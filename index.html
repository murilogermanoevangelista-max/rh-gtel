              <select id="ctr-status" onchange="ctrToggleDesistencia()">
                <option value="em_processo" ${(!c||c.status==='em_processo')?'selected':''}>Em Processo</option>
                <option value="aguardando_integracao" ${c?.status==='aguardando_integracao'?'selected':''}>Aguardando Integração</option>
                <option value="integrado" ${c?.status==='integrado'?'selected':''}>Integrado</option>
                <option value="desistiu" ${c?.status==='desistiu'?'selected':''}>Desistiu/Reprovado</option>
              </select>
            </div>
            <div class="form-group" id="ctr-grupo-desistencia" style="display:${c?.status==='desistiu'?'block':'none'}"><label>Data da Desistência</label>
              <input type="date" id="ctr-data-desistencia" value="${c?.data_desistencia||ctrHojeISO()}"></div>
            <div class="form-group full"><label>Observação</label>
              <textarea id="ctr-obs" rows="2" placeholder="Ex: ASO agendado 13/07, nome em análise...">${c?.observacao||''}</textarea></div>
          </div>

          <div style="border-top:1px solid var(--border);padding-top:16px;margin-top:18px">
            <div style="font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">Checklist de Documentos para Admissão</div>
            <div style="font-size:11px;color:var(--text-muted);margin-bottom:10px">Marque os documentos entregues. Use "Isentar" para documentos que não se aplicam a este candidato (não entram no cálculo do %).</div>
            <div style="margin-bottom:14px;display:flex;align-items:center;gap:10px">
              <div style="flex:1;height:8px;background:var(--border);border-radius:4px"><div id="ctr-docs-barra" style="height:8px;border-radius:4px;background:${pct>=100?'var(--success)':pct>=50?'var(--warning)':'var(--danger)'};width:${pct}%"></div></div>
              <span id="ctr-docs-label" style="font-size:12px;font-weight:600;min-width:110px">${done}/${total} (${pct}%)</span>
            </div>
            <div id="ctr-docs-itens" style="columns:2;column-gap:24px">${ctrDocsItemsHtml()}</div>
          </div>

          <div style="border-top:1px solid var(--border);padding-top:16px;margin-top:18px">
            <div style="font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">Projeções (Exame, Portal, DP, Integração, Mobilização)</div>
            <div style="font-size:11px;color:var(--text-muted);margin-bottom:10px">As datas de Portal, Aprovação, Envio DP e Admissão Prevista são projetadas automaticamente a partir da data do Exame. Edite qualquer campo para ajustar à realidade — os campos seguintes serão recalculados.</div>
            <div class="form-grid">
              <div class="form-group"><label>Tipo de Exame</label>
                <select id="proj-tipo-exame" onchange="ctrCascataExame()">
                  <option value="">— Selecione —</option>
                  <option value="operacional" ${c?.tipo_exame==='operacional'?'selected':''}>Operacional (2 dias úteis)</option>
                  <option value="operacional_ac" ${c?.tipo_exame==='operacional_ac'?'selected':''}>Operacional AC (5 dias úteis)</option>
                </select>
              </div>
              <div class="form-group"><label>Data do Exame</label>
                <input type="date" id="proj-data-exame" value="${c?.data_exame||''}" oninput="ctrCascataExame()"></div>
              <div class="form-group full" style="margin-top:-8px">
                <div style="font-size:12px;color:var(--text-muted)">Resultado previsto: <b id="proj-resultado-exame" style="color:var(--text)">${ctrFmtData(p.resultadoExame)}</b></div>
              </div>

              <div class="form-group"><label>Documentos lançados no Portal <span style="font-weight:400;color:var(--text-muted)">(auto: resultado do exame)</span></label>
                <input type="date" id="proj-doc-portal" value="${c?.data_documentos_portal||p.docPortal||''}" data-auto="${c?.data_documentos_portal?'false':'true'}" oninput="ctrCascataPortal(true)"></div>
              <div class="form-group"><label>Aprovação da Diretoria <span style="font-weight:400;color:var(--text-muted)">(auto: portal +2 dias úteis)</span></label>
                <input type="date" id="proj-aprovacao" value="${c?.data_aprovacao_diretoria||p.aprovacao||''}" data-auto="${c?.data_aprovacao_diretoria?'false':'true'}" oninput="ctrCascataAprovacao(true)"></div>

              <div class="form-group"><label>Envio ao DP para Registro <span style="font-weight:400;color:var(--text-muted)">(auto: aprovação +1 dia útil)</span></label>
                <input type="date" id="proj-envio-dp" value="${c?.data_envio_dp||p.envioDp||''}" data-auto="${c?.data_envio_dp?'false':'true'}" oninput="ctrCascataEnvioDp(true)"></div>
              <div class="form-group">
                <label>Admissão Prevista <span style="font-weight:400;color:var(--text-muted)">(auto: envio DP +1 dia útil)</span></label>
                <input type="date" id="proj-registro-previsto" value="${c?.data_prevista_admissao||p.admissao||''}" data-auto="${c?.data_prevista_admissao?'false':'true'}" oninput="this.dataset.auto='false'">
              </div>

              <div class="form-group"><label>Integração Prevista <span style="font-weight:400;color:var(--text-muted)">(manual — depende da obra)</span></label>
                <input type="date" id="proj-integracao" value="${c?.data_integracao_prevista||''}" onchange="ctrAutoStatusPorData('aguardando_integracao',this.value)"></div>
              <div class="form-group"><label>Viagem de Mobilização <span style="font-weight:400;color:var(--text-muted)">(manual — depende da obra)</span></label>
                <input type="date" id="proj-viagem" value="${c?.data_viagem_mobilizacao||''}" onchange="ctrAutoStatusPorData('integrado',this.value)"></div>
              <div class="form-group"><label>Previsão de Chegada</label>
                <input type="date" id="proj-chegada" value="${c?.data_prevista_chegada||''}"></div>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn" onclick="closeModal('modal-contratacao')">Cancelar</button>
          <button class="btn btn-primary" onclick="saveContratacao(${c?`'${c.id}'`:'null'})"><i class="ti ti-check"></i> ${c?'Salvar':'Cadastrar'}</button>
        </div>
      </div>
    </div>`);
}

function ctrProspOptions(){
  const nomesJaCandidatos=new Set(contratacoes.map(c=>ctrNorm(c.nome)));
  const lista=contratacoesProspeccoes
    .filter(p=>!nomesJaCandidatos.has(ctrNorm(p.nome)))
    .slice()
    .sort((a,b)=>{
      const ra=a.retorno==='aceitou'?0:1,rb=b.retorno==='aceitou'?0:1;
      if(ra!==rb)return ra-rb;
      return(a.nome||'').localeCompare(b.nome||'','pt-BR');
    });
  return lista.map(p=>{
    const info=prospRetornoInfo(p.retorno);
    return`<option value="${p.id}">${p.nome} — ${p.funcao?.nome||'sem função'} (${info.label})</option>`;
  }).join('');
}
function toggleProspeccaoBusca(){
  const sel=document.getElementById('ctr-prosp-select');
  if(!sel)return;
  sel.style.display=sel.style.display==='none'?'block':'none';
}
function ctrPreencherDeProspeccao(prospId){
  if(!prospId)return;
  const p=contratacoesProspeccoes.find(x=>String(x.id)===String(prospId));
  if(!p)return;
  document.getElementById('ctr-nome').value=p.nome||'';
  if(p.funcao_id){
    const funcSelect=document.getElementById('ctr-funcao-select');
    const opt=funcSelect?.querySelector(`option[value="${p.funcao_id}"]`);
    if(opt){
      funcSelect.value=p.funcao_id;
    }else if(p.funcao?.nome){
      // função da prospecção não está na lista (duplicada/renomeada) — usa modo manual
      if(!ctrFuncaoModoManual)toggleFuncaoModoCtr();
      document.getElementById('ctr-funcao-input').value=p.funcao.nome;
    }
  }
  if(p.telefone)document.getElementById('ctr-contato').value=p.telefone;
  if(p.obra_id){
    const obraSelect=document.getElementById('ctr-obra');
    if(obraSelect)obraSelect.value=p.obra_id;
  }
  const obsEl=document.getElementById('ctr-obs');
  if(obsEl&&p.observacao&&!obsEl.value){
    obsEl.value=`Da prospecção: ${p.observacao}`;
  }
  showToast('Dados preenchidos a partir da prospecção!');
}

function ctrCascataExame(){
  const tipo=document.getElementById('proj-tipo-exame').value;
  const data=document.getElementById('proj-data-exame').value;
  const elResultado=document.getElementById('proj-resultado-exame');
  let resultado=null;
  if(tipo&&data){
    resultado=ctrAddDiasUteis(data,tipo==='operacional_ac'?5:2);
    elResultado.textContent=ctrFmtData(resultado);
  }else{
    elResultado.textContent='—';
  }
  if(resultado){
    const portalInput=document.getElementById('proj-doc-portal');
    portalInput.value=resultado;
    portalInput.dataset.auto='true'; // ainda é só projeção, não confirmado
    ctrCascataPortal(false);
  }
}
function ctrCascataPortal(manual=true){
  const portalInput=document.getElementById('proj-doc-portal');
  if(manual)portalInput.dataset.auto='false'; // usuário editou este campo diretamente
  const dataPortal=portalInput.value;
  if(dataPortal){
    const aprovInput=document.getElementById('proj-aprovacao');
    aprovInput.value=ctrAddDiasUteis(dataPortal,2);
    aprovInput.dataset.auto='true';
  }
  ctrCascataAprovacao(false);
}
function ctrCascataAprovacao(manual=true){
  const aprovInput=document.getElementById('proj-aprovacao');
  if(manual)aprovInput.dataset.auto='false';
  const dataAprovacao=aprovInput.value;
  if(dataAprovacao){
    const envioInput=document.getElementById('proj-envio-dp');
    envioInput.value=ctrAddDiasUteis(dataAprovacao,1);
    envioInput.dataset.auto='true';
  }
  ctrCascataEnvioDp(false);
}
function ctrCascataEnvioDp(manual=true){
  const envioInput=document.getElementById('proj-envio-dp');
  if(manual)envioInput.dataset.auto='false';
  const dataEnvioDp=envioInput.value;
  const elAdmissao=document.getElementById('proj-registro-previsto');
  if(dataEnvioDp){
    elAdmissao.value=ctrAddDiasUteis(dataEnvioDp,1);
    elAdmissao.dataset.auto='true';
  }else{
    elAdmissao.value='';
    elAdmissao.dataset.auto='true';
  }
}

function ctrValorConfirmado(id){
  const el=document.getElementById(id);
  if(!el)return null;
  return el.dataset.auto==='true'?null:(el.value||null);
}

async function saveContratacao(id){
  const nome=document.getElementById('ctr-nome').value.trim();
  if(!nome){showToast('Nome é obrigatório','error');return;}

  const isMod=ctrFuncaoModoManual;
  let funcaoId=isMod?null:document.getElementById('ctr-funcao-select').value||null;
  const funcaoManualTexto=isMod?document.getElementById('ctr-funcao-input').value.trim():null;
  if(isMod&&funcaoManualTexto){
    const existente=funcoes.find(f=>ctrNorm(f.nome)===ctrNorm(funcaoManualTexto));
    if(existente){
      funcaoId=existente.id;
    }else{
      const{data:novaFuncao,error:errFuncao}=await sb.from('funcoes').insert({nome:funcaoManualTexto}).select().single();
      if(errFuncao){showToast('Erro ao salvar função: '+errFuncao.message,'error');return;}
      funcoes.push(novaFuncao);
      funcaoId=novaFuncao.id;
    }
  }

  const documentos={...(window._ctrDocsState||{})};
  DOCS_CONTRATACAO.forEach(([k])=>{if(!documentos[k])delete documentos[k];}); // não grava chaves "pendente" (false)

  const payload={
    nome,
    funcao_id:funcaoId,
    obra_id:document.getElementById('ctr-obra').value||null,
    origem:document.getElementById('ctr-origem').value.trim()||null,
    contato:document.getElementById('ctr-contato').value.trim()||null,
    salario:document.getElementById('ctr-salario').value?parseFloat(document.getElementById('ctr-salario').value):null,
    status:document.getElementById('ctr-status').value,
    data_prevista_admissao:ctrValorConfirmado('proj-registro-previsto'),
    observacao:document.getElementById('ctr-obs').value.trim()||null,
    documentos,
    tipo_exame:document.getElementById('proj-tipo-exame').value||null,
    data_exame:document.getElementById('proj-data-exame').value||null,
    data_documentos_portal:ctrValorConfirmado('proj-doc-portal'),
    data_aprovacao_diretoria:ctrValorConfirmado('proj-aprovacao'),
    data_envio_dp:ctrValorConfirmado('proj-envio-dp'),
    data_integracao_prevista:document.getElementById('proj-integracao').value||null,
    data_viagem_mobilizacao:document.getElementById('proj-viagem').value||null,
    data_prevista_chegada:document.getElementById('proj-chegada').value||null,
  };
  if(payload.status==='integrado'){
    const atual=id?contratacoes.find(x=>x.id===id):null;
    payload.data_integracao=atual?.data_integracao||toISO(new Date());
  }
  payload.data_desistencia=payload.status==='desistiu'?(document.getElementById('ctr-data-desistencia').value||ctrHojeISO()):null;
  const{error}=id?await sb.from('contratacoes').update(payload).eq('id',id):await sb.from('contratacoes').insert(payload);
  if(error){showToast('Erro: '+error.message,'error');return;}
  showToast(id?'Candidato atualizado!':'Candidato cadastrado!');
  closeModal('modal-contratacao');
  if(payload.status==='desistiu')contratacoesTab='desistencias';
  await loadContratacoes();renderContratacoes();
  ctrAutoSyncProspeccoes();
}

async function deleteContratacao(id,nome){
  if(!confirm(`Excluir o candidato ${nome}?`))return;
  const{error}=await sb.from('contratacoes').delete().eq('id',id);
  if(error){showToast('Erro: '+error.message,'error');return;}
  showToast('Candidato excluído.');
  await loadContratacoes();renderContratacoes();
}

function openModalDocumentosContratacao(id){
  openModalContratacao(id);
}


let vagaFuncaoModoManual=false;

function toggleFuncaoModoVaga(){
  vagaFuncaoModoManual=!vagaFuncaoModoManual;
  document.getElementById('vaga-funcao-select').style.display=vagaFuncaoModoManual?'none':'block';
  document.getElementById('vaga-funcao-input').style.display=vagaFuncaoModoManual?'block':'none';
  document.getElementById('vaga-funcao-toggle').textContent=vagaFuncaoModoManual?'← Escolher da lista':'✏️ Digitar manualmente';
}

function openModalVaga(id){
  const v=id?contratacoesVagas.find(x=>x.id===id):null;
  vagaFuncaoModoManual=false;
  const funcaoOpts=ctrFuncoesUnicas().map(f=>`<option value="${f.id}" ${String(v?.funcao_id||'')===String(f.id)?'selected':''}>${f.nome}</option>`).join('');
  const obraOpts=obras.map(o=>`<option value="${o.id}" ${String(v?.obra_id||'')===String(o.id)?'selected':''}>${o.codigo?o.codigo+' — ':''}${o.nome||''}</option>`).join('');
  document.body.insertAdjacentHTML('beforeend',`
    <div class="modal-overlay" id="modal-vaga" onclick="if(event.target===this)closeModal('modal-vaga')">
      <div class="modal" style="max-width:480px">
        <div class="modal-header">
          <span class="modal-title"><i class="ti ti-clipboard-list"></i> ${v?'Editar':'Nova'} Vaga Prevista</span>
          <button class="btn btn-sm" onclick="closeModal('modal-vaga')"><i class="ti ti-x"></i></button>
        </div>
        <div class="modal-body">
          <div class="form-grid">
            <div class="form-group full">
              <label>Função * <span class="funcao-toggle" id="vaga-funcao-toggle" onclick="toggleFuncaoModoVaga()" style="font-size:11px;font-weight:400;cursor:pointer;color:var(--primary);margin-left:6px">✏️ Digitar manualmente</span></label>
              <select id="vaga-funcao-select"><option value="">Selecione...</option>${funcaoOpts}</select>
              <input id="vaga-funcao-input" placeholder="Digite a função..." style="display:none">
            </div>
            <div class="form-group full"><label>Obra *</label>
              <select id="vaga-obra"><option value="">Selecione...</option>${obraOpts}</select></div>
            <div class="form-group full"><label>Quantidade Prevista *</label>
              <input type="number" min="0" id="vaga-qtd" value="${v?.quantidade_prevista??0}"></div>
            <div class="form-group full"><label>Observação <span style="font-weight:400;color:var(--text-muted)">(ex: pode vir por transferência, terceirizado, etc.)</span></label>
              <textarea id="vaga-obs" rows="3" style="width:100%;padding:8px;border:1px solid var(--border);border-radius:var(--radius);font-size:13px;resize:vertical" placeholder="Anotações livres sobre esta vaga...">${v?.observacao||''}</textarea></div>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn" onclick="closeModal('modal-vaga')">Cancelar</button>
          <button class="btn btn-primary" onclick="saveVaga(${v?`'${v.id}'`:'null'})"><i class="ti ti-check"></i> ${v?'Salvar':'Cadastrar'}</button>
        </div>
      </div>
    </div>`);
}

async function saveVaga(id){
  const isMod=vagaFuncaoModoManual;
  let funcaoId=isMod?null:(document.getElementById('vaga-funcao-select').value||null);
  const funcaoManualTexto=isMod?document.getElementById('vaga-funcao-input').value.trim():null;
  if(isMod&&funcaoManualTexto){
    const existente=funcoes.find(f=>ctrNorm(f.nome)===ctrNorm(funcaoManualTexto));
    if(existente){
      funcaoId=existente.id;
    }else{
      const{data:novaFuncao,error:errFuncao}=await sb.from('funcoes').insert({nome:funcaoManualTexto}).select().single();
      if(errFuncao){showToast('Erro ao salvar função: '+errFuncao.message,'error');return;}
      funcoes.push(novaFuncao);
      funcaoId=novaFuncao.id;
    }
  }
  const obraId=document.getElementById('vaga-obra').value;
  const qtd=parseInt(document.getElementById('vaga-qtd').value,10)||0;
  const obs=document.getElementById('vaga-obs').value.trim()||null;
  if(!funcaoId||!obraId){showToast('Função e Obra são obrigatórias','error');return;}
  const payload={funcao_id:funcaoId,obra_id:obraId,quantidade_prevista:qtd,observacao:obs};
  const{error}=id?await sb.from('contratacoes_vagas').update(payload).eq('id',id):await sb.from('contratacoes_vagas').upsert(payload,{onConflict:'funcao_id,obra_id'});
  if(error){showToast('Erro: '+error.message,'error');return;}
  showToast(id?'Vaga atualizada!':'Vaga cadastrada!');
  closeModal('modal-vaga');
  await loadContratacoesVagas();renderContratacoes();
}

async function deleteVaga(id){
  if(!confirm('Excluir esta vaga prevista?'))return;
  const{error}=await sb.from('contratacoes_vagas').delete().eq('id',id);
  if(error){showToast('Erro: '+error.message,'error');return;}
  showToast('Vaga excluída.');
  await loadContratacoesVagas();renderContratacoes();
}

if(checkSessao()){
  entrarNoApp();
} else {
  document.getElementById('login-screen').style.display='flex';
}
</script>
</body>
</html>
