// ─── FOLGAS ───────────────────────────────────────────────────────────────────
let folgasFiltro='todos',folgasBusca='',folgasNomesFiltro=null; // folgasNomesFiltro: Set de primeiros-nomes quando filtrando por card de mês

function calcVencimentos(folga){
  const vencs=[];
  const baseDate=parseDate(folga.data_inicio);
  if(!baseDate)return vencs;
  const periodo=parseInt(folga.periodo_trabalhado)||30;
  const ciclos=periodo===180?[180,360,540,720,900]:periodo===90?[90,180,270,360,450]:periodo===60?[60,120,180,240,300]:periodo===45?[45,90,135,180,225]:[30,60,90,120,150];
  for(let i=0;i<5;i++){
    const v=new Date(baseDate);v.setDate(v.getDate()+ciclos[i]);vencs.push(v);
  }
  return vencs;
}
// Projeta o vencimento do N-ésimo ciclo (1-indexado), inclusive além dos 5 ciclos armazenados no banco —
// usado para mostrar as próximas projeções mesmo depois que os 5 slots já foram todos utilizados.
function calcVencimentoN(folga,n){
  const baseDate=parseDate(folga.data_inicio);
  if(!baseDate)return null;
  const periodo=parseInt(folga.periodo_trabalhado)||30;
  const v=new Date(baseDate);v.setDate(v.getDate()+periodo*n);
  return v;
}
function vencStatus(venc,realDate,periodo){
  if(realDate)return'ok';
  const hoje=new Date();hoje.setHours(0,0,0,0);
  const diff=Math.floor((venc-hoje)/86400000);
  const limiteWarn=parseInt(periodo)===30?10:30;
  if(diff<0)return'danger';
  if(diff<=limiteWarn)return'warn';
  return'future';
}
function diasFolga(periodo){
  const map={180:5,90:5,60:3,45:2,30:1};return map[periodo]||1;
}

async function renderFolgas(){
  await Promise.all([loadFolgas(),loadFolgasTranslados()]);
  renderFolgasLocal();
}
function irParaListaMesFolga(funcIds){
  folgasNomesFiltro=new Set((funcIds||[]).filter(Boolean).map(String));
  folgasFiltro='todos';folgasBusca='';
  folgasAba='programacao';
  renderFolgasLocal();
  setTimeout(()=>document.querySelector('.folga-row')?.scrollIntoView({behavior:'smooth',block:'center'}),50);
}
let folgasAba='programacao',transladoObraFiltro='',transladoBusca='';
function renderFolgasLocal(){
  if(folgasAba==='translados'){renderFolgasTranslados();return;}
  const hoje=new Date();hoje.setHours(0,0,0,0);
  let lista=folgas;
  if(globalObraFiltro){lista=lista.filter(f=>String(f.funcionario?.obra_id)===String(globalObraFiltro));}
  if(folgasBusca)lista=lista.filter(f=>f.funcionario?.nome_completo?.toLowerCase().includes(folgasBusca.toLowerCase())||f.funcionario?.matricula?.includes(folgasBusca));
  if(folgasNomesFiltro)lista=lista.filter(f=>folgasNomesFiltro.has(String(f.funcionario_id)));
  if(folgasFiltro==='warn')lista=lista.filter(f=>{const vencs=calcVencimentos(f);return vencs.some((v,i)=>vencStatus(v,f[`saida${i+1}_real`],f.periodo_trabalhado)==='warn');});
  if(folgasFiltro==='danger')lista=lista.filter(f=>{const vencs=calcVencimentos(f);return vencs.some((v,i)=>vencStatus(v,f[`saida${i+1}_real`],f.periodo_trabalhado)==='danger');});
  if(folgasFiltro==='programadas')lista=lista.filter(f=>[1,2,3,4,5].some(n=>f[`saida${n}_programada`]&&!f[`saida${n}_real`]));
  lista=[...lista].sort((a,b)=>{
    const aVencs=calcVencimentos(a);const bVencs=calcVencimentos(b);
    const aMin=Math.min(...aVencs.filter((_,i)=>!a[`saida${i+1}_real`]).map(v=>v.getTime()),Infinity);
    const bMin=Math.min(...bVencs.filter((_,i)=>!b[`saida${i+1}_real`]).map(v=>v.getTime()),Infinity);
    return aMin-bMin;
  });
  // totalVenc/totalWarn baseados na lista já filtrada por obra
  const listaBase=globalObraFiltro?folgas.filter(f=>String(f.funcionario?.obra_id)===String(globalObraFiltro)):folgas;
  let totalVenc=0,totalWarn=0,totalProg=0;
  listaBase.forEach(f=>{const vencs=calcVencimentos(f);vencs.forEach((v,i)=>{const st=vencStatus(v,f[`saida${i+1}_real`],f.periodo_trabalhado);if(st==='danger')totalVenc++;if(st==='warn')totalWarn++;if(f[`saida${i+1}_programada`]&&!f[`saida${i+1}_real`])totalProg++;});});
  const obraOptions=obras.map(o=>`<option value="${o.id}">${o.codigo} — ${o.nome}</option>`).join('');
  const rows=lista.map(f=>{
    const vencs=calcVencimentos(f);
    const nDias=diasFolga(f.periodo_trabalhado);
    // Descobre o ciclo "atual" (1-indexado): o primeiro dos 5 slots que ainda não tem saída real confirmada.
    // Se todos os 5 já foram confirmados, o atual fica "além" do armazenado (6), e as próximas projeções
    // passam a ser calculadas dinamicamente (calcVencimentoN), sem precisar de mais colunas no banco.
    let currentN=6;
    for(let n=1;n<=5;n++){
      const realN=f['saida'+n+'_real'];
      if(!realN){currentN=n;break;}
      const realNDate=parseDate(realN);
      // Só considera o ciclo "concluído" (vai pro histórico) depois que a data de gozo já passou.
      // Enquanto a data ainda não chegou, mesmo com saída confirmada, continua aparecendo como Próxima Saída.
      if(realNDate&&realNDate>=hoje){currentN=n;break;}
    }
    const historicoNs=[];
    for(let n=1;n<currentN&&n<=5;n++)historicoNs.push(n);
    const trAtual=folgasTranslados.find(x=>String(x.folga_id)===String(f.id)&&x.numero_ciclo===currentN);
    const compradaAtual=trAtual?.passagem_comprada===true;
    const passagemAtualBadge=`<div style="margin-top:4px;display:flex;align-items:center;gap:6px">
      <span style="font-size:10px;color:var(--text-muted);font-weight:600">🎫 Passagem:</span>
      <select onchange="togglePassagemComprada('${f.id}',${currentN},this.value)" onclick="event.stopPropagation()" style="font-size:11px;padding:2px 6px;border-radius:6px;border:1px solid ${compradaAtual?'#BBF7D0':'#FCD34D'};background:${compradaAtual?'#F0FDF4':'#FFFBEB'};color:${compradaAtual?'var(--success)':'#92400E'};font-weight:600;cursor:pointer">
        <option value="nao" ${!compradaAtual?'selected':''}>Não comprada</option>
        <option value="sim" ${compradaAtual?'selected':''}>Comprada</option>
      </select>
    </div>${trAtual?.passagem_observacao?`<div style="font-size:10px;color:var(--text-muted);margin-top:2px;font-style:italic">💬 ${trAtual.passagem_observacao}</div>`:''}`;

    // ── Histórico (colapsado) ──
    const historicoHtml=historicoNs.length?historicoNs.map(n=>{
      const real=f['saida'+n+'_real'];
      return`<div style="display:flex;justify-content:space-between;align-items:center;gap:6px;padding:3px 0;border-bottom:1px solid var(--border)">
        <span style="color:var(--text-muted)">Venc.${n}: ${formatDate(vencs[n-1])}</span>
        <span style="display:flex;align-items:center;gap:6px;white-space:nowrap">
          <span style="color:var(--success);font-weight:600">✓ ${formatDate(real)}</span>
          <span title="Remover este lançamento (ex: duplicidade)" style="cursor:pointer;color:var(--danger)" onclick="event.stopPropagation();removeSaidaReal('${f.id}',${n})">✕</span>
        </span>
      </div>`;
    }).join(''):'';
    const historicoCell=`<div class="folga-cell">
      <div class="folga-cell-header">Histórico</div>
      ${historicoNs.length?`<details style="font-size:11px">
        <summary style="cursor:pointer;color:var(--text-muted);font-weight:600">📜 ${historicoNs.length} ciclo(s)</summary>
        <div style="margin-top:6px">${historicoHtml}</div>
      </details>`:`<div style="font-size:11px;color:var(--text-muted)">—</div>`}
    </div>`;

    // ── Célula "Próxima Saída" (ciclo atual, com todas as ações) ──
    let currentCell;
    if(currentN<=5){
      const i=currentN-1;
      const v=vencs[i];
      const st=vencStatus(v,f['saida'+currentN+'_real'],f.periodo_trabalhado);
      const realDate=f['saida'+currentN+'_real'];
      const progDate=f['saida'+currentN+'_programada'];
      const projDate=f['saida'+currentN+'_projecao'];
      const diff=Math.floor((v-hoje)/86400000);
      const realDateObj=realDate?parseDate(realDate):null;
      const aindaNaoChegou=realDateObj&&realDateObj>=hoje;
      const diffSaida=realDateObj?Math.floor((realDateObj-hoje)/86400000):null;
      const diffTxt=realDate?(aindaNaoChegou?`em ${diffSaida}d`:'✓'):(diff<0?`${Math.abs(diff)}d atrás`:`${diff}d`);
      let acoesHtml;
      if(realDate&&aindaNaoChegou){
        acoesHtml=`<div style="font-size:11px;color:var(--info);font-weight:600">📌 Confirmado: ${formatDate(realDate)} <span style="cursor:pointer;color:var(--danger);margin-left:4px" onclick="removeSaidaReal('${f.id}',${currentN})">✕</span></div>`;
      } else if(realDate){
        acoesHtml=`<div style="font-size:11px;color:var(--success)">✓ Saiu: ${formatDate(realDate)} <span style="cursor:pointer;color:var(--danger);margin-left:4px" onclick="removeSaidaReal('${f.id}',${currentN})">✕</span></div>`;
      } else if(progDate){
        acoesHtml=`<div style="font-size:11px;color:var(--info);font-weight:600">📅 Programado: ${formatDate(progDate)}</div>
        <div style="display:flex;gap:6px;margin-top:2px">
          <span style="font-size:11px;color:var(--info);cursor:pointer" onclick="programarSaida('${f.id}',${currentN})">✎ Editar</span>
          <span style="font-size:11px;color:var(--success);cursor:pointer" onclick="lancarSaidaReal('${f.id}',${currentN})">✓ Confirmar</span>
          <span style="font-size:11px;color:var(--danger);cursor:pointer" onclick="removeSaidaProgramada('${f.id}',${currentN})">✕</span>
        </div>`;
      } else {
        acoesHtml=`<div class="folga-saida-proj">Proj: ${formatDate(projDate)||'—'}</div>
        <div style="display:flex;gap:6px">
          <span class="folga-saida-real" style="color:var(--info)" onclick="programarSaida('${f.id}',${currentN})">+ Programar</span>
          <span class="folga-saida-real" onclick="lancarSaidaReal('${f.id}',${currentN})">+ Confirmar saída</span>
        </div>`;
      }
      currentCell=`<div class="folga-cell">
        <div class="folga-cell-header">Venc.${currentN}</div>
        <div class="folga-venc ${realDate?(aindaNaoChegou?'prog':'ok'):(progDate?'prog':st)}">${formatDate(v)}<br><small>${diffTxt}</small></div>
        ${acoesHtml}
        ${passagemAtualBadge}
      </div>`;
    } else {
      currentCell=`<div class="folga-cell">
        <div class="folga-cell-header">Próxima Saída</div>
        <div style="font-size:11px;color:var(--text-muted);padding:6px 0">Os 5 ciclos cadastrados já foram utilizados. Contate o suporte para estender o registro.</div>
      </div>`;
    }

    // ── 4 previews de projeção futura (somente leitura — sem ações) ──
    const previewCells=[1,2,3,4].map(k=>{
      const nFut=currentN+k;
      let vFut,statusLabel='',isProgramado=false,progLabel='';
      if(nFut<=5){
        vFut=vencs[nFut-1];
        const progF=f['saida'+nFut+'_programada'];
        if(progF){isProgramado=true;progLabel=formatDate(progF);}
      } else {
        vFut=calcVencimentoN(f,nFut);
      }
      if(!vFut)return`<div class="folga-cell"><div class="folga-cell-header">Proj. +${k}</div><div style="font-size:11px;color:var(--text-muted)">—</div></div>`;
      const diff=Math.floor((vFut-hoje)/86400000);
      return`<div class="folga-cell" style="opacity:.75">
        <div class="folga-cell-header">Proj. +${k}</div>
        <div style="font-size:12px;font-weight:600">${formatDate(vFut)}</div>
        <div style="font-size:10px;color:var(--text-muted)">${diff<0?Math.abs(diff)+'d atrás':diff+'d'}</div>
        ${isProgramado?`<div style="font-size:10px;color:var(--info);font-weight:600;margin-top:2px">📅 ${progLabel}</div>`:''}
      </div>`;
    }).join('');

    const vencCells=historicoCell+currentCell+previewCells;
    const passagemBadges=`
      ${f.tipo_passagem_aerea?'<span class="passagem-badge passagem-aerea">✈ Aérea</span>':''}
      ${f.tipo_passagem_terrestre?'<span class="passagem-badge passagem-terrestre">🚌 Terrestre</span>':''}
      ${!f.tipo_passagem_aerea&&!f.tipo_passagem_terrestre?'<span class="passagem-badge passagem-nao">—</span>':''}`;
    return`<div class="folga-row">
      <div class="folga-cell">
        <div class="folga-func-name">${f.funcionario?.nome_completo||'—'}</div>
        <div class="folga-func-sub">${f.funcionario?.matricula||''} · ${f.funcionario?.obra?.nome||'—'}</div>
        ${(f.funcionario?.funcao?.nome)?`<div style="font-size:11px;color:var(--primary-dark);font-weight:500;margin-top:1px">${f.funcionario.funcao.nome}</div>`:''}
        <div style="display:flex;gap:4px;margin-top:6px">
          <button class="btn btn-sm" title="Editar" onclick="openModalFolga('${f.id}')" style="padding:3px 8px;font-size:11px"><i class="ti ti-edit"></i> Editar</button>
          <button class="btn btn-sm btn-danger" title="Excluir" onclick="deleteFolgaConfirm('${f.id}')" style="padding:3px 8px;font-size:11px"><i class="ti ti-trash"></i></button>
        </div>
        <div style="margin-top:4px;display:flex;flex-wrap:wrap;gap:4px">${passagemBadges}</div>
        ${f.cidade_origem?`<div style="font-size:11px;color:var(--text-muted);margin-top:2px">📍 ${f.cidade_origem}</div>`:''}
      </div>
      <div class="folga-cell"><div class="folga-cell-header">Período</div><div style="font-weight:600">${f.periodo_trabalhado||'—'} dias</div></div>
      <div class="folga-cell"><div class="folga-cell-header">Início</div>${formatDate(f.data_inicio)}</div>
      <div class="folga-cell"><div class="folga-cell-header">Folga</div><div style="font-weight:700;color:var(--primary-dark)">${nDias} dia(s) útil</div></div>
      ${vencCells}
    </div>`;}).join('')||`<div class="empty-state"><i class="ti ti-beach"></i><div>Nenhum registro de folga encontrado</div></div>`;
  // ── Card 1: Em folga AGORA (saiu, ainda não retornou) ──
  const emFolgaAgora=[];
  listaBase.forEach(function(f){
    const nD=diasFolga(f.periodo_trabalhado);
    for(var i=1;i<=5;i++){
      const real=f['saida'+i+'_real'];
      if(!real)continue;
      const saida=parseDate(real);if(!saida)continue;
      const retorno=new Date(saida);var cont=0;
      while(cont<nD){retorno.setDate(retorno.getDate()+1);const dw=retorno.getDay();if(dw!==0&&dw!==6)cont++;}
      if(saida<=hoje&&retorno>=hoje){
        emFolgaAgora.push({nome:(f.funcionario&&f.funcionario.nome_completo?f.funcionario.nome_completo.split(' ').slice(0,2).join(' '):'—'),saida:saida,retorno:retorno,busca:(f.funcionario&&f.funcionario.nome_completo?f.funcionario.nome_completo.split(' ')[0]:'')});break;
      }
    }
  });

  // ── Cards por mês: saídas agendadas (saída real lançada futura) ──
  const mesLabel=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const mesAtual=hoje.getMonth(),anoAtual=hoje.getFullYear();
  const proxMes=(mesAtual+1)%12,anoProxMes=mesAtual===11?anoAtual+1:anoAtual;
  const mes2=(mesAtual+2)%12,anoMes2=mesAtual>=10?anoAtual+1:anoAtual;
  const agendMesAtual=[],agendProxMes=[],agendMes2=[];
  listaBase.forEach(function(f){
    for(var i=1;i<=5;i++){
      const real=f['saida'+i+'_real'];if(!real)continue;
      const saida=parseDate(real);if(!saida)continue;
      if(saida>hoje){
        const m=saida.getMonth(),a=saida.getFullYear();
        const info={nome:(f.funcionario&&f.funcionario.nome_completo?f.funcionario.nome_completo.split(' ').slice(0,2).join(' '):'—'),saida:saida,busca:(f.funcionario&&f.funcionario.nome_completo?f.funcionario.nome_completo.split(' ')[0]:''),funcId:f.funcionario_id};
        if(m===mesAtual&&a===anoAtual)agendMesAtual.push(info);
        else if(m===proxMes&&a===anoProxMes)agendProxMes.push(info);
        else if(m===mes2&&a===anoMes2)agendMes2.push(info);
        break;
      }
    }
  });
  agendMesAtual.sort(function(a,b){return a.saida-b.saida;});
  agendProxMes.sort(function(a,b){return a.saida-b.saida;});
  agendMes2.sort(function(a,b){return a.saida-b.saida;});

  // Montar seção de cards
  var cardsHtml='';
  const temAgora=emFolgaAgora.length>0;
  const temAgend=agendMesAtual.length>0||agendProxMes.length>0||agendMes2.length>0;
  if(temAgora||temAgend){
    var secTitle='<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px"><i class="ti ti-plane" style="color:var(--primary);font-size:16px"></i><span style="font-size:13px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.6px">Situação das Folgas</span></div>';
    var cardsCols='';

    // Card "Em folga agora" — mantém estilo destacado com lista (geralmente poucos itens)
    if(temAgora){
      var itensAgora=emFolgaAgora.map(function(f){return itemAgoraRow(f);}).join('');
      cardsCols+='<div style="background:linear-gradient(135deg,#0d5e46,#1D9E75);border-radius:var(--radius-lg);padding:16px 18px;flex:1;min-width:220px;max-height:260px;overflow-y:auto">'
        +'<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">'
        +'<i class="ti ti-plane-departure" style="font-size:16px;color:rgba(255,255,255,.8)"></i>'
        +'<span style="font-size:11px;font-weight:700;color:rgba(255,255,255,.7);text-transform:uppercase;letter-spacing:.5px">Em folga agora</span>'
        +'</div>'
        +'<div style="font-size:28px;font-weight:700;color:#fff;margin-bottom:10px">'+emFolgaAgora.length+'<span style="font-size:13px;font-weight:400;color:rgba(255,255,255,.7);margin-left:6px">funcionário(s)</span></div>'
        +itensAgora
        +'</div>';
    }

    // helper: linha clicável por funcionário (usado no card "Em folga agora")
    function itemAgoraRow(f){
      var busca=f.busca||'';
      return '<div onclick="event.stopPropagation();folgasNomesFiltro=null;folgasBusca=\''+busca+'\';folgasFiltro=\'todos\';renderFolgas();setTimeout(function(){var rows=document.querySelectorAll(\'.folga-row\');var el=null;rows.forEach(function(r){if(r.innerText.toUpperCase().indexOf(\''+busca.toUpperCase()+'\')>=0)el=r;});if(el){el.scrollIntoView({behavior:\'smooth\',block:\'center\'});el.style.outline=\'2px solid #1D9E75\';setTimeout(function(){el.style.outline=\'\';},2000);}},150)" '
        +'style="display:flex;justify-content:space-between;align-items:center;padding:7px 8px;margin:0 -8px;border-radius:6px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.15);transition:background .15s" '
        +'onmouseover="this.style.background=\'rgba(255,255,255,.1)\'" onmouseout="this.style.background=\'\'">'
        +'<span style="font-size:12px;color:rgba(255,255,255,.95);font-weight:500">'+f.nome+'</span>'
        +'<span style="font-size:11px;color:rgba(255,255,255,.7)">ret. '+formatDate(f.retorno)+'<i class="ti ti-arrow-right" style="margin-left:4px;font-size:10px"></i></span>'
        +'</div>';
    }

    // helper: card compacto de mês — só ícone, label, contagem e próxima data; clique abre a lista filtrada daquele mês
    function cardMesCompacto(label,ano,itens,destacado){
      var qtd=itens.length;
      var proxima=qtd>0?formatDate(itens[0].saida):null;
      var idsMes=JSON.stringify(itens.map(function(f){return f.funcId;})).replace(/"/g,'&quot;');
      var corNum=destacado?'var(--primary-dark)':(qtd>0?'var(--text)':'var(--text-muted)');
      return '<div onclick="irParaListaMesFolga('+idsMes+')" style="background:var(--surface);border:'+(destacado?'2px solid var(--primary)':'1px solid var(--border)')+';border-radius:var(--radius-lg);padding:16px 18px;flex:1;min-width:160px;cursor:pointer;transition:box-shadow .15s" onmouseover="this.style.boxShadow=\'0 4px 16px rgba(0,0,0,.08)\'" onmouseout="this.style.boxShadow=\'none\'">'
        +'<div style="display:flex;align-items:center;gap:6px;margin-bottom:8px;flex-wrap:wrap">'
        +'<i class="ti ti-calendar-month" style="font-size:15px;color:'+(destacado?'var(--primary)':'var(--text-muted)')+'"></i>'
        +'<span style="font-size:11px;font-weight:700;color:'+(destacado?'var(--primary-dark)':'var(--text-muted)')+';text-transform:uppercase;letter-spacing:.5px">'+label+'/'+ano+'</span>'
        +(destacado?'<span style="background:var(--primary);color:#fff;border-radius:20px;font-size:9px;font-weight:700;padding:1px 6px">ATUAL</span>':'')
        +'</div>'
        +'<div style="font-size:26px;font-weight:700;color:'+corNum+'">'+qtd+'<span style="font-size:12px;font-weight:400;color:var(--text-muted);margin-left:5px">agendada(s)</span></div>'
        +(proxima?'<div style="font-size:11px;color:var(--text-muted);margin-top:6px">Próxima: '+proxima+' <i class="ti ti-arrow-right" style="margin-left:2px;font-size:9px"></i></div>':'')
        +'</div>';
    }

    cardsCols+=cardMesCompacto(mesLabel[mesAtual],anoAtual,agendMesAtual,true);
    cardsCols+=cardMesCompacto(mesLabel[proxMes],anoProxMes,agendProxMes,false);
    cardsCols+=cardMesCompacto(mesLabel[mes2],anoMes2,agendMes2,false);

    cardsHtml=secTitle+'<div style="display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap">'+cardsCols+'</div>';
  }
  const alertsHtml=[
    totalVenc>0?`<div class="folga-alert-banner danger" style="cursor:pointer" onclick="folgasNomesFiltro=null;folgasFiltro='danger';renderFolgasLocal();setTimeout(()=>document.querySelector('.folga-row')?.scrollIntoView({behavior:'smooth',block:'center'}),50)"><i class="ti ti-alert-triangle" style="font-size:18px"></i><strong>${totalVenc} vencimento(s) em atraso</strong> — colaboradores sem folga realizada</div>`:'',
    totalWarn>0?`<div class="folga-alert-banner warn" style="cursor:pointer" onclick="folgasNomesFiltro=null;folgasFiltro='warn';renderFolgasLocal();setTimeout(()=>document.querySelector('.folga-row')?.scrollIntoView({behavior:'smooth',block:'center'}),50)"><i class="ti ti-clock" style="font-size:18px"></i><strong>${totalWarn} vencimento(s) próximo(s)</strong> — planejar saídas</div>`:'',
  ].join('');
  document.getElementById('main-content').innerHTML=`
    <div class="page-header">
      <div><div class="page-title">Folgas de Campo</div><div class="page-subtitle">${listaBase.length} registros ativos</div></div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-sm" onclick="exportFolgasExcel()"><i class="ti ti-file-type-xls"></i> Excel</button>
        <button class="btn btn-primary" onclick="openModalFolga()"><i class="ti ti-plus"></i> Nova folga</button>
      </div>
    </div>
    <div class="exp-tabs">
      <div class="exp-tab active" onclick="folgasAba='programacao';renderFolgasLocal()">Programação</div>
      <div class="exp-tab" onclick="folgasAba='translados';renderFolgasLocal()">Translados</div>
    </div>
    ${cardsHtml}
    ${alertsHtml}
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px">
      <div class="metric-card" style="cursor:pointer;border-color:${folgasFiltro==='todos'?'var(--primary)':'var(--border)'}" onclick="folgasNomesFiltro=null;folgasFiltro='todos';renderFolgasLocal()"><div class="metric-label">Total de registros</div><div class="metric-value">${listaBase.length}</div></div>
      <div class="metric-card amber" style="cursor:pointer;border-color:${folgasFiltro==='warn'?'var(--warning)':'var(--border)'}" onclick="folgasNomesFiltro=null;folgasFiltro='warn';renderFolgasLocal()"><div class="metric-label">🟡 Vencendo (30d / 10d p/ ciclo 30d)</div><div class="metric-value">${totalWarn}</div></div>
      <div class="metric-card red" style="cursor:pointer;border-color:${folgasFiltro==='danger'?'var(--danger)':'var(--border)'}" onclick="folgasNomesFiltro=null;folgasFiltro='danger';renderFolgasLocal()"><div class="metric-label">🔴 Vencidas</div><div class="metric-value">${totalVenc}</div></div>
      <div class="metric-card" style="cursor:pointer;border-color:${folgasFiltro==='programadas'?'var(--info)':'var(--border)'}" onclick="folgasNomesFiltro=null;folgasFiltro='programadas';renderFolgasLocal()"><div class="metric-label">📅 Programadas</div><div class="metric-value" style="color:var(--info)">${totalProg}</div></div>
    </div>
    ${folgasNomesFiltro?`<div style="display:flex;align-items:center;gap:8px;background:#E6F7F0;border:1px solid var(--primary);border-radius:var(--radius);padding:8px 14px;margin-bottom:14px;font-size:13px;color:var(--primary-dark)"><i class="ti ti-filter"></i><span>Mostrando apenas quem tem saída agendada no mês selecionado (${lista.length} de ${listaBase.length})</span><button class="btn btn-sm" style="margin-left:auto" onclick="folgasNomesFiltro=null;renderFolgasLocal()"><i class="ti ti-x"></i> Limpar filtro</button></div>`:''}
    <div class="filters">
      <div class="search-box"><i class="ti ti-search"></i><input placeholder="Buscar funcionário..." value="${folgasBusca}" oninput="folgasNomesFiltro=null;folgasBusca=this.value;if(!_buscaHandlers.folgas)_buscaHandlers.folgas=makeBuscaHandler(v=>folgasBusca=v,renderFolgasLocal,300);_buscaHandlers.folgas(this.value);this.focus()"></div>
      <button class="btn btn-sm" onclick="folgasNomesFiltro=null;folgasFiltro='todos';folgasBusca='';renderFolgasLocal()"><i class="ti ti-x"></i> Limpar</button>
    </div>
    <div class="folga-header-row">
      <div class="folga-header-cell">Funcionário</div>
      <div class="folga-header-cell">Período</div>
      <div class="folga-header-cell">Início</div>
      <div class="folga-header-cell">Folga</div>
      <div class="folga-header-cell">Histórico</div>
      <div class="folga-header-cell">Próxima Saída</div>
      <div class="folga-header-cell">Proj. +1</div>
      <div class="folga-header-cell">Proj. +2</div>
      <div class="folga-header-cell">Proj. +3</div>
      <div class="folga-header-cell">Proj. +4</div>
    </div>
    ${rows}`;
}

// ─── TRANSLADOS ────────────────────────────────────────────────────────────
// Aba dedicada: para a saída pendente (venc.) de cada funcionário, controla se a
// passagem já foi comprada, observações, e data/local/hora de ida e de retorno,
// para organizar o transporte (translado) até o ponto de embarque. Essas
// informações também aparecem na ficha do funcionário.
function ctrCicloAtualFolga(f){
  for(let n=1;n<=5;n++){if(!f['saida'+n+'_real'])return n;}
  return 5;
}
function renderFolgasTranslados(){
  let lista=folgas.filter(f=>{
    const n=ctrCicloAtualFolga(f);
    return !!(f['saida'+n+'_programada']||f['saida'+n+'_real']||f['saida'+n+'_projecao']);
  });
  if(transladoObraFiltro)lista=lista.filter(f=>String(f.funcionario?.obra_id)===String(transladoObraFiltro));
  if(transladoBusca){
    const b=transladoBusca.toLowerCase();
    lista=lista.filter(f=>f.funcionario?.nome_completo?.toLowerCase().includes(b)||f.funcionario?.matricula?.includes(b));
  }
  lista=lista.sort((a,b)=>{
    const na=ctrCicloAtualFolga(a),nb=ctrCicloAtualFolga(b);
    const da=a['saida'+na+'_real']||a['saida'+na+'_programada']||a['saida'+na+'_projecao'];
    const db=b['saida'+nb+'_real']||b['saida'+nb+'_programada']||b['saida'+nb+'_projecao'];
    return (parseDate(da)||new Date(9999,0))-(parseDate(db)||new Date(9999,0));
  });
  const obraOpts=obras.map(o=>`<option value="${o.id}" ${transladoObraFiltro===String(o.id)?'selected':''}>${o.codigo?o.codigo+' — ':''}${o.nome||''}</option>`).join('');
  const rows=lista.map(f=>{
    const n=ctrCicloAtualFolga(f);
    const dataSaida=f['saida'+n+'_real']||f['saida'+n+'_programada']||f['saida'+n+'_projecao'];
    const statusSaida=f['saida'+n+'_real']?'✅ Realizada':f['saida'+n+'_programada']?'📅 Programada':'⏳ Projetada';
    const t=folgasTranslados.find(x=>String(x.folga_id)===String(f.id)&&x.numero_ciclo===n)||{};
    const nome=f.funcionario?.nome_completo||'—';
    const obraNome=f.funcionario?.obra?.codigo||f.funcionario?.obra?.nome||'—';
    const tipoPassagemStr=[f.tipo_passagem_aerea?'✈️ Aérea':'',f.tipo_passagem_terrestre?'🚌 Terrestre':''].filter(Boolean).join(' · ')||'—';
    const comprada=t.passagem_comprada===true;
    return `<div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px 16px;margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px;margin-bottom:10px">
        <div>
          <div style="font-weight:600">${nome}</div>
          <div style="font-size:11px;color:var(--text-muted);margin-top:2px">${f.funcionario?.matricula||'—'} · ${obraNome} · Venc.${n}: <strong>${formatDate(dataSaida)}</strong> (${statusSaida}) · ${tipoPassagemStr}</div>
        </div>
        <span class="badge" style="background:${comprada?'#F0FDF4':'#FFFBEB'};color:${comprada?'var(--success)':'#92400E'}">🎫 ${comprada?'Comprada':'Não comprada'}</span>
      </div>
      <div class="form-grid" style="gap:8px">
        <div class="form-group"><label>Passagem Comprada</label>
          <select id="tr-comprada-${f.id}">
            <option value="nao" ${!comprada?'selected':''}>Não</option>
            <option value="sim" ${comprada?'selected':''}>Sim</option>
          </select>
        </div>
        <div class="form-group full"><label>Observação</label>
          <textarea id="tr-obs-${f.id}" rows="1" placeholder="Alguma particularidade sobre a passagem (trecho, data de compra, pendência...)">${t.passagem_observacao||''}</textarea>
        </div>
        <div class="form-section" style="margin:0">Ida (saída até o ponto de embarque)</div>
        <div></div>
        <div class="form-group"><label>Data</label><input type="date" id="tr-ida-data-${f.id}" value="${t.data_ida||''}"></div>
        <div class="form-group"><label>Hora</label><input type="time" id="tr-ida-hora-${f.id}" value="${t.hora_ida||''}"></div>
        <div class="form-group full"><label>Local</label><input type="text" id="tr-ida-local-${f.id}" placeholder="Ex: Rodoviária de..., Aeroporto de..." value="${t.local_ida||''}"></div>
        <div class="form-section" style="margin:0">Retorno (chegada de volta à obra/alojamento)</div>
        <div></div>
        <div class="form-group"><label>Data</label><input type="date" id="tr-volta-data-${f.id}" value="${t.data_retorno||''}"></div>
        <div class="form-group"><label>Hora</label><input type="time" id="tr-volta-hora-${f.id}" value="${t.hora_retorno||''}"></div>
        <div class="form-group full"><label>Local</label><input type="text" id="tr-volta-local-${f.id}" placeholder="Ex: Rodoviária de..., Aeroporto de..." value="${t.local_retorno||''}"></div>
      </div>
      <div style="margin-top:10px;display:flex;justify-content:flex-end">
        <button class="btn btn-primary btn-sm" onclick="salvarTranslado('${f.id}',${n})"><i class="ti ti-check"></i> Salvar</button>
      </div>
    </div>`;
  }).join('')||'<div style="color:var(--text-muted);font-size:13px;padding:24px 0;text-align:center">Nenhum funcionário com saída pendente no momento.</div>';
  document.getElementById('main-content').innerHTML=`
    <div class="page-header">
      <div><div class="page-title">Folgas de Campo</div><div class="page-subtitle">${lista.length} translado(s) a organizar</div></div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-sm" onclick="exportFolgasExcel()"><i class="ti ti-file-type-xls"></i> Excel</button>
        <button class="btn btn-primary" onclick="openModalFolga()"><i class="ti ti-plus"></i> Nova folga</button>
      </div>
    </div>
    <div class="exp-tabs">
      <div class="exp-tab" onclick="folgasAba='programacao';renderFolgasLocal()">Programação</div>
      <div class="exp-tab active" onclick="folgasAba='translados';renderFolgasLocal()">Translados</div>
    </div>
    <div style="background:var(--info-light);border-radius:var(--radius);padding:10px 14px;font-size:12px;color:var(--info);margin-bottom:16px">
      <i class="ti ti-info-circle"></i> Para a saída pendente de cada funcionário, controle se a passagem foi comprada e organize data, local e horário de ida e de retorno. Essas informações aparecem também na ficha do funcionário.
    </div>
    <div class="filters">
      <div class="search-box"><i class="ti ti-search"></i><input placeholder="Buscar funcionário..." value="${transladoBusca}" oninput="transladoBusca=this.value;if(!_buscaHandlers.translados)_buscaHandlers.translados=makeBuscaHandler(v=>transladoBusca=v,renderFolgasTranslados,300);_buscaHandlers.translados(this.value);this.focus()"></div>
      <select class="filter-select" onchange="transladoObraFiltro=this.value;renderFolgasTranslados()">
        <option value="">Todas as obras</option>${obraOpts}
      </select>
      <button class="btn btn-sm" onclick="transladoObraFiltro='';transladoBusca='';renderFolgasTranslados()"><i class="ti ti-x"></i> Limpar</button>
    </div>
    ${rows}`;
}

async function togglePassagemComprada(folgaId,numeroCiclo,valor){
  // Atalho usado na tela de Programação: atualiza só o status da passagem,
  // preservando os demais dados do translado (observação, datas/locais de ida e volta) já salvos.
  const existente=folgasTranslados.find(x=>String(x.folga_id)===String(folgaId)&&x.numero_ciclo===numeroCiclo)||{};
  const payload={
    folga_id:folgaId,
    numero_ciclo:numeroCiclo,
    passagem_comprada:valor==='sim',
    passagem_observacao:existente.passagem_observacao||null,
    data_ida:existente.data_ida||null,
    hora_ida:existente.hora_ida||null,
    local_ida:existente.local_ida||null,
    data_retorno:existente.data_retorno||null,
    hora_retorno:existente.hora_retorno||null,
    local_retorno:existente.local_retorno||null,
  };
  const{error}=await sb.from('folgas_translados').upsert(payload,{onConflict:'folga_id,numero_ciclo'});
  if(error){showToast('Erro: '+error.message,'error');return;}
  showToast(valor==='sim'?'Passagem marcada como comprada!':'Passagem marcada como não comprada.');
  await loadFolgasTranslados();renderFolgasLocal();
}
async function salvarTranslado(folgaId,numeroCiclo){
  const payload={
    folga_id:folgaId,
    numero_ciclo:numeroCiclo,
    passagem_comprada:document.getElementById(`tr-comprada-${folgaId}`).value==='sim',
    passagem_observacao:document.getElementById(`tr-obs-${folgaId}`).value.trim()||null,
    data_ida:document.getElementById(`tr-ida-data-${folgaId}`).value||null,
    hora_ida:document.getElementById(`tr-ida-hora-${folgaId}`).value||null,
    local_ida:document.getElementById(`tr-ida-local-${folgaId}`).value.trim()||null,
    data_retorno:document.getElementById(`tr-volta-data-${folgaId}`).value||null,
    hora_retorno:document.getElementById(`tr-volta-hora-${folgaId}`).value||null,
    local_retorno:document.getElementById(`tr-volta-local-${folgaId}`).value.trim()||null,
  };
  const{error}=await sb.from('folgas_translados').upsert(payload,{onConflict:'folga_id,numero_ciclo'});
  if(error){showToast('Erro: '+error.message,'error');return;}
  showToast('Translado salvo!');
  await loadFolgasTranslados();renderFolgasTranslados();
}

function openModalFolga(folgaId=null){
  const folga=folgaId?folgas.find(f=>f.id===folgaId)||null:null;
  const isEdit=!!folga;
  const candidatos=funcionarios.filter(f=>f.situacao==='ativo'||f.situacao==='transferido');
  const funcSelecionado=folga?candidatos.find(f=>f.id===folga.funcionario_id):null;
  const valorInicial=funcSelecionado?`${funcSelecionado.matricula||'—'} — ${funcSelecionado.nome_completo}`:'';
  document.body.insertAdjacentHTML('beforeend',`
    <div class="modal-overlay" id="modal-folga" onclick="if(event.target===this)closeModal('modal-folga')">
      <div class="modal">
        <div class="modal-header"><span class="modal-title">${isEdit?'Editar':'Nova'} Folga</span><button class="btn btn-sm" onclick="closeModal('modal-folga')"><i class="ti ti-x"></i></button></div>
        <div class="modal-body"><div class="form-grid">
          <div class="form-group full autocomplete-wrap">
            <label>Funcionário *</label>

async function saveFolga(id){
  const funcId=document.getElementById('fl-func').value;
  const dataInicio=document.getElementById('fl-inicio').value;
  if(!funcId||!dataInicio){showToast('Funcionário e data início são obrigatórios','error');return;}
  const periodo=parseInt(document.getElementById('fl-periodo').value);
  const base=new Date(dataInicio+'T12:00:00');
  const ciclos=periodo===180?[180,360,540,720,900]:periodo===90?[90,180,270,360,450]:periodo===60?[60,120,180,240,300]:periodo===45?[45,90,135,180,225]:[30,60,90,120,150];
  const projecoes={};
  for(let i=0;i<5;i++){const d=new Date(base);d.setDate(d.getDate()+ciclos[i]);projecoes[`saida${i+1}_projecao`]=toISO(d);}
  const payload={
    funcionario_id:funcId,data_inicio:dataInicio,
    periodo_trabalhado:periodo,
    cidade_origem:document.getElementById('fl-cidade').value.trim()||null,
    tipo_passagem_aerea:document.getElementById('fl-aerea').checked,
    tipo_passagem_terrestre:document.getElementById('fl-terrestre').checked,
    ...projecoes
  };
  const{error}=id?await sb.from('folgas').update(payload).eq('id',id):await sb.from('folgas').insert(payload);
  if(error){showToast('Erro: '+error.message,'error');return;}
  showToast(id?'Folga atualizada!':'Folga cadastrada!');closeModal('modal-folga');renderFolgas();
}

function parseDataBR(entrada){
  // Converte DD/MM/AAAA ou AAAA-MM-DD para AAAA-MM-DD. Retorna null se inválido.
  const partes=entrada.trim().split('/');
  let dataISO;
  if(partes.length===3&&partes[0].length<=2&&partes[1].length<=2&&partes[2].length===4){
    dataISO=`${partes[2]}-${partes[1].padStart(2,'0')}-${partes[0].padStart(2,'0')}`;
  } else if(/^\d{4}-\d{2}-\d{2}$/.test(entrada.trim())){
    dataISO=entrada.trim();
  } else {
    return null;
  }
  const d=new Date(dataISO+'T12:00:00');
  if(isNaN(d.getTime()))return null;
  return dataISO;
}

function exportFolgasExcel(){
  const hoje=new Date();hoje.setHours(0,0,0,0);

  // Usa a MESMA lista filtrada exibida na tela (obra, busca, status, nomes do mês)
  let lista=folgas;
  if(globalObraFiltro)lista=lista.filter(f=>String(f.funcionario?.obra_id)===String(globalObraFiltro));
  if(folgasBusca)lista=lista.filter(f=>f.funcionario?.nome_completo?.toLowerCase().includes(folgasBusca.toLowerCase())||f.funcionario?.matricula?.includes(folgasBusca));
  if(folgasNomesFiltro)lista=lista.filter(f=>folgasNomesFiltro.has(String(f.funcionario_id)));
  if(folgasFiltro==='warn')lista=lista.filter(f=>{const vencs=calcVencimentos(f);return vencs.some((v,i)=>vencStatus(v,f[`saida${i+1}_real`],f.periodo_trabalhado)==='warn');});
  if(folgasFiltro==='danger')lista=lista.filter(f=>{const vencs=calcVencimentos(f);return vencs.some((v,i)=>vencStatus(v,f[`saida${i+1}_real`],f.periodo_trabalhado)==='danger');});
  if(folgasFiltro==='programadas')lista=lista.filter(f=>[1,2,3,4,5].some(n=>f[`saida${n}_programada`]&&!f[`saida${n}_real`]));

  if(!lista.length){showToast('Nenhum registro para exportar.','error');return;}

  lista=[...lista].sort((a,b)=>{
    const aVencs=calcVencimentos(a);const bVencs=calcVencimentos(b);
    const aMin=Math.min(...aVencs.filter((_,i)=>!a[`saida${i+1}_real`]).map(v=>v.getTime()),Infinity);
    const bMin=Math.min(...bVencs.filter((_,i)=>!b[`saida${i+1}_real`]).map(v=>v.getTime()),Infinity);
    return aMin-bMin;
  });

  const statusLabel={danger:'VENCIDA',warn:'PRÓXIMA',ok:'OK'};
  const header=['Funcionário','Matrícula','Obra','Função','Período (dias)','Início','Folga (dias úteis)'];
  for(let i=1;i<=5;i++)header.push(`Venc.${i}`,`Saída real ${i}`,`Programado ${i}`,`Status ${i}`);

  const rows=[header];
  lista.forEach(f=>{
    const vencs=calcVencimentos(f);
    const nDias=diasFolga(f.periodo_trabalhado);
    const row=[
      f.funcionario?.nome_completo||'—',
      f.funcionario?.matricula||'',
      f.funcionario?.obra?.codigo?`${f.funcionario.obra.codigo} — ${f.funcionario.obra.nome||''}`.trim():'—',
      f.funcionario?.funcao?.nome||'',
      f.periodo_trabalhado||'',
      formatDate(f.data_inicio)||'',
      nDias
    ];
    for(let i=0;i<5;i++){
      const v=vencs[i];
      const realDate=f[`saida${i+1}_real`];
      const progDate=f[`saida${i+1}_programada`];
      const st=vencStatus(v,realDate,f.periodo_trabalhado);
      row.push(
        v?formatDate(v):'',
        realDate?formatDate(realDate):'',
        progDate?formatDate(progDate):'',
        realDate?'REALIZADA':statusLabel[st]||''
      );
    }
    rows.push(row);
  });

  const ws=XLSX.utils.aoa_to_sheet(rows);
  ws['!cols']=[{wch:28},{wch:10},{wch:24},{wch:18},{wch:12},{wch:12},{wch:12},
    ...Array(5).fill([{wch:12},{wch:12},{wch:12},{wch:11}]).flat()];
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Folgas');
  const dataEmissao=new Date().toLocaleDateString('pt-BR').replace(/\//g,'-');
  const sufixoObra=globalObraFiltro?`_${obras.find(o=>o.id===globalObraFiltro)?.codigo||'obra'}`:'';
  XLSX.writeFile(wb,`Folgas_GTEL${sufixoObra}_${dataEmissao}.xlsx`);
  showToast('Excel exportado!');
}

// ─── FÉRIAS ───────────────────────────────────────────────────────────────────
let feriasFiltro='todos',feriasBusca='',feriasObraFiltro='';
let feriasObraTocado=false; // true quando o usuário interage manualmente com o select de obra desta página

async function renderFerias(){
  await loadFerias();
  renderFeriasLocal();
}
function renderFeriasLocal(){
  const hoje=new Date();hoje.setHours(0,0,0,0);

  // Sincronizar com o filtro global de obra (sidebar), a menos que o usuário tenha escolhido manualmente um filtro local diferente
  if(!feriasObraTocado){
    feriasObraFiltro=globalObraFiltro||''; // usa obra.id igual ao filtro global
  }

  // Aplicar filtro de obra (global ou local do módulo) — compara por obra_id do funcionário
  const obraFiltroAtivo=feriasObraFiltro||'';
  const feriasBase=obraFiltroAtivo
    ?feriasData.filter(f=>f.funcionario?.obra_id===obraFiltroAtivo||f.funcionario?.obra?.codigo===obraFiltroAtivo)
    :feriasData;

  // Agrupar por matrícula, ordenar por periodo_aquisitivo_inicio asc
  const byMat={};
  feriasBase.forEach(f=>{
    const mat=f.matricula||'?';
    if(!byMat[mat])byMat[mat]=[];
    byMat[mat].push(f);
  });
  Object.values(byMat).forEach(arr=>arr.sort((a,b)=>{
    const da=parseDate(a.periodo_aquisitivo_inicio)||new Date(0);
    const db=parseDate(b.periodo_aquisitivo_inicio)||new Date(0);
    return da-db;
  }));

  const totalFuncs=Object.keys(byMat).length;
  const totalPeriodos=feriasBase.length;

  // Funcionários atualmente em férias (programado com data_inicio_programada<=hoje<=data_fim_programada)
  const matsEmFerias=new Set();
  feriasBase.forEach(f=>{
    if(!f.programado||!f.data_inicio_programada||!f.data_fim_programada)return;
    const ini=parseDate(f.data_inicio_programada),fim=parseDate(f.data_fim_programada);
    if(ini&&fim&&ini<=hoje&&fim>=hoje)matsEmFerias.add(f.matricula);
  });
  const emFeriasCount=matsEmFerias.size;

  // Stats
  let progCount=0,naoProgCount=0;
  let per1Vencidas=0,per1Vencendo60=0;
  let per2Vencidas=0,per2Vencendo60=0;
  let alertaVencidas=0,alertaVencendo30=0;

  Object.values(byMat).forEach(arr=>{
    if(arr.some(f=>f.programado))progCount++;
    if(arr.some(f=>!f.programado))naoProgCount++;
    const p1=arr[0],p2=arr[1];
    // 1º período — alerta pelo Limite Máx. Legal
    if(p1&&!p1.programado){
      const limMax=parseDate(p1.dt_limite_maxima);
      if(limMax){const d=Math.floor((limMax-hoje)/86400000);
        if(d<0){per1Vencidas++;alertaVencidas++;}
        else if(d<=60){per1Vencendo60++;alertaVencendo30++;}
      }
    }
    // 2º período — alerta pelo Limite Máx. Legal
    if(p2&&!p2.programado){
      const limMax=parseDate(p2.dt_limite_maxima);
      if(limMax){const d=Math.floor((limMax-hoje)/86400000);
        if(d<0){per2Vencidas++;alertaVencidas++;}
        else if(d<=60){per2Vencendo60++;alertaVencendo30++;}
      }
    }
  });

  // Status por funcionário para ordenação/filtro
  // Status sempre pelo período mais antigo não programado (1º vence antes → gera multa)
  function getPeriodoUrgente(arr){
    // Retorna o período pendente (não gozado) mais antigo
    return arr.find(p=>ePendente(p))||null;
  }
  function getStatus(arr){
    const p=getPeriodoUrgente(arr);if(!p)return'ok';
    const limMax=parseDate(p.dt_limite_maxima);
    if(limMax&&limMax<hoje)return'vencida';
    if(limMax){const d=Math.floor((limMax-hoje)/86400000);if(d>=0&&d<=60)return'vencendo';}
    return'ok';
  }

  // Filtros
  let listaFuncs=Object.values(byMat);
  if(feriasBusca)listaFuncs=listaFuncs.filter(arr=>{
    const f=arr[0];
    return(f.funcionario?.nome_completo||'').toLowerCase().includes(feriasBusca.toLowerCase())||(f.matricula||'').includes(feriasBusca);
  });
  if(feriasFiltro==='programado')listaFuncs=listaFuncs.filter(arr=>arr.some(f=>f.programado));
  if(feriasFiltro==='naoprog')listaFuncs=listaFuncs.filter(arr=>arr.some(p=>ePendente(p)));
  if(feriasFiltro==='emferias')listaFuncs=listaFuncs.filter(arr=>matsEmFerias.has(arr[0]?.matricula));
  if(feriasFiltro==='vencidas')listaFuncs=listaFuncs.filter(arr=>{const p=getPeriodoUrgente(arr);if(!p)return false;const l=parseDate(p.dt_limite_maxima);return l&&l<hoje;});
  if(feriasFiltro==='vencendo60')listaFuncs=listaFuncs.filter(arr=>{const p=getPeriodoUrgente(arr);if(!p)return false;const l=parseDate(p.dt_limite_maxima);if(!l)return false;const d=Math.floor((l-hoje)/86400000);return d>=0&&d<=60;});
  if(feriasFiltro==='per1vencida')listaFuncs=listaFuncs.filter(arr=>{const p=arr[0];if(!p||p.programado)return false;const l=parseDate(p.dt_limite_maxima);return l&&l<hoje;});
  if(feriasFiltro==='per1vencendo')listaFuncs=listaFuncs.filter(arr=>{const p=arr[0];if(!p||p.programado)return false;const l=parseDate(p.dt_limite_maxima);if(!l)return false;const d=Math.floor((l-hoje)/86400000);return d>=0&&d<=60;});
  if(feriasFiltro==='per2vencida')listaFuncs=listaFuncs.filter(arr=>{const p=arr[1];if(!p||p.programado)return false;const l=parseDate(p.dt_limite_maxima);return l&&l<hoje;});
  if(feriasFiltro==='per2vencendo')listaFuncs=listaFuncs.filter(arr=>{const p=arr[1];if(!p||p.programado)return false;const l=parseDate(p.dt_limite_maxima);if(!l)return false;const d=Math.floor((l-hoje)/86400000);return d>=0&&d<=60;});

  // Ordenar por urgência real:
  // Critério: periodo_aquisitivo_fim do período mais urgente (não programado)
  // Quem vence primeiro aparece no topo
  function getDataUrgente(arr){
    const pendentes=arr.filter(p=>ePendente(p));
    if(pendentes.length===0) return parseDate(arr[arr.length-1]?.periodo_aquisitivo_fim)||new Date(9999,0);
    const datas=pendentes.map(p=>parseDate(p.dt_limite_maxima)||new Date(9999,0));
    return datas.reduce((min,d)=>d<min?d:min, new Date(9999,0));
  }
  // Período "pendente" = não gozado ainda
  // programado mas data_inicio no futuro = agendado mas não saiu = AINDA pendente
  function ePendente(p){
    if(!p.programado) return true;
    const ini=parseDate(p.data_inicio_programada);
    return !ini || ini > hoje; // se início futuro, ainda não gozou
  }
  function getUrgenciaNivel(arr){
    // 0=limMax vencido (férias não gozadas — multa legal)
    // 1=prazo p/ programar vencido
    // 2=vencendo <=60d no limMax
    // 3=vencendo <=90d no limMax
    // 4=em curso agora ou gozado
    const pendentes=arr.filter(p=>ePendente(p));
    if(pendentes.length===0) return 4;
    let melhorNivel=4, melhorData=new Date(9999,0);
    pendentes.forEach(p=>{
      const limMax=parseDate(p.dt_limite_maxima);
      if(!limMax) return;
      const diasLim=Math.floor((limMax-hoje)/86400000);
      const fimPer=parseDate(p.periodo_aquisitivo_fim);
      const progAte=fimPer?new Date(fimPer.getTime()-60*86400000):null;
      const diasProg=progAte?Math.floor((progAte-hoje)/86400000):null;
      let nivel=4;
      if(diasLim<0) nivel=0;
      else if(diasProg!==null&&diasProg<0) nivel=1;
      else if(diasLim<=60) nivel=2;
      else if(diasLim<=90) nivel=3;
      if(nivel<melhorNivel||(nivel===melhorNivel&&limMax<melhorData)){
        melhorNivel=nivel; melhorData=limMax;
      }
    });
    return melhorNivel;
  }
  listaFuncs.sort((a,b)=>{
    const na=getUrgenciaNivel(a), nb=getUrgenciaNivel(b);
    if(na!==nb) return na-nb;       // nível de urgência primeiro
    return getDataUrgente(a)-getDataUrgente(b); // data mais próxima primeiro
  });

  // Alertas — clicáveis para filtrar a tabela
  const alertas=[];
  if(alertaVencidas>0)alertas.push(`<div onclick="feriasFiltro='vencidas';renderFerias()" style="display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:var(--radius);margin-bottom:6px;background:var(--danger-light);border:1px solid #FCA5A5;color:#991B1B;cursor:pointer"><i class="ti ti-alert-triangle" style="font-size:18px;flex-shrink:0"></i><strong>${alertaVencidas} funcionário(s) com férias vencidas — risco legal</strong><i class="ti ti-chevron-right" style="margin-left:auto;opacity:.5"></i></div>`);
  if(alertaVencendo30>0)alertas.push(`<div onclick="feriasFiltro='vencendo60';renderFerias()" style="display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:var(--radius);margin-bottom:6px;background:var(--warning-light);border:1px solid #FCD34D;color:#92400E;cursor:pointer"><i class="ti ti-clock" style="font-size:18px;flex-shrink:0"></i><strong>${alertaVencendo30} vencendo em 60 dias — programar urgente</strong><i class="ti ti-chevron-right" style="margin-left:auto;opacity:.5"></i></div>`);

  // Obras
  // Opções do select local de obra — value=obra.id, label=codigo — nome
  const obrasUnicasMap={};
  feriasData.forEach(f=>{
    const oId=f.funcionario?.obra_id;
    if(oId&&!obrasUnicasMap[oId])obrasUnicasMap[oId]=[f.funcionario?.obra?.codigo,f.funcionario?.obra?.nome].filter(Boolean).join(' — ');
  });
  const obraFilterOpts=Object.entries(obrasUnicasMap).sort((a,b)=>a[1].localeCompare(b[1],'pt-BR')).map(([id,label])=>`<option value="${id}" ${feriasObraFiltro===id?'selected':''}>${label}</option>`).join('');

  // Helper: bloco de período
  function blocoPeríodo(f, isSegundo, per2Ref){
    if(!f) return '<td style="text-align:center;color:var(--text-muted);font-size:12px;padding:8px 12px">—</td>';
    const limMax  = parseDate(f.dt_limite_maxima);
    const fimPer  = parseDate(f.periodo_aquisitivo_fim);
    const perAqui = formatDate(f.periodo_aquisitivo_inicio) + ' → ' + formatDate(f.periodo_aquisitivo_fim);
    const dias    = f.dias_direito || 30;

    // Datas de controle
    const progAte   = fimPer ? new Date(fimPer.getTime() - 60*86400000) : null;
    const iniAlerta = fimPer ? new Date(fimPer.getTime() - 90*86400000) : null;
    const diasProg  = progAte  ? Math.floor((progAte  - hoje)/86400000) : null;
    const diasFim   = fimPer   ? Math.floor((fimPer   - hoje)/86400000) : null;
    const naZona    = iniAlerta ? (hoje >= iniAlerta) : false;

    var cor, bg, border, icon, corpo;

    if (f.programado) {
      cor='var(--success)'; bg='var(--success-light)'; border='none'; icon='✓ ';
      corpo = '<span style="font-size:11px;font-weight:600;color:var(--success)">Programado · ' + dias + 'd</span>'
            + (f.validado_dp
                ? '<br><span style="font-size:10px;font-weight:700;color:var(--success)">✓ Validado DP</span>'
                : '<br><span style="font-size:10px;font-weight:700;color:var(--warning)">⏳ Aguardando DP</span>');

    } else if (isSegundo) {
      // ── 2º PERÍODO ──
      // Data principal = periodo_aquisitivo_fim (23/09/2026) — vencimento real das férias
      // NÃO usar dt_limite_maxima como data principal
      var feriasVenc = diasFim  !== null && diasFim  < 0;
      var prazoVenc  = !feriasVenc && diasProg !== null && diasProg < 0;
      var vermelho   = !feriasVenc && !prazoVenc && diasProg !== null && diasProg <= 60;
      var amarelo    = !feriasVenc && !prazoVenc && !vermelho && naZona;

      if (feriasVenc) {
        cor='var(--danger)'; bg='var(--danger-light)'; border='1px solid #FCA5A5'; icon='⚠️ ';
        corpo = '<span style="font-size:11px;font-weight:700;color:var(--danger)">Férias vencidas — risco legal</span>';
      } else if (prazoVenc) {
        cor='var(--danger)'; bg='var(--danger-light)'; border='1px solid #FCA5A5'; icon='🔴 ';
        corpo = '<span style="font-size:11px;font-weight:700;color:var(--danger)">' + diasFim + 'd para vencer</span>'
              + '<br><span style="font-size:10px;color:var(--danger)">Programar até: <strong>' + formatDate(progAte) + '</strong> (prazo vencido)</span>';
      } else if (vermelho) {
        cor='var(--danger)'; bg='var(--danger-light)'; border='1px solid #FCA5A5'; icon='🔴 ';
        corpo = '<span style="font-size:11px;font-weight:700;color:var(--danger)">' + diasProg + 'd para o prazo</span>'
              + '<br><span style="font-size:10px;color:var(--danger)">Programar até: <strong>' + formatDate(progAte) + '</strong></span>';
      } else if (amarelo) {
        cor='#b45309'; bg='var(--warning-light)'; border='1px solid #FCD34D'; icon='🟡 ';
        corpo = '<span style="font-size:11px;font-weight:700;color:#b45309">' + diasProg + 'd para o prazo</span>'
              + '<br><span style="font-size:10px;color:#b45309">Programar até: <strong>' + formatDate(progAte) + '</strong></span>';
      } else {
        cor='var(--text)'; bg='transparent'; border='none'; icon='';
        // Contador = dias até o vencimento das férias (fimPer)
        corpo = '<span style="font-size:11px;font-weight:600;color:var(--text)">' + (diasFim !== null ? diasFim + 'd para vencer' : '—') + '</span>'
              + (progAte ? '<br><span style="font-size:10px;color:var(--text-muted)">Programar até: ' + formatDate(progAte) + '</span>' : '');
      }

      // Para o 2º período: mostrar fimPer (vencimento real) como data principal, não limMax
      return '<td style="padding:8px 12px">'
        + '<div style="font-size:10px;color:var(--text-muted);margin-bottom:4px;white-space:nowrap">' + perAqui + '</div>'
        + '<div style="background:' + bg + ';border:' + border + ';border-radius:6px;padding:6px 10px;display:inline-block;min-width:140px">'
          + '<div style="font-size:13px;font-weight:700;color:' + cor + '">' + icon + (formatDate(fimPer)||'—') + '</div>'
          + (corpo ? '<div style="margin-top:4px;line-height:1.5">' + corpo + '</div>' : '')
        + '</div>'
      + '</td>';

    } else {
      // ── 1º PERÍODO ──
      var jaVenc  = limMax && limMax < hoje;
      var temProx = !!per2Ref;

      // Usar fimPer para saber se o período aquisitivo já passou
      var perAqVenc = fimPer && fimPer < hoje;
      var dM = limMax ? Math.floor((limMax-hoje)/86400000) : null;

      if (jaVenc) {
        // Limite máximo legal (dt_limite_maxima) já passou — risco legal real, independente de haver 2º período
        cor='var(--danger)'; bg='var(--danger-light)'; border='1px solid #FCA5A5'; icon='⚠️ ';
        corpo = '<span style="font-size:11px;font-weight:700;color:var(--danger)">1º Período Vencido</span>'
              + '<br><span style="font-size:10px;color:var(--danger)">Férias não gozadas — ação necessária</span>';
      } else if (temProx && perAqVenc) {
        // Período aquisitivo já encerrou, mas o prazo legal (limite máx.) ainda não venceu — não é risco, apenas informativo
        cor='var(--text-muted)'; bg='transparent'; border='none'; icon='';
        corpo = '<span style="font-size:11px;color:var(--text-muted)">1º Período Encerrado'
              + (dM!==null ? ' · '+dM+'d até o limite legal' : '') + '</span>';
      } else if (temProx) {
        // Período aquisitivo ainda vigente com 2º — discreto
        cor='var(--text-muted)'; bg='transparent'; border='none'; icon='';
        corpo = '<span style="font-size:11px;color:var(--text-muted)">1º Período em curso</span>';
      } else {
        // Único período, ainda vigente — mostrar data e contador normal
        var warnMax = dM!==null && dM<=60;
        cor = warnMax?'var(--warning)':'var(--text)';
        bg = warnMax?'var(--warning-light)':'transparent';
        border = warnMax?'1px solid #FCD34D':'none';
        icon = warnMax?'⏰ ':'';
        corpo = dM!==null ? '<span style="font-size:11px;font-weight:600;color:'+cor+'">' + dM + 'd restantes · ' + dias + 'd</span>' : '';
      }
    }

    // Retorno padrão para 1º período
    // Mostrar a data do limite legal sempre que for o caso de risco real (jaVenc) ou quando não há 2º período
    var mostrarData = jaVenc || !temProx;
    return '<td style="padding:8px 12px">'
      + '<div style="font-size:10px;color:var(--text-muted);margin-bottom:4px;white-space:nowrap">' + perAqui + '</div>'
      + '<div style="background:' + bg + ';border:' + border + ';border-radius:6px;padding:6px 10px;display:inline-block;min-width:140px">'
        + (mostrarData ? '<div style="font-size:13px;font-weight:700;color:' + cor + '">' + icon + (formatDate(limMax)||'—') + '</div>' : '')
        + (corpo ? '<div style="margin-top:4px;line-height:1.5">' + corpo + '</div>' : '')
      + '</div>'
    + '</td>';
  }

  // Projetar 2º período no padrão TOTVS quando não existe na planilha
  function projetarPer2(per1){
    const fimPer1=parseDate(per1.periodo_aquisitivo_fim);
    if(!fimPer1)return null;
    const inicioPer2=new Date(fimPer1);inicioPer2.setDate(inicioPer2.getDate()+1);
    const fimPer2=new Date(inicioPer2);fimPer2.setFullYear(fimPer2.getFullYear()+1);fimPer2.setDate(fimPer2.getDate()-1);
    // Limite Máx. Legal do 2º = mesmo do 1º projetado +1 ano
    const limMaxPer1=parseDate(per1.dt_limite_maxima);
    const limMaxPer2=limMaxPer1?new Date(limMaxPer1.getFullYear()+1,limMaxPer1.getMonth(),limMaxPer1.getDate()):null;
    return{
      _projetado:true,
      matricula:per1.matricula,
      funcionario:per1.funcionario,
      programado:false,
      dias_direito:per1.dias_direito||30,
      periodo_aquisitivo_inicio:toISO(inicioPer2),
      periodo_aquisitivo_fim:toISO(fimPer2),
      dt_limite_maxima:toISO(limMaxPer2),
      dt_limite_ideal:null,
    };
  }

  // Tabela
  const rows=listaFuncs.map(arr=>{
    const f0=arr[0];
    const nomeFunc=f0.funcionario?.nome_completo||f0.matricula||'—';
    const obraFunc=f0.funcionario?.obra?.codigo
      ?`${f0.funcionario.obra.codigo} — ${f0.funcionario.obra.nome||''}`
      :f0.funcionario?.obra?.nome||'—';
    const per1=arr[0]||null;
    const per2=arr[1]||( per1?projetarPer2(per1):null );
    const st=getStatus(arr);
    const estaEmFerias=matsEmFerias.has(f0.matricula);
    const rowStyle=estaEmFerias?'border-left:4px solid #2563EB;background:#EFF6FF':st==='vencida'?'border-left:4px solid var(--danger)':st==='vencendo'?'border-left:4px solid var(--warning)':'';
    const pendente=arr.find(f=>!f.programado);
    const programados=arr.filter(f=>f.programado);
    const btnProg=`<div style="display:flex;flex-direction:column;gap:4px;align-items:flex-start">
      ${programados.map(f=>`
        <div style="display:flex;align-items:center;gap:4px">
          <button class="prog-btn programada" style="font-size:11px;padding:3px 8px" onclick="openModalProgramarFerias('${f.id}')"><i class="ti ti-edit" style="font-size:11px"></i> Alterar</button>
          <button class="prog-btn" style="background:#FEE2E2;color:#991B1B;border-color:#FCA5A5;font-size:11px;padding:3px 8px" onclick="cancelarProgFerias('${f.id}')"><i class="ti ti-x" style="font-size:11px"></i> Cancelar</button>
        </div>`).join('')}
      ${pendente?`<button class="prog-btn" style="font-size:11px;padding:3px 8px" onclick="openModalProgramarFerias('${pendente.id}')">📅 Programar${arr.length>1?' Per.'+(arr.indexOf(pendente)+1):''}</button>`:''}
    </div>`;
    const progResume=programados.map(f=>
      `<div style="display:flex;align-items:center;gap:8px;margin-bottom:2px">
        <span style="font-size:11px;color:var(--success)">✓ ${f.dias_programados||'?'}d: ${formatDate(f.data_inicio_programada)} → ${formatDate(f.data_fim_programada)}</span>
        <label style="display:flex;align-items:center;gap:3px;cursor:pointer;font-size:10px;font-weight:600;white-space:nowrap;color:${f.validado_dp?'var(--success)':'var(--warning)'}" title="Marque quando o DP confirmar que a programação foi lançada/efetivada">
          <input type="checkbox" ${f.validado_dp?'checked':''} onchange="toggleValidadoDP('${f.id}',this.checked)" style="cursor:pointer;margin:0">
          ${f.validado_dp?'Validado DP':'Aguardando DP'}
        </label>
      </div>`
    ).join('')||'<span style="color:var(--text-muted);font-size:12px">—</span>';

    return`<tr style="${rowStyle}">
      <td><div class="name-cell">
        ${avatarHtml(f0.funcionario?.foto_url, nomeFunc)}
        <div>
          <div style="font-weight:500;display:flex;align-items:center;gap:6px;cursor:pointer" onclick="event.stopPropagation();verFicha('${f0.funcionario_id}')" title="Ver ficha">${nomeFunc}${estaEmFerias?'<span style="background:#2563EB;color:#fff;font-size:9px;font-weight:700;padding:2px 7px;border-radius:10px;letter-spacing:.3px;white-space:nowrap">🌴 EM FÉRIAS</span>':''}</div>
          <div style="font-size:11px;color:var(--text-muted)">${f0.matricula||'—'}</div>
          ${f0.funcionario?.funcao?.nome?`<div style="font-size:11px;color:var(--primary-dark);font-weight:500;margin-top:1px">${f0.funcionario.funcao.nome}</div>`:''}
          ${f0.funcionario?.data_admissao?`<div style="font-size:10px;color:var(--text-muted);margin-top:1px">Admissão: ${formatDate(f0.funcionario.data_admissao)}</div>`:''}
          ${estaEmFerias?(()=>{const fEm=arr.find(x=>x.programado&&x.data_inicio_programada&&x.data_fim_programada&&parseDate(x.data_inicio_programada)<=hoje&&parseDate(x.data_fim_programada)>=hoje);return fEm?`<div style="font-size:10px;color:#2563EB;font-weight:600;margin-top:1px">Retorna em ${formatDate(fEm.data_fim_programada)}</div>`:'';})():''}
        </div>
      </div></td>
      <td style="font-size:12px;white-space:nowrap">${obraFunc}</td>
      ${blocoPeríodo(per1,false,per2)}
      ${blocoPeríodo(per2,true,null)}
      <td>${progResume}</td>
      <td>${btnProg}</td>
    </tr>`;
  }).join('')||`<tr><td colspan="8"><div class="empty-state"><i class="ti ti-palm-tree"></i><div>Nenhum registro encontrado</div><div style="font-size:12px;margin-top:8px">Importe a planilha do DP para começar</div></div></td></tr>`;

  // Verificar ativos sem registro de férias
  const matsComFerias=new Set(feriasData.map(f=>String(f.matricula||'').trim().replace(/^0+/,'')));
  const ativosSemFerias=funcionarios.filter(f=>{
    if(f.situacao!=='ativo'||f.obra_transferencia_id)return false;
    if(globalObraFiltro&&f.obra_id!==globalObraFiltro)return false;
    const mat=String(f.matricula||'').trim().replace(/^0+/,'');
    return mat&&!matsComFerias.has(mat);
  });

  window._ativosSemFerias=ativosSemFerias;

  document.getElementById('main-content').innerHTML=`
    <div class="page-header">
      <div>
        <div class="page-title">Controle de Férias</div>
        <div class="page-subtitle">${totalFuncs} funcionários · ${totalPeriodos} períodos${ativosSemFerias.length?` · <span onclick="abrirModalSemFerias()" style="color:var(--warning);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px">⚠ ${ativosSemFerias.length} ativo(s) sem registro na planilha DP</span>`:''}</div>
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-sm" onclick="exportFeriasExcel()"><i class="ti ti-file-type-xls"></i> Excel</button>
        <button class="btn btn-sm btn-success" onclick="exportFeriasPDF()"><i class="ti ti-file-type-pdf"></i> PDF</button>
        <button class="btn btn-sm" onclick="openModalFeriasManual()"><i class="ti ti-calendar-plus"></i> Lançar Período</button>
        <button class="btn btn-primary" onclick="openImportFerias()"><i class="ti ti-upload"></i> Importar planilha DP</button>
      </div>
    </div>
    ${alertas.length?`<div style="margin-bottom:16px">${alertas.join('')}</div>`:''}

    <!-- Cards linha 1: geral -->
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:10px">
      <div class="ferias-card ${feriasFiltro==='todos'?'active':''}" onclick="feriasFiltro='todos';renderFerias()">
        <div class="ferias-card-value" style="color:var(--text)">${totalFuncs}</div>
        <div class="ferias-card-label">Funcionários</div>
      </div>
      <div class="ferias-card green ${feriasFiltro==='programado'?'active':''}" onclick="feriasFiltro='programado';renderFerias()">
        <div class="ferias-card-value">${progCount}</div>
        <div class="ferias-card-label">Programadas</div>
      </div>
      <div class="ferias-card blue ${feriasFiltro==='naoprog'?'active':''}" onclick="feriasFiltro='naoprog';renderFerias()">
        <div class="ferias-card-value">${naoProgCount}</div>
        <div class="ferias-card-label">Não Progr.</div>
      </div>
      <div class="ferias-card ${feriasFiltro==='emferias'?'active':''}" style="${emFeriasCount?'border-color:#93C5FD':''}" onclick="feriasFiltro='emferias';renderFerias()">
        <div class="ferias-card-value" style="color:#185FA5">${emFeriasCount}</div>
        <div class="ferias-card-label">Em Férias</div>
      </div>
    </div>

    <!-- Cards linha 2: por período -->
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px">
      <div style="background:var(--surface);border:2px solid #BFDBFE;border-radius:var(--radius-lg);padding:14px">
        <div style="font-size:11px;font-weight:700;color:#1E40AF;margin-bottom:10px;letter-spacing:.5px">
          📅 1º PERÍODO AQUISITIVO
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
          <div style="background:var(--danger-light);border-radius:var(--radius);padding:10px;text-align:center;cursor:pointer;border:2px solid ${feriasFiltro==='per1vencida'?'var(--danger)':'transparent'}" onclick="feriasFiltro='per1vencida';renderFerias()">
            <div style="font-size:26px;font-weight:700;color:var(--danger)">${per1Vencidas}</div>
            <div style="font-size:10px;color:var(--danger);font-weight:600;text-transform:uppercase">Vencidas</div>
          </div>
          <div style="background:var(--warning-light);border-radius:var(--radius);padding:10px;text-align:center;cursor:pointer;border:2px solid ${feriasFiltro==='per1vencendo'?'var(--warning)':'transparent'}" onclick="feriasFiltro='per1vencendo';renderFerias()">
            <div style="font-size:26px;font-weight:700;color:var(--warning)">${per1Vencendo60}</div>
            <div style="font-size:10px;color:var(--warning);font-weight:600;text-transform:uppercase">Vencendo 60d</div>
          </div>
        </div>
      </div>
      <div style="background:var(--surface);border:2px solid #FED7AA;border-radius:var(--radius-lg);padding:14px">
        <div style="font-size:11px;font-weight:700;color:#C2410C;margin-bottom:10px;letter-spacing:.5px">
          📅 2º PERÍODO AQUISITIVO
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
          <div style="background:var(--danger-light);border-radius:var(--radius);padding:10px;text-align:center;cursor:pointer;border:2px solid ${feriasFiltro==='per2vencida'?'var(--danger)':'transparent'}" onclick="feriasFiltro='per2vencida';renderFerias()">
            <div style="font-size:26px;font-weight:700;color:var(--danger)">${per2Vencidas}</div>
            <div style="font-size:10px;color:var(--danger);font-weight:600;text-transform:uppercase">Vencidas</div>
          </div>
          <div style="background:var(--warning-light);border-radius:var(--radius);padding:10px;text-align:center;cursor:pointer;border:2px solid ${feriasFiltro==='per2vencendo'?'var(--warning)':'transparent'}" onclick="feriasFiltro='per2vencendo';renderFerias()">
            <div style="font-size:26px;font-weight:700;color:var(--warning)">${per2Vencendo60}</div>
            <div style="font-size:10px;color:var(--warning);font-weight:600;text-transform:uppercase">Vencendo 60d</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Filtros -->
    <div class="filters">
      <div class="search-box"><i class="ti ti-search"></i><input placeholder="Buscar por nome ou matrícula..." value="${feriasBusca}" oninput="feriasBusca=this.value;if(!_buscaHandlers.ferias)_buscaHandlers.ferias=makeBuscaHandler(v=>feriasBusca=v,renderFeriasLocal,300);_buscaHandlers.ferias(this.value);this.focus()"></div>
      <select class="filter-select" onchange="feriasObraFiltro=this.value;feriasObraTocado=true;renderFerias()">
        <option value="">Todas as obras</option>${obraFilterOpts}
      </select>
      <button class="btn btn-sm" onclick="feriasFiltro='todos';feriasBusca='';feriasObraFiltro='';feriasObraTocado=true;renderFerias()"><i class="ti ti-x"></i> Limpar</button>
    </div>

    <!-- Tabela -->
    <div class="table-container" style="overflow-x:auto"><table>
      <thead>
        <tr>
          <th rowspan="2" style="min-width:180px">Funcionário</th>
          <th rowspan="2">Obra / C. Custo</th>
          <th style="text-align:center;background:#EFF6FF;color:#1E40AF;border-bottom:2px solid #BFDBFE;padding:8px;font-size:10px;font-weight:700;letter-spacing:.5px">
            1º PERÍODO — LIMITE MÁX. LEGAL
          </th>
          <th style="text-align:center;background:#FFF7ED;color:#C2410C;border-bottom:2px solid #FED7AA;padding:8px;font-size:10px;font-weight:700;letter-spacing:.5px">
            2º PERÍODO — LIMITE MÁX. LEGAL
          </th>
          <th rowspan="2">Programação</th>
          <th rowspan="2"></th>
        </tr>
        <tr>
          <th style="background:#EFF6FF;color:#1E40AF;font-size:10px;font-weight:600;padding:5px 12px">⚠️ Alerta 60 dias antes do vencimento</th>
          <th style="background:#FFF7ED;color:#C2410C;font-size:10px;font-weight:600;padding:5px 12px">⚠️ Alerta 60 dias antes do vencimento</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table></div>
  `;
}


// Modal programar férias
function abrirModalSemFerias(){
  const lista=window._ativosSemFerias||[];
  if(!lista.length)return;
  const rows=lista.map(f=>{
    const obraLabel=f.obra?(f.obra.codigo?f.obra.codigo+' — ':'')+f.obra.nome:'—';
    return`<tr style="cursor:pointer" onclick="closeModal('modal-sem-ferias');showPage('funcionarios');setTimeout(()=>{busca='${(f.nome_completo||'').replace(/'/g,"\\'")}';atualizarTabelaFuncionarios();},400)"
      onmouseover="this.style.background='var(--bg)'" onmouseout="this.style.background=''">
      <td style="padding:10px 12px">
        <div style="display:flex;align-items:center;gap:10px">
          ${avatarHtml(f.foto_url,f.nome_completo)}
          <div>
            <div style="font-weight:500">${f.nome_completo||'—'}</div>
            <div style="font-size:11px;color:var(--text-muted)">${f.matricula||'—'}</div>
          </div>
        </div>
      </td>
      <td style="padding:10px 12px;font-size:12px;color:var(--text-muted)">${obraLabel}</td>
      <td style="padding:10px 12px;font-size:12px;color:var(--text-muted)">${f.funcao?.nome||f.funcao_manual||'—'}</td>
      <td style="padding:10px 12px;font-size:12px;color:var(--primary);font-weight:500">→ Ver ficha</td>
    </tr>`;
  }).join('');
  document.body.insertAdjacentHTML('beforeend',`
    <div class="modal-overlay" id="modal-sem-ferias" onclick="if(event.target===this)closeModal('modal-sem-ferias')">
      <div class="modal" style="max-width:600px">
        <div class="modal-header">
          <span class="modal-title" style="color:var(--warning)"><i class="ti ti-alert-triangle"></i> Ativos sem registro na planilha DP</span>
          <button class="btn btn-sm" onclick="closeModal('modal-sem-ferias')"><i class="ti ti-x"></i></button>
        </div>
        <div class="modal-body" style="padding:0">
          <div style="padding:12px 16px;background:var(--warning-light);border-bottom:1px solid #FCD34D;font-size:12px;color:#92400E">
            <i class="ti ti-info-circle"></i> Estes funcionários estão ativos no sistema mas não constam na última planilha de férias importada do DP. Clique em um nome para ir à ficha do funcionário.
          </div>
          <div style="max-height:400px;overflow-y:auto">
            <table style="width:100%;border-collapse:collapse">
              <thead><tr style="background:var(--bg)">
                <th style="padding:8px 12px;text-align:left;font-size:11px;color:var(--text-muted)">Funcionário</th>
                <th style="padding:8px 12px;text-align:left;font-size:11px;color:var(--text-muted)">Obra</th>
                <th style="padding:8px 12px;text-align:left;font-size:11px;color:var(--text-muted)">Função</th>
                <th></th>
              </tr></thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn" onclick="closeModal('modal-sem-ferias')">Fechar</button>
        </div>
      </div>
    </div>`);

async function salvarProgFerias(id){
  const dias=parseInt(document.getElementById('prog-dias').value);
  const inicio=document.getElementById('prog-inicio').value;
  const fim=document.getElementById('prog-fim').value;
  const passagemComprada=document.getElementById('prog-passagem-comprada').value==='sim';
  const passagemObs=document.getElementById('prog-passagem-obs').value.trim()||null;
  if(!inicio||!fim){showToast('Data início e fim são obrigatórias','error');return;}
  const{error}=await sb.from('ferias').update({programado:true,dias_programados:dias,data_inicio_programada:inicio,data_fim_programada:fim,validado_dp:false,passagem_comprada:passagemComprada,passagem_observacao:passagemObs}).eq('id',id);
  if(error){showToast('Erro: '+error.message,'error');return;}
  showToast('Férias programadas!');closeModal('modal-prog-ferias');await loadFerias();renderFerias();
}

async function desproramarFerias(id){
  if(!confirm('Remover programação de férias?'))return;
  await sb.from('ferias').update({programado:false,dias_programados:null,data_inicio_programada:null,data_fim_programada:null,validado_dp:false}).eq('id',id);
  showToast('Programação removida.');closeModal('modal-prog-ferias');renderFerias();
}

async function cancelarProgFerias(id){
  if(!confirm('Cancelar a programação de férias deste funcionário?'))return;
  const{error}=await sb.from('ferias').update({programado:false,dias_programados:null,data_inicio_programada:null,data_fim_programada:null,validado_dp:false}).eq('id',id);
  if(error){showToast('Erro ao cancelar: '+error.message,'error');return;}
  showToast('Programação cancelada.','success');
  await loadFerias();renderFerias();
}

async function toggleValidadoDP(id,checked){

function fmAtualizarDireito(){
  // Sugere data de início do período aquisitivo com base na admissão, se disponível e ainda sem registro
  const funcId=document.getElementById('fm-func')?.value;
  const histBox=document.getElementById('fm-historico');
  if(!funcId){histBox.style.display='none';histBox.innerHTML='';return;}
  const f=funcionarios.find(x=>x.id===funcId);
  if(!f)return;
  const jaTem=feriasData.filter(x=>x.matricula===f.matricula).sort((a,b)=>(parseDate(a.periodo_aquisitivo_inicio)||new Date(0))-(parseDate(b.periodo_aquisitivo_inicio)||new Date(0)));

  // Mostra o histórico completo de períodos já cadastrados (início e fim de cada um)
  if(jaTem.length){
    const linhasHist=jaTem.map((p,i)=>{
      const progStr=p.programado?(' · ✅ Programado: '+formatDate(p.data_inicio_programada)+' → '+formatDate(p.data_fim_programada)):'';
      return `<div style="font-size:12px;padding:4px 0;${i<jaTem.length-1?'border-bottom:1px solid var(--border)':''}">`
        +`<strong>${i+1}º período:</strong> ${formatDate(p.periodo_aquisitivo_inicio)} → ${formatDate(p.periodo_aquisitivo_fim)}`
        +` <span style="color:var(--text-muted)">(limite: ${formatDate(p.dt_limite_maxima)})</span>${progStr}`
        +`</div>`;
    }).join('');
    histBox.innerHTML=`<div style="padding:10px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius)">
      <div style="font-size:11px;font-weight:700;color:var(--text-muted);margin-bottom:4px;text-transform:uppercase">Períodos já cadastrados</div>
      ${linhasHist}
    </div>`;
    histBox.style.display='block';
  }else{
    histBox.innerHTML=`<div style="padding:10px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);font-size:12px;color:var(--text-muted)">Nenhum período de férias cadastrado ainda para este funcionário.</div>`;
    histBox.style.display='block';
  }

  const inicioInput=document.getElementById('fm-periodo-inicio');
  if(!inicioInput.value){
    if(jaTem.length){
      // Sugere o dia seguinte ao fim do último período já cadastrado
      const ultimo=jaTem[jaTem.length-1];
      const fimAnterior=parseDate(ultimo.periodo_aquisitivo_fim);
      if(fimAnterior){const prox=new Date(fimAnterior);prox.setDate(prox.getDate()+1);inicioInput.value=toISO(prox);}
    }else if(f.data_admissao){
      inicioInput.value=toISO(parseDate(f.data_admissao));
    }
  }
  fmCalcularDatas();
}

function fmCalcularDatas(){
  const iniVal=document.getElementById('fm-periodo-inicio').value;
  const box=document.getElementById('fm-datas-calc');
  if(!iniVal){box.style.display='none';return;}
  const ini=parseDate(iniVal);
  if(!ini){box.style.display='none';return;}
  const fimPeriodo=new Date(ini);fimPeriodo.setFullYear(fimPeriodo.getFullYear()+1);fimPeriodo.setDate(fimPeriodo.getDate()-1);
  const limMax=new Date(fimPeriodo);limMax.setFullYear(limMax.getFullYear()+1);
  document.getElementById('fm-fim-periodo').textContent=formatDate(toISO(fimPeriodo));
  document.getElementById('fm-lim-ideal').textContent=formatDate(toISO(fimPeriodo));
  document.getElementById('fm-lim-max').textContent=formatDate(toISO(limMax));
  box.style.display='block';
}

function fmCalcularRetorno(){
  const saidaVal=document.getElementById('fm-saida').value;
  const dias=parseInt(document.getElementById('fm-dias-prog').value||'30');
  if(!saidaVal)return;
  const saida=parseDate(saidaVal);
  const retorno=new Date(saida);retorno.setDate(retorno.getDate()+dias);
  document.getElementById('fm-retorno').value=toISO(retorno);
}

async function salvarFeriasManual(){
  const funcId=document.getElementById('fm-func').value;
  const periodoInicio=document.getElementById('fm-periodo-inicio').value;
  if(!funcId){showToast('Selecione o funcionário','error');return;}
  if(!periodoInicio){showToast('Informe o início do período aquisitivo','error');return;}
  const f=funcionarios.find(x=>x.id===funcId);
  if(!f){showToast('Funcionário não encontrado','error');return;}

  const ini=parseDate(periodoInicio);
  const fimPeriodo=new Date(ini);fimPeriodo.setFullYear(fimPeriodo.getFullYear()+1);fimPeriodo.setDate(fimPeriodo.getDate()-1);
  const limMax=new Date(fimPeriodo);limMax.setFullYear(limMax.getFullYear()+1);
  const diasDireito=parseInt(document.getElementById('fm-dias-direito').value||'30');

  const saida=document.getElementById('fm-saida').value;
  const retorno=document.getElementById('fm-retorno').value;
  const diasProg=document.getElementById('fm-dias-prog').value;

  // Verifica se já existe um período com a mesma data de início para essa matrícula (evita duplicar)
  const existente=feriasData.find(x=>x.matricula===f.matricula&&(x.periodo_aquisitivo_inicio||'').substring(0,10)===toISO(ini));
  if(existente){
    showToast('Já existe um período aquisitivo cadastrado com esse início para esse funcionário','error');
    return;
  }

  const payload={
    funcionario_id:funcId,
    matricula:f.matricula,
    periodo_aquisitivo_inicio:toISO(ini),
    periodo_aquisitivo_fim:toISO(fimPeriodo),
    dt_limite_ideal:toISO(fimPeriodo),
    dt_limite_maxima:toISO(limMax),
    dias_direito:diasDireito,
    dias_vencidos:0,
    importado_em:new Date().toISOString(),
    programado:!!(saida&&retorno),
    dias_programados:saida&&retorno?parseInt(diasProg):null,
    data_inicio_programada:saida||null,
    data_fim_programada:retorno||null,
    validado_dp:false,
  };
  const{error}=await sb.from('ferias').insert(payload);
  if(error){showToast('Erro ao salvar: '+error.message,'error');console.error(error);return;}
  showToast('Período de férias lançado com sucesso!');
  closeModal('modal-ferias-manual');
  await loadFerias();renderFerias();
}

function handleDropImport(event){

function handleImportFile(input){
