}

function processImportFile(file){
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      // cellDates:true para que XLSX já converta serial → Date
      const wb=XLSX.read(e.target.result,{type:'array',cellDates:true,dateNF:'yyyy-mm-dd'});
      // Sheet: "1-Cabeçalho de Férias" ou primeira
      const sheetName=wb.SheetNames.find(n=>n.toLowerCase().includes('cabe'))||wb.SheetNames[0];
      const ws=wb.Sheets[sheetName];
      const data=XLSX.utils.sheet_to_json(ws,{header:1,raw:false,defval:'',dateNF:'yyyy-mm-dd'});

      // Estrutura conhecida da planilha GTEL:
      // Row 0: "Cabeçalho de Férias" (título)
      // Row 1: Filial | Centro Custo | Matricula | Nome | Data Admis. | Data Base Ferias |
      //         Periodo Aquisitivo | Dt.Limite Ideal | Dt.Limite Maxima | Ferias Vencidas |
      //         D.Abat.Faltas | Ferias Proporc. | Faltas Proporc. | TOTAL Ferias | PROGFER | DIASFER ...
      // Row 2+: dados

      // Encontrar linha de cabeçalho buscando "Matricula" ou "Filial"
      let headerRow=-1;
      for(let i=0;i<Math.min(data.length,5);i++){
        const rowStr=data[i].map(c=>String(c||'').toLowerCase()).join('|');
        if(rowStr.includes('matricula')||rowStr.includes('matrícula')||rowStr.includes('filial')){
          headerRow=i;break;
        }
      }
      if(headerRow===-1){showToast('Formato de planilha não reconhecido — linha de cabeçalho não encontrada','error');return;}

      const headers=data[headerRow].map(h=>String(h||'').toLowerCase().replace(/\s+/g,' ').trim());

      // Mapeamento por posição — busca flexível nos cabeçalhos
      function findCol(...terms){
        return headers.findIndex(h=>terms.some(t=>h.includes(t)));
      }
      const COL={
        centroCusto: findCol('centro','custo'),         // col 1
        matricula:   findCol('matricula','matrícula'),   // col 2
        nome:        findCol('nome'),                    // col 3
        dataAdmis:   findCol('admis','admissão','admissao'), // col 4 — Data Admis.
        periodoAqui: findCol('aquisitivo','periodo a'),  // col 6 — string "DD/MM/YYYY  DD/MM/YYYY"
        dtIdeal:     findCol('ideal'),                   // col 7 se existir — Date (opcional)
        dtMaxima:    findCol('maxima','máxima','limite max','dt.limite'),// col 7 — Date
        feriasVenc:  findCol('vencidas'),                // col 8
        totalFerias: findCol('total'),                   // col 12
      };

      // Fallback: se busca por texto falhou use posições fixas do layout TOTVS/GTEL
      // Layout real: col6=PeriodoAqui | col7=Dt.Limite Maxima | col8=FeriasVencidas | col12=TotalFerias
      // Nota: este layout NÃO tem coluna "Ideal" separada
      if(COL.matricula===-1) COL.matricula=2;
      if(COL.nome===-1)      COL.nome=3;
      if(COL.centroCusto===-1) COL.centroCusto=1;
      if(COL.dataAdmis===-1) COL.dataAdmis=4;
      if(COL.periodoAqui===-1) COL.periodoAqui=6;
      if(COL.dtMaxima===-1)  COL.dtMaxima=7;
      if(COL.feriasVenc===-1) COL.feriasVenc=8;
      if(COL.totalFerias===-1) COL.totalFerias=12;
      // dtIdeal não existe neste layout — deixar -1 para gravar null
      // (se existir em outro layout, será encontrado pelo findCol acima)

      // Helper: converte qualquer valor de célula em Date
      function cellToDate(val){
        if(!val||val==='')return null;
        // cellDates:true já entrega string ISO "yyyy-mm-dd" ou Date object
        if(typeof val==='string'){
          // ISO yyyy-mm-dd
          if(/^\d{4}-\d{2}-\d{2}/.test(val)){
            const d=new Date(val+'T12:00:00');
            return isNaN(d)?null:d;
          }
          // DD/MM/YYYY
          const m=val.match(/(\d{2})\/(\d{2})\/(\d{4})/);
          if(m)return new Date(`${m[3]}-${m[2]}-${m[1]}T12:00:00`);
        }
        if(val instanceof Date&&!isNaN(val))return val;
        // número serial (fallback)
        if(typeof val==='number'){
          const d=new Date(Math.round((val-25569)*86400*1000));
          return isNaN(d)?null:d;
        }
        return null;
      }

      // Processar linhas de dados
      const dataRows=data.slice(headerRow+1).filter(r=>{
        const mat=String(r[COL.matricula]||'').trim();
        return mat&&mat.length>=3&&!/filial|centro|matricula/i.test(mat);
      });

      // Agrupar por matrícula
      const byMat={};
      dataRows.forEach(r=>{
        // Normalizar matrícula: remover zeros à esquerda e repaddar a 6
        const matRaw=String(r[COL.matricula]||'').trim();
        const mat=matRaw.padStart(6,'0');
        if(!byMat[mat])byMat[mat]=[];
        byMat[mat].push(r);
      });

      // Cruzar com funcionários cadastrados
      const encontrados=[],naoEncontrados=[];
      Object.entries(byMat).forEach(([mat,periodos])=>{
        const func=funcionarios.find(f=>{
          const fm=String(f.matricula||'').trim();
          return fm===mat||fm===mat.replace(/^0+/,'')||fm.padStart(6,'0')===mat;
        });
        if(func){
          // Parsear todos os periodos do TOTVS e ordenar do mais antigo ao mais recente
          const parsedPeriodos=periodos.map(r=>{
            const periodoStr=String(r[COL.periodoAqui]||'');
            let periodoInicio=null,periodoFim=null;
            const matchPer=periodoStr.match(/(\d{2}\/\d{2}\/\d{4})\s+(\d{2}\/\d{2}\/\d{4})/);
            if(matchPer){
              periodoInicio=new Date(`${matchPer[1].split('/').reverse().join('-')}T12:00:00`);
              periodoFim  =new Date(`${matchPer[2].split('/').reverse().join('-')}T12:00:00`);
            }
            const dtIdeal =COL.dtIdeal>=0?cellToDate(r[COL.dtIdeal]):null;
            // Bug 2 fix: usar o limite máximo real que vem da coluna do TOTVS.
            // Fallback: periodoFim + 12 meses (CLT art. 134) caso a coluna esteja vazia.
            let dtMaxima=COL.dtMaxima>=0?cellToDate(r[COL.dtMaxima]):null;
            if(!dtMaxima&&periodoFim){
              dtMaxima=new Date(periodoFim);
              dtMaxima.setMonth(dtMaxima.getMonth()+12);
            }
            const diasDir =parseFloat(r[COL.totalFerias])||30;
            const diasVenc=parseFloat(r[COL.feriasVenc])||0;
            const cc      =String(r[COL.centroCusto]||'').trim();
            return{func,mat,periodoInicio,periodoFim,dtIdeal,dtMaxima,diasDir,diasVenc,
              nomeDP:String(r[COL.nome]||''),centroCusto:cc,rowRaw:r};
          }).filter(p=>p.periodoInicio);
          parsedPeriodos.sort((a,b)=>a.periodoInicio-b.periodoInicio);
          // Bug 1 fix: NÃO criar período fantasma anterior.
          // O TOTVS lista todos os períodos pendentes de cada funcionário.
          // Se há só 1 período, ele É o 1º período — o 2º será projetado na tela pelo projetarPer2().
          // Adicionar todos os períodos do TOTVS diretamente.
          parsedPeriodos.forEach(p=>encontrados.push(p));
        }else{
          const nomeDP=periodos.length>0?String(periodos[0][COL.nome]||''):'';
          const cc=periodos.length>0?String(periodos[0][COL.centroCusto]||''):'';
          naoEncontrados.push({mat,nome:nomeDP,cc,qtd:periodos.length});
        }
      });
      // Preview
      let previewHtml=`<div style="font-weight:600;margin-bottom:8px">Prévia da importação</div>`;
      previewHtml+=`<div style="display:flex;gap:12px;margin-bottom:12px">
        <div style="background:var(--success-light);color:var(--success);padding:8px 14px;border-radius:var(--radius);font-weight:600">✓ ${encontrados.length} períodos a importar</div>
        ${naoEncontrados.length>0?`<div style="background:var(--warning-light);color:var(--warning);padding:8px 14px;border-radius:var(--radius);font-weight:600">⚠ ${naoEncontrados.length} não cadastrados</div>`:''}
      </div>`;
      if(naoEncontrados.length>0){
        previewHtml+=`<div style="background:var(--warning-light);border:1px solid #FCD34D;border-radius:var(--radius);padding:12px;margin-bottom:12px">
          <div style="font-weight:600;color:var(--warning);margin-bottom:8px">⚠ Funcionários na planilha NÃO cadastrados no sistema:</div>
          <table style="width:100%;font-size:12px;border-collapse:collapse">
            <thead><tr><th style="text-align:left;padding:4px 8px;border-bottom:1px solid #FCD34D">Matrícula</th><th style="text-align:left;padding:4px 8px;border-bottom:1px solid #FCD34D">Nome</th><th style="text-align:left;padding:4px 8px;border-bottom:1px solid #FCD34D">C. Custo</th></tr></thead>
            <tbody>${naoEncontrados.map(n=>`<tr><td style="padding:4px 8px">${n.mat}</td><td style="padding:4px 8px">${n.nome}</td><td style="padding:4px 8px">${n.cc}</td></tr>`).join('')}</tbody>
          </table>
        </div>`;
      }
      document.getElementById('import-preview').innerHTML=previewHtml;
      window._importFeriasData=encontrados;
      document.getElementById('import-footer').innerHTML=`
        <button class="btn" onclick="closeModal('modal-import-ferias')">Cancelar</button>
        <button class="btn btn-primary" onclick="confirmarImportFerias()"><i class="ti ti-check"></i> Importar ${encontrados.length} períodos</button>`;
    }catch(err){
      showToast('Erro ao processar arquivo: '+err.message,'error');
      console.error(err);
    }
  };
  reader.readAsArrayBuffer(file);
}

async function confirmarImportFerias(){
  const dados=window._importFeriasData;
  if(!dados||!dados.length){showToast('Nenhum dado para importar','error');return;}
  const btn=document.querySelector('#import-footer .btn-primary');
  if(btn){btn.disabled=true;btn.textContent='Importando...';}
  let inseridos=0,atualizados=0,erros=0,preservados=0;

  // Agrupar por funcionario_id (UUID — sem ambiguidade de formato)
  const porFuncId={};
  dados.forEach(d=>{
    const fid=d.func.id;
    if(!porFuncId[fid])porFuncId[fid]=[];
    porFuncId[fid].push(d);
  });

  for(const [funcId,periodos] of Object.entries(porFuncId)){
    // 1. Buscar todos os registros existentes pelo funcionario_id
    const{data:existentes}=await sb.from('ferias')
      .select('id,periodo_aquisitivo_inicio,programado,dias_programados,data_inicio_programada,data_fim_programada')
      .eq('funcionario_id',funcId);

    // Mapear existentes pela chave do período (yyyy-mm-dd) para localizar por UPDATE em vez de DELETE+INSERT.
    // IMPORTANTE: nunca apagamos períodos que não vierem na planilha nova — isso evita perder
    // sinalizações de período vencido caso a planilha do mês não traga aquele período por qualquer motivo
    // (linha faltando, variação de layout, etc). Períodos "sumidos" da planilha ficam preservados no sistema.
    const existMap={};
    (existentes||[]).forEach(e=>{
      const chave=(e.periodo_aquisitivo_inicio||'').substring(0,10);
      existMap[chave]=e;
    });
    const chavesNaPlanilha=new Set();

    for(const d of periodos){
      const perIso=toISO(d.periodoInicio);
      if(!perIso){console.warn('periodoInicio nulo para',d.mat,d);continue;}
      const chave=perIso.substring(0,10);
      chavesNaPlanilha.add(chave);
      const existente=existMap[chave];

      const payload={
        funcionario_id:funcId,
        matricula:d.mat,
        periodo_aquisitivo_inicio:perIso,
        periodo_aquisitivo_fim:toISO(d.periodoFim),
        dt_limite_ideal:toISO(d.dtIdeal),
        dt_limite_maxima:toISO(d.dtMaxima),
        dias_direito:d.diasDir,
        dias_vencidos:d.diasVenc,
        importado_em:new Date().toISOString(),
      };

      if(existente){
        // Atualiza dados do DP, preservando 100% o que já estava programado
        const{error}=await sb.from('ferias').update(payload).eq('id',existente.id);
        if(error){erros++;console.error('Erro update ferias',funcId,error);}
        else atualizados++;
      }else{
        payload.programado=false;
        payload.dias_programados=null;
        payload.data_inicio_programada=null;
        payload.data_fim_programada=null;
        const{error}=await sb.from('ferias').insert(payload);
        if(error){erros++;console.error('Erro insert ferias',funcId,error);}
        else inseridos++;
      }
    }

    // Períodos que já estavam no sistema mas não vieram nesta planilha: mantidos, apenas contabilizados
    preservados+=(existentes||[]).filter(e=>!chavesNaPlanilha.has((e.periodo_aquisitivo_inicio||'').substring(0,10))).length;
  }

  let msg=`${inseridos} novo(s), ${atualizados} atualizado(s)`;
  if(preservados>0)msg+=`, ${preservados} preservado(s) (não vieram nesta planilha)`;
  if(erros>0)showToast(msg+` — ${erros} erro(s)`,'error');
  else showToast(msg+'!');
  closeModal('modal-import-ferias');
  await loadFerias();
  renderFerias();
}

function exportFeriasExcel(){
  const hoje=new Date();hoje.setHours(0,0,0,0);

  // Agrupar por matrícula igual ao render
  const byMat={};
  feriasData.forEach(f=>{
    const mat=f.matricula||'?';
    if(!byMat[mat])byMat[mat]=[];
    byMat[mat].push(f);
  });
  Object.values(byMat).forEach(arr=>arr.sort((a,b)=>{
    const da=parseDate(a.periodo_aquisitivo_inicio)||new Date(0);
    const db=parseDate(b.periodo_aquisitivo_inicio)||new Date(0);
    return da-db;
  }));

  // Filtrar só alertas (vencido ou vencendo 60d no período mais urgente)
  function getPeriodoUrgenteExp(arr){return arr.find(f=>!f.programado)||null;}
  function getStatusExp(arr){
    const p=getPeriodoUrgenteExp(arr);if(!p)return'ok';
    const lim=parseDate(p.dt_limite_maxima);
    if(lim&&lim<hoje)return'vencida';
    if(lim){const d=Math.floor((lim-hoje)/86400000);if(d>=0&&d<=60)return'vencendo';}
    return'ok';
  }

  let listaAlerta=Object.values(byMat).filter(arr=>['vencida','vencendo'].includes(getStatusExp(arr)));

  // feriasBase já está filtrado por obra via obraFiltroAtivo

  // Ordenar: vencidas → vencendo → data mais próxima
  listaAlerta.sort((a,b)=>{
    const ord={vencida:0,vencendo:1};
    const sa=ord[getStatusExp(a)]??1,sb=ord[getStatusExp(b)]??1;
    if(sa!==sb)return sa-sb;
    const la=parseDate(getPeriodoUrgenteExp(a)?.dt_limite_maxima)||new Date(9999,0);
    const lb=parseDate(getPeriodoUrgenteExp(b)?.dt_limite_maxima)||new Date(9999,0);
    return la-lb;
  });

  if(!listaAlerta.length){showToast('Nenhum funcionário em alerta para exportar.','error');return;}

  // Agrupar por obra para abas separadas
  const porObra={};
  listaAlerta.forEach(arr=>{
    const obraKey=arr[0].funcionario?.obra?.codigo
      ?`${arr[0].funcionario.obra.codigo} — ${arr[0].funcionario.obra.nome||''}`.trim()
      :'Sem Obra';
    if(!porObra[obraKey])porObra[obraKey]=[];
    porObra[obraKey].push(arr);
  });

  const wb=XLSX.utils.book_new();
  const dataEmissao=new Date().toLocaleDateString('pt-BR');

  Object.entries(porObra).forEach(([obraKey,funcs])=>{
    const rows=[];

    // Cabeçalho do relatório
    rows.push([`RELATÓRIO DE FÉRIAS EM ALERTA — ${obraKey.toUpperCase()}`,'','','','','','','','','']);
    rows.push([`Emitido em: ${dataEmissao}  ·  ${funcs.length} funcionário(s) em alerta`,'','','','','','','','','']);
    rows.push([]);

    // Cabeçalho da tabela
    rows.push([
      'FUNCIONÁRIO','MATRÍCULA','CENTRO DE CUSTO',
      'PER. AQUISITIVO URGENTE','LIMITE MÁX. LEGAL','DIAS RESTANTES','STATUS',
      '2º PERÍODO (se houver)','LIMITE MÁX. 2º PER.',
      'PROGRAMAÇÃO'
    ]);

    funcs.forEach(arr=>{
      const f0=arr[0];
      const nome=f0.funcionario?.nome_completo||f0.matricula||'—';
      const mat=f0.matricula||'—';
      const cc=f0.funcionario?.obra?.centro_custo||'—';
      const per1=arr[0];
      const per2=arr[1]||null;
      const pUrgente=getPeriodoUrgenteExp(arr);
      const limMax=parseDate(pUrgente?.dt_limite_maxima);
      const dM=limMax?Math.floor((limMax-hoje)/86400000):null;
      const status=dM===null?'—':dM<0?`VENCIDA (${Math.abs(dM)}d atrás)`:`VENCENDO (${dM}d)`;
      const perAquiUrgente=pUrgente?`${formatDate(pUrgente.periodo_aquisitivo_inicio)} → ${formatDate(pUrgente.periodo_aquisitivo_fim)}`:'—';

      // 2º período — real ou projetado
      const per2real=arr[1]||null;
      let per2exp=per2real;
      if(!per2exp&&per1){
        const fimP1=parseDate(per1.periodo_aquisitivo_fim);
        if(fimP1){
          const ini2=new Date(fimP1);ini2.setDate(ini2.getDate()+1);
          const fim2=new Date(ini2);fim2.setFullYear(fim2.getFullYear()+1);fim2.setDate(fim2.getDate()-1);
          const lm1=parseDate(per1.dt_limite_maxima);
          const lm2=lm1?new Date(lm1.getFullYear()+1,lm1.getMonth(),lm1.getDate()):null;
          per2exp={periodo_aquisitivo_inicio:toISO(ini2),periodo_aquisitivo_fim:toISO(fim2),dt_limite_maxima:toISO(lm2),_projetado:true};
        }
      }
      const per2Str=per2exp?`${formatDate(per2exp.periodo_aquisitivo_inicio)} → ${formatDate(per2exp.periodo_aquisitivo_fim)}`:'—';
      const per2Lim=per2exp?formatDate(per2exp.dt_limite_maxima):'—';

      // Programação
      const prog=arr.filter(f=>f.programado).map(f=>`${f.dias_programados||'?'}d: ${formatDate(f.data_inicio_programada)} → ${formatDate(f.data_fim_programada)}`).join(' | ')||'Não programada';

      rows.push([nome,mat,cc,perAquiUrgente,formatDate(limMax),dM===null?'—':dM<0?`${Math.abs(dM)}d atrás`:`${dM}d`,status,per2Str,per2Lim,prog]);
    });

    const ws=XLSX.utils.aoa_to_sheet(rows);

    // Larguras das colunas
    ws['!cols']=[{wch:32},{wch:12},{wch:16},{wch:26},{wch:18},{wch:14},{wch:22},{wch:26},{wch:18},{wch:34}];

    // Mesclar título
    ws['!merges']=[{s:{r:0,c:0},e:{r:0,c:9}},{s:{r:1,c:0},e:{r:1,c:9}}];

    // Nome da aba: máx 31 chars, sem caracteres inválidos
    const abaName=obraKey.replace(/[\\/:?*[\]]/g,'').substring(0,31);
    XLSX.utils.book_append_sheet(wb,ws,abaName||'Obras');
  });

  // Aba resumo se houver múltiplas obras
  if(Object.keys(porObra).length>1){
    const resumoRows=[
      [`RESUMO GERAL — FÉRIAS EM ALERTA`,'','',''],
      [`Emitido em: ${dataEmissao}`,'','',''],
      [],
      ['OBRA / C. CUSTO','VENCIDAS','VENCENDO 60d','TOTAL ALERTA'],
    ];
    Object.entries(porObra).forEach(([obraKey,funcs])=>{
      const venc=funcs.filter(a=>getStatusExp(a)==='vencida').length;
      const vendo=funcs.filter(a=>getStatusExp(a)==='vencendo').length;
      resumoRows.push([obraKey,venc,vendo,venc+vendo]);
    });
    const wsRes=XLSX.utils.aoa_to_sheet(resumoRows);
    wsRes['!cols']=[{wch:40},{wch:12},{wch:14},{wch:14}];
    wsRes['!merges']=[{s:{r:0,c:0},e:{r:0,c:3}},{s:{r:1,c:0},e:{r:1,c:3}}];
    XLSX.utils.book_append_sheet(wb,wsRes,'RESUMO');
  }

  const obraLabel=feriasObraFiltro?`_${feriasObraFiltro}`:'_TodasObras';
  XLSX.writeFile(wb,`Ferias_Alerta${obraLabel}_${dataEmissao.replace(/\//g,'-')}.xlsx`);
  showToast(`Excel exportado — ${listaAlerta.length} funcionário(s) em alerta!`);
}

function previewFotoPrestador(input){
  const file=input.files[0];if(!file)return;
  window._prestFotoFile=file;
  window._prestRemoverFoto=false;
  const reader=new FileReader();
  reader.onload=e=>{document.getElementById('prest-foto-prev').innerHTML=`<img src="${e.target.result}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`};
  reader.readAsDataURL(file);
}

async function salvarPrestador(id){
  const nome=document.getElementById('prest-nome').value.trim();
  const obraId=document.getElementById('prest-obra').value;
  if(!nome){showToast('Nome completo é obrigatório','error');return;}
  if(!obraId){showToast('Selecione uma obra','error');return;}

  // Upload de foto
  let fotoUrl=id?prestadores.find(x=>x.id===id)?.foto_url||null:null;
  if(window._prestFotoFile){
    const ext=window._prestFotoFile.name.split('.').pop();
    const path=`prestadores/${Date.now()}.${ext}`;
    const{error:upErr}=await sb.storage.from('funcionarios').upload(path,window._prestFotoFile,{contentType:window._prestFotoFile.type});
    if(!upErr){const{data:urlData}=sb.storage.from('funcionarios').getPublicUrl(path);fotoUrl=urlData.publicUrl;}
    else{showToast('Erro no upload da foto: '+upErr.message,'error');}
  } else if(window._prestRemoverFoto){
    fotoUrl=null;
  }

  const payload={
    razao_social:document.getElementById('prest-razao').value.trim()||null,
    cnpj:document.getElementById('prest-cnpj').value.trim()||null,
    nome_fantasia:document.getElementById('prest-fantasia').value.trim()||null,
    nome_completo:nome,
    funcao:document.getElementById('prest-funcao').value.trim()||null,
    data_mobilizacao:document.getElementById('prest-mobilizacao').value||null,
    data_integracao:document.getElementById('prest-integracao').value||null,
    obra_id:obraId,
    alojamento_id:document.getElementById('prest-alojamento').value||null,
    situacao:document.getElementById('prest-sit').value,
    observacao:document.getElementById('prest-obs').value.trim()||null,
    foto_url:fotoUrl,
  };
  let error;
  if(id){({error}=await sb.from('prestadores').update(payload).eq('id',id));}
  else{({error}=await sb.from('prestadores').insert(payload));}
  if(error){showToast('Erro: '+error.message,'error');return;}
  showToast(id?'Prestador atualizado!':'Prestador cadastrado!');
  closeModal('modal-prestador');
  window._prestFotoFile=null;window._prestRemoverFoto=false;
  await loadPrestadores();renderPrestadores();
}

async function deletarPrestador(id,nome){
  if(!confirm(`Remover prestador "${nome}"?`))return;
  const{error}=await sb.from('prestadores').delete().eq('id',id);
  if(error){showToast('Erro: '+error.message,'error');return;}
  showToast('Prestador removido!');
  await loadPrestadores();renderPrestadores();
}

// ─── TREINAMENTOS ───────────────────────────────────────────────────────────────
let treinamentosBusca='',treinamentosFiltroTipo='',treinamentosFiltroStatus='',treinamentosFiltroObra='';

// Periodicidade de referência (em meses) das NRs mais comuns em obras de eletromecânica/construção.
// São valores de PRÁTICA DE MERCADO — não há, para várias NRs, prazo de reciclagem fixado em lei federal.
// Por isso o campo vem pré-preenchido mas SEMPRE editável, e cabe ao usuário confirmar a periodicidade
// aplicável (CCT, norma regulamentadora específica, exigência do cliente/contratante etc).
const NR_LISTA=[
  {codigo:'NR-06',nome:'Uso de EPI',meses:null},
  {codigo:'NR-10',nome:'Segurança em Instalações Elétricas — Básico',meses:24},
  {codigo:'NR-10-SEP',nome:'NR-10 — Sistema Elétrico de Potência (SEP)',meses:24},
  {codigo:'NR-11',nome:'Operação de Empilhadeira/Transporte de Materiais',meses:24},
  {codigo:'NR-12',nome:'Segurança no Trabalho em Máquinas',meses:null},
  {codigo:'NR-18',nome:'PCMAT — Condições de Trabalho na Construção',meses:12},
  {codigo:'NR-20',nome:'Inflamáveis e Combustíveis',meses:12},
  {codigo:'NR-33',nome:'Espaços Confinados',meses:12},
  {codigo:'NR-35',nome:'Trabalho em Altura',meses:24},
  {codigo:'BRIGADA',nome:'Brigada de Incêndio',meses:12},
  {codigo:'OUTRA-NR',nome:'Outra NR (definir manualmente)',meses:null},
];
function nrInfo(codigo){return NR_LISTA.find(n=>n.codigo===codigo)||null;}
const ASO_TIPOS=['Admissional','Periódico','Mudança de Função','Retorno ao Trabalho','Demissional'];
const CNH_CATEGORIAS=['A','B','AB','AC','AD','AE','C','D','E'];

// Calcula vencimento/status de um registro de treinamento
function calcVencTreinamento(t){
  const venc=parseDate(t.data_vencimento);
  if(!venc)return{venc:null,dias:null,status:'sem_data'};
  const hoje=new Date();hoje.setHours(0,0,0,0);
  const dias=Math.floor((venc-hoje)/86400000);
  let status;
  if(dias<0)status='vencido';
  else if(dias<=10)status='critico';
  else if(dias<=20)status='atencao';
  else if(dias<=30)status='alerta';
  else status='ok';
  return{venc,dias,status};
}
const TREIN_STATUS_UI={
  vencido:{label:'Vencido',cor:'var(--danger)',bg:'var(--danger-light)'},
  critico:{label:'≤ 10 dias',cor:'#C2410C',bg:'#FFEDD5'},
  atencao:{label:'≤ 20 dias',cor:'var(--warning)',bg:'var(--warning-light)'},
  alerta:{label:'≤ 30 dias',cor:'var(--info)',bg:'var(--info-light)'},
  ok:{label:'Em dia',cor:'var(--success)',bg:'var(--success-light)'},
  sem_data:{label:'Sem vencimento',cor:'var(--text-muted)',bg:'var(--bg)'},
};
function tipoLabelTreinamento(t){
  if(t.tipo==='NR')return(nrInfo(t.nr_codigo)?.codigo||t.nr_codigo||'NR')+(t.nome_treinamento?' — '+t.nome_treinamento:(nrInfo(t.nr_codigo)?' — '+nrInfo(t.nr_codigo).nome:''));
  if(t.tipo==='CNH')return'CNH'+(t.categoria_cnh?' — Cat. '+t.categoria_cnh:'');
  if(t.tipo==='ASO')return'ASO'+(t.nome_treinamento?' — '+t.nome_treinamento:'');
  return t.nome_treinamento||'Outro';
}
function tipoIconTreinamento(t){
  if(t.tipo==='CNH')return'ti-car';
  if(t.tipo==='ASO')return'ti-stethoscope';
  return'ti-certificate-2';
}

async function renderTreinamentos(){
  await loadTreinamentos();
  renderTreinamentosLocal();
}
function renderTreinamentosLocal(){
  const obraFiltroAtivo=globalObraFiltro||treinamentosFiltroObra||'';
  let base=obraFiltroAtivo?treinamentos.filter(t=>String(t.funcionario?.obra_id)===String(obraFiltroAtivo)):treinamentos;

  const comStatus=base.map(t=>({...t,_calc:calcVencTreinamento(t)}));
  const total=comStatus.length;
  const nVencidos=comStatus.filter(t=>t._calc.status==='vencido').length;
  const nCritico=comStatus.filter(t=>t._calc.status==='critico').length;
  const nAtencao=comStatus.filter(t=>t._calc.status==='atencao').length;
  const nAlerta=comStatus.filter(t=>t._calc.status==='alerta').length;
  const nOk=comStatus.filter(t=>t._calc.status==='ok').length;

  let lista=comStatus;
  if(treinamentosFiltroStatus)lista=lista.filter(t=>t._calc.status===treinamentosFiltroStatus);
  if(treinamentosFiltroTipo)lista=lista.filter(t=>t.tipo===treinamentosFiltroTipo);
  if(treinamentosBusca){
    const b=treinamentosBusca.toLowerCase();
    lista=lista.filter(t=>(t.funcionario?.nome_completo||'').toLowerCase().includes(b)||(t.funcionario?.matricula||'').toLowerCase().includes(b)||tipoLabelTreinamento(t).toLowerCase().includes(b));
  }
  // Ordena: vencido/crítico primeiro, depois por dias restantes
  const ordemStatus={vencido:0,critico:1,atencao:2,alerta:3,ok:4,sem_data:5};
  lista.sort((a,b)=>(ordemStatus[a._calc.status]-ordemStatus[b._calc.status])||((a._calc.dias??9999)-(b._calc.dias??9999)));

  const obrasOpts=obras.map(o=>`<option value="${o.id}" ${treinamentosFiltroObra===String(o.id)?'selected':''}>${o.codigo?o.codigo+' — ':''}${o.nome||''}</option>`).join('');
  const tiposOpts=[['NR','NR'],['CNH','CNH'],['ASO','ASO'],['OUTRO','Outro']].map(([v,l])=>`<option value="${v}" ${treinamentosFiltroTipo===v?'selected':''}>${l}</option>`).join('');

  const rows=lista.map(t=>{
    const ui=TREIN_STATUS_UI[t._calc.status];
    const diasStr=t._calc.dias===null?'—':t._calc.dias<0?Math.abs(t._calc.dias)+'d atrás':t._calc.dias+'d';
    const nomeCell=t.funcionario_id?`<span style="cursor:pointer" onclick="verFicha('${t.funcionario_id}')" title="Ver ficha">${t.funcionario?.nome_completo||'—'}</span>`:(t.funcionario?.nome_completo||'—');
    return`<tr>
      <td>
        <div class="name-cell">
          ${avatarHtml(t.funcionario?.foto_url,t.funcionario?.nome_completo)}
          <div>
            <div style="font-weight:500">${nomeCell}</div>
            <div style="font-size:11px;color:var(--text-muted)">${t.funcionario?.matricula||'—'} · ${t.funcionario?.obra?.codigo||'—'}</div>
          </div>
        </div>
      </td>
      <td style="font-size:13px"><i class="ti ${tipoIconTreinamento(t)}" style="margin-right:4px;color:var(--text-muted)"></i>${tipoLabelTreinamento(t)}</td>
      <td style="font-size:12px">${formatDate(t.data_realizacao)}</td>
      <td style="font-size:12px;font-weight:600">${formatDate(t.data_vencimento)}${t.vencimento_manual?' <span title="Vencimento definido manualmente" style="color:var(--text-muted);font-weight:400">✎</span>':''}</td>
      <td><span class="badge" style="background:${ui.bg};color:${ui.cor}">${ui.label}${t._calc.dias!==null?' ('+diasStr+')':''}</span></td>
      <td>
        <div style="display:flex;gap:6px">
          <button class="btn btn-sm" onclick="openModalTreinamento('${t.id}')"><i class="ti ti-edit"></i></button>
          <button class="btn btn-sm btn-danger" onclick="deletarTreinamento('${t.id}','${(t.funcionario?.nome_completo||'').replace(/'/g,"\\'")}')"><i class="ti ti-trash"></i></button>
        </div>
      </td>
    </tr>`;
  }).join('')||'<tr><td colspan="6"><div class="empty-state"><i class="ti ti-school"></i><div>Nenhum treinamento encontrado</div></div></td></tr>';

  document.getElementById('main-content').innerHTML=`
    <div class="page-header">
      <div><div class="page-title"><i class="ti ti-school"></i> Treinamentos</div><div class="page-subtitle">NR · ASO · CNH — controle de vencimentos${globalObraFiltro?' · <strong>'+(obras.find(o=>String(o.id)===String(globalObraFiltro))?.nome||'')+'</strong>':''}</div></div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-sm" onclick="exportarTreinamentosExcel()"><i class="ti ti-file-type-xls"></i> Excel</button>
        <button class="btn btn-primary" onclick="openModalTreinamento()"><i class="ti ti-plus"></i> Novo treinamento</button>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:16px">
      <div class="metric-card" onclick="treinamentosFiltroStatus='';renderTreinamentosLocal()" style="cursor:pointer;border-color:${!treinamentosFiltroStatus?'var(--primary)':'var(--border)'}">
        <div class="metric-label">Total</div><div class="metric-value">${total}</div>
      </div>
      <div class="metric-card" onclick="treinamentosFiltroStatus=treinamentosFiltroStatus==='vencido'?'':'vencido';renderTreinamentosLocal()" style="cursor:pointer;background:${TREIN_STATUS_UI.vencido.bg};border-color:${treinamentosFiltroStatus==='vencido'?TREIN_STATUS_UI.vencido.cor:'var(--border)'}">
        <div class="metric-label" style="color:${TREIN_STATUS_UI.vencido.cor}">Vencidos</div><div class="metric-value" style="color:${TREIN_STATUS_UI.vencido.cor}">${nVencidos}</div>
      </div>
      <div class="metric-card" onclick="treinamentosFiltroStatus=treinamentosFiltroStatus==='critico'?'':'critico';renderTreinamentosLocal()" style="cursor:pointer;background:${TREIN_STATUS_UI.critico.bg};border-color:${treinamentosFiltroStatus==='critico'?TREIN_STATUS_UI.critico.cor:'var(--border)'}">
        <div class="metric-label" style="color:${TREIN_STATUS_UI.critico.cor}">≤ 10 dias</div><div class="metric-value" style="color:${TREIN_STATUS_UI.critico.cor}">${nCritico}</div>
      </div>
      <div class="metric-card" onclick="treinamentosFiltroStatus=treinamentosFiltroStatus==='atencao'?'':'atencao';renderTreinamentosLocal()" style="cursor:pointer;background:${TREIN_STATUS_UI.atencao.bg};border-color:${treinamentosFiltroStatus==='atencao'?TREIN_STATUS_UI.atencao.cor:'var(--border)'}">
        <div class="metric-label" style="color:${TREIN_STATUS_UI.atencao.cor}">≤ 20 dias</div><div class="metric-value" style="color:${TREIN_STATUS_UI.atencao.cor}">${nAtencao}</div>
      </div>
      <div class="metric-card" onclick="treinamentosFiltroStatus=treinamentosFiltroStatus==='alerta'?'':'alerta';renderTreinamentosLocal()" style="cursor:pointer;background:${TREIN_STATUS_UI.alerta.bg};border-color:${treinamentosFiltroStatus==='alerta'?TREIN_STATUS_UI.alerta.cor:'var(--border)'}">

// Mostra/esconde campos conforme o tipo escolhido e recalcula o vencimento automático (quando não manual)
function atualizarCamposTreinamento(){
  const tipo=document.getElementById('tr-tipo').value;
  const manualEl=document.getElementById('tr-manual');
  const wrapNr=document.getElementById('tr-wrap-nr');
  const wrapCnh=document.getElementById('tr-wrap-cnh');
  const wrapAso=document.getElementById('tr-wrap-aso');
  const wrapNome=document.getElementById('tr-wrap-nome');
  const wrapPeriod=document.getElementById('tr-wrap-periodicidade');
  const wrapManualToggle=document.getElementById('tr-wrap-manual-toggle');
  const vencInput=document.getElementById('tr-vencimento');

  wrapNr.style.display=tipo==='NR'?'':'none';
  wrapCnh.style.display=tipo==='CNH'?'':'none';
  wrapAso.style.display=tipo==='ASO'?'':'none';
  wrapNome.style.display=tipo==='OUTRO'?'':'none';
  wrapPeriod.style.display=tipo==='NR'?'':'none';

  if(tipo==='CNH'){
    // CNH: sem periodicidade legal fixa — vencimento sempre manual
    manualEl.checked=true;manualEl.disabled=true;
    wrapManualToggle.style.display='none';
  } else {
    manualEl.disabled=false;
    wrapManualToggle.style.display='';
  }

  const manual=manualEl.checked;
  vencInput.disabled=false; // sempre editável, só recalculamos abaixo quando automático

  if(!manual){
    const dataReal=document.getElementById('tr-data-realizacao').value;
    let periodicidade=null;
    if(tipo==='NR')periodicidade=parseInt(document.getElementById('tr-periodicidade').value)||null;
    else if(tipo==='ASO')periodicidade=12; // ASO: vencimento sempre 1 ano após a realização
    if(dataReal&&periodicidade){
      const d=new Date(dataReal+'T12:00:00');
      d.setMonth(d.getMonth()+periodicidade);
      vencInput.value=toISO(d);
    }
  }

  // Ao trocar de NR, sugere a periodicidade de referência (só se o campo ainda estiver vazio)
  if(tipo==='NR'){
    const nrSel=document.getElementById('tr-nr').value;
    const info=nrInfo(nrSel);
    const periodInput=document.getElementById('tr-periodicidade');
    if(info&&!periodInput.value&&info.meses)periodInput.value=info.meses;
  }
}

async function salvarTreinamento(id){
  const funcId=document.getElementById('tr-func').value;
  const tipo=document.getElementById('tr-tipo').value;
  if(!funcId){showToast('Selecione o funcionário','error');return;}
  const vencimento=document.getElementById('tr-vencimento').value||null;
  const manual=document.getElementById('tr-manual').checked;
  const nomeOutro=document.getElementById('tr-nome').value.trim()||null;
  if(tipo==='OUTRO'&&!nomeOutro){showToast('Informe o nome do treinamento','error');return;}
  if(!vencimento){showToast('Informe a data de vencimento','error');return;}

  const payload={
    funcionario_id:funcId,
    tipo,
    nr_codigo:tipo==='NR'?document.getElementById('tr-nr').value:null,
    categoria_cnh:tipo==='CNH'?document.getElementById('tr-cnh-cat').value||null:null,
    nome_treinamento:tipo==='ASO'?(document.getElementById('tr-aso-tipo').value||null):tipo==='OUTRO'?nomeOutro:null,
    data_realizacao:document.getElementById('tr-data-realizacao').value||null,
    periodicidade_meses:tipo==='NR'?(parseInt(document.getElementById('tr-periodicidade').value)||null):tipo==='ASO'?12:null,
    vencimento_manual:manual,
    data_vencimento:vencimento,
    observacao:document.getElementById('tr-obs').value.trim()||null,
  };
  let error;
  if(id){({error}=await sb.from('treinamentos').update(payload).eq('id',id));}
  else{({error}=await sb.from('treinamentos').insert(payload));}
  if(error){showToast('Erro: '+error.message,'error');return;}
  showToast(id?'Treinamento atualizado!':'Treinamento cadastrado!');
  closeModal('modal-treinamento');
  await loadTreinamentos();renderTreinamentosLocal();
}

async function deletarTreinamento(id,nome){
  if(!confirm(`Remover este treinamento de "${nome}"?`))return;
  const{error}=await sb.from('treinamentos').delete().eq('id',id);
  if(error){showToast('Erro: '+error.message,'error');return;}
  showToast('Treinamento removido!');
  await loadTreinamentos();renderTreinamentosLocal();
}

function exportarTreinamentosExcel(){
  const hoje=new Date();
  const dataEmissao=hoje.toLocaleDateString('pt-BR');
  const obraFiltroAtivo=globalObraFiltro||treinamentosFiltroObra||'';

  // Reaplica os mesmos filtros ativos na tela (obra, tipo, status, busca)
  let lista=obraFiltroAtivo?treinamentos.filter(t=>String(t.funcionario?.obra_id)===String(obraFiltroAtivo)):treinamentos;
  lista=lista.map(t=>({...t,_calc:calcVencTreinamento(t)}));
  if(treinamentosFiltroStatus)lista=lista.filter(t=>t._calc.status===treinamentosFiltroStatus);
  if(treinamentosFiltroTipo)lista=lista.filter(t=>t.tipo===treinamentosFiltroTipo);
  if(treinamentosBusca){
    const b=treinamentosBusca.toLowerCase();
    lista=lista.filter(t=>(t.funcionario?.nome_completo||'').toLowerCase().includes(b)||(t.funcionario?.matricula||'').toLowerCase().includes(b)||tipoLabelTreinamento(t).toLowerCase().includes(b));
  }
  if(!lista.length){showToast('Nenhum treinamento para exportar.','error');return;}

  const ordemStatus={vencido:0,critico:1,atencao:2,alerta:3,ok:4,sem_data:5};
  lista.sort((a,b)=>(ordemStatus[a._calc.status]-ordemStatus[b._calc.status])||((a._calc.dias??9999)-(b._calc.dias??9999)));

  const obraLabel=obraFiltroAtivo?(obras.find(o=>String(o.id)===String(obraFiltroAtivo))?.codigo||''):'Todas as Obras';

  const rows=[];
  rows.push(['CONTROLE DE TREINAMENTOS — GTEL','','','','','','']);
  rows.push([`Emitido em: ${dataEmissao}  ·  ${obraLabel}  ·  ${lista.length} treinamento(s)`,'','','','','','']);
  rows.push([]);
  rows.push(['FUNCIONÁRIO','MATRÍCULA','OBRA','TREINAMENTO','DATA REALIZAÇÃO','DATA VENCIMENTO','DIAS RESTANTES','STATUS']);

  lista.forEach(t=>{
    const obra=t.funcionario?.obra?.codigo?`${t.funcionario.obra.codigo} — ${t.funcionario.obra.nome||''}`.trim():t.funcionario?.obra?.nome||'—';
    const diasStr=t._calc.dias===null?'—':t._calc.dias<0?`${Math.abs(t._calc.dias)}d atrás`:`${t._calc.dias}d`;
    rows.push([
      t.funcionario?.nome_completo||'—',
      t.funcionario?.matricula||'—',
      obra,
      tipoLabelTreinamento(t),
      formatDate(t.data_realizacao)||'—',
      formatDate(t.data_vencimento)||'—',
      diasStr,
      TREIN_STATUS_UI[t._calc.status].label,
    ]);
  });

  const ws=XLSX.utils.aoa_to_sheet(rows);
  ws['!cols']=[{wch:32},{wch:12},{wch:30},{wch:34},{wch:16},{wch:16},{wch:14},{wch:14}];
  ws['!merges']=[{s:{r:0,c:0},e:{r:0,c:7}},{s:{r:1,c:0},e:{r:1,c:7}}];

  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Treinamentos');

  const sufixo=obraFiltroAtivo?`_${obras.find(o=>String(o.id)===String(obraFiltroAtivo))?.codigo||'filtro'}`:'';
  XLSX.writeFile(wb,`Treinamentos_GTEL${sufixo}_${dataEmissao.replace(/\//g,'-')}.xlsx`);
  showToast(`Excel exportado — ${lista.length} treinamento(s)!`);
}

async function salvarUsuario(id){
  const nome=document.getElementById('u-nome').value.trim();
  const email=document.getElementById('u-email').value.trim();
  const senha=document.getElementById('u-senha').value;
  const nivel=document.getElementById('u-nivel').value;
  const ativo=document.getElementById('u-ativo').value==='true';
  const obrasAcesso=[...document.querySelectorAll('.u-obra-chk:checked')].map(c=>c.value);
  if(!nome||!email){showToast('Nome e usuário são obrigatórios','error');return;}
  if(!senha){showToast('Senha é obrigatória','error');return;}
  const payload={nome,usuario:email,perfil:nivel,senha,obras_acesso:obrasAcesso,ativo};
  let error;
  if(id){({error}=await sb.from('usuarios_acesso').update(payload).eq('id',id));}
  else{({error}=await sb.from('usuarios_acesso').insert({...payload,}));}
  if(error){showToast('Erro: '+error.message,'error');return;}
  showToast(id?'Usuário atualizado!':'Usuário criado!');closeModal('modal-usuario');renderUsuarios();

}

let fornecedoresBusca='',fornecedoresFiltroSit='ativo',fornecedoresFiltroTipo='',fornecedoresFiltroObra='';

function renderFornecedores(){
  const lista=fornecedores.filter(f=>{
    if(fornecedoresFiltroSit&&f.situacao!==fornecedoresFiltroSit)return false;
    if(fornecedoresFiltroTipo&&!(f.tipo_fornecimento||'').toLowerCase().includes(fornecedoresFiltroTipo.toLowerCase()))return false;
    if(fornecedoresFiltroObra&&String(f.obra_id)!==String(fornecedoresFiltroObra))return false;
    if(fornecedoresBusca){
      const b=fornecedoresBusca.toLowerCase();
      return(f.razao_social||'').toLowerCase().includes(b)||(f.nome_fantasia||'').toLowerCase().includes(b)||(f.cnpj||'').includes(b)||(f.tipo_fornecimento||'').toLowerCase().includes(b);
    }
    return true;
  });

  const total=fornecedores.length;
  const ativos=fornecedores.filter(f=>f.situacao==='ativo').length;
  const inativos=fornecedores.filter(f=>f.situacao==='inativo').length;

  const rows=lista.map(f=>{
    const sitBadge=f.situacao==='ativo'
      ?'<span class="badge badge-green">Ativo</span>'
      :'<span class="badge badge-red">Inativo</span>';
    const nOrc=fornecedorOrcamentos.filter(o=>String(o.fornecedor_id)===String(f.id)).length;
    return`<tr>
      <td>
        <div style="font-weight:500">${f.razao_social||'—'}</div>
        ${f.nome_fantasia?`<div style="font-size:11px;color:var(--text-muted)">${f.nome_fantasia}</div>`:''}
        ${f.cnpj?`<div style="font-size:11px;color:var(--text-muted);font-family:monospace">${f.cnpj}</div>`:''}
      </td>
      <td style="font-size:12px">${f.obra?`${f.obra.codigo?f.obra.codigo+' — ':''}${f.obra.nome||''}`:'<span style="color:var(--text-muted)">—</span>'}</td>
      <td style="font-size:12px">${f.tipo_fornecimento||'—'}</td>
      <td style="font-size:12px">
        ${f.contato_nome?`<div>${f.contato_nome}</div>`:''}
        ${f.telefone?`<div style="color:var(--text-muted)">${f.telefone}</div>`:''}
        ${f.email?`<div style="color:var(--text-muted)">${f.email}</div>`:''}
        ${(!f.contato_nome&&!f.telefone&&!f.email)?'—':''}
      </td>
      <td style="font-size:12px">${f.forma_pagamento||'—'}</td>
      <td>${sitBadge}</td>
      <td>
        <div class="action-btns">
          ${f.cartao_cnpj_url?`<a href="${f.cartao_cnpj_url}" target="_blank" class="btn btn-sm btn-info" title="Ver Cartão CNPJ"><i class="ti ti-file-certificate"></i></a>`:''}
          <button class="btn btn-sm" onclick="abrirModalOrcamentos('${f.id}')" title="Orçamentos"><i class="ti ti-file-invoice"></i> ${nOrc||''}</button>
          <button class="btn btn-sm" onclick="openModalFornecedor('${f.id}')" title="Editar"><i class="ti ti-edit"></i></button>
          <button class="btn btn-sm btn-danger" onclick="deleteFornecedor('${f.id}','${(f.razao_social||'').replace(/'/g,"\\'")}')" title="Excluir"><i class="ti ti-trash"></i></button>
        </div>
      </td>
    </tr>`;
  }).join('')||'<tr><td colspan="7"><div class="empty-state"><i class="ti ti-truck-delivery"></i><div>Nenhum fornecedor encontrado</div></div></td></tr>';

  const obrasOpts=obras.map(o=>`<option value="${o.id}" ${fornecedoresFiltroObra===String(o.id)?'selected':''}>${o.codigo?o.codigo+' — ':''}${o.nome||''}</option>`).join('');

  document.getElementById('main-content').innerHTML=`
    <div class="page-header">
      <div><div class="page-title">Fornecedores</div><div class="page-subtitle">${ativos} ativos · ${inativos} inativos</div></div>
      <button class="btn btn-primary" onclick="openModalFornecedor()"><i class="ti ti-plus"></i> Novo fornecedor</button>
    </div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px">
      <div class="metric-card" onclick="fornecedoresFiltroSit='';renderFornecedores()" style="cursor:pointer;border-color:${!fornecedoresFiltroSit?'var(--primary)':'var(--border)'}">
        <div class="metric-label">Total</div><div class="metric-value">${total}</div>
      </div>
      <div class="metric-card green" onclick="fornecedoresFiltroSit='ativo';renderFornecedores()" style="cursor:pointer;border-color:${fornecedoresFiltroSit==='ativo'?'var(--success)':'var(--border)'}">
        <div class="metric-label">Ativos</div><div class="metric-value">${ativos}</div>
      </div>
      <div class="metric-card red" onclick="fornecedoresFiltroSit='inativo';renderFornecedores()" style="cursor:pointer;border-color:${fornecedoresFiltroSit==='inativo'?'var(--danger)':'var(--border)'}">
        <div class="metric-label">Inativos</div><div class="metric-value">${inativos}</div>
      </div>
    </div>
    <div class="filters">
      <div class="search-box"><i class="ti ti-search"></i>
        <input placeholder="Buscar por nome, CNPJ, tipo de fornecimento..." value="${fornecedoresBusca}"
          oninput="fornecedoresBusca=this.value;if(!_buscaHandlers.forn)_buscaHandlers.forn=makeBuscaHandler(v=>fornecedoresBusca=v,renderFornecedores,300);_buscaHandlers.forn(this.value);this.focus()">
      </div>
      <select class="filter-select" onchange="fornecedoresFiltroObra=this.value;renderFornecedores()">
        <option value="">Todas as obras</option>${obrasOpts}
      </select>
      <button class="btn btn-sm" onclick="fornecedoresBusca='';fornecedoresFiltroSit='ativo';fornecedoresFiltroTipo='';fornecedoresFiltroObra='';renderFornecedores()"><i class="ti ti-x"></i> Limpar</button>
    </div>
    <div class="table-container"><table>
      <thead><tr>
        <th>Fornecedor</th><th>Obra</th><th>Fornece</th><th>Contato</th><th>Pagamento</th><th>Status</th><th>Ações</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table></div>`;
}

async function saveFornecedor(id){
  const razaoSocial=document.getElementById('forn-razao').value.trim();
  if(!razaoSocial){showToast('Razão Social é obrigatória','error');return;}

  let cartaoUrl=id?fornecedores.find(x=>x.id===id)?.cartao_cnpj_url||null:null;
  const cartaoFile=document.getElementById('forn-cartao-file')?.files?.[0];
  if(cartaoFile){
    showToast('Enviando cartão CNPJ...');
    const path='cartao_cnpj/'+Date.now()+'_'+cartaoFile.name.replace(/[^a-zA-Z0-9._-]/g,'_');
    const{error:upErr}=await sb.storage.from('fornecedores').upload(path,cartaoFile,{contentType:'application/pdf',upsert:true});
    if(upErr){showToast('Erro ao enviar cartão CNPJ: '+upErr.message,'error');return;}
    cartaoUrl=sb.storage.from('fornecedores').getPublicUrl(path).data.publicUrl;
  }

  const payload={
    razao_social:razaoSocial,
    nome_fantasia:document.getElementById('forn-fantasia').value.trim()||null,
    cnpj:document.getElementById('forn-cnpj').value.trim()||null,

async function saveOrcamento(fornecedorId){
  const descricao=document.getElementById('orc-descricao').value.trim();
  const valorRaw=document.getElementById('orc-valor').value;
  const valor=valorRaw!==''?parseFloat(String(valorRaw).replace(',','.')):null;
  const data=document.getElementById('orc-data').value||null;
  let arquivoUrl=null;
  const arquivoFile=document.getElementById('orc-arquivo-file')?.files?.[0];
  if(arquivoFile){
    showToast('Enviando orçamento...');
    const path='orcamentos/'+Date.now()+'_'+arquivoFile.name.replace(/[^a-zA-Z0-9._-]/g,'_');
    const{error:upErr}=await sb.storage.from('fornecedores').upload(path,arquivoFile,{contentType:'application/pdf',upsert:true});
    if(upErr){showToast('Erro ao enviar orçamento: '+upErr.message,'error');return;}
    arquivoUrl=sb.storage.from('fornecedores').getPublicUrl(path).data.publicUrl;
  }
  const payload={fornecedor_id:fornecedorId,descricao:descricao||null,valor,data,arquivo_url:arquivoUrl};
  const{error}=await sb.from('fornecedor_orcamentos').insert(payload);
  if(error){showToast('Erro: '+error.message,'error');return;}
  showToast('Orçamento lançado!');
  await loadFornecedores();
  closeModal('modal-orcamentos');
  abrirModalOrcamentos(fornecedorId);
  renderFornecedores();
}

async function deleteOrcamento(id,fornecedorId){
  if(!confirm('Excluir este orçamento?'))return;
  const{error}=await sb.from('fornecedor_orcamentos').delete().eq('id',id);
  if(error){showToast('Erro: '+error.message,'error');return;}
  showToast('Orçamento excluído.');
  await loadFornecedores();
  closeModal('modal-orcamentos');
  abrirModalOrcamentos(fornecedorId);
  renderFornecedores();
}

function geocodeCidade(cidade,estado){
  if(!cidade&&!estado)return null;
  const key=(cidade||'').trim().toLowerCase()+'|'+(estado||'').trim().toLowerCase();
  if(COORDS_CIDADES[key])return COORDS_CIDADES[key];
  const uf=(estado||'').trim().toLowerCase();
  if(COORDS_CAPITAIS[uf])return COORDS_CAPITAIS[uf];
  return null;
}
let _matrizMapInstance=null;

async function loadMatriz(){
  const{data,error}=await sb.from('matriz_contatos').select('*').order('obra');
  if(error){console.error('loadMatriz erro:',error);matrizData=[];return;}
  matrizData=data||[];
}

function renderMatriz(){
  let lista=matrizData;
  if(matrizFiltroObra)lista=lista.filter(x=>x.obra===matrizFiltroObra);
  if(matrizFiltroCargo)lista=lista.filter(x=>x.cargo===matrizFiltroCargo);
  if(matrizFiltroEstado)lista=lista.filter(x=>x.estado===matrizFiltroEstado);
  if(matrizFiltroGestor)lista=lista.filter(x=>x.gestor_obra===matrizFiltroGestor);
  if(matrizBusca){
    const b=matrizBusca.toLowerCase();
    lista=lista.filter(x=>(x.nome||'').toLowerCase().includes(b)||(x.obra||'').toLowerCase().includes(b)||(x.cargo||'').toLowerCase().includes(b));
  }

  const obrasUnicas=[...new Set(matrizData.map(x=>x.obra).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR'));
  const cargosUnicos=[...new Set(matrizData.map(x=>x.cargo).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR'));
  const estadosUnicos=[...new Set(matrizData.map(x=>x.estado).filter(Boolean))].sort();
  const gestoresUnicos=[...new Set(matrizData.map(x=>x.gestor_obra).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR'));

  const totalContatos=matrizData.length;
  const totalObras=obrasUnicas.length;
  const totalEstados=estadosUnicos.length;
  const totalGestores=gestoresUnicos.length;

  // Agrupar por obra para os pins do mapa (1 pin por obra)
  const porObra={};
  matrizData.forEach(x=>{
    if(!x.obra)return;
    if(!porObra[x.obra])porObra[x.obra]={obra:x.obra,cidade:x.cidade,estado:x.estado,contatos:[]};
    porObra[x.obra].contatos.push(x);
  });

  const rows=lista.map(x=>`
    <tr>
      <td><div style="font-weight:500">${x.nome||'—'}</div></td>
      <td style="font-size:12px">${x.cargo||'—'}</td>
      <td style="font-size:12px">${x.obra||'—'}</td>
      <td style="font-size:12px;font-family:monospace">${x.crd||'—'}</td>
      <td style="font-size:12px">${[x.cidade,x.estado].filter(Boolean).join(' — ')||'—'}</td>
      <td style="font-size:12px">
        ${x.email?`<div><i class="ti ti-mail" style="font-size:13px;margin-right:4px;color:var(--text-muted)"></i>${x.email}</div>`:''}
        ${x.contato?`<div><i class="ti ti-phone" style="font-size:13px;margin-right:4px;color:var(--text-muted)"></i>${x.contato}</div>`:''}
        ${!x.email&&!x.contato?'—':''}
      </td>
    </tr>`).join('')||'<tr><td colspan="6"><div class="empty-state"><i class="ti ti-map-2"></i><div>Nenhum contato encontrado — importe a planilha</div></div></td></tr>';

  document.getElementById('main-content').innerHTML=`
    <div class="page-header">
      <div><div class="page-title">Matriz de Comunicação</div><div class="page-subtitle">${totalContatos} contatos · ${totalObras} obras</div></div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-sm" onclick="openImportMatriz()"><i class="ti ti-upload"></i> Importar planilha</button>
        <button class="btn btn-sm" onclick="exportMatrizExcel()"><i class="ti ti-file-type-xls"></i> Excel</button>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px">
      <div class="metric-card"><div class="metric-value">${totalContatos}</div><div class="metric-label">Contatos</div></div>
      <div class="metric-card"><div class="metric-value">${totalObras}</div><div class="metric-label">Obras</div></div>
      <div class="metric-card"><div class="metric-value">${totalEstados}</div><div class="metric-label">Estados</div></div>
      <div class="metric-card"><div class="metric-value">${totalGestores}</div><div class="metric-label">Gestores</div></div>
    </div>
    <div class="filters" style="margin-bottom:16px">
      <div class="search-box"><i class="ti ti-search"></i><input placeholder="Buscar por nome, obra ou cargo..." value="${matrizBusca}" oninput="matrizBusca=this.value;if(!_buscaHandlers.matriz)_buscaHandlers.matriz=makeBuscaHandler(v=>matrizBusca=v,renderMatriz,300);_buscaHandlers.matriz(this.value);this.focus()"></div>
      <select class="filter-select" onchange="matrizFiltroObra=this.value;renderMatriz()">
        <option value="">Todas as obras</option>${obrasUnicas.map(o=>`<option value="${o}" ${matrizFiltroObra===o?'selected':''}>${o}</option>`).join('')}
      </select>
      <select class="filter-select" onchange="matrizFiltroCargo=this.value;renderMatriz()">
        <option value="">Todos os cargos</option>${cargosUnicos.map(c=>`<option value="${c}" ${matrizFiltroCargo===c?'selected':''}>${c}</option>`).join('')}
      </select>
      <select class="filter-select" onchange="matrizFiltroEstado=this.value;renderMatriz()">
        <option value="">Todos os estados</option>${estadosUnicos.map(e=>`<option value="${e}" ${matrizFiltroEstado===e?'selected':''}>${e}</option>`).join('')}
      </select>
      <select class="filter-select" onchange="matrizFiltroGestor=this.value;renderMatriz()">
        <option value="">Todos os gestores</option>${gestoresUnicos.map(g=>`<option value="${g}" ${matrizFiltroGestor===g?'selected':''}>${g}</option>`).join('')}
      </select>
      <button class="btn btn-sm" onclick="matrizFiltroObra='';matrizFiltroCargo='';matrizFiltroEstado='';matrizFiltroGestor='';matrizBusca='';renderMatriz()"><i class="ti ti-x"></i> Limpar</button>
    </div>
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px;margin-bottom:16px">
      <div style="font-size:13px;color:var(--text-muted);margin-bottom:8px">Localização das obras — clique em um pin para filtrar a tabela (zoom e arraste para navegar)</div>
      <div id="matriz-map" style="height:420px;border-radius:var(--radius);overflow:hidden"></div>
    </div>
    <div class="table-container"><table>
      <thead><tr><th>Nome</th><th>Cargo</th><th>Obra</th><th>CRD</th><th>Cidade/UF</th><th>Contato</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>`;

  initMatrizMap(porObra);
}

function initMatrizMap(porObra){
  const el=document.getElementById('matriz-map');
  if(!el||typeof L==='undefined')return;
  if(_matrizMapInstance){_matrizMapInstance.remove();_matrizMapInstance=null;}
  const map=L.map('matriz-map',{scrollWheelZoom:true}).setView([-15,-50],4);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
    maxZoom:18,
  }).addTo(map);
  const bounds=[];
  Object.values(porObra).forEach(o=>{
    const coord=geocodeCidade(o.cidade,o.estado);
    if(!coord)return;
    bounds.push(coord);
    const ativo=matrizFiltroObra===o.obra;
    const icon=L.divIcon({
      className:'',
      html:`<div style="width:16px;height:16px;border-radius:50%;background:${ativo?'#0F6E56':'#1D9E75'};border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.3)"></div>`,
      iconSize:[16,16],iconAnchor:[8,8],
    });
    const marker=L.marker(coord,{icon}).addTo(map);
    marker.bindPopup(`<strong>${o.obra}</strong><br>${[o.cidade,o.estado].filter(Boolean).join(' — ')}<br>${o.contatos.length} contato(s)`);
    marker.on('click',()=>{
      matrizFiltroObra=ativo?'':o.obra;
      renderMatriz();
    });
  });
  if(bounds.length)map.fitBounds(bounds,{padding:[30,30],maxZoom:6});
  _matrizMapInstance=map;
}

  document.body.insertAdjacentHTML('beforeend',`

          <button class="btn" onclick="closeModal('modal-import-matriz')">Cancelar</button>
        </div>

function handleDropImportMatriz(event){
  event.preventDefault();
  document.getElementById('import-drop-matriz').classList.remove('drag-over');
  const file=event.dataTransfer.files[0];
  if(file)processImportMatrizFile(file);
}
function handleImportFileMatriz(input){
  const file=input.files[0];if(file)processImportMatrizFile(file);
}
function processImportMatrizFile(file){
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const wb=XLSX.read(e.target.result,{type:'array'});
      const colMap={
        obra:'obra',crd:'crd',nome:'nome',cargo:'cargo',setor:'setor',email:'email',contato:'contato',
        'lider imediato obra':'lider_imediato','gestor da obra':'gestor_obra','responsável pelo contrato':'responsavel_contrato',
        cidade:'cidade',estado:'estado','tipo de obra':'tipo_obra',
      };
      // Importar somente a aba "Planilha1" (as demais abas da pasta de trabalho são ignoradas)
      const sheetName=wb.SheetNames.find(n=>n.trim().toLowerCase()==='planilha1');
      if(!sheetName){
        document.getElementById('import-preview-matriz').innerHTML=
          `<div style="padding:10px;background:var(--danger-light);border-radius:var(--radius);font-size:13px;color:var(--danger)">A planilha não tem uma aba chamada "Planilha1". Verifique o arquivo enviado.</div>`;
        return;
      }
      let registros=[];
      const ws=wb.Sheets[sheetName];
      const data=XLSX.utils.sheet_to_json(ws,{header:1,raw:false,defval:''});
      if(data.length){
        const header=data[0].map(h=>String(h||'').trim().toLowerCase());
        const idxObra=header.indexOf('obra');
        const idxNome=header.indexOf('nome');
        if(idxObra>=0&&idxNome>=0){
          const idx={};
          header.forEach((h,i)=>{if(colMap[h])idx[colMap[h]]=i;});
          // Endereço e Foto não têm cabeçalho de texto na planilha — usam posição fixa de coluna (14 e 15)
          for(let r=1;r<data.length;r++){
            const row=data[r];
            if(!row||!row[idxObra]||!row[idxNome])continue;
            const rec={};
            Object.entries(idx).forEach(([campo,i])=>{rec[campo]=(row[i]||'').toString().trim()||null;});
            rec.endereco=(row[14]||'').toString().trim()||null;
            rec.foto_url=(row[15]||'').toString().trim()||null;
            registros.push(rec);
          }
        }
      }
      window._matrizImportPreview=registros;
      document.getElementById('import-preview-matriz').innerHTML=
        `<div style="padding:10px;background:var(--success-light);border-radius:var(--radius);font-size:13px;color:var(--success)">
          <strong>${registros.length} contato(s)</strong> encontrados na aba "Planilha1", prontos para importar.
        </div>`;
      document.getElementById('import-footer-matriz').innerHTML=
        `<button class="btn" onclick="closeModal('modal-import-matriz')">Cancelar</button>
         <button class="btn btn-primary" onclick="confirmarImportMatriz()"><i class="ti ti-check"></i> Confirmar importação</button>`;
    }catch(err){
      document.getElementById('import-preview-matriz').innerHTML=
        `<div style="padding:10px;background:var(--danger-light);border-radius:var(--radius);font-size:13px;color:var(--danger)">Erro ao ler o arquivo: ${err.message}</div>`;
    }
  };
  reader.readAsArrayBuffer(file);
}
async function confirmarImportMatriz(){
  const registros=window._matrizImportPreview||[];
  if(!registros.length){showToast('Nenhum registro para importar','error');return;}
  showToast('Importando...');
  const{error:delErr}=await sb.from('matriz_contatos').delete().gte('created_at','1900-01-01');
  if(delErr){showToast('Erro ao limpar dados anteriores: '+delErr.message,'error');return;}
  const{error:insErr}=await sb.from('matriz_contatos').insert(registros);
  if(insErr){showToast('Erro ao importar: '+insErr.message,'error');return;}
  showToast(`${registros.length} contato(s) importado(s) com sucesso!`);
  closeModal('modal-import-matriz');
  await loadMatriz();renderMatriz();
}
function exportMatrizExcel(){
  const rows=[['Obra','CRD','Nome','Cargo','Setor','Email','Contato','Líder Imediato','Gestor da Obra','Responsável pelo Contrato','Cidade','Estado','Tipo de Obra']];
  matrizData.forEach(x=>rows.push([x.obra,x.crd,x.nome,x.cargo,x.setor,x.email,x.contato,x.lider_imediato,x.gestor_obra,x.responsavel_contrato,x.cidade,x.estado,x.tipo_obra]));
  const ws=XLSX.utils.aoa_to_sheet(rows);
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Matriz');
  XLSX.writeFile(wb,'Matriz_Comunicacao_GTEL.xlsx');
  showToast('Excel exportado!');
}

function closeModal(id){
  const el=document.getElementById(id);
  if(el)el.remove();
}


function insertModal(id,html){
  const old=document.getElementById(id);if(old)old.remove();
  document.body.insertAdjacentHTML('beforeend',`<div class="modal-overlay" id="${id}" onclick="if(event.target===this)closeModal('${id}')">${html}</div>`);
}

function renderAlojamentos(){
  const hoje=new Date();hoje.setHours(0,0,0,0);
  const alojsFiltrados=(()=>{
    let lista=globalObraFiltro?alojamentos.filter(a=>a.obra_id===globalObraFiltro):alojamentos;
    const _mes=new Date().getMonth()+1;const _ano=new Date().getFullYear();
    if(alojFiltroAtivo==='contratos_vencidos'){
      const _hj=new Date();_hj.setHours(0,0,0,0);
      lista=lista.filter(a=>{const d=parseDate(a.data_termino);return d&&d<_hj;});
    } else if(alojFiltroAtivo==='contratos_vencendo'){
      const _hj=new Date();_hj.setHours(0,0,0,0);
      lista=lista.filter(a=>{const d=parseDate(a.data_termino);if(!d)return false;const diff=Math.floor((d-_hj)/86400000);return diff>=0&&diff<=60;});
    } else if(alojFiltroAtivo==='nao_lancadas'){
      const _obrig=['agua','energia','gas','condominio'];
      lista=lista.filter(a=>{
        if(a.tipo_alojamento==='hotel')return false; // hotéis não têm contas a lançar
        const tiposLanc=new Set(alojamentosContas.filter(c=>String(c.alojamento_id)===String(a.id)&&c.mes===_mes&&c.ano===_ano).map(c=>c.tipo));
        return _obrig.some(t=>!tiposLanc.has(t)&&!a['isenta_'+t]);
      });
    }
    if(alojBusca){
      const b=alojBusca.toLowerCase();
      lista=lista.filter(a=>a.endereco?.toLowerCase().includes(b)||a.nome?.toLowerCase().includes(b));
    }
    return lista;
  })();
  const totalVagas=alojsFiltrados.reduce((s,a)=>s+(a.vagas_total||0),0);
  const _idsAlojFiltrados=new Set(alojsFiltrados.map(a=>String(a.id)));
  const totalOcup=funcionarios.filter(f=>f.alojamento_id&&f.situacao!=='inativo'&&_idsAlojFiltrados.has(String(f.alojamento_id))).length
    +prestadores.filter(p=>p.alojamento_id&&p.situacao==='ativo'&&_idsAlojFiltrados.has(String(p.alojamento_id))).length;
  const totalDisp=totalVagas-totalOcup;
  const totalAluguel=alojsFiltrados.reduce((s,a)=>s+Number(a.custo_mensal||0)+Number(a.condominio||0)+Number(a.iptu||0)+Number(a.seguro||0),0);
  const totalCaucao=alojsFiltrados.reduce((s,a)=>s+Number(a.caucao||0),0);
  const totalContas=alojamentosContas.filter(c=>c.mes===hoje.getMonth()+1&&c.ano===hoje.getFullYear()).reduce((s,c)=>s+Number(c.valor||0),0);

  // Vencimentos próximos (60 dias)
  const vencProx=alojsFiltrados.filter(a=>{const d=parseDate(a.data_termino);return d&&Math.floor((d-hoje)/86400000)<=60&&Math.floor((d-hoje)/86400000)>=0;}).length;
  const vencidos=alojsFiltrados.filter(a=>{const d=parseDate(a.data_termino);return d&&d<hoje;}).length;

  // ─── Tabela agrupada por obra ─────────────────────────────────────────────
  const _mesTabela=tabelaMesFiltro||hoje.getMonth()+1;
  const _anoTabela=tabelaAnoFiltro||hoje.getFullYear();
  const _mesesNomes=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  const _mesLabel=_mesesNomes[_mesTabela-1]+'/'+_anoTabela;
  const _contasObrigTab=['agua','energia','gas','condominio'];
  const _nomesTab={agua:'Água',energia:'Energia',gas:'Gás',condominio:'Condomínio'};
  const _labTab={agua:'💧',energia:'⚡',gas:'🔥',condominio:'🏢'};

  const _byObra={};

    const obraKey=a.obra?.codigo?(a.obra.codigo+' — '+a.obra.nome):'Sem obra vinculada';

      +_obrasSemRelatorio.map(o=>{
        const cnt=_alojSemRelatorio.filter(a=>(a.obra?.codigo?(a.obra.codigo+' — '+a.obra.nome):'Sem obra')===o).length;
        const ativo=bannerRelatoriosFiltroObra===o;
        return '<button onclick="event.stopPropagation();bannerRelatoriosFiltroObra=bannerRelatoriosFiltroObra===\''+o+'\'?\'\':\''+o+'\';renderAlojamentos()" style="font-size:11px;padding:2px 10px;border-radius:20px;border:1px solid '+(ativo?'#991B1B':'#FCA5A5')+';background:'+(ativo?'#991B1B':'transparent')+';color:'+(ativo?'#fff':'#991B1B')+';cursor:pointer">'+(o.split(' — ')[0]||o)+' ('+cnt+')</button>';

      +'</div>';

    const linhasRel=_listaFiltradaRel.map(a=>{
      const obraLabel=a.obra?.codigo||'—';
      return '<div style="display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid #FCA5A5"><i class="ti ti-home" style="color:#991B1B;flex-shrink:0;font-size:12px"></i><span style="font-size:11px;color:var(--text-muted);min-width:44px">'+obraLabel+'</span><span style="font-weight:600;color:#991B1B;flex:1;font-size:12px;cursor:pointer;text-decoration:underline" onclick="event.stopPropagation();bannerRelatoriosAberto=false;scrollToAlojamento(&apos;'+a.id+'&apos;)">'+ a.nome +'</span><button class="btn btn-sm" style="font-size:11px;padding:2px 8px;border-color:#FCA5A5;color:#991B1B" onclick="event.stopPropagation();openModalRelatorios(&apos;'+a.id+'&apos;,'+_mesAtual+','+_anoAtual+')">📋 Lançar recebimento</button></div>';
    }).join('');

    return '<div style="background:#FEF2F2;border:1px solid #FCA5A5;border-radius:var(--radius);margin-bottom:8px;overflow:hidden">'+headerHtml+filtroObrasHtml+'<div style="padding:6px 14px;max-height:300px;overflow-y:auto">'+linhasRel+'</div></div>';
  })():'';

  document.getElementById('main-content').innerHTML=`
    <div class="page-header">
      <div><div class="page-title"><i class="ti ti-home-2"></i> Alojamentos</div>
        <div class="page-subtitle">${alojamentos.length} alojamento(s)</div></div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-sm" onclick="exportAlojamentosExcel()"><i class="ti ti-file-type-xls"></i> Excel</button>
        <button class="btn btn-primary" onclick="openModalAlojamento()"><i class="ti ti-plus"></i> Novo alojamento</button>
      </div>
    </div>

    ${vencidos>0?`<div onclick="alojFiltroAtivo=alojFiltroAtivo==='contratos_vencidos'?null:'contratos_vencidos';renderAlojamentos()" style="display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:var(--radius);margin-bottom:8px;background:var(--danger-light);border:1px solid #FCA5A5;color:#991B1B;cursor:pointer;transition:opacity .15s" ${alojFiltroAtivo==='contratos_vencidos'?'class="aloj-filtro-ativo"':''}><i class="ti ti-alert-triangle" style="font-size:18px"></i><strong>${vencidos} contrato(s) vencido(s) — providenciar renovação!</strong><i class="ti ti-${alojFiltroAtivo==='contratos_vencidos'?'x':'chevron-right'}" style="margin-left:auto"></i></div>`:''}
    ${vencProx>0?`<div onclick="alojFiltroAtivo=alojFiltroAtivo==='contratos_vencendo'?null:'contratos_vencendo';renderAlojamentos()" style="display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:var(--radius);margin-bottom:8px;background:var(--warning-light);border:1px solid #FCD34D;color:#92400E;cursor:pointer" ${alojFiltroAtivo==='contratos_vencendo'?'class="aloj-filtro-ativo"':''}><i class="ti ti-clock" style="font-size:18px"></i><strong>${vencProx} contrato(s) vencendo em 60 dias</strong><i class="ti ti-${alojFiltroAtivo==='contratos_vencendo'?'x':'chevron-right'}" style="margin-left:auto"></i></div>`:''}
    ${bannerSemContas}
    ${bannerSemRelatorio}

    <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;margin-bottom:16px">
      <!-- Totais gerais -->
      <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:14px">
        <div><div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">Total Vagas</div><div style="font-size:26px;font-weight:700">${totalVagas}</div></div>
        <div><div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">Ocupadas</div><div style="font-size:26px;font-weight:700;color:var(--primary-dark)">${totalOcup}</div></div>
        <div><div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">Disponíveis</div><div style="font-size:26px;font-weight:700;color:${totalDisp===0?'var(--danger)':totalDisp<=3?'var(--warning)':'var(--text)'}">${totalDisp}</div></div>
        <div><div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">Custo Mensal</div><div style="font-size:18px;font-weight:700">R$ ${(totalAluguel+totalContas).toLocaleString('pt-BR',{minimumFractionDigits:2})}</div></div>
        <div><div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">Total Caução</div><div style="font-size:18px;font-weight:700">R$ ${totalCaucao.toLocaleString('pt-BR',{minimumFractionDigits:2})}</div></div>
      </div>
      <!-- Breakdown por obra -->
      <div style="border-top:1px solid var(--border);padding-top:14px">
        <div style="font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px">Por Obra</div>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px">
          ${(()=>{
            const _todas=globalObraFiltro?alojamentos.filter(a=>a.obra_id===globalObraFiltro):alojamentos;
            const _obrasMap={};
            _todas.forEach(a=>{
              const k=a.obra?.codigo||(a.obra?.nome||'Sem obra');
              if(!_obrasMap[k])_obrasMap[k]={vagas:0,ocup:0,custo:0,nome:a.obra?.nome||'Sem obra',id:a.obra_id};
              _obrasMap[k].vagas+=a.vagas_total||0;
              _obrasMap[k].ocup+=funcionarios.filter(f=>String(f.alojamento_id)===String(a.id)&&f.situacao!=='inativo').length
                +prestadores.filter(p=>String(p.alojamento_id)===String(a.id)&&p.situacao==='ativo').length;
              _obrasMap[k].custo+=Number(a.custo_mensal||0)+Number(a.condominio||0)+Number(a.iptu||0)+Number(a.seguro||0);
            });
            return Object.entries(_obrasMap).map(([cod,o])=>{
              const pct=o.vagas?Math.round(o.ocup/o.vagas*100):0;
              const cor=pct>=100?'var(--danger)':pct>=80?'var(--warning)':'var(--primary)';
              const disp=o.vagas-o.ocup;
              return '<div onclick="if(\''+(o.id||'')+'\'){document.getElementById(\'global-obra-select\').value=\''+(o.id||'')+'\';setGlobalObraFiltro(\''+(o.id||'')+'\')}" '
                +'onmouseover="this.style.borderColor=\'var(--primary)\'" onmouseout="this.style.borderColor=\'var(--border)\'" '
                +'style="background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px;cursor:pointer;transition:border-color .15s">'
                +'<div style="display:flex;align-items:center;justify-content:between;gap:8px;margin-bottom:10px">'
                +'<div style="font-size:13px;font-weight:700;color:var(--primary-dark);overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="'+(o.nome||'')+'">'+cod+'</div>'
                +'</div>'
                +'<div style="display:flex;align-items:baseline;gap:6px;margin-bottom:2px">'
                +'<span style="font-size:24px;font-weight:700;color:var(--text)">'+o.ocup+'</span>'
                +'<span style="font-size:13px;color:var(--text-muted)">/ '+o.vagas+' vagas</span>'
                +'</div>'
                +'<div style="font-size:11px;color:'+(disp===0?'var(--danger)':disp<=2?'var(--warning)':'var(--text-muted)')+';margin-bottom:10px">'+(disp===0?'Sem vagas disponíveis':disp+' disponível'+(disp!==1?'eis':''))+'</div>'
                +'<div style="height:6px;background:var(--border);border-radius:3px;margin-bottom:10px"><div style="height:6px;border-radius:3px;background:'+cor+';width:'+pct+'%;transition:width .3s"></div></div>'
                +'<div style="display:flex;align-items:center;justify-content:space-between;padding-top:8px;border-top:1px solid var(--border)">'
                +'<span style="font-size:11px;color:var(--text-muted)">Custo mensal</span>'
                +'<strong style="font-size:13px">R$ '+o.custo.toLocaleString('pt-BR',{minimumFractionDigits:2})+'</strong>'
                +'</div>'
                +'</div>';
            }).join('');
          })()}
        </div>
      </div>
    </div>
    <div style="margin-bottom:12px;display:flex;gap:8px">
      <div class="search-box" style="max-width:320px"><i class="ti ti-search"></i><input placeholder="Buscar por endereço ou nome..." value="${alojBusca}" oninput="alojBusca=this.value;if(!_buscaHandlers.aloj)_buscaHandlers.aloj=makeBuscaHandler(v=>alojBusca=v,renderAlojamentos,300);_buscaHandlers.aloj(this.value);this.focus()"></div>
      ${alojBusca?`<button class="btn btn-sm" onclick="alojBusca='';renderAlojamentos()"><i class="ti ti-x"></i> Limpar</button>`:''}
    </div>
    <!-- Seletor de mês para tabela -->
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
      <span style="font-size:12px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px">Visualizar mês:</span>
      ${(()=>{
        const _meses=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
        const _hj=new Date();
        const opts=[];
        for(let i=5;i>=-1;i--){
          const d=new Date(_hj.getFullYear(),_hj.getMonth()-i,1);
          const m=d.getMonth()+1;const y=d.getFullYear();
          const sel=(tabelaMesFiltro||_hj.getMonth()+1)===m&&(tabelaAnoFiltro||_hj.getFullYear())===y;
          opts.push('<button onclick="tabelaMesFiltro='+m+';tabelaAnoFiltro='+y+';renderAlojamentos()" style="font-size:12px;padding:4px 12px;border-radius:20px;border:1px solid '+(sel?'var(--primary)':'var(--border)')+';background:'+(sel?'var(--primary)':'var(--surface)')+';color:'+(sel?'#fff':'var(--text-muted)')+';cursor:pointer;font-weight:'+(sel?'600':'400')+'">'+_meses[m-1]+'/'+y+'</button>');
        }
        return opts.join('');
      })()}
    </div>

    ${tabelaAlojamentos}`;
}

}

// Mostra/esconde os blocos de custo de aluguel, contas e ADM 31 conforme o tipo de alojamento.
// Hotel não tem contas a pagar nem checklist ADM 31 — só o valor da diária.
function atualizarCamposAlojamento(){
  const tipo=document.getElementById('aloj-tipo').value;
  const isHotel=tipo==='hotel';
  document.getElementById('aloj-wrap-diaria').style.display=isHotel?'':'none';
  document.getElementById('aloj-bloco-residencia').style.display=isHotel?'none':'contents';
  document.getElementById('aloj-wrap-contas').style.display=isHotel?'none':'';
  const anexos=document.getElementById('aloj-wrap-anexos-contrato');
  if(anexos)anexos.style.display=isHotel?'none':'';
}


async function saveAlojamento(id){
  const nome=document.getElementById('aloj-nome').value.trim();
  if(!nome){showToast('Nome é obrigatório','error');return;}

  // Upload PDFs se selecionados
  async function uploadPDF(inputId,folder){
    const input=document.getElementById(inputId);
    if(!input||!input.files||!input.files[0])return null;
    const file=input.files[0];
    const path=`${folder}/${Date.now()}_${file.name.replace(/\s/g,'_')}`;
    const{error}=await sb.storage.from('alojamentos').upload(path,file,{contentType:'application/pdf',upsert:true});
    if(error){showToast('Erro no upload: '+error.message,'error');return null;}
    return sb.storage.from('alojamentos').getPublicUrl(path).data.publicUrl;
  }

  const existente=id?alojamentos.find(x=>x.id===id):null;
  const contratoUrl=await uploadPDF('aloj-contrato-file','contratos')||existente?.contrato_url||null;
  const laudoUrl=await uploadPDF('aloj-laudo-file','laudos')||existente?.laudo_url||null;
  const fotosUrl=await uploadPDF('aloj-fotos-file','fotos')||existente?.fotos_url||null;

  function parseBRL(v){if(!v&&v!==0)return null;const s=String(v).trim();if(s.includes(',')){return parseFloat(s.replace(/\./g,'').replace(',','.'))||null;}return parseFloat(s)||null;}
  const tipoAloj=document.getElementById('aloj-tipo').value;
  const isHotel=tipoAloj==='hotel';
  const payload={
    nome,
    tipo_alojamento:tipoAloj,
    valor_diaria:isHotel?parseBRL(document.getElementById('aloj-diaria').value):null,
    obra_id:document.getElementById('aloj-obra').value||null,
    endereco:document.getElementById('aloj-end').value.trim()||null,
    vagas_total:parseInt(document.getElementById('aloj-vagas').value)||null,
    imobiliaria:document.getElementById('aloj-imob').value.trim()||null,
    contato_imobiliaria:document.getElementById('aloj-contato').value.trim()||null,
    custo_mensal:isHotel?null:parseBRL(document.getElementById('aloj-aluguel').value),
    condominio:isHotel?null:parseBRL(document.getElementById('aloj-cond').value),
    iptu:isHotel?null:parseBRL(document.getElementById('aloj-iptu').value),
    seguro:isHotel?null:parseBRL(document.getElementById('aloj-seguro').value),
    caucao:isHotel?null:parseBRL(document.getElementById('aloj-caucao').value),
    data_inicio:isHotel?null:(document.getElementById('aloj-inicio').value||null),
    data_termino:isHotel?null:(document.getElementById('aloj-termino').value||null),
    isencao_meses:isHotel?null:(parseInt(document.getElementById('aloj-isencao').value)||null),
    indice_reajuste:isHotel?null:(document.getElementById('aloj-indice').value.trim()||null),
    observacoes:document.getElementById('aloj-obs').value.trim()||null,
    isenta_agua:isHotel?false:(document.getElementById('isenta-agua')?.checked||false),
    isenta_energia:isHotel?false:(document.getElementById('isenta-energia')?.checked||false),
    isenta_gas:isHotel?false:(document.getElementById('isenta-gas')?.checked||false),
    isenta_condominio:isHotel?false:(document.getElementById('isenta-condominio')?.checked||false),
    contrato_url:contratoUrl,
    laudo_url:laudoUrl,
    fotos_url:fotosUrl,
  };
  const{error}=id?await sb.from('alojamentos').update(payload).eq('id',id):await sb.from('alojamentos').insert(payload);
  if(error){showToast('Erro: '+error.message,'error');return;}
  showToast(id?'Alojamento atualizado!':'Alojamento cadastrado!');
  closeModal('modal-aloj');await loadAlojamentos();renderAlojamentos();
}

async function deleteAlojamento(id,nome){
  if(!confirm(`Excluir alojamento "${nome}"?`))return;

  if(error){showToast('Erro: '+error.message,'error');return;}
  showToast('Alojamento excluído.');await loadAlojamentos();renderAlojamentos();
}
