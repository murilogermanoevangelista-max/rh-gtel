<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RH Manager — GTEL</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>window.__XLSXCore=window.XLSX;</script>
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<script>window.XLSXStyle=window.XLSX;window.XLSX=window.__XLSXCore;</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
--primary:#1D9E75;--primary-dark:#0F6E56;--primary-light:#E1F5EE;
--bg:#F8F9FA;--surface:#fff;--border:#E5E7EB;
--text:#1a1a1a;--text-muted:#6B7280;
--danger:#E24B4A;--danger-light:#FCEBEB;
--warning:#BA7517;--warning-light:#FAEEDA;
--success:#3B6D11;--success-light:#EAF3DE;
--info:#185FA5;--info-light:#E6F1FB;
--radius:8px;--radius-lg:12px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:220px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:100}
.sidebar-header{padding:20px 16px 16px;border-bottom:1px solid var(--border)}
.sidebar-logo{font-size:16px;font-weight:600;color:var(--primary)}
.sidebar-sub{font-size:11px;color:var(--text-muted)}
.sidebar-nav{flex:1;padding:12px 8px;overflow-y:auto}
.nav-section{font-size:10px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.8px;padding:8px 8px 4px}
.nav-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--radius);cursor:pointer;color:var(--text-muted);font-size:13px;margin-bottom:2px;transition:all .15s}
.nav-item:hover{background:var(--bg);color:var(--text)}
.nav-item.active{background:var(--primary-light);color:var(--primary-dark);font-weight:500}
.nav-item i{font-size:16px}
.sidebar-obra-filter{padding:8px 12px;border-top:1px solid var(--border);border-bottom:1px solid var(--border);background:var(--bg)}
.sidebar-obra-filter label{font-size:10px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:4px}
.sidebar-obra-filter select{width:100%;font-size:12px;padding:5px 8px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text);cursor:pointer}
.sidebar-obra-filter select:focus{outline:none;border-color:var(--primary)}
.global-obra-badge{display:none;margin:0 8px 6px;padding:4px 8px;background:var(--primary-light);border-radius:20px;font-size:11px;color:var(--primary-dark);font-weight:500;text-align:center}
.main{margin-left:220px;min-height:100vh;padding:24px}
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
.page-title{font-size:20px;font-weight:600}
.page-subtitle{font-size:13px;color:var(--text-muted);margin-top:2px}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:24px}
.metric-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px}
.metric-label{font-size:12px;color:var(--text-muted);margin-bottom:4px}
.metric-value{font-size:24px;font-weight:600;color:var(--text)}
.metric-card.green .metric-value{color:var(--primary-dark)}
.metric-card.red .metric-value{color:var(--danger)}
.metric-card.amber .metric-value{color:var(--warning)}
.table-container{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden}
.search-box{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:6px 12px;min-width:220px}
.search-box input{border:none;background:transparent;outline:none;font-size:13px;color:var(--text);width:100%}
.search-box i{color:var(--text-muted);font-size:15px}
table{width:100%;border-collapse:collapse}
thead th{text-align:left;font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--border)}
tbody tr{border-bottom:1px solid var(--border);transition:background .1s}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:#FAFAFA}
tbody td{padding:10px 16px;font-size:13px}
.ctr-table{table-layout:fixed;width:100%}
.ctr-table thead th{padding:6px 8px;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctr-table tbody td{padding:6px 8px;font-size:11px;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
.ctr-table tbody td .action-btns .btn{padding:3px 6px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--primary-light);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--primary-dark);overflow:hidden;flex-shrink:0}
.avatar.has-foto{cursor:zoom-in}
#foto-lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:9999;align-items:center;justify-content:center;flex-direction:column;gap:14px}
#foto-lightbox.open{display:flex}
#foto-lightbox img{max-width:min(90vw,380px);max-height:min(80vh,380px);border-radius:50%;border:4px solid #fff;box-shadow:0 8px 40px rgba(0,0,0,.6);object-fit:cover}
#foto-lightbox .lb-nome{color:#fff;font-size:15px;font-weight:600;text-align:center;max-width:320px}
#foto-lightbox .lb-close{position:absolute;top:18px;right:22px;color:#fff;font-size:30px;cursor:pointer;opacity:.8;line-height:1;user-select:none}
.avatar img{width:100%;height:100%;object-fit:cover}
.name-cell{display:flex;align-items:center;gap:10px}
.name-cell [onclick*="verFicha"]:hover{color:var(--primary);text-decoration:underline}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:500}
.badge-green{background:var(--success-light);color:var(--success)}
.badge-red{background:var(--danger-light);color:var(--danger)}
.badge-amber{background:var(--warning-light);color:var(--warning)}
.badge-blue{background:#E6F1FB;color:#185FA5}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:13px;cursor:pointer;font-weight:500;transition:all .15s}
.btn:hover{background:var(--bg)}
.btn-primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn-primary:hover{background:var(--primary-dark);border-color:var(--primary-dark)}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-danger{background:var(--danger-light);color:var(--danger);border-color:transparent}
.btn-info{background:var(--info-light);color:var(--info);border-color:transparent}
.btn-success{background:var(--success-light);color:var(--success);border-color:transparent}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:999;padding:20px}
.modal{background:var(--surface);border-radius:var(--radius-lg);width:100%;max-width:700px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.15)}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);z-index:1}
.modal-title{font-size:16px;font-weight:600}
.modal-body{padding:24px}
.autocomplete-wrap{position:relative}
.autocomplete-list{position:absolute;top:100%;left:0;right:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 8px 24px rgba(0,0,0,.12);max-height:220px;overflow-y:auto;z-index:50;display:none;margin-top:4px}
.autocomplete-list.show{display:block}
.autocomplete-item{padding:8px 12px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--border)}
.autocomplete-item:last-child{border-bottom:none}
.autocomplete-item:hover,.autocomplete-item.highlighted{background:var(--hover)}
.autocomplete-item .ac-mat{font-size:11px;color:var(--text-muted)}
.autocomplete-empty{padding:10px 12px;font-size:12px;color:var(--text-muted)}
.modal-footer{padding:16px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form-group{display:flex;flex-direction:column;gap:5px}
.form-group.full{grid-column:1/-1}
label{font-size:12px;font-weight:500;color:var(--text-muted)}
input,select,textarea{padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius);font-size:13px;color:var(--text);background:var(--surface);outline:none;transition:border .15s;width:100%}
input:focus,select:focus{border-color:var(--primary)}
.form-section{font-size:12px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.8px;padding-bottom:6px;border-bottom:1px solid var(--border);grid-column:1/-1}
.foto-upload{display:flex;align-items:center;gap:16px;grid-column:1/-1;padding:16px;background:var(--bg);border-radius:var(--radius);border:1px dashed var(--border)}
.foto-preview{width:64px;height:64px;border-radius:50%;background:var(--primary-light);display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:20px;font-weight:600;color:var(--primary-dark);flex-shrink:0}
.foto-preview img{width:100%;height:100%;object-fit:cover}
.funcao-toggle{font-size:11px;color:var(--primary);cursor:pointer;text-decoration:underline;margin-top:3px;display:inline-block}
.aloj-filtro-ativo{outline:2px solid currentColor;outline-offset:-2px;font-weight:700!important}
.transfer-tipo-btns{grid-column:1/-1;display:flex;gap:10px;margin-top:4px}
.transfer-tipo-btn{flex:1;padding:12px;border:2px solid var(--border);border-radius:var(--radius);cursor:pointer;text-align:center;transition:all .2s;background:var(--surface)}
.transfer-tipo-btn:hover{border-color:var(--primary);background:var(--primary-light)}
.transfer-tipo-btn.selected-envio{border-color:var(--warning);background:var(--warning-light)}
.transfer-tipo-btn.selected-recebimento{border-color:var(--info);background:var(--info-light)}
.transfer-tipo-btn .ttb-icon{font-size:22px;margin-bottom:4px}
.transfer-tipo-btn .ttb-label{font-size:13px;font-weight:600}
.transfer-tipo-btn .ttb-desc{font-size:11px;color:var(--text-muted);margin-top:2px}
.transfer-block{grid-column:1/-1;display:none}
.transfer-block.visible{display:contents}
.transfer-fields{grid-column:1/-1;display:none}
.transfer-fields.visible{display:contents}
.transfer-header{grid-column:1/-1;display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:var(--radius);font-size:13px;font-weight:600;margin-top:4px}
.transfer-header.envio{background:var(--warning-light);color:var(--warning)}
.transfer-header.recebimento{background:var(--info-light);color:var(--info)}
/* FICHA */
.ficha-modal{max-width:1220px;width:96vw}
.ficha-modal .modal-body{max-height:calc(94vh - 118px);overflow-y:auto;padding:16px 20px}
.ficha-columns{column-count:2;column-gap:20px}
.ficha-columns .ficha-section,.ficha-columns>div{break-inside:avoid;-webkit-column-break-inside:avoid;page-break-inside:avoid}
@media(max-width:900px){.ficha-columns{column-count:1}}
.ficha-header-card{background:linear-gradient(135deg,var(--primary-dark),var(--primary));border-radius:var(--radius-lg);padding:14px 18px;display:flex;align-items:center;gap:14px;margin-bottom:12px;color:#fff}
.ficha-avatar{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:#fff;overflow:hidden;flex-shrink:0;border:2px solid rgba(255,255,255,.4)}
.ficha-avatar img{width:100%;height:100%;object-fit:cover}
.ficha-nome{font-size:16px;font-weight:700;margin-bottom:2px}
.ficha-mat{font-size:12px;opacity:.8}
.ficha-badges{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap}
.ficha-badge{padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;background:rgba(255,255,255,.2);color:#fff}
.ficha-section{margin-bottom:10px;background:var(--surface);display:inline-block;width:100%}
.ficha-section-title{font-size:10px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px;padding-bottom:4px;border-bottom:1px solid var(--border)}
.ficha-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px}
.ficha-field{display:flex;flex-direction:column;gap:1px}
.ficha-field.full{grid-column:1/-1}
.ficha-field-label{font-size:10px;color:var(--text-muted);font-weight:500}
.ficha-field-value{font-size:12.5px;color:var(--text);font-weight:500;line-height:1.3}
.ficha-transf-card{background:var(--warning-light);border:1px solid #F0D090;border-radius:var(--radius);padding:16px;margin-bottom:20px}
.ficha-transf-card.recebimento{background:var(--info-light);border-color:#9EC5F0}
.ficha-transf-title{font-size:12px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.ficha-transf-title.envio{color:var(--warning)}
.ficha-transf-title.recebimento{color:var(--info)}
.ficha-export-btns{display:flex;gap:8px}
.empty-state{text-align:center;padding:48px 24px;color:var(--text-muted)}
.empty-state i{font-size:48px;margin-bottom:12px;display:block;opacity:.3}
.loading{text-align:center;padding:32px;color:var(--text-muted)}
.toast{position:fixed;bottom:24px;right:24px;background:#1a1a1a;color:#fff;padding:12px 16px;border-radius:var(--radius);font-size:13px;z-index:9999;transform:translateY(100px);transition:transform .3s;max-width:320px}
.toast.show{transform:translateY(0)}
.toast.success{background:var(--primary-dark)}
.toast.error{background:var(--danger)}
.action-btns{display:flex;gap:4px}
.filters{display:flex;gap:8px;margin-bottom:16px;flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px}
.filters .filter-select{width:auto;flex:0 0 auto;min-width:150px}
.filters .search-box{flex:1 1 220px;min-width:180px}
.filters>button{flex:0 0 auto;white-space:nowrap}
.filter-select{padding:7px 10px;border:1px solid var(--border);border-radius:var(--radius);font-size:13px;background:var(--surface);color:var(--text);outline:none}
.login-screen{position:fixed;inset:0;background:linear-gradient(135deg,var(--primary-dark),var(--primary));display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px}
.login-card{background:var(--surface);border-radius:var(--radius-lg);box-shadow:0 20px 50px rgba(0,0,0,.25);padding:36px 32px;width:100%;max-width:380px}
.login-logo{display:flex;align-items:center;gap:8px;font-size:20px;font-weight:700;color:var(--primary-dark);margin-bottom:2px}
.login-sub{font-size:12px;color:var(--text-muted);margin-bottom:24px}
.login-field{margin-bottom:14px}
.login-field label{display:block;font-size:12px;font-weight:600;color:var(--text-muted);margin-bottom:5px}
.login-field input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius);font-size:14px}
.login-error{display:none;background:var(--danger-light);color:var(--danger);font-size:12px;padding:8px 10px;border-radius:var(--radius);margin-bottom:14px}
.login-btn{width:100%;justify-content:center;padding:11px;font-size:14px}
@media(max-width:768px){.sidebar{display:none}.main{margin-left:0}.form-grid{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.ficha-grid{grid-template-columns:1fr}}
/* EXPERIÊNCIA */
.exp-alert{border-radius:var(--radius-lg);padding:16px 20px;display:flex;align-items:center;gap:16px;margin-bottom:20px;border:1px solid}
.exp-alert.danger{background:#FFF5F5;border-color:#FED7D7;color:#C53030}
.exp-alert.warning{background:#FFFBEB;border-color:#FCD34D;color:#92400E}
.exp-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:20px}
.exp-card{background:var(--surface);border:2px solid var(--border);border-radius:var(--radius-lg);padding:14px;cursor:pointer;transition:all .2s;text-align:center}
.exp-card:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.1)}
.exp-card.active{border-color:var(--primary);background:var(--primary-light)}
.exp-card-value{font-size:28px;font-weight:700;margin-bottom:2px}
.exp-card-label{font-size:11px;color:var(--text-muted);font-weight:500;text-transform:uppercase;letter-spacing:.5px}
.exp-card.blue .exp-card-value{color:#185FA5}
.exp-card.green .exp-card-value{color:var(--primary-dark)}
.exp-card.amber .exp-card-value{color:var(--warning)}
.exp-card.red .exp-card-value{color:var(--danger)}
.exp-card.purple .exp-card-value{color:#6B21A8}
.exp-tabs{display:flex;gap:4px;margin-bottom:16px;background:var(--bg);padding:4px;border-radius:var(--radius);width:fit-content}
.exp-tab{padding:6px 16px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500;color:var(--text-muted);transition:all .15s}
.exp-tab.active{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.status-badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.status-exp1{background:#DBEAFE;color:#1E40AF}
.status-exp1-hoje{background:#FFEDD5;color:#9A3412;border:1px solid #FDBA74}
.status-exp2{background:#FEF3C7;color:#92400E}
.status-efetivado{background:var(--success-light);color:var(--success)}
.status-vencendo{background:#FFF3CD;color:#856404;border:1px solid #FCD34D}
.status-vencida{background:var(--danger-light);color:var(--danger)}
.dias-restantes{font-weight:700;font-size:13px}
.dias-restantes.ok{color:var(--primary-dark)}
.dias-restantes.warn{color:var(--warning)}
.dias-restantes.danger{color:var(--danger)}
.obs-cell{max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;color:var(--text-muted);cursor:pointer}
.obs-cell:hover{color:var(--primary)}
.efetivar-btn{background:#E8F5E9;color:#2E7D32;border:1px solid #A5D6A7;border-radius:var(--radius);padding:4px 10px;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap}
.efetivar-btn:hover{background:#C8E6C9}
.obs-modal{max-width:480px}
/* FOLGAS */
.folga-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;margin-bottom:12px}
.folga-row{display:grid;grid-template-columns:260px 100px 120px 100px repeat(6,1fr);gap:0;align-items:stretch;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:6px;overflow:hidden}
.folga-cell{padding:10px 12px;border-right:1px solid var(--border);display:flex;flex-direction:column;justify-content:center;font-size:13px}
.folga-cell:last-child{border-right:none}
.folga-cell-header{font-size:10px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
.folga-venc{border-radius:6px;padding:4px 8px;font-size:12px;font-weight:600;text-align:center;margin-bottom:4px}
.folga-venc.ok{background:var(--success-light);color:var(--success)}
.folga-venc.prog{background:var(--info-light);color:var(--info)}
.folga-venc.warn{background:#FFF3CD;color:#856404;border:1px solid #FCD34D}
.folga-venc.danger{background:var(--danger-light);color:var(--danger)}
.folga-venc.future{background:var(--bg);color:var(--text-muted)}
.folga-saida-real{font-size:11px;color:var(--primary);cursor:pointer;text-decoration:underline}
.folga-saida-proj{font-size:11px;color:var(--text-muted)}
.folga-header-row{display:grid;grid-template-columns:260px 100px 120px 100px repeat(6,1fr);gap:0;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius) var(--radius) 0 0;margin-bottom:0;overflow:hidden}
.folga-header-cell{padding:8px 12px;font-size:10px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;border-right:1px solid var(--border)}
.folga-header-cell:last-child{border-right:none}
.folga-func-name{font-weight:600;font-size:13px}
.folga-func-sub{font-size:11px;color:var(--text-muted);margin-top:2px}
.passagem-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:500}
.passagem-aerea{background:#E6F1FB;color:#185FA5}

window._acState={};
function initFuncAutocomplete(inputId,hiddenId,lista){
  window._acState[inputId]=lista;
  const input=document.getElementById(inputId);
  if(input){
    input.dataset.lastVal=input.value;
    input.addEventListener('blur',()=>setTimeout(()=>{const list=document.getElementById(inputId+'-list');if(list)list.classList.remove('show');},150));
  }
}
function funcAutocompleteInput(inputId,hiddenId){
  const lista=window._acState[inputId]||[];
  const input=document.getElementById(inputId);
  const term=(input.value||'').toLowerCase().trim();
  const listEl=document.getElementById(inputId+'-list');
  // Só invalida a seleção anterior se o texto realmente mudou desde a última seleção (evita apagar ao só focar/abrir a lista)
  if(input.value!==input.dataset.lastVal)document.getElementById(hiddenId).value='';
  if(!term){listEl.classList.remove('show');listEl.innerHTML='';return;}
  const matches=lista.filter(f=>(f.nome_completo||'').toLowerCase().includes(term)||(f.matricula||'').toLowerCase().includes(term)).slice(0,30);
  if(!matches.length){
    listEl.innerHTML='<div class="autocomplete-empty">Nenhum funcionário encontrado</div>';
  }else{
    listEl.innerHTML=matches.map(f=>`<div class="autocomplete-item" onclick="selecionarFuncAutocomplete('${inputId}','${hiddenId}','${f.id}')">${(f.matricula||'—')} — ${f.nome_completo}</div>`).join('');
  }
  listEl.classList.add('show');
}
function selecionarFuncAutocomplete(inputId,hiddenId,funcId){
  const lista=window._acState[inputId]||[];
  const f=lista.find(x=>x.id===funcId);
  if(!f)return;
  const input=document.getElementById(inputId);
  input.value=`${f.matricula||'—'} — ${f.nome_completo}`;
  input.dataset.lastVal=input.value;
  document.getElementById(hiddenId).value=f.id;
  document.getElementById(inputId+'-list').classList.remove('show');
}

function formatDate(d){
  if(!d)return'—';
  if(d instanceof Date){if(isNaN(d.getTime()))return'—';return d.toLocaleDateString('pt-BR');}
  const parsed=new Date(d+'T12:00:00');
  if(isNaN(parsed.getTime()))return'—';
  return parsed.toLocaleDateString('pt-BR');
}
function parseDate(str){
  if(!str)return null;
  if(str instanceof Date)return str;
  const d=new Date(str+'T12:00:00');
  return isNaN(d.getTime())?null:d;
}
// Parse Excel serial date (number) to JS Date
function excelSerialToDate(serial){
  if(!serial||isNaN(serial))return null;
  // Excel date serial: days since 1900-01-01, with leap year bug
  const d=new Date(Math.round((serial - 25569)*86400*1000));
  return d;
}
// Parse date string DD/MM/YYYY or excel serial
function parseDPDate(val){
  if(!val)return null;
  if(typeof val==='number') return excelSerialToDate(val);
  if(typeof val==='string'){
    const m=val.match(/(\d{2})\/(\d{2})\/(\d{4})/);
    if(m) return new Date(`${m[3]}-${m[2]}-${m[1]}T12:00:00`);
    const d=new Date(val+'T12:00:00');
    return isNaN(d.getTime())?null:d;
  }
  if(val instanceof Date) return val;
  return null;
}
function toISO(d){
  if(!d)return null;
  const dt=d instanceof Date?d:new Date(d);
  if(isNaN(dt.getTime()))return null;
  return dt.toISOString().split('T')[0];
}

    sb.from('funcionarios').select('*,funcao:funcoes!funcionarios_funcao_id_fkey(nome),empresa:empresas!funcionarios_empresa_id_fkey(nome),obra:obras!funcionarios_obra_id_fkey(nome,codigo),obra_transferencia:obras!funcionarios_obra_transferencia_id_fkey(nome,codigo)').order('nome_completo'),
    sb.from('obras').select('*,empresa:empresas(nome)').order('nome'),
    sb.from('empresas').select('*').order('nome'),
    sb.from('funcoes').select('*').order('nome'),
    sb.from('alojamentos').select('*,obra:obras(nome,codigo)').order('nome'),
    sb.from('movimentacoes_historico').select('*,obra_origem:obras!movimentacoes_historico_obra_origem_id_fkey(nome,codigo),obra_destino:obras!movimentacoes_historico_obra_destino_id_fkey(nome,codigo)').order('data_movimentacao'),
  ]);
  funcionarios=f.data||[];obras=o.data||[];empresas=e.data||[];funcoes=fn.data||[];
  let listaAloj=al.data||[];
  movimentacoesHistorico=mh.data||[];
  if(obrasPermitidasIds){
    obras=obras.filter(o=>obrasPermitidasIds.has(String(o.id)));
    funcionarios=funcionarios.filter(f=>f.obra_id&&obrasPermitidasIds.has(String(f.obra_id)));
    listaAloj=listaAloj.filter(x=>x.obra_id&&obrasPermitidasIds.has(String(x.obra_id)));
  }
  alojamentos=listaAloj;
}

async function loadFolgas(){
  const {data}=await sb.from('folgas').select('*,funcionario:funcionarios(nome_completo,matricula,obra_id,situacao,funcao:funcoes!funcionarios_funcao_id_fkey(nome),obra:obras!funcionarios_obra_id_fkey(nome,codigo))').order('funcionario_id');
  let lista=data||[];
  lista=lista.filter(x=>x.funcionario?.situacao!=='inativo'); // remove demitidos — histórico fica só na aba Demitidos
  if(obrasPermitidasIds){
    const codigosPermitidos=new Set(obras.map(o=>o.codigo));
    lista=lista.filter(x=>x.funcionario?.obra?.codigo&&codigosPermitidos.has(x.funcionario.obra.codigo));
  }
  folgas=lista;
}

async function loadAlojamentos(){
  const [a,c,r]=await Promise.all([
    sb.from('alojamentos').select('*,obra:obras(nome,codigo)').order('nome'),
    sb.from('alojamentos_contas').select('*').order('ano',{ascending:false}).order('mes',{ascending:false}),
    sb.from('alojamentos_relatorios').select('*').order('ano',{ascending:false}).order('mes',{ascending:false}),
  ]);
  let listaAloj=a.data||[],listaContas=c.data||[],listaRel=r.data||[];
  if(obrasPermitidasIds){
    listaAloj=listaAloj.filter(x=>x.obra_id&&obrasPermitidasIds.has(String(x.obra_id)));
    const idsAlojPermitidos=new Set(listaAloj.map(x=>String(x.id)));
    listaContas=listaContas.filter(x=>idsAlojPermitidos.has(String(x.alojamento_id)));
    listaRel=listaRel.filter(x=>idsAlojPermitidos.has(String(x.alojamento_id)));
  }
  alojamentos=listaAloj;alojamentosContas=listaContas;alojamentosRelatorios=listaRel;
}

let currentPage='dashboard';

async function showPage(page){
  const _vindoDeAlerta=window._filtroViaAlerta;
  window._filtroViaAlerta=false;
  if(page==='usuarios'&&currentUser?.perfil!=='admin'){
    showToast('Acesso restrito a administradores','error');
    page='dashboard';
  }
  currentPage=page;
  document.querySelectorAll('.nav-item').forEach(el=>{
    const t=el.textContent.trim().toLowerCase();
    el.classList.toggle('active',
      (page==='dashboard'&&t.includes('dashboard'))||
      (page==='funcionarios'&&t.includes('funcionário'))||
      (page==='experiencia'&&t.includes('experiência'))||
      (page==='treinamentos'&&t.includes('treinamentos'))||
      (page==='folgas'&&t.includes('folga'))||
      (page==='ferias'&&t.includes('férias'))||
      (page==='alojamentos'&&t.includes('alojamento'))||
      (page==='prestadores'&&t.includes('prestador'))||
      (page==='usuarios'&&t.includes('usuário'))||
      (page==='obras'&&t.includes('obra'))||
      (page==='empresas'&&t.includes('empresa'))||
      (page==='fornecedores'&&t.includes('fornecedores'))||
      (page==='contratacoes'&&t.includes('contratações'))||
      (page==='matriz'&&t.includes('matriz'))
    );
  });
  document.getElementById('main-content').innerHTML='<div class="loading"><i class="ti ti-loader ti-spin"></i> Carregando...</div>';
  try{await loadAll();}catch(e){
    document.getElementById('main-content').innerHTML='<div style="padding:40px;color:var(--danger)"><strong>Erro no loadAll:</strong><br>'+e.message+'</div>';
    return;
  }
  populateGlobalObraSelect();
  try{
    if(page==='dashboard')await renderDashboard();
    else if(page==='funcionarios')renderFuncionarios();
    else if(page==='experiencia')renderExperiencia();
    else if(page==='treinamentos'){await loadTreinamentos();renderTreinamentos();}
    else if(page==='folgas')renderFolgas();
    else if(page==='ferias')renderFerias();
    else if(page==='alojamentos'){if(!_vindoDeAlerta)alojFiltroAtivo=null;bannerNaoLancadasAberto=false;bannerFiltroObra='';bannerRelatoriosAberto=false;bannerRelatoriosFiltroObra='';await loadAlojamentos();await loadPrestadores();renderAlojamentos();}
    else if(page==='prestadores'){await loadPrestadores();renderPrestadores();}
    else if(page==='efetivo'){efetivoSituacaoFiltro='';await loadEfetivo();renderEfetivo();}
    else if(page==='usuarios')renderUsuarios();
    else if(page==='obras')renderObras();
    else if(page==='empresas')renderEmpresas();
    else if(page==='fornecedores'){await loadFornecedores();renderFornecedores();}
    else if(page==='contratacoes'){await Promise.all([loadContratacoes(),loadContratacoesVagas(),loadContratacoesProspeccoes()]);renderContratacoes();}
    else if(page==='matriz'){await loadMatriz();renderMatriz();}
  }catch(e){
    console.error('showPage erro em '+page+':',e);
    document.getElementById('main-content').innerHTML='<div style="padding:40px;color:var(--danger)"><i class="ti ti-alert-circle" style="font-size:32px;display:block;margin-bottom:12px"></i><strong>Erro ao carregar página "'+page+'"</strong><br><br><code style="font-size:12px">'+e.message+'</code><br><br><button class="btn" onclick="showPage(\''+page+'\')" >Tentar novamente</button></div>';
  }
}

// ─── DASHBOARD ───────────────────────────────────────────────────────────────
async function renderDashboard(){
  await loadFolgas();
  await loadFerias();
  const hoje=new Date();hoje.setHours(0,0,0,0);
  // Aplicar filtro global de obra em todos os cálculos do dashboard
  const funcsFiltrados=globalObraFiltro?funcionarios.filter(f=>f.obra_id===globalObraFiltro):funcionarios;
  // Transferidos: têm obra_transferencia_id (saíram de alguma obra) — separados dos ativos
  const transferidos=funcsFiltrados.filter(f=>f.obra_transferencia_id).length;
  // Ativos e inativos excluem os transferidos para não dupla-contagem
  const ativos=funcsFiltrados.filter(f=>f.situacao==='ativo'&&!f.obra_transferencia_id).length;
  const inativos=funcsFiltrados.filter(f=>f.situacao==='inativo'&&!f.obra_transferencia_id).length;
  const admMes=funcsFiltrados.filter(f=>{
    if(!f.data_admissao||f.situacao==='transferido')return false;
    const d=new Date(f.data_admissao+'T12:00:00');
    return d.getMonth()===hoje.getMonth()&&d.getFullYear()===hoje.getFullYear();
  }).length;

  const ativosLista=funcionarios.filter(f=>f.situacao==='ativo'&&(!globalObraFiltro||f.obra_id===globalObraFiltro));
  const comExp=ativosLista.map(f=>({...f,_exp:calcExp(f)})).filter(f=>f._exp);
  const emExp=comExp.filter(f=>['exp1','exp2','vencendo'].includes(f._exp.status)).length;
  const expVencendo=comExp.filter(f=>f._exp.status==='vencendo').length;
  const expVencidas=comExp.filter(f=>f._exp.status==='vencida').length;
  const expVenceHoje=comExp.filter(f=>f._exp.restantes===0&&f._exp.status!=='efetivado').length;

  const folgasDash=globalObraFiltro?folgas.filter(f=>String(f.funcionario?.obra_id)===String(globalObraFiltro)):folgas;
  const feriasDash=globalObraFiltro?feriasData.filter(f=>String(f.funcionario?.obra_id)===String(globalObraFiltro)):feriasData;
  let folgasVencidas=0,folgasVencendo=0,folgasProgramadasQtd=0;
  folgasDash.forEach(f=>{
    const vencs=calcVencimentos(f);
    vencs.forEach((v,i)=>{
      const st=vencStatus(v,f[`saida${i+1}_real`],f.periodo_trabalhado);
      if(st==='danger')folgasVencidas++;
      if(st==='warn')folgasVencendo++;
      if(f[`saida${i+1}_programada`]&&!f[`saida${i+1}_real`])folgasProgramadasQtd++;
    });
  });

  // Férias stats
  const {feriasVencidas,feriasVencendo60,feriasProgTotal}=calcFeriasStats(feriasDash,hoje);

  const byObra={};
  ativosLista.forEach(f=>{
    const key=f.obra?.codigo?`${f.obra.codigo} — ${f.obra.nome}`:'Sem obra';
    byObra[key]=(byObra[key]||0)+1;
  });
  const byFuncao={};
  ativosLista.forEach(f=>{
    const key=f.funcao?.nome||f.funcao_manual||'Sem função';
    byFuncao[key]=(byFuncao[key]||0)+1;
  });
  const admissoesMeses=[];
  for(let i=5;i>=0;i--){
    const d=new Date();d.setMonth(d.getMonth()-i);
    const label=d.toLocaleDateString('pt-BR',{month:'short',year:'2-digit'});
    const count=funcionarios.filter(f=>{
      if(!f.data_admissao)return false;
      const fd=new Date(f.data_admissao+'T12:00:00');
      return fd.getMonth()===d.getMonth()&&fd.getFullYear()===d.getFullYear();
    }).length;
    admissoesMeses.push({label,count});
  }
  const maxAdm=Math.max(...admissoesMeses.map(m=>m.count),1);
  // Férias programadas — cálculo antecipado (necessário para alertas)
  const feriasProgramadas=[];
  feriasDash.forEach(f=>{
    if(!f.programado||!f.data_inicio_programada||!f.data_fim_programada)return;
    const ini=parseDate(f.data_inicio_programada);
    const fim=parseDate(f.data_fim_programada);
    if(!ini||!fim)return;
    const diffIni=Math.floor((ini-hoje)/86400000);
    const diffFim=Math.floor((fim-hoje)/86400000);
    if(diffFim>=-7){
      const emCurso=(diffIni<=0&&diffFim>=0);
      feriasProgramadas.push({nome:f.funcionario?.nome_completo||f.matricula,mat:f.matricula,obra:f.funcionario?.obra?.codigo||'',ini,fim,diffIni,diffFim,emCurso,funcId:f.funcionario_id});
    }
  });
  feriasProgramadas.sort((a,b)=>a.diffIni-b.diffIni);
  const feriasProgEmCurso=feriasProgramadas.filter(f=>f.emCurso).length;
  const feriasProgFuturas=feriasProgramadas.filter(f=>!f.emCurso&&f.diffIni>0).length;

  // Alertas de alojamentos
  const alojDash=globalObraFiltro?alojamentos.filter(a=>a.obra_id===globalObraFiltro):alojamentos;
  const contasObrigatorias=['agua','energia','gas','condominio'];
  const mesAtual=hoje.getMonth()+1;const anoAtual=hoje.getFullYear();
  const alojSemContas=alojDash.filter(a=>{
    const contasMesAloj=alojamentosContas.filter(c=>String(c.alojamento_id)===String(a.id)&&c.mes===mesAtual&&c.ano===anoAtual);
    const tiposLancados=new Set(contasMesAloj.map(c=>c.tipo));
    return contasObrigatorias.some(t=>!tiposLancados.has(t)&&!a['isenta_'+t]);
  });
  const qtdAlojSemContas=alojSemContas.length;
  const alojContratosVencidos=alojDash.filter(a=>{const d=parseDate(a.data_termino);return d&&d<hoje;});
  const alojContratosVencendo=alojDash.filter(a=>{const d=parseDate(a.data_termino);if(!d)return false;const diff=Math.floor((d-hoje)/86400000);return diff>=0&&diff<=60;});

  const alertas=[];
  if(expVenceHoje>0)alertas.push({tipo:'danger',icon:'ti-certificate',modulo:'Experiência',destino:'Ver funcionários',msg:`Experiência vence HOJE — decisão necessária`,qtd:expVenceHoje,link:'experiencia',filtroVar:'expFiltro',filtroVal:'vencehoje'});
  if(alojContratosVencidos.length>0)alertas.push({tipo:'danger',icon:'ti-home-off',modulo:'Alojamentos',destino:'Ver alojamentos',msg:`Contrato de alojamento vencido`,qtd:alojContratosVencidos.length,link:'alojamentos',filtroVar:'alojFiltroAtivo',filtroVal:'contratos_vencidos'});
  if(qtdAlojSemContas>0)alertas.push({tipo:'warning',icon:'ti-home-exclamation',modulo:'Alojamentos',destino:'Ver alojamentos',msg:`Contas não lançadas este mês`,qtd:qtdAlojSemContas,link:'alojamentos',filtroVar:'alojFiltroAtivo',filtroVal:'nao_lancadas'});
  if(alojContratosVencendo.length>0)alertas.push({tipo:'warning',icon:'ti-home-clock',modulo:'Alojamentos',destino:'Ver alojamentos',msg:`Contrato vencendo em 60 dias`,qtd:alojContratosVencendo.length,link:'alojamentos',filtroVar:'alojFiltroAtivo',filtroVal:'contratos_vencendo'});
  if(expVencidas>0)alertas.push({tipo:'danger',icon:'ti-certificate',modulo:'Experiência',destino:'Ver funcionários',msg:`Experiência(s) vencida(s)`,qtd:expVencidas,link:'experiencia',filtroVar:'expFiltro',filtroVal:'vencida'});
  if(folgasVencidas>0)alertas.push({tipo:'danger',icon:'ti-beach',modulo:'Folgas de campo',destino:'Ver funcionários',msg:`Folga(s) vencida(s)`,qtd:folgasVencidas,link:'folgas',filtroVar:'folgasFiltro',filtroVal:'danger'});
  if(feriasVencidas>0)alertas.push({tipo:'danger',icon:'ti-palm-tree',modulo:'Férias',destino:'Ver funcionários',msg:`Período(s) de férias vencido(s) — ação legal necessária`,qtd:feriasVencidas,link:'ferias',filtroVar:'feriasFiltro',filtroVal:'vencidas'});
  if(expVencendo>0)alertas.push({tipo:'warning',icon:'ti-certificate',modulo:'Experiência',destino:'Ver funcionários',msg:`Vencendo em 15 dias`,qtd:expVencendo,link:'experiencia',filtroVar:'expFiltro',filtroVal:'vencendo'});
  if(folgasVencendo>0)alertas.push({tipo:'warning',icon:'ti-beach',modulo:'Folgas de campo',destino:'Ver funcionários',msg:`Vencimento próximo`,qtd:folgasVencendo,link:'folgas',filtroVar:'folgasFiltro',filtroVal:'warn'});
  if(feriasVencendo60>0)alertas.push({tipo:'warning',icon:'ti-palm-tree',modulo:'Férias',destino:'Ver funcionários',msg:`Vencendo em 60 dias`,qtd:feriasVencendo60,link:'ferias',filtroVar:'feriasFiltro',filtroVal:'vencendo60'});
  if(feriasProgEmCurso>0)alertas.push({tipo:'info',icon:'ti-plane-departure',modulo:'Férias',destino:'Ver funcionários',msg:`Atualmente em férias`,qtd:feriasProgEmCurso,link:'ferias',filtroVar:'feriasFiltro',filtroVal:'emferias'});
  if(folgasProgramadasQtd>0)alertas.push({tipo:'info',icon:'ti-calendar-event',modulo:'Folgas de campo',destino:'Ver funcionários',msg:`Folga(s) programada(s)`,qtd:folgasProgramadasQtd,link:'folgas',filtroVar:'folgasFiltro',filtroVal:'programadas'});
  if(feriasProgFuturas>0)alertas.push({tipo:'info',icon:'ti-calendar-event',modulo:'Férias',destino:'Ver funcionários',msg:`Férias programada(s) — ainda não iniciadas`,qtd:feriasProgFuturas,link:'ferias',filtroVar:'feriasFiltro',filtroVal:'programado'});

  // ── Pendências agrupadas por obra ──────────────────────────────────────
  // Estrutura: { 'CODIGO — NOME': { obraId, danger:0, warning:0, itens:{ 'chave do tipo de alerta': {tipo,icon,msg,qtd,link,filtroVar,filtroVal} } } }
  const pendObra={};
  const obraKeyDe=o=>o?`${o.codigo||'?'} — ${o.nome||''}`:'Sem obra';
  function addPend(obraKey,tipo,icon,msg,obraId,link,filtroVar,filtroVal){
    if(!obraKey)return;
    if(!pendObra[obraKey])pendObra[obraKey]={obraId:obraId||'',danger:0,warning:0,itens:{}};
    const chave=icon+'|'+msg;
    if(!pendObra[obraKey].itens[chave])pendObra[obraKey].itens[chave]={tipo,icon,msg,qtd:0,link,filtroVar,filtroVal};
    pendObra[obraKey].itens[chave].qtd++;
    pendObra[obraKey][tipo==='danger'?'danger':'warning']++;
  }
  // Alojamentos — contrato vencido / vencendo / contas não lançadas
  alojContratosVencidos.forEach(a=>addPend(obraKeyDe(a.obra),'danger','ti-home-off','Contrato de alojamento vencido',a.obra_id,'alojamentos','alojFiltroAtivo','contratos_vencidos'));
  alojContratosVencendo.forEach(a=>addPend(obraKeyDe(a.obra),'warning','ti-home-clock','Contrato vencendo em 60 dias',a.obra_id,'alojamentos','alojFiltroAtivo','contratos_vencendo'));
  alojSemContas.forEach(a=>addPend(obraKeyDe(a.obra),'warning','ti-home-exclamation','Conta(s) não lançada(s) este mês',a.obra_id,'alojamentos','alojFiltroAtivo','nao_lancadas'));
  // Experiência — vencida / vencendo
  comExp.forEach(f=>{
    if(f._exp.status==='vencida')addPend(obraKeyDe(f.obra),'danger','ti-certificate','Experiência vencida',f.obra_id,'experiencia','expFiltro','vencida');
    if(f._exp.status==='vencendo')addPend(obraKeyDe(f.obra),'warning','ti-certificate','Experiência vencendo em 15 dias',f.obra_id,'experiencia','expFiltro','vencendo');
  });
  // Folgas — vencida / vencendo
  folgasDash.forEach(f=>{
    const vencs=calcVencimentos(f);
    vencs.forEach((v,i)=>{

function calcFeriasStats(data,hoje){
  let feriasVencidas=0,feriasVencendo60=0,feriasProgTotal=0;
  data.forEach(f=>{
    if(f.programado)feriasProgTotal++;
    const limMax=parseDate(f.dt_limite_maxima);
    if(!f.programado&&limMax){
      const diff=Math.floor((limMax-hoje)/86400000);
      if(diff<0)feriasVencidas++;
      else if(diff<=60)feriasVencendo60++;
    }
  });
  return{feriasVencidas,feriasVencendo60,feriasProgTotal};
}

let filtroSituacao='',filtroObra='',busca='';
let filtroObraTocado=false; // true quando o usuário interage manualmente com o select de obra desta página
let filtroFuncaoDash=''; // filtro de função vindo do clique no card do Dashboard

let funcTab='ativos'; // 'ativos' | 'demitidos' | 'transferidos'

function getFuncionariosFiltrados(){
  let lista=funcionarios;
  // Obra efetiva: se o usuário já interagiu com o select local desta página, respeita a escolha dele (mesmo que seja "Todas obras");
  // caso contrário, herda o filtro global do menu lateral
  const obraEfetiva=filtroObraTocado?filtroObra:(filtroObra||globalObraFiltro);
  // Aba ativos: apenas situacao=ativo (nunca transferido, nunca demitido)
  // Aba demitidos: apenas situacao=inativo
  // Aba transferidos: apenas transferido
  if(funcTab==='transferidos'){
    // Histórico: quem SAIU de alguma obra (tem obra_transferencia_id preenchido)
    lista=lista.filter(f=>f.obra_transferencia_id);
    if(obraEfetiva){
      // Na obra X: mostra quem SAIU dela (obra_transferencia_id = X)
      lista=lista.filter(f=>f.obra_transferencia_id===obraEfetiva);
    }
  } else if(funcTab==='demitidos'){
    lista=lista.filter(f=>f.situacao==='inativo');
    if(obraEfetiva)lista=lista.filter(f=>f.obra_id===obraEfetiva);
  } else {
    // Ativos: filtra por obra_id atual — onde o funcionário ESTÁ agora.
    // Inclui também registros antigos com situacao='transferido' que nunca foram corrigidos
    // para 'ativo' — se o obra_id aponta pra cá, o funcionário está ativo NESTA obra hoje.
    lista=lista.filter(f=>f.situacao==='ativo'||f.situacao==='transferido');
    if(obraEfetiva)lista=lista.filter(f=>f.obra_id===obraEfetiva);
  }
  if(busca){const b=busca.toLowerCase();lista=lista.filter(f=>f.nome_completo?.toLowerCase().includes(b)||f.matricula?.toLowerCase().includes(b));}
  if(filtroFuncaoDash){lista=lista.filter(f=>(f.funcao?.nome||f.funcao_manual||'Sem função')===filtroFuncaoDash);}
  return lista;
}

  const dataEmissao=hoje.toLocaleDateString('pt-BR');
  const obraEfetiva=filtroObraTocado?filtroObra:(filtroObra||globalObraFiltro);

  // Usa a mesma lista exibida na tela (respeita aba ativa, busca e obra)
  const lista=getFuncionariosFiltrados();

  if(!lista.length){showToast('Nenhum funcionário para exportar.','error');return;}

  // Título dinâmico conforme filtros ativos
  const obraLabel=obraEfetiva?obras.find(o=>o.id===obraEfetiva)?.codigo||'':'Todas as Obras';
  const situLabel=funcTab==='demitidos'?'Demitidos':funcTab==='transferidos'?'Transferidos':'Ativos';

  const rows=[];
  rows.push([`LISTA DE EFETIVO — GTEL`,'','','','','']);
  rows.push([`Emitido em: ${dataEmissao}  ·  ${obraLabel}  ·  ${situLabel}  ·  ${lista.length} funcionário(s)`,'','','','','']);
  rows.push([]);
  rows.push(['NOME','MATRÍCULA','FUNÇÃO','OBRA / CONTRATO','EMPRESA','ADMISSÃO','INTEGRAÇÃO','SITUAÇÃO']);

  lista.forEach(f=>{
    const funcao=f.funcao?.nome||f.funcao_manual||'—';
    const obra=f.obra?.codigo?`${f.obra.codigo} — ${f.obra.nome||''}`.trim():f.obra?.nome||'—';
    const empresa=f.empresa?.nome||'—';
    const admissao=f.data_admissao?new Date(f.data_admissao+'T12:00:00').toLocaleDateString('pt-BR'):'—';
    const integracao=f.data_mobilizacao?new Date(f.data_mobilizacao+'T12:00:00').toLocaleDateString('pt-BR'):'—';
    const situacao=f.situacao?f.situacao.charAt(0).toUpperCase()+f.situacao.slice(1):'—';
    rows.push([f.nome_completo||'—',f.matricula||'—',funcao,obra,empresa,admissao,integracao,situacao]);
  });

  const ws=XLSX.utils.aoa_to_sheet(rows);
  ws['!cols']=[{wch:36},{wch:12},{wch:30},{wch:30},{wch:36},{wch:14},{wch:14},{wch:14}];
  ws['!merges']=[{s:{r:0,c:0},e:{r:0,c:7}},{s:{r:1,c:0},e:{r:1,c:7}}];

  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Efetivo');

  const sufixo=obraEfetiva?`_${obras.find(o=>o.id===obraEfetiva)?.codigo||'filtro'}`:'';
  XLSX.writeFile(wb,`Efetivo_GTEL${sufixo}_${dataEmissao.replace(/\//g,'-')}.xlsx`);
  showToast(`Excel exportado — ${lista.length} funcionário(s)!`);
}

function exportFichaExcel(id){

  const empresaObj=f.empresa_id?empresas.find(e=>e.id===f.empresa_id):null;
  const exp=calcExp(f);
  const contratoExpStr=(exp&&exp.status!=='efetivado')?'SIM':'';
  const prazoExpStr=exp?(f.periodo_experiencia==='30s'?'30 dias (único)':(f.periodo_experiencia||45)+' + '+(f.periodo_experiencia||45)+' dias'):'';
  const salarioStr=f.salario!=null?'R$ '+Number(f.salario).toLocaleString('pt-BR',{minimumFractionDigits:2}):'';
  const catFuncional=f.tipo_pagamento?f.tipo_pagamento.toUpperCase():'';
  const obraStr=(f.obra?.codigo?f.obra.codigo+' ':'')+(f.obra?.nome||'');

  const NCOLS=6;
  const dados=[];
  const merges=[];
  let r=0;
  function pushRow(){dados.push(new Array(NCOLS).fill(''));return r++;}
  function addField(rowIdx,items){

  function section(labelItems,valueItems){

function onSituacaoChange(){
  const val=document.getElementById('f-situacao').value;
  const block=document.getElementById('transfer-block');
  if(val==='transferido'){block.classList.add('visible');}
  else{block.classList.remove('visible');tipoTransferencia='';
    document.getElementById('transfer-fields').classList.remove('visible');
    document.querySelectorAll('.transfer-tipo-btn').forEach(b=>b.classList.remove('selected-envio','selected-recebimento'));}
  const demBlock=document.getElementById('demissao-block');

function selectTipoTransferencia(tipo){
  tipoTransferencia=tipo;
  document.querySelectorAll('.transfer-tipo-btn').forEach(b=>b.classList.remove('selected-envio','selected-recebimento'));
  document.getElementById('btn-tipo-'+tipo).classList.add('selected-'+tipo);
  const fields=document.getElementById('transfer-fields');const header=document.getElementById('transfer-header');
  fields.classList.add('visible');header.className='transfer-header '+tipo;
  const hint=document.getElementById('f-alojamento-hint');
  if(tipo==='envio'){
    header.innerHTML='<i class="ti ti-arrow-right"></i> Envio — funcionário transferido para outra obra';
    document.getElementById('label-obra-transf').textContent='Obra de Destino';
    document.getElementById('row-mobilizacao').style.display='none';
    document.getElementById('row-desmobilizacao').style.display='flex';
    // Ao enviar para outra obra, o alojamento atual (da obra de origem) vira histórico —
    // a lista de alojamentos passa a refletir a obra de destino (assim que selecionada)
    const func=window._funcEditando;
    const alojAtual=func?.alojamento_id?alojamentos.find(a=>String(a.id)===String(func.alojamento_id)):null;
    if(hint)hint.innerHTML=alojAtual?`<i class="ti ti-info-circle"></i> Alojamento anterior (<strong>${alojAtual.nome}</strong>) será mantido no histórico da transferência. Selecione o alojamento na obra de destino, se já souber.`:'';
    // Data de Integração também é específica da obra de origem — vira histórico e o campo fica em branco
    const integEl=document.getElementById('f-integracao');
    const integHint=document.getElementById('f-integracao-hint');
    if(integEl&&func?.data_mobilizacao&&integEl.value===func.data_mobilizacao){
      integEl.value='';
      if(integHint)integHint.innerHTML=`<i class="ti ti-info-circle"></i> Data anterior (${formatDate(func.data_mobilizacao)}) mantida no histórico. Informe a data de integração na obra nova.`;
    }
  }else{
    header.innerHTML='<i class="ti ti-arrow-left"></i> Recebimento — funcionário recebido de outra obra';
    document.getElementById('label-obra-transf').textContent='Obra de Origem';
    document.getElementById('row-mobilizacao').style.display='flex';
    document.getElementById('row-desmobilizacao').style.display='none';
    if(hint)hint.innerHTML='';
    const integHint2=document.getElementById('f-integracao-hint');
    if(integHint2)integHint2.innerHTML='';
  }
  atualizarAlojamentoPorObra();
}

// Preenche o select de Alojamento apenas com os alojamentos da obra selecionada.
// preselecionarAtual=true (só na abertura do modal): mantém o alojamento atual do funcionário selecionado
// SE ele pertencer à obra escolhida — caso contrário, o campo fica em branco para o administrativo preencher.
function atualizarAlojamentoPorObra(preselecionarAtual){
  const sel=document.getElementById('f-alojamento');
  if(!sel)return;
  const situacaoEl=document.getElementById('f-situacao');
  const emEnvio=situacaoEl?.value==='transferido'&&tipoTransferencia==='envio';
  const obraTransfEl=document.getElementById('f-obra-transf');
  const obraId=(emEnvio&&obraTransfEl?.value)?obraTransfEl.value:document.getElementById('f-obra').value;
  const func=window._funcEditando;
  const candidatos=obraId?alojamentos.filter(a=>String(a.obra_id)===String(obraId)):alojamentos;
  const manterAtual=preselecionarAtual&&!emEnvio&&func?.alojamento_id&&candidatos.some(a=>String(a.id)===String(func.alojamento_id));
  sel.innerHTML='<option value="">— Nenhum —</option>'+candidatos.map(a=>`<option value="${a.id}" ${manterAtual&&String(func.alojamento_id)===String(a.id)?'selected':''}>${a.nome}${a.obra?.codigo?' ('+a.obra.codigo+')':''}</option>`).join('');
}

function editFuncionario(id){

}

async function saveFuncionario(id){
  const mat=document.getElementById('f-matricula').value.trim();
  const nome=document.getElementById('f-nome').value.trim();
  if(!mat||!nome){showToast('Matrícula e nome são obrigatórios','error');return;}
  const matDuplicada=funcionarios.find(f=>String(f.matricula||'').trim()===mat&&String(f.id)!==String(id));
  if(matDuplicada){
    showToast(`Matrícula ${mat} já pertence a ${matDuplicada.nome_completo} (${matDuplicada.situacao||'—'}). Use outra matrícula.`,'error');
    return;
  }
  const isMod=funcaoModoManual;
  let funcaoId=isMod?null:document.getElementById('f-funcao-select').value||null;
  const funcaoManualTexto=isMod?document.getElementById('f-funcao-input').value.trim():null;
  if(isMod&&funcaoManualTexto){
    const existente=funcoes.find(f=>ctrNorm(f.nome)===ctrNorm(funcaoManualTexto));
    if(existente){
      funcaoId=existente.id;
    }else{
      const{data:novaFuncao,error:errFuncao}=await sb.from('funcoes').insert({nome:funcaoManualTexto}).select().single();
      if(errFuncao){showToast('Erro ao salvar função: '+errFuncao.message,'error');return;}
      funcoes.push(novaFuncao);
      funcaoId=novaFuncao.id;
    }
  }
  const funcaoManual=null;
  const situacao=document.getElementById('f-situacao').value;
  const isTransf=situacao==='transferido';
  const isDemitido=situacao==='inativo';
  const tipoTransf=isTransf?tipoTransferencia:'';
  // Na transferência por Envio: o funcionário VAI para outra obra
  //   obra_id = nova obra (destino) → onde está agora
  //   obra_transferencia_id = obra atual (origem) → histórico
  //   situacao = ativo (continua ativo na nova obra)
  // Na transferência por Recebimento: o funcionário VEIO de outra obra
  //   obra_id = obra atual (já preenchida no form, onde está agora)
  //   obra_transferencia_id = obra de origem
  //   situacao = ativo
  const obraTransfId=isTransf?document.getElementById('f-obra-transf').value||null:null;
  const obraAtualId=document.getElementById('f-obra').value||null;
  let obraFinal=obraAtualId;
  let obraOrigem=null;
  if(isTransf&&tipoTransf==='envio'&&obraTransfId){
    obraFinal=obraTransfId;   // vai para a obra de destino
    obraOrigem=obraAtualId;   // registra a obra de origem
  } else if(isTransf&&tipoTransf==='recebimento'&&obraTransfId){
    obraFinal=obraAtualId;    // já está na obra atual
    obraOrigem=obraTransfId;  // veio desta obra
  }
  let fotoUrl=null;
  if(fotoFile){
    const ext=fotoFile.name.split('.').pop();
    const path=`fotos/${Date.now()}.${ext}`;
    const{error:upErr}=await sb.storage.from('funcionarios').upload(path,fotoFile,{contentType:fotoFile.type});
    if(!upErr){const{data:urlData}=sb.storage.from('funcionarios').getPublicUrl(path);fotoUrl=urlData.publicUrl;}
  }else if(id){
    const f=funcionarios.find(x=>x.id===id);
    fotoUrl=f?.foto_url||null;
  }
  // ── Alojamento: o select já vem filtrado pela obra selecionada (atualizarAlojamentoPorObra), então só
  // contém opções válidas para a obra atual/destino. Se o funcionário tinha um alojamento de uma obra
  // diferente da obra final (por transferência, atual ou de edições anteriores), esse alojamento vira
  // histórico em alojamento_origem_id e o campo atual fica em branco até o administrativo preencher.
  const existente=id?funcionarios.find(x=>x.id===id):null;
  const alojamentoSelecionado=document.getElementById('f-alojamento').value||null;
  let alojamentoOrigemId=existente?.alojamento_origem_id||null;
  const alojOrigemManualEl=document.getElementById('f-alojamento-origem-manual');
  if(alojOrigemManualEl){
    // Campo de correção manual visível (funcionário já transferido) — usa o valor escolhido pelo usuário,
    // sobrepondo a detecção automática.
    alojamentoOrigemId=alojOrigemManualEl.value||null;
  } else if(existente?.alojamento_id&&!alojamentoOrigemId){
    const alojAnterior=alojamentos.find(a=>String(a.id)===String(existente.alojamento_id));
    const pertenceAObraFinal=alojAnterior&&String(alojAnterior.obra_id)===String(obraFinal);
    if(!pertenceAObraFinal)alojamentoOrigemId=existente.alojamento_id;
  }
  // ── Data de Integração: mesmo raciocínio do alojamento. Se o funcionário já foi transferido (tem
  // obra_transferencia_id e data_transferencia) e a integração salva é anterior/igual à data da
  // transferência, ela pertence à obra de origem — vira histórico e o campo atual fica em branco
  // (a menos que o próprio usuário já tenha preenchido uma data nova nesta edição).
  let integracaoSelecionada=document.getElementById('f-integracao').value||null;
  let integracaoOrigem=existente?.data_integracao_origem||null;
  if(existente?.data_mobilizacao&&existente?.obra_transferencia_id&&existente?.data_transferencia&&!integracaoOrigem){
    const dTransf=parseDate(existente.data_transferencia);
    const dMob=parseDate(existente.data_mobilizacao);
    if(dTransf&&dMob&&dMob<=dTransf){
      integracaoOrigem=existente.data_mobilizacao;
      if(integracaoSelecionada===existente.data_mobilizacao)integracaoSelecionada=null;
    }
  }
  // ── Histórico de transferência: só é regravado quando o usuário está ATIVAMENTE transferindo
  // nesta edição (isTransf=true). Em qualquer outra edição (ex: trocar salário, alojamento, etc.),
  // preserva o histórico já existente — sem isso, cada edição futura apagava a transferência anterior.
  const transferidoFinal=isTransf?true:(existente?.transferido||false);
  const tipoTransferenciaFinal=isTransf?tipoTransferencia:(existente?.tipo_transferencia||null);
  const obraTransferenciaFinal=isTransf?obraOrigem:(existente?.obra_transferencia_id||null);
  const dataTransferenciaFinal=isTransf?(document.getElementById('f-data-transf').value||null):(existente?.data_transferencia||null);
  const centroCustoTransfFinal=isTransf?(document.getElementById('f-centro-custo').value.trim()||null):(existente?.centro_custo_transferencia||null);
  const dataDesmobFinal=isTransf&&tipoTransferencia==='envio'?(document.getElementById('f-desmobilizacao').value||null):(existente?.data_desmobilizacao||null);
  // ── Detecta se esta é uma movimentação NOVA (diferente da última já registrada), para gravar
  // no histórico (movimentacoes_historico) sem apagar as movimentações anteriores.
  const movimentacaoNova=isTransf&&(
    String(obraTransferenciaFinal||'')!==String(existente?.obra_transferencia_id||'')||
    String(obraFinal||'')!==String(existente?.obra_id||'')||
    String(dataTransferenciaFinal||'')!==String(existente?.data_transferencia||'')||
    String(tipoTransferenciaFinal||'')!==String(existente?.tipo_transferencia||'')
  );
  const payload={
    matricula:mat,nome_completo:nome,
    data_admissao:document.getElementById('f-admissao').value||null,
    data_mobilizacao:integracaoSelecionada,
    data_integracao_origem:integracaoOrigem,
    situacao:isTransf?'ativo':situacao,
    tipo:document.getElementById('f-tipo').value,
    periodo_experiencia:(()=>{const v=document.getElementById('f-periodo-exp').value;return v==='30s'?'30s':parseInt(v);})(),
    salario:document.getElementById('f-salario').value?parseFloat(document.getElementById('f-salario').value):null,
    tipo_pagamento:document.getElementById('f-tipo-pagamento').value||null,
    funcao_id:funcaoId,funcao_manual:funcaoManual,
    empresa_id:document.getElementById('f-empresa').value||null,
    obra_id:obraFinal,
    alojamento_id:alojamentoSelecionado,
    alojamento_origem_id:alojamentoOrigemId,
    cidade:document.getElementById('f-cidade').value.trim()||null,
    uf:document.getElementById('f-uf').value||null,
    observacao_interna:document.getElementById('f-obs').value.trim()||null,
    transferido:transferidoFinal,
    tipo_transferencia:tipoTransferenciaFinal,
    obra_transferencia_id:obraTransferenciaFinal,
    data_transferencia:dataTransferenciaFinal,
    centro_custo_transferencia:centroCustoTransfFinal,
    data_desmobilizacao:dataDesmobFinal,
    data_demissao:isDemitido?document.getElementById('f-data-demissao').value||null:null,
    tipo_demissao:isDemitido?document.getElementById('f-tipo-demissao').value||null:null,
    motivo_demissao:isDemitido?document.getElementById('f-motivo-demissao').value.trim()||null:null,
  };
  if(fotoUrl)payload.foto_url=fotoUrl;
  let idFinal=id;
  let error;
  if(id){
    ({error}=await sb.from('funcionarios').update(payload).eq('id',id));
  }else{
    const{data,error:errIns}=await sb.from('funcionarios').insert(payload).select().single();
    error=errIns;
    if(data)idFinal=data.id;
  }
  if(error){
    if(/funcionarios_matricula_key/.test(error.message)){
      showToast(`Matrícula ${mat} já está em uso por outro funcionário. Verifique e tente novamente.`,'error');
    }else{
      showToast('Erro ao salvar: '+error.message,'error');
    }
    return;
  }
  // ── Registra a movimentação no histórico (nunca sobrescreve movimentações anteriores) ──
  if(movimentacaoNova&&idFinal){
    const{error:errHist}=await sb.from('movimentacoes_historico').insert({
      funcionario_id:idFinal,
      obra_origem_id:obraTransferenciaFinal,
      obra_destino_id:obraFinal,
      tipo:tipoTransferenciaFinal,
      data_movimentacao:dataTransferenciaFinal,
      centro_custo:centroCustoTransfFinal,
      data_desmobilizacao:dataDesmobFinal,
    });
    if(errHist)showToast('Funcionário salvo, mas houve erro ao gravar o histórico de movimentação: '+errHist.message,'error');
    else await carregarMovimentacoesHistorico();
  }
  showToast(id?'Funcionário atualizado!':'Funcionário cadastrado!');
  closeModal('modal-func');showPage('funcionarios');
}

async function carregarMovimentacoesHistorico(){
  const{data}=await sb.from('movimentacoes_historico').select('*,obra_origem:obras!movimentacoes_historico_obra_origem_id_fkey(nome,codigo),obra_destino:obras!movimentacoes_historico_obra_destino_id_fkey(nome,codigo)').order('data_movimentacao');
  movimentacoesHistorico=data||[];
}

// ─── EXPERIÊNCIA ──────────────────────────────────────────────────────────────
let expFiltro='',expBuscaVal='';

function calcExp(f){
  if(!f.data_admissao)return null;
  if(f.efetivado)return{status:'efetivado',restantes:0,fim1:null,fim2:null};
  const admissao=new Date(f.data_admissao+'T12:00:00');
  const periodoRaw=f.periodo_experiencia;
  const unico=periodoRaw==='30s';
  const periodo=unico?30:parseInt(periodoRaw)||45;
  const fim1=new Date(admissao);fim1.setDate(fim1.getDate()+periodo-1);
  const fim2=unico?null:new Date(admissao);if(!unico)fim2.setDate(fim2.getDate()+periodo*2-1);
  const hoje=new Date();hoje.setHours(0,0,0,0);
  const diff1=Math.floor((fim1-hoje)/86400000);
  if(unico){
    if(diff1<0)return{status:'vencida',restantes:diff1,fim1,fim2:null};
    if(diff1<=15)return{status:'vencendo',restantes:diff1,fim1,fim2:null};
    return{status:'exp1',restantes:diff1,fim1,fim2:null};
  }
  const diff2=Math.floor((fim2-hoje)/86400000);
  if(diff2<0)return{status:'vencida',restantes:diff2,fim1,fim2};
  if(diff2<=15)return{status:'vencendo',restantes:diff2,fim1,fim2};
  if(diff1<0)return{status:'exp2',restantes:diff2,fim1,fim2};
  if(diff1===0)return{status:'exp1_hoje',restantes:diff1,fim1,fim2};
  return{status:'exp1',restantes:diff1,fim1,fim2};
}

function renderExperiencia(){
  const ativosLista=funcionarios.filter(f=>f.situacao==='ativo'&&(!globalObraFiltro||f.obra_id===globalObraFiltro));
  const comExp=ativosLista.map(f=>({...f,_exp:calcExp(f)})).filter(f=>f._exp);
  const counts={exp1:0,exp1_hoje:0,exp2:0,vencendo:0,vencida:0,efetivado:0};
  comExp.forEach(f=>counts[f._exp.status]=(counts[f._exp.status]||0)+1);
  counts.vencehoje=comExp.filter(f=>f._exp.restantes===0&&f._exp.status!=='efetivado').length;
  const emExpTotal=(counts.exp1||0)+(counts.exp1_hoje||0)+(counts.exp2||0)+(counts.vencendo||0);
  const taxaEfet=comExp.length?Math.round((counts.efetivado||0)/comExp.length*100):0;
  let lista=comExp;
  if(expFiltro==='emexp')lista=comExp.filter(f=>['exp1','exp1_hoje','exp2','vencendo'].includes(f._exp.status));
  else if(expFiltro==='vencehoje')lista=comExp.filter(f=>f._exp.restantes===0&&f._exp.status!=='efetivado');
  else if(expFiltro&&expFiltro!=='todos')lista=comExp.filter(f=>f._exp.status===expFiltro);
  if(expBuscaVal)lista=lista.filter(f=>(f.nome_completo||'').toLowerCase().includes(expBuscaVal.toLowerCase())||(f.matricula||'').includes(expBuscaVal));
  lista=[...lista].sort((a,b)=>{
    const order={vencida:0,vencendo:1,exp1_hoje:2,exp2:3,exp1:4,efetivado:5};
    const od=(order[a._exp.status]||0)-(order[b._exp.status]||0);
    if(od!==0)return od;
    return(a._exp.restantes||0)-(b._exp.restantes||0);
  });
  const alertas=[];
  if(counts.vencehoje>0)alertas.push(`<div class="exp-alert danger"><i class="ti ti-alarm" style="font-size:24px;flex-shrink:0"></i><div><strong>${counts.vencehoje} experiência(s) vence(m) HOJE</strong><div style="font-size:13px;margin-top:2px">Decisão precisa ser tomada ainda hoje — efetivar ou desligar</div></div></div>`);
  if(counts.vencida>0)alertas.push(`<div class="exp-alert danger"><i class="ti ti-alert-triangle" style="font-size:24px;flex-shrink:0"></i><div><strong>${counts.vencida} experiência(s) vencida(s)</strong><div style="font-size:13px;margin-top:2px">Ação imediata necessária — efetivar ou desligar</div></div></div>`);
  if(counts.vencendo>0)alertas.push(`<div class="exp-alert warning"><i class="ti ti-clock" style="font-size:24px;flex-shrink:0"></i><div><strong>${counts.vencendo} vencendo em 15 dias</strong><div style="font-size:13px;margin-top:2px">Planejar efetivação ou desligamento</div></div></div>`);
  const cardsData=[
    {key:'emexp',label:'Em Exp.',value:emExpTotal,cls:'blue'},
    {key:'vencehoje',label:'Vence Hoje',value:counts.vencehoje||0,cls:'red'},
    {key:'exp1',label:'Exp.1',value:counts.exp1||0,cls:'blue'},
    {key:'exp2',label:'Exp.2',value:counts.exp2||0,cls:'amber'},
    {key:'efetivado',label:'Efetivados',value:counts.efetivado||0,cls:'green'},
    {key:'vencendo',label:'Vencendo',value:counts.vencendo||0,cls:'amber'},
    {key:'vencida',label:'Vencidas',value:counts.vencida||0,cls:'red'},
    {key:'taxa',label:'% Efetivação',value:taxaEfet+'%',cls:'purple',noFilter:true},
  ];
  const cardsHtml=cardsData.map(c=>`
    <div class="exp-card ${c.cls} ${expFiltro===c.key?'active':''}" onclick="${c.noFilter?'':'expFiltro=\''+c.key+'\';renderExperiencia()'}">
      <div class="exp-card-value">${c.value}</div>
      <div class="exp-card-label">${c.label}</div>
    </div>`).join('');
  let tableContent='';
  if(true){

    tableContent=`<div class="table-container"><table>

      <tbody>${rows}</tbody>

  }
  document.getElementById('main-content').innerHTML=`
    <div class="page-header">
      <div><div class="page-title">Controle de Experiência</div><div class="page-subtitle">${comExp.length} colaboradores em acompanhamento</div></div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-sm" onclick="exportExpExcel()"><i class="ti ti-file-type-xls"></i> Excel</button>
        <button class="btn btn-sm btn-success" onclick="exportExpPDF()"><i class="ti ti-file-type-pdf"></i> PDF</button>
      </div>
    </div>
    ${alertas.join('')}
    <div class="exp-cards">${cardsHtml}</div>
    <div style="display:flex;align-items:center;justify-content:flex-end;margin-bottom:12px">
      <div style="display:flex;gap:8px">
        <div class="search-box" style="min-width:180px"><i class="ti ti-search"></i><input placeholder="Buscar..." oninput="expBuscaVal=this.value;if(!_buscaHandlers.exp)_buscaHandlers.exp=makeBuscaHandler(v=>expBuscaVal=v,renderExperiencia,300);_buscaHandlers.exp(this.value);this.focus()" id="exp-search" value="${expBuscaVal}"></div>
        <button class="btn btn-sm" onclick="expFiltro='';expBuscaVal='';renderExperiencia()"><i class="ti ti-x"></i> Limpar</button>
      </div>
