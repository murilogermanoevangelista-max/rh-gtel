function filtrarMoradorCandidatos(q){
  const cont=document.getElementById('add-morador-resultados');
  const lista=window._alojDisponiveis||[];
  const termo=(q||'').trim().toLowerCase();
  const filtrados=termo
    ?lista.filter(f=>(f.nome_completo||'').toLowerCase().includes(termo)||(f.matricula||'').toLowerCase().includes(termo)||(f.cnpj||'').toLowerCase().includes(termo)).slice(0,8)
    :lista.slice(0,8);
  if(!filtrados.length){
    cont.innerHTML='<div style="padding:12px;font-size:12px;color:var(--text-muted)">Nenhum funcionário ou prestador encontrado</div>';
  } else {
    cont.innerHTML=filtrados.map(f=>`
      <div onclick="selecionarMoradorCandidato('${f.id}','${(f.nome_completo||'').replace(/'/g,"\\'")}','${f.matricula||''}','${f._tipo}')"
        style="padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center"
        onmouseover="this.style.background='var(--bg)'" onmouseout="this.style.background=''">
        <div><div style="font-size:13px;font-weight:500">${f.nome_completo}</div><div style="font-size:11px;color:var(--text-muted)">${f._tipo==='funcionario'?`${f.matricula||'—'} · ${f.funcao?.nome||'—'}`:`${f.funcao||'—'} · ${f.razao_social||'—'}`}</div></div>
        <span class="badge" style="background:${f._tipo==='funcionario'?'var(--info-light)':'var(--warning-light)'};color:${f._tipo==='funcionario'?'var(--info)':'var(--warning)'};font-size:9px">${f._tipo==='funcionario'?'FUNCIONÁRIO':'PRESTADOR'}</span>
      </div>`).join('');
  }
  cont.style.display='block';
}

function selecionarMoradorCandidato(id,nome,matricula,tipo){
  window._alojMoradorSelId=id;
  window._alojMoradorSelTipo=tipo;
  document.getElementById('add-morador-busca').value=nome;

async function addMorador(alojId){
  const id=window._alojMoradorSelId;
  const tipo=window._alojMoradorSelTipo;
  if(!id){showToast('Busque e selecione um funcionário ou prestador primeiro','error');return;}
  const tabela=tipo==='prestador'?'prestadores':'funcionarios';
  const{error}=await sb.from(tabela).update({alojamento_id:alojId}).eq('id',id);
  if(error){showToast('Erro: '+error.message,'error');return;}
  showToast((tipo==='prestador'?'Prestador':'Funcionário')+' adicionado ao alojamento!');
  await loadAll();await loadPrestadores();await loadAlojamentos();
  closeModal('modal-moradores');openModalMoradores(alojId);renderAlojamentos();
}

async function removeMorador(id,alojId,nome,tipo){
  if(!confirm(`Remover ${nome} do alojamento?`))return;

}

function openModalContas(alojId,filtroMes,filtroAno,tipoPresel){
  const a=alojamentos.find(x=>String(x.id)===String(alojId));
  const hoje=new Date();
  const mesAtualN=filtroMes?parseInt(filtroMes):hoje.getMonth()+1;
  const anoAtualN=filtroAno?parseInt(filtroAno):hoje.getFullYear();
  const meses=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  const tipos=['agua','energia','gas','condominio','outros'];
  const tiposLabel={agua:'🚿 Água',energia:'⚡ Energia',gas:'🔥 Gás',condominio:'🏢 Condomínio',outros:'📄 Outros'};
  const isentas=new Set(['agua','energia','gas','condominio'].filter(t=>a?.['isenta_'+t]));

  const contasAloj=alojamentosContas.filter(c=>String(c.alojamento_id)===String(alojId)).sort((a,b)=>b.ano-a.ano||b.mes-a.mes);
  const mesesDisp=[];const seen=new Set();
  contasAloj.forEach(c=>{const k=c.ano+'-'+String(c.mes).padStart(2,'0');if(!seen.has(k)){seen.add(k);mesesDisp.push({mes:c.mes,ano:c.ano});}});
  const keyAtual=anoAtualN+'-'+String(mesAtualN).padStart(2,'0');
  if(!seen.has(keyAtual))mesesDisp.unshift({mes:mesAtualN,ano:anoAtualN});
  mesesDisp.sort((a,b)=>b.ano-a.ano||b.mes-a.mes);

  const contasMesSel=contasAloj.filter(c=>c.mes===mesAtualN&&c.ano===anoAtualN);
  const tiposLancadosSel=new Set(contasMesSel.map(c=>c.tipo));

  const statusItems=['agua','energia','gas','condominio'].map(t=>{
    const lanc=tiposLancadosSel.has(t);
    const isento=isentas.has(t);
    const bg=isento?'#F3F4F6':lanc?'var(--success-light)':'#FFF7ED';
    const cor=isento?'var(--text-muted)':lanc?'var(--success)':'#B45309';
    const lbl=(isento?'– ':lanc?'✓ ':'! ')+tiposLabel[t]+(isento?' (isento)':'');
    return '<span style="padding:3px 8px;border-radius:20px;font-size:12px;font-weight:500;background:'+bg+';color:'+cor+'">'+lbl+'</span>';
  }).join('');

  const contasHistoricoHtml=contasMesSel.length?contasMesSel.map(c=>{

    const mesLabel=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'][c.mes-1]||'';
    const enviado=!!(c.adm35_numero&&c.adm35_envio);
    const dataEnvioFmt=c.adm35_envio?c.adm35_envio.split('-').reverse().join('/'):'';
    const admBadge=enviado
      ?'<span style="font-size:11px;background:var(--success-light);color:var(--success);padding:2px 8px;border-radius:20px;font-weight:500">✓ ADM 35 nº '+c.adm35_numero+' · '+dataEnvioFmt+'</span>'
      :'<span style="font-size:11px;background:var(--danger-light);color:var(--danger);padding:2px 8px;border-radius:20px;font-weight:500">❗ Não enviado p/ pagamento</span>';
    return '<div class="conta-row"><div style="display:flex;flex-direction:column;gap:1px"><span>'+tl+'</span><span style="font-size:11px;color:var(--text-muted)">'+mesLabel+'/'+c.ano+'</span></div><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><span style="font-weight:500">'+vl+'</span>'+admBadge+(c.anexo_url?'<a href="'+c.anexo_url+'" target="_blank" class="btn btn-sm btn-info" title="Ver anexo"><i class="ti ti-paperclip"></i></a>':'')+'<button class="btn btn-sm" onclick="editarAdm35Click(this)" data-id="'+c.id+'" data-alojid="'+alojId+'" data-mes="'+mesAtualN+'" data-ano="'+anoAtualN+'" data-num="'+(c.adm35_numero||'')+'" data-data="'+(c.adm35_envio||'')+'" title="Lançar/editar envio ADM 35"><i class="ti ti-send"></i></button><button class="btn btn-sm btn-danger" onclick="deleteConta(\''+c.id+'\',\''+alojId+'\','+mesAtualN+','+anoAtualN+')"><i class="ti ti-trash"></i></button></div></div>';
  }).join(''):'<div style="text-align:center;padding:16px;color:var(--text-muted);font-size:13px">Nenhuma conta lançada neste mês</div>';

  const filtroMesOpts=mesesDisp.map(m=>'<option value="'+m.mes+'" '+(m.mes===mesAtualN&&m.ano===anoAtualN?'selected':'')+'>'+meses[m.mes-1]+'/'+m.ano+'</option>').join('');
  const tipoOpts=tipos.map(t=>'<option value="'+t+'" '+(t===(tipoPresel||'agua')?'selected':'')+'>'+tiposLabel[t]+'</option>').join('');
  const mesLancOpts=meses.map((m,i)=>'<option value="'+(i+1)+'" '+((i+1)===mesAtualN?'selected':'')+'>'+m+'</option>').join('');
  const isentaInfo=isentas.size>0?'<span style="margin-left:auto;font-size:11px;color:var(--text-muted)">Isentos: '+[...isentas].map(t=>tiposLabel[t]).join(', ')+'</span>':'';

  insertModal('modal-contas',`
    <div class="modal" style="max-width:660px">
      <div class="modal-header">
        <span class="modal-title"><i class="ti ti-receipt"></i> Contas — ${a?.nome||''}</span>
        <button class="btn btn-sm" onclick="closeModal('modal-contas')"><i class="ti ti-x"></i></button>
      </div>
      <div class="modal-body">
        <div style="display:flex;gap:8px;align-items:center;margin-bottom:12px">
          <label style="font-size:12px;font-weight:600;color:var(--text-muted)">MÊS</label>
          <select id="c-filtro-mes" style="padding:6px 10px;border:1px solid var(--border);border-radius:var(--radius);font-size:13px" onchange="openModalContas('${alojId}',this.value,document.getElementById('c-filtro-ano').value)">
            ${filtroMesOpts}
          </select>
          <input id="c-filtro-ano" type="number" value="${anoAtualN}" style="width:78px;padding:6px 8px;border:1px solid var(--border);border-radius:var(--radius);font-size:13px" onchange="openModalContas('${alojId}',document.getElementById('c-filtro-mes').value,this.value)">
          ${isentaInfo}
        </div>
        <div style="background:var(--bg);border-radius:var(--radius);padding:10px 12px;margin-bottom:14px;border:1px solid var(--border);display:flex;gap:8px;flex-wrap:wrap;align-items:center">
          <span style="font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;margin-right:4px">Status:</span>
          ${statusItems}
        </div>
        <div style="background:var(--primary-light);border-radius:var(--radius);padding:12px;margin-bottom:16px">
          <div style="font-size:12px;font-weight:600;color:var(--primary-dark);margin-bottom:8px">LANÇAR NOVA CONTA</div>
          <div style="display:grid;grid-template-columns:1fr 1fr 1fr 80px;gap:8px;align-items:flex-end">
            <div class="form-group" style="margin:0"><label>Mês</label>
              <select id="c-mes" style="width:100%;padding:8px;border:1px solid var(--border);border-radius:var(--radius)">
                ${mesLancOpts}
              </select>
            </div>
            <div class="form-group" style="margin:0"><label>Ano</label>
              <input id="c-ano" type="number" value="${anoAtualN}" style="padding:8px;border:1px solid var(--border);border-radius:var(--radius);width:100%">
            </div>
            <div class="form-group" style="margin:0"><label>Tipo</label>
              <select id="c-tipo" style="width:100%;padding:8px;border:1px solid var(--border);border-radius:var(--radius)">
                ${tipoOpts}
              </select>
            </div>
            <div class="form-group" style="margin:0"><label>Valor R$</label>
              <input id="c-valor" type="number" step="0.01" placeholder="0,00" style="padding:8px;border:1px solid var(--border);border-radius:var(--radius);width:100%">
            </div>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:flex-end;margin-top:8px">
            <div class="form-group" style="margin:0"><label>Nº da ADM 35</label>
              <input id="c-adm35-num" type="text" placeholder="Ex: 1234" style="padding:8px;border:1px solid var(--border);border-radius:var(--radius);width:100%">
            </div>
            <div class="form-group" style="margin:0"><label>Data envio ADM 35</label>
              <input id="c-adm35-data" type="date" style="padding:8px;border:1px solid var(--border);border-radius:var(--radius);width:100%">
            </div>
          </div>
          <div class="form-group" style="margin:8px 0 0"><label>📎 Anexar conta (PDF)</label>
            <input type="file" id="c-anexo-file" accept=".pdf" style="width:100%;padding:6px 0;font-size:12px">
          </div>
          <div style="font-size:11px;color:var(--text-muted);margin-top:4px">Pode deixar em branco e lançar depois, clicando em <i class="ti ti-send"></i> na conta já lançada.</div>
          <button class="btn btn-primary btn-sm" style="margin-top:8px" onclick="saveConta('${alojId}')"><i class="ti ti-plus"></i> Lançar</button>
        </div>
        <div id="contas-historico">
          ${contasHistoricoHtml}

      </div>
      <div class="modal-footer"><button class="btn" onclick="closeModal('modal-contas')">Fechar</button></div>

async function saveConta(alojId){
  const mes=parseInt(document.getElementById('c-mes').value);
  const ano=parseInt(document.getElementById('c-ano').value);
  const tipo=document.getElementById('c-tipo').value;
  const valorRaw=document.getElementById('c-valor').value;
  const valor=parseFloat(String(valorRaw).replace(',','.'));
  const adm35Num=(document.getElementById('c-adm35-num').value||'').trim();
  const adm35Data=document.getElementById('c-adm35-data').value||null;
  console.log('[saveConta] alojId=',alojId,'mes=',mes,'ano=',ano,'tipo=',tipo,'valor=',valor,'valorRaw=',valorRaw);
  if(valorRaw===''||isNaN(valor)){showToast('Informe o valor','error');return;}
  if(!alojId||alojId==='undefined'||alojId==='null'){showToast('Erro: ID do alojamento inválido: '+alojId,'error');return;}
  if(!mes||!ano){showToast('Mês/ano inválido: mes='+mes+' ano='+ano,'error');return;}
  let anexoUrl=null;
  const anexoFile=document.getElementById('c-anexo-file')?.files?.[0];
  if(anexoFile){
    showToast('Enviando anexo...');
    const path='contas/'+Date.now()+'_'+anexoFile.name.replace(/[^a-zA-Z0-9._-]/g,'_');
    const{error:upErr}=await sb.storage.from('alojamentos').upload(path,anexoFile,{contentType:'application/pdf',upsert:true});
    if(upErr){showToast('Erro ao enviar anexo: '+upErr.message,'error');return;}
    anexoUrl=sb.storage.from('alojamentos').getPublicUrl(path).data.publicUrl;
  }
  const payload={alojamento_id:alojId,mes,ano,tipo,valor:Number(valor),adm35_numero:adm35Num||null,adm35_envio:adm35Data,anexo_url:anexoUrl};
  console.log('[saveConta] payload=',JSON.stringify(payload));
  const res=await sb.from('alojamentos_contas').insert(payload);
  console.log('[saveConta] res=',res);
  if(res.error){
    console.error('Erro saveConta:',res.error);
    showToast('Erro: '+res.error.message+' | code: '+res.error.code,'error');
    return;
  }
  showToast('Conta lançada! ✓');
  await loadAlojamentos();
  closeModal('modal-contas');

async function saveRelatorio(alojId){
  const mes=parseInt(document.getElementById('r-mes').value);
  const ano=parseInt(document.getElementById('r-ano').value);
  const avaliador=(document.getElementById('r-avaliador').value||'').trim();
  const dataAvaliacao=document.getElementById('r-data-avaliacao').value||null;
  const dataRecebimento=document.getElementById('r-data-recebimento').value||toISO(new Date());
  const obs=(document.getElementById('r-obs').value||'').trim();
  if(!alojId||alojId==='undefined'||alojId==='null'){showToast('Erro: ID do alojamento inválido: '+alojId,'error');return;}
  if(!mes||!ano){showToast('Mês/ano inválido: mes='+mes+' ano='+ano,'error');return;}
  let anexoUrl=null;
  const anexoFile=document.getElementById('r-anexo-file')?.files?.[0];
  if(anexoFile){
    showToast('Enviando anexo...');
    const path='relatorios/'+Date.now()+'_'+anexoFile.name.replace(/[^a-zA-Z0-9._-]/g,'_');
    const{error:upErr}=await sb.storage.from('alojamentos').upload(path,anexoFile,{contentType:'application/pdf',upsert:true});
    if(upErr){showToast('Erro ao enviar anexo: '+upErr.message,'error');return;}
    anexoUrl=sb.storage.from('alojamentos').getPublicUrl(path).data.publicUrl;
  }
  const payload={alojamento_id:alojId,mes,ano,avaliador:avaliador||null,data_avaliacao:dataAvaliacao,data_recebimento:dataRecebimento,observacoes:obs||null,anexo_url:anexoUrl};
  const res=await sb.from('alojamentos_relatorios').insert(payload);
  if(res.error){
    console.error('Erro saveRelatorio:',res.error);
    showToast('Erro: '+res.error.message+' | code: '+res.error.code,'error');
    return;
  }
  showToast('Relatório ADM 31 lançado! ✓');
  await loadAlojamentos();
  closeModal('modal-relatorios');
  openModalRelatorios(alojId,mes,ano);
  renderAlojamentos();
}

async function importarHE(file){
  if(!file)return;
  showToast('Importando H.E...');
  try{
    // Kairos exporta XLS como HTML disfarçado — precisamos detectar e tratar os dois formatos
    const buf=await file.arrayBuffer();
    const rawText=new TextDecoder('utf-8').decode(buf);
    const isHTML=rawText.trimStart().startsWith('\uFEFF<html')||rawText.trimStart().startsWith('<html');

    let rows=[];

    if(isHTML){
      // Parsear HTML do Kairos: <table> com colunas
      // Data | Nome | Matrícula | Estrutura | Ocorrência | Horas | Abono | Justificativa | ...
      const parser=new DOMParser();
      const doc=parser.parseFromString(rawText,'text/html');
      const trs=doc.querySelectorAll('tr');
      trs.forEach(tr=>{
        const cells=[...tr.querySelectorAll('td,th')].map(td=>td.textContent.trim());
        rows.push(cells);
      });
    } else {
      const{read,utils}=await import('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/+esm');
      const wb=read(buf,{type:'array'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      rows=utils.sheet_to_json(ws,{header:1,defval:''});
    }

    // Encontrar linha de cabeçalho
    let hi=rows.findIndex(r=>r.some(c=>String(c).toLowerCase().includes('matrícula')||String(c).toLowerCase().includes('matricula')));
    if(hi<0)hi=rows.findIndex(r=>r.some(c=>String(c).toLowerCase().includes('nome')));
    if(hi<0){showToast('Formato não reconhecido','error');return;}

    // Detectar período: buscar data no título/cabeçalho do HTML ou nas linhas de dados
    let dataISO='';
    for(let i=0;i<hi;i++){
      const row=rows[i]||[];
      for(let j=0;j<row.length;j++){
        const cell=String(row[j]||'');
        const m=cell.match(/(\d{2})\/(\d{2})\/(\d{4})/);
        if(m){dataISO=m[3]+'-'+m[2]+'-'+m[1];break;}
      }
      if(dataISO)break;
    }

    // Converter horas no formato HH:MM ou fração de dia para minutos
    function parseHoras(v){
      if(!v||v===''||v==='00:00')return 0;
      const s=String(v).trim();
      // Formato texto "HH:MM"
      const mHM=s.match(/^(\d+):(\d{2})$/);
      if(mHM)return parseInt(mHM[1])*60+parseInt(mHM[2]);
      // Fração de dia (Excel numérico)
      const n=parseFloat(s);
      if(!isNaN(n)&&n>0&&n<5)return Math.round(n*24*60);
      return 0;
    }

    // Converter data DD/MM/YYYY para ISO
    function parseDataLinha(v){
      const s=String(v||'').trim();
      const m=s.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
      if(m)return m[3]+'-'+m[2]+'-'+m[1];
      // Serial Excel
      if(typeof v==='number'&&v>40000&&v<60000){
        const d=new Date(Math.round((v-25569)*86400000));
        return d.toISOString().slice(0,10);
      }
      return dataISO||new Date().toISOString().slice(0,10);
    }

    if(!dataISO){
      // Usar a data da primeira linha de dados como período de referência
      for(let i=hi+1;i<rows.length;i++){
        const d=parseDataLinha(rows[i][0]);
        if(d){dataISO=d;break;}
      }
    }
    if(!dataISO)dataISO=new Date().toISOString().slice(0,10);
    console.log('[importarHE] data referência:',dataISO);

    const regs=[];
    rows.slice(hi+1).forEach(r=>{
      const dataVal=r[0];
      const nome=String(r[1]||'').trim();
      const mat=String(r[2]||'').trim();
      const tipo=String(r[4]||'').trim(); // Ocorrência
      const horasVal=r[5]; // Horas

      if(!mat||!nome||!tipo||!tipo.toLowerCase().includes('hora extra'))return;

      const linhaData=parseDataLinha(dataVal)||dataISO;
      const mins=parseHoras(horasVal);
      if(mins<=0)return;

      // Normalizar tipo: "Hora Extra 60%" → "HE 60%", "Hora Extra 100%" → "HE 100%", etc.
      const tipoNorm=tipo.replace(/^Hora Extra\s*/i,'HE ').trim();

      regs.push({
        data:linhaData,
        periodo_ini:dataISO,
        matricula:mat,
        nome:nome.toUpperCase(),
        tipo:tipoNorm,
        mins,
      });
    });

    if(!regs.length){showToast('Nenhum registro de H.E. encontrado','error');return;}

    // Deletar registros de TODAS as datas presentes no arquivo
    // (não só por periodo_ini, para evitar duplicatas entre imports com datas de referência diferentes)
    const datasNoArquivo=[...new Set(regs.map(r=>r.data))];
    for(const d of datasNoArquivo){
      await sb.from('efetivo_he').delete().eq('data',d);
    }
    // Também limpar por periodo_ini por segurança (imports antigos)
    await sb.from('efetivo_he').delete().eq('periodo_ini',dataISO);

    for(let i=0;i<regs.length;i+=500){
      const{error}=await sb.from('efetivo_he').insert(regs.slice(i,i+500));
      if(error){showToast('Erro: '+error.message,'error');return;}
    }

    const totalMins=regs.reduce((s,r)=>s+r.mins,0);
    const hh=Math.floor(totalMins/60),mm=totalMins%60;
    showToast('H.E. importadas! '+regs.length+' registros · Total: '+String(hh).padStart(3,'0')+':'+String(mm).padStart(2,'0'));
    efetivoViewMode='he';
    await loadEfetivo();renderEfetivo();
  }catch(e){showToast('Erro: '+e.message,'error');console.error(e);}
}

async function importarHoras(file){
  if(!file)return;
  showToast('Importando horas...');
  try{
    const{read,utils}=await import('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/+esm');
    const buf=await file.arrayBuffer();
    const wb=read(buf,{type:'array'});
    const ws=wb.Sheets[wb.SheetNames[0]];
    const rows=utils.sheet_to_json(ws,{header:1,defval:''});

    // Buscar data do PERÍODO (não do título) — priorizar linha com "Período de:"
    let dataISO='';
    // 1ª prioridade: linha que contém "Período de:" ou "periodo"
    for(let i=0;i<10;i++){
      const row=rows[i]||[];
      for(let j=0;j<row.length;j++){
        const cell=String(row[j]||'').toLowerCase();
        if(cell.includes('período de')||cell.includes('periodo de')){
          const m=cell.match(/(\d{2})\/(\d{2})\/(\d{4})/);
          if(m){dataISO=m[3]+'-'+m[2]+'-'+m[1];break;}
        }
      }
      if(dataISO)break;
    }
    // 2ª prioridade: coluna Data nas linhas de dados (serial Excel)
    if(!dataISO){
      for(let i=5;i<rows.length;i++){
        const row=rows[i]||[];
        if(!row[0]||isNaN(Number(row[0])))continue;
        for(let j=0;j<row.length;j++){
          if(typeof row[j]==='number'&&row[j]>40000&&row[j]<55000){
            const d=new Date(Math.round((row[j]-25569)*86400000));
            dataISO=d.toISOString().slice(0,10);break;
          }
        }
        if(dataISO)break;
      }
    }
    if(!dataISO)dataISO=new Date().toISOString().slice(0,10);
    console.log('[importarHoras] dataISO detectada:',dataISO);

    // Encontrar linha de dados (tem matrícula numérica na col 0)
    function parseMins(v){
      if(!v||v==='000:00'||v==='0')return 0;
      const s=String(v).trim();
      const parts=s.split(':');
      if(parts.length===2)return parseInt(parts[0]||0)*60+parseInt(parts[1]||0);
      return 0;
    }

    const regs=[];
    rows.forEach(r=>{
      const mat=String(r[0]||'').trim();
      if(!mat||isNaN(Number(mat)))return;
      const nome=String(r[1]||'').trim().toUpperCase();
      if(!nome)return;
      regs.push({
        data:dataISO,
        matricula:mat,
        nome,
        departamento:String(r[2]||'').trim(),
        mins_a_trabalhar:parseMins(r[3]),
        mins_trabalhadas:parseMins(r[4]),
        mins_descontos:parseMins(r[5]),
        mins_justificadas:parseMins(r[6]),
      });
    });

    if(!regs.length){showToast('Nenhum registro de horas encontrado','error');return;}
    await sb.from('efetivo_horas').delete().eq('data',dataISO);
    for(let i=0;i<regs.length;i+=500){
      const{error}=await sb.from('efetivo_horas').insert(regs.slice(i,i+500));
      if(error){showToast('Erro: '+error.message,'error');return;}
    }
    showToast('Horas importadas! '+regs.length+' registros · '+dataISO.split('-').reverse().join('/'));
    efetivoViewMode='horas';
    await loadEfetivo();renderEfetivo();
  }catch(e){showToast('Erro ao importar: '+e.message,'error');}
}

async function importarEfetivo(file){
  if(!file)return;
  showToast('Importando...');
  try{
    // Kairos às vezes exporta um .xls que na verdade é HTML disfarçado — detecta os dois formatos,
    // igual já fazemos na importação de Horas Extras.
    const buf=await file.arrayBuffer();
    const rawText=new TextDecoder('utf-8').decode(buf);
    const isHTML=rawText.trimStart().startsWith('\uFEFF<html')||rawText.trimStart().startsWith('<html')||/<table/i.test(rawText.slice(0,2000));

    let rows=[];
    if(isHTML){
      const parser=new DOMParser();
      const doc=parser.parseFromString(rawText,'text/html');
      doc.querySelectorAll('tr').forEach(tr=>{
        rows.push([...tr.querySelectorAll('td,th')].map(td=>td.textContent.trim()));
      });
    }else{
      const{read,utils}=await import('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/+esm');
      const wb=read(buf,{type:'array'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      rows=utils.sheet_to_json(ws,{header:1,defval:''});
    }

    let hi=rows.findIndex(r=>String(r[0]||'').toLowerCase().includes('cracha')||String(r[0]||'').toLowerCase().includes('crachá'));
    if(hi<0)hi=rows.findIndex(r=>r.length>=4&&r[0]&&r[1]);
    if(hi<0){showToast('Formato não reconhecido','error');return;}
    const dr=rows.slice(hi+1).filter(r=>r[0]&&r[1]);
    if(!dr.length){showToast('Nenhum registro encontrado','error');return;}

    // Extrai data DD/MM/AAAA via regex (ignora hora junto e não depende de split ingênuo por '/')
    function extrairDataDDMMAAAA(v){
      if(v==null||v==='')return null;
      if(typeof v==='number'){const d=new Date(Math.round((v-25569)*86400000));return d.toISOString().slice(0,10);}
      const s=String(v);
      const m=s.match(/(\d{2})\/(\d{2})\/(\d{4})/);
      if(m)return m[3]+'-'+m[2]+'-'+m[1];
      return null;
    }
    // Primeiro tenta achar a data no título/cabeçalho (linhas antes do header da tabela) — mais confiável.
    let dataISO=null;
    for(let i=0;i<hi&&!dataISO;i++){
      const row=rows[i]||[];
      for(let j=0;j<row.length&&!dataISO;j++)dataISO=extrairDataDDMMAAAA(row[j]);
    }
    // Se não achou, tenta a coluna Data (índice 3) da primeira linha de dados.
    if(!dataISO)dataISO=extrairDataDDMMAAAA(dr[0][3]);
    if(!dataISO)dataISO=new Date().toISOString().slice(0,10);

    const regs=[];
    // Ler diretamente da planilha — col 6 = Situações (PRESENTE/AUSENTE)
    dr.forEach(r=>{
      const mat=String(r[0]||'').trim(),nome=String(r[1]||'').trim();
      if(!mat||!nome)return;
      const situacaoRaw=String(r[6]||'').trim().toUpperCase();
      const marcacoes=String(r[5]||'').trim();
      // Se tem marcação de ponto = PRESENTE, independente da coluna situação
      const temMarcacao=marcacoes&&marcacoes!=='-'&&marcacoes!=='';
      const situacao=temMarcacao?'PRESENTE':(situacaoRaw==='AUSENTE'?'AUSENTE':(situacaoRaw==='PRESENTE'?'PRESENTE':'AUSENTE'));
      regs.push({
        data:dataISO,
        cracha:mat,
        nome:nome.toUpperCase(),
        departamento:String(r[2]||'').trim(),
        situacao,
        horario_entrada:String(r[4]||'')||null,
        marcacoes:temMarcacao?marcacoes:null,
      });
    });
    if(!regs.length){showToast('Nenhum registro para importar','error');return;}
    await sb.from('efetivo_presenca').delete().eq('data',dataISO);
    for(let i=0;i<regs.length;i+=500){
      const{error}=await sb.from('efetivo_presenca').insert(regs.slice(i,i+500));
      if(error){showToast('Erro: '+error.message,'error');return;}
    }
    const np=regs.filter(r=>r.situacao==='PRESENTE').length,na=regs.filter(r=>r.situacao==='AUSENTE').length;
    showToast('Importado! '+np+' presentes · '+na+' ausentes · '+dataISO.split('-').reverse().join('/'));
    efetivoDataFiltro=dataISO;
    await loadEfetivo();renderEfetivo();
  }catch(e){showToast('Erro ao importar: '+e.message,'error');}
}

function exportarEfetivoExcel(tipo){
  // Coletar dados da tabela ativa
  const tabela=document.querySelector('#main-content table');
  if(!tabela){showToast('Nenhum dado para exportar','error');return;}
  const rows=[...tabela.querySelectorAll('tr')];
  const data=rows.map(r=>[...r.querySelectorAll('th,td')].map(c=>c.innerText.trim()));
  // Montar CSV
  const csv=data.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
  const bom='\uFEFF';
  const blob=new Blob([bom+csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  const hoje=new Date().toISOString().slice(0,10);
  a.href=url;a.download='efetivo_'+tipo+'_'+hoje+'.csv';
  document.body.appendChild(a);a.click();
  document.body.removeChild(a);URL.revokeObjectURL(url);
  showToast('Exportado com sucesso!');
}

function exportarHEDetalhado(){
  // Buscar dados filtrados (mesma lógica da view HE)
  const heFiltroPeriodo=window._heFiltroPeriodo||'acumulado';
  const heFiltroDe=window._heFiltroDe||'';
  const heFiltroAte=window._heFiltroAte||'';

  let heFiltradas=globalObraFiltro
    ?efetivoHE.filter(h=>{const f=funcionarios.find(x=>{const fm=String(x.matricula||'').trim().replace(/^0+/,'');return fm===String(h.matricula||'').trim().replace(/^0+/,'');});return f&&f.obra_id===globalObraFiltro;})
    :efetivoHE;

  if(heFiltroPeriodo==='periodo'&&heFiltroDe&&heFiltroAte){
    heFiltradas=heFiltradas.filter(h=>h.data>=heFiltroDe&&h.data<=heFiltroAte);
  }

  if(!heFiltradas.length){showToast('Nenhum dado para exportar','error');return;}

  // Filtrar registros com horas zeradas (dados corrompidos de imports anteriores)
  const comHoras=heFiltradas.filter(h=>(h.mins||0)>0);
  const semHoras=heFiltradas.length-comHoras.length;
  if(semHoras>0)console.warn(`[exportHE] ${semHoras} registros com mins=0 ignorados`);
  heFiltradas=comHoras;
  if(!heFiltradas.length){showToast('Dados com horas zeradas — reimporte o arquivo H.E.','error');return;}

  // Ordenar por data e nome
  heFiltradas=[...heFiltradas].sort((a,b)=>{
    const dc=a.data.localeCompare(b.data);
    if(dc!==0)return dc;
    return(a.nome||'').localeCompare(b.nome||'','pt-BR',{sensitivity:'base'});
  });

  // Montar cabeçalho do período
  const datas=heFiltradas.map(h=>h.data).sort();
  const deStr=datas[0]?datas[0].split('-').reverse().join('/'):'';
  const ateStr=datas[datas.length-1]?datas[datas.length-1].split('-').reverse().join('/'):'';
  const periodoLabel=heFiltroPeriodo==='periodo'&&heFiltroDe
    ?`Período: ${deStr} a ${ateStr}`
    :`Período: ${deStr} a ${ateStr} (Acumulado)`;

  // Função para formatar horas (mins → HH:MM)
  function fmtH(m){if(!m)return'00:00';return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');}

  // Função para buscar estrutura organizacional (obra) do funcionário
  function getEstrutura(mat){
    const f=funcionarios.find(x=>{const fm=String(x.matricula||'').trim().replace(/^0+/,'');return fm===String(mat||'').trim().replace(/^0+/,'');});
    return f?.obra?.nome||'—';
  }

  // Montar linhas
  const headerPeriodo=[periodoLabel,'','','','','','','','',''];
  const cabecalho=['Data','Nome','Matrícula','Estrutura Organizacional','Ocorrência','Horas','Abono','Justificativa','Transferência B.H','CID'];
  const linhas=heFiltradas.map(h=>{
    const dataFmt=h.data?h.data.split('-').reverse().join('/'):'';
    // Normalizar tipo de volta: "HE 60%" → "Hora Extra 60%"
    const tipoFmt=(h.tipo||'').replace(/^HE\s*/i,'Hora Extra ');
    return[
      dataFmt,
      h.nome||'—',
      h.matricula||'—',
      getEstrutura(h.matricula),
      tipoFmt,
      fmtH(h.mins||0),
      '00:00','00:00','','',
    ];
  });

  const todasLinhas=[headerPeriodo,cabecalho,...linhas];

  // Exportar como XLSX
  import('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/+esm').then(({utils,writeFile})=>{
    const ws=utils.aoa_to_sheet(todasLinhas);
    // Larguras
    ws['!cols']=[{wch:14},{wch:32},{wch:12},{wch:28},{wch:20},{wch:10},{wch:10},{wch:14},{wch:18},{wch:6}];
    const wb=utils.book_new();
    utils.book_append_sheet(wb,ws,'H. Extras');
    const hoje=new Date().toLocaleDateString('pt-BR').replace(/\//g,'-');
    writeFile(wb,`HE_${hoje}.xlsx`);
    showToast('Excel exportado!');
  }).catch(e=>showToast('Erro ao exportar: '+e.message,'error'));
}

async function togglePresencaPrestador(prestadorId,data){
  const reg=prestadoresPresenca.find(x=>x.prestador_id===prestadorId&&x.data===data);
  // Lógica: default = PRESENTE (sem registro). Clicar → AUSENTE. Clicar de novo → remove (volta PRESENTE)
  if(reg&&reg.situacao==='AUSENTE'){
    // Estava ausente → volta para presente (deleta o registro)
    await sb.from('prestadores_presenca').delete().eq('id',reg.id);
  } else if(!reg){
    // Estava presente (sem registro) → marca ausente
    await sb.from('prestadores_presenca').insert({prestador_id:prestadorId,data,situacao:'AUSENTE'});
  }
  await renderEfetivo();
}

async function editarMarcacao(id,valorAtual,btn){
  const novo=prompt('Horário de marcação (ex: 07:23):',valorAtual||'');
  if(novo===null)return;

  // Ausente sintético — não existe no banco ainda, precisa criar
  if(String(id).startsWith('_sint_')){
    const funcId=id.replace('_sint_','');
    const func=funcionarios.find(f=>f.id===funcId);
    if(!func){showToast('Funcionário não encontrado','error');return;}
    const ds=efetivoDataFiltro||new Date().toISOString().slice(0,10);
    const{data,error}=await sb.from('efetivo_presenca').insert({
      data:ds,
      cracha:String(func.matricula||'').trim(),
      nome:(func.nome_completo||func.nome||'').toUpperCase(),
      departamento:func.obra?.nome||'',
      situacao:'PRESENTE',
      horario_entrada:null,
      marcacoes:novo||null,
    }).select().single();
    if(error){showToast('Erro: '+error.message,'error');return;}
    // Atualizar local e recarregar
    showToast('Marcação lançada! Funcionário marcado como presente.');
    await loadEfetivo();renderEfetivo();
    return;
  }

  // Registro existente — atualizar
  const{error}=await sb.from('efetivo_presenca').update({
    marcacoes:novo||null,
    situacao:'PRESENTE',
  }).eq('id',id);
  if(error){showToast('Erro: '+error.message,'error');return;}
  const el=document.getElementById('marc-'+id);
  if(el)el.textContent=novo||'—';
  showToast('Marcação atualizada!');
  const rec=efetivoData.find(r=>r.id===id);
  if(rec){rec.marcacoes=novo||null;rec.situacao='PRESENTE';}
}

async function renderEfetivo(){
  await loadPrestadores();
  // Carregar presenças manuais de prestadores para a data selecionada
  const _dataPrest=efetivoDataFiltro||new Date().toISOString().slice(0,10);
  const{data:ppData}=await sb.from('prestadores_presenca').select('*').eq('data',_dataPrest);
  prestadoresPresenca=ppData||[];
  renderEfetivoLocal();
}
function renderEfetivoLocal(){
  function normMat(v){return String(v||'').trim().replace(/^0+/,'');}

  // ── Determinar data ─────────────────────────────────────────────────────
  const _todasDatas=[...new Set(efetivoData.map(r=>r.data))].sort((a,b)=>b.localeCompare(a));
  if(!efetivoDataFiltro&&_todasDatas.length)efetivoDataFiltro=_todasDatas[0];
  if(_todasDatas.length&&!_todasDatas.includes(efetivoDataFiltro))efetivoDataFiltro=_todasDatas[0];
  const ds=efetivoDataFiltro;

  // ── Filtrar por obra ────────────────────────────────────────────────────
  let efetivoFiltrado;
  if(globalObraFiltro){
    const funcsObra=funcionarios.filter(f=>f.obra_id===globalObraFiltro&&f.situacao!=='inativo');
    const crachasObra=new Set(funcsObra.map(f=>normMat(f.matricula)));
    const presentesDia=efetivoData.filter(r=>r.data===ds&&r.situacao==='PRESENTE'&&crachasObra.has(normMat(r.cracha)));
    const crachasPresentes=new Set(presentesDia.map(r=>normMat(r.cracha)));
    const temImportacaoDia=efetivoData.some(r=>r.data===ds);
    const ausentesSinteticos=temImportacaoDia
      ?funcsObra.filter(f=>!crachasPresentes.has(normMat(f.matricula))).map(f=>({
          id:'_sint_'+f.id,data:ds,cracha:String(f.matricula||'').trim(),
          nome:(f.nome_completo||f.nome||'').toUpperCase(),departamento:f.obra?.nome||'',
          situacao:'AUSENTE',horario_entrada:null,marcacoes:null}))
      :[];
    // Prestadores ativos da obra — situação baseada no registro manual do dia
    const prestObra=prestadores.filter(p=>p.obra_id===globalObraFiltro&&p.situacao==='ativo');
    const prestSint=prestObra.map(p=>{
      const reg=prestadoresPresenca.find(x=>x.prestador_id===p.id);
      const sit=reg?reg.situacao:'PRESENTE';
      return{id:'_prest_'+p.id,data:ds,cracha:'PREST',nome:(p.nome_completo||'').toUpperCase(),
        departamento:p.funcao||'Prestador',situacao:sit,horario_entrada:null,marcacoes:null,
        _prestador:true,_prestadorId:p.id,_funcao:p.funcao};
    });
    efetivoFiltrado=[...presentesDia,...ausentesSinteticos,...prestSint];
  } else {
    const temImportacaoDia=efetivoData.some(r=>r.data===ds);
    if(temImportacaoDia){
      const presentesDiaGeral=efetivoData.filter(r=>r.data===ds&&r.situacao==='PRESENTE');
      const crachasPresentesGeral=new Set(presentesDiaGeral.map(r=>normMat(r.cracha)));
      const ausentesGeral=funcionarios.filter(f=>f.situacao!=='inativo'&&!crachasPresentesGeral.has(normMat(f.matricula)))
        .map(f=>({id:'_sint_'+f.id,data:ds,cracha:String(f.matricula||'').trim(),
          nome:(f.nome_completo||f.nome||'').toUpperCase(),departamento:f.obra?.nome||'',
          situacao:'AUSENTE',horario_entrada:null,marcacoes:null}));
      // Todos os prestadores ativos — situação baseada no registro manual do dia
      const prestSintGeral=prestadores.filter(p=>p.situacao==='ativo').map(p=>{
        const reg=prestadoresPresenca.find(x=>x.prestador_id===p.id);
        const sit=reg?reg.situacao:'PRESENTE';
        return{id:'_prest_'+p.id,data:ds,cracha:'PREST',nome:(p.nome_completo||'').toUpperCase(),
          departamento:p.funcao||'Prestador',situacao:sit,horario_entrada:null,marcacoes:null,
          _prestador:true,_prestadorId:p.id,_funcao:p.funcao};
      });
      efetivoFiltrado=[...presentesDiaGeral,...ausentesGeral,...prestSintGeral];
    } else {
      efetivoFiltrado=efetivoData;
    }
  }

  // ── Dados do dia ────────────────────────────────────────────────────────

function ctrAddDiasUteis(dataISO,dias){
  if(!dataISO)return null;
  const d=new Date(dataISO+'T12:00:00');
  let restantes=dias;
  while(restantes>0){
    d.setDate(d.getDate()+1);
    const dow=d.getDay();
    if(dow!==0&&dow!==6)restantes--;
  }
  return toISO(d);
}
function ctrFmtData(iso){
  return iso?iso.split('-').reverse().join('/'):'—';
}
function ctrHojeISO(){return toISO(new Date());}

function ctrDocsPct(c){
  const docs=c.documentos||{};
  const isentos=DOCS_CONTRATACAO.filter(([k])=>docs[k]==='isento').length;
  const done=DOCS_CONTRATACAO.filter(([k])=>docs[k]==='ok'||docs[k]===true).length;
  const total=DOCS_CONTRATACAO.length-isentos;
  return{done,total,pct:total?Math.round(done/total*100):100};
}

function ctrExameJaOcorreu(c){
  // O exame é considerado "realizado" quando o resultado já foi confirmado manualmente
  // OU quando a data agendada do exame já chegou/passou (mesmo sem o resultado lançado ainda).
  if(c.data_resultado_exame)return true;
  if(!c.data_exame)return false;
  return c.data_exame<=ctrHojeISO();
}

function ctrStatusInfo(status){

async function ctrAutoSyncProspeccoes(){
  // Se o candidato já foi lançado em "Candidatos" (circuito de processo), o contato de
  // Prospecção correspondente (mesmo nome) deve refletir automaticamente "Aceitou".
  const nomesAtivos=new Set(contratacoes.filter(c=>c.status!=='desistiu').map(c=>ctrNorm(c.nome)));
  const pendentes=contratacoesProspeccoes.filter(p=>p.retorno!=='aceitou'&&nomesAtivos.has(ctrNorm(p.nome)));
  if(!pendentes.length)return false;
  for(const p of pendentes){
    await sb.from('contratacoes_prospeccoes').update({retorno:'aceitou',data_aceite:p.data_aceite||ctrHojeISO()}).eq('id',p.id);
  }
  await loadContratacoesProspeccoes();
  return true;
}
async function ctrAutoSyncStatusIntegracao(silencioso){
  // Corrige, sob demanda, o status de candidatos cuja data de Mobilização/Integração
  // Prevista já foi lançada mas o status ainda não reflete isso (só avança nível,
  // nunca rebaixa e nunca mexe em quem desistiu). NÃO roda sozinho a cada render —
  // só quando chamado explicitamente (botão "Sincronizar Status"), para não sobrescrever
  // uma escolha manual de status feita pelo usuário.
  const ordem={em_processo:0,aguardando_integracao:1,integrado:2};
  const pendentes=contratacoes.filter(c=>{
    if(c.status==='desistiu')return false;
    const alvo=c.data_viagem_mobilizacao?'integrado':(c.data_integracao_prevista?'aguardando_integracao':null);
    if(!alvo)return false;
    return(ordem[c.status]??0)<ordem[alvo];
  });
  if(!pendentes.length){
    if(!silencioso)showToast('Nenhum status pendente de sincronização.');
    return false;
  }
  for(const c of pendentes){
    const alvo=c.data_viagem_mobilizacao?'integrado':'aguardando_integracao';
    await sb.from('contratacoes').update({status:alvo}).eq('id',c.id);
  }
  await loadContratacoes();
  if(!silencioso)showToast(`${pendentes.length} candidato(s) com status sincronizado!`);
  return true;
}
function renderContratacoes(){
  if(contratacoesTab==='vagas')renderContratacoesVagas();
  else if(contratacoesTab==='prospeccao'){
    renderContratacoesProspeccao();
    ctrAutoSyncProspeccoes().then(mudou=>{if(mudou&&contratacoesTab==='prospeccao')renderContratacoesProspeccao();});
  }
  else if(contratacoesTab==='desistencias')renderContratacoesDesistencias();
  else{
    renderContratacoesCandidatos();
  }
}

function ctrCalcularProjecoes(c){
  const diasExame=c.tipo_exame==='operacional_ac'?5:2;
  const resultadoExameReal=c.data_resultado_exame||null;
  const resultadoExameCalc=c.data_exame?ctrAddDiasUteis(c.data_exame,diasExame):null;
  const resultadoExame=resultadoExameReal||resultadoExameCalc;

  const docPortalReal=c.data_documentos_portal||null;
  const docPortal=docPortalReal||resultadoExame;

  const aprovacaoReal=c.data_aprovacao_diretoria||null;
  const aprovacao=aprovacaoReal||(docPortal?ctrAddDiasUteis(docPortal,2):null);

  const envioDpReal=c.data_envio_dp||null;
  const envioDp=envioDpReal||(aprovacao?ctrAddDiasUteis(aprovacao,1):null);

  const admissaoReal=c.data_prevista_admissao||null;
  const admissaoCalc=envioDp?ctrAddDiasUteis(envioDp,1):null;
  const admissao=admissaoReal||admissaoCalc;

  return{
    resultadoExame,resultadoExameReal:!!resultadoExameReal,
    docPortal,docPortalReal:!!docPortalReal,
    aprovacao,aprovacaoReal:!!aprovacaoReal,
    envioDp,envioDpReal:!!envioDpReal,
    admissao,admissaoReal:!!admissaoReal,
  };
}

function ctrConfirmChk(id,campo,isReal,projecao,dataReal){
  const title=isReal?`Confirmado em ${ctrFmtData(dataReal)} — desmarque para desfazer`:(projecao?`Previsto para ${ctrFmtData(projecao)} — marque para confirmar hoje`:'Marque para confirmar');
  return `<label style="display:inline-flex;align-items:center;gap:5px;cursor:pointer;font-size:10px" title="${title}" onclick="event.stopPropagation()">
    <input type="checkbox" ${isReal?'checked':''} style="width:14px;height:14px;cursor:pointer;accent-color:var(--success)" onchange="event.stopPropagation();ctrToggleConfirmacao('${id}','${campo}',this.checked)">
    ${isReal?`<span style="color:var(--text-muted)">${ctrFmtData(dataReal)}</span>`:''}
  </label>`;
}
function ctrProjCelulas(c){
  const hoje=ctrHojeISO();
  const tipoLabel=c.tipo_exame==='operacional_ac'?'Operacional AC':(c.tipo_exame==='operacional'?'Operacional':null);
  const p=ctrCalcularProjecoes(c);
  const exameOk=p.resultadoExameReal||(p.resultadoExame&&hoje>=p.resultadoExame);
  const registroOk=p.envioDp&&hoje>=p.envioDp;
  const nowrap='style="font-size:10px;white-space:normal;line-height:1.35"';
  return{

async function ctrConfirmarData(id,campo,valor){
  const payload={};payload[campo]=valor;
  const{error}=await sb.from('contratacoes').update(payload).eq('id',id);
  if(error){showToast('Erro: '+error.message,'error');return;}

function ctrCandidatosFiltrados(){
  const ativos=contratacoes.filter(c=>c.status!=='desistiu'&&(!globalObraFiltro||String(c.obra_id)===String(globalObraFiltro)));
  const lista=ativos.filter(c=>{
    if(contratacoesFiltroStatus&&c.status!==contratacoesFiltroStatus)return false;
    if(contratacoesFiltroFuncao&&String(c.funcao_id)!==String(contratacoesFiltroFuncao))return false;
    if(contratacoesFiltroObra&&String(c.obra_id)!==String(contratacoesFiltroObra))return false;
    if(contratacoesFiltroNome&&String(c.id)!==String(contratacoesFiltroNome))return false;
    if(contratacoesFiltroEtapa){
      if(contratacoesFiltroEtapa==='admitido'){
        if(!c.data_prevista_admissao)return false;
      }else{
        const etapa=CTR_ETAPAS.find(e=>e.key===contratacoesFiltroEtapa);
        if(!etapa)return false;
        if(!etapa.todosStatus&&c.status!=='em_processo')return false;
        if(!etapa.test(c))return false;
      }
    }
    if(contratacoesBusca){
      const b=contratacoesBusca.toLowerCase();
      return(c.nome||'').toLowerCase().includes(b)||(c.origem||'').toLowerCase().includes(b)||(c.contato||'').toLowerCase().includes(b);
    }
    return true;
  });
  return{ativos,lista};
}

function exportContratacoesExcel(){
 try{
  const{ativos,lista}=ctrCandidatosFiltrados();
  if(!lista.length){showToast('Nenhum candidato para exportar.','error');return;}

  const listaOrdenada=lista.slice().sort((a,b)=>{
    const fa=(a.funcao?.nome||'Sem função').toUpperCase();
    const fb=(b.funcao?.nome||'Sem função').toUpperCase();
    if(fa!==fb)return fa.localeCompare(fb,'pt-BR');
    return(a.nome||'').localeCompare(b.nome||'','pt-BR');
  });

  const NCOL=11;
  const pad=arr=>{while(arr.length<NCOL)arr.push('');return arr;};
  const dataEmissao=new Date().toLocaleDateString('pt-BR');

  // Filtros ativos aplicados (para constar no cabeçalho do relatório)
  const filtrosAtivos=[];
  const obraFiltroId=contratacoesFiltroObra||globalObraFiltro;
  if(obraFiltroId){const o=obras.find(o=>String(o.id)===String(obraFiltroId));if(o)filtrosAtivos.push(`Obra: ${o.codigo?o.codigo+' — ':''}${o.nome||''}`);}
  if(contratacoesFiltroFuncao){const f=funcoes.find(f=>String(f.id)===String(contratacoesFiltroFuncao));if(f)filtrosAtivos.push(`Função: ${f.nome}`);}
  if(contratacoesFiltroStatus)filtrosAtivos.push(`Status: ${ctrStatusInfo(contratacoesFiltroStatus).label}`);
  if(contratacoesFiltroEtapa){
    const et=contratacoesFiltroEtapa==='admitido'?'Admitido':(CTR_ETAPAS.find(e=>e.key===contratacoesFiltroEtapa)?.label||contratacoesFiltroEtapa);
    filtrosAtivos.push(`Etapa: ${et}`);
  }
  if(contratacoesBusca)filtrosAtivos.push(`Busca: "${contratacoesBusca}"`);

  const rows=[];
  rows.push(pad(['RELATÓRIO DE CONTRATAÇÕES — GTEL']));
  rows.push(pad([`Emitido em: ${dataEmissao}  ·  ${listaOrdenada.length} candidato(s)${filtrosAtivos.length?'  ·  Filtros: '+filtrosAtivos.join(' | '):''}`]));
  rows.push(pad([]));
  const headerRowIdx=rows.length; // linha do cabeçalho da tabela (0-indexed)
  rows.push([
    'NOME','FUNÇÃO','CIDADE','EXAME','D. PORTAL','APROVAÇÃO','ENVIO DP',
    'ADMISSÃO','INTEGRAÇÃO','MOBILIZ.','STATUS'
  ]);

  const grupoRowsIdx=[]; // linhas de cabeçalho de grupo (função), para aplicar destaque visual
  let grupoAnterior=null;
  listaOrdenada.forEach(c=>{
    const funcaoNome=c.funcao?.nome||'Sem função';
    if(funcaoNome!==grupoAnterior){
      grupoAnterior=funcaoNome;
      const countGrupo=listaOrdenada.filter(x=>(x.funcao?.nome||'Sem função')===funcaoNome).length;
      grupoRowsIdx.push(rows.length);
      rows.push(pad([`${funcaoNome.toUpperCase()} (${countGrupo})`]));
    }
    const p=ctrCalcularProjecoes(c);
    rows.push([
      c.nome||'—',
      funcaoNome,
      c.origem||'—',
      c.data_exame?ctrFmtData(c.data_exame):'—',
      p.docPortalReal?ctrFmtData(c.data_documentos_portal):'—',
      p.aprovacaoReal?ctrFmtData(c.data_aprovacao_diretoria):'—',
      p.envioDpReal?ctrFmtData(c.data_envio_dp):'—',
      p.admissaoReal?ctrFmtData(c.data_prevista_admissao):'—',
      c.data_integracao_prevista?ctrFmtData(c.data_integracao_prevista):'—',
      c.data_viagem_mobilizacao?ctrFmtData(c.data_viagem_mobilizacao):'—',
      ctrStatusInfo(c.status).label,
    ]);
  });

  const STATUS_COLORS={
    em_processo:{bg:'FAEEDA',fg:'BA7517'},
    aguardando_integracao:{bg:'E6F1FB',fg:'185FA5'},
    integrado:{bg:'EAF3DE',fg:'3B6D11'},
    desistiu:{bg:'FCEBEB',fg:'E24B4A'},
  };
  const thin={style:'thin',color:{rgb:'D9DCE1'}};
  const borderAll={top:thin,bottom:thin,left:thin,right:thin};

  const ws=XLSXStyle.utils.aoa_to_sheet(rows);
  ws['!cols']=[
    {wch:28},{wch:22},{wch:20},{wch:16},{wch:18},{wch:18},
    {wch:18},{wch:18},{wch:18},{wch:14},{wch:20}
  ];
  ws['!merges']=[
    {s:{r:0,c:0},e:{r:0,c:NCOL-1}},
    {s:{r:1,c:0},e:{r:1,c:NCOL-1}},
    ...grupoRowsIdx.map(r=>({s:{r,c:0},e:{r,c:NCOL-1}}))
  ];
  ws['!autofilter']={ref:XLSXStyle.utils.encode_range({s:{r:headerRowIdx,c:0},e:{r:headerRowIdx,c:NCOL-1}})};
  const rowHeights=[{hpt:24},{hpt:18},{hpt:6},{hpt:20}];
  grupoRowsIdx.forEach(r=>{rowHeights[r]={hpt:19};});
  ws['!rows']=rowHeights;

  // Título
  ws['A1'].s={font:{bold:true,sz:14,color:{rgb:'FFFFFF'}},fill:{fgColor:{rgb:'1D9E75'}},alignment:{vertical:'center',horizontal:'left',indent:1}};
  // Subtítulo
  ws['A2'].s={font:{italic:true,sz:10,color:{rgb:'6B7280'}},fill:{fgColor:{rgb:'E1F5EE'}},alignment:{vertical:'center',horizontal:'left',indent:1}};

  // Cabeçalho da tabela
  for(let c=0;c<NCOL;c++){
    const addr=XLSXStyle.utils.encode_cell({r:headerRowIdx,c});
    if(ws[addr])ws[addr].s={font:{bold:true,color:{rgb:'FFFFFF'},sz:11},fill:{fgColor:{rgb:'0F6E56'}},alignment:{vertical:'center',horizontal:'center'},border:borderAll};
  }

  // Linhas de grupo (função)
  grupoRowsIdx.forEach(r=>{
    const addr=XLSXStyle.utils.encode_cell({r,c:0});
    if(ws[addr])ws[addr].s={font:{bold:true,sz:11,color:{rgb:'0F6E56'}},fill:{fgColor:{rgb:'E1F5EE'}},alignment:{vertical:'center',horizontal:'left',indent:1},border:{bottom:thin}};
  });

  // Linhas de dados: bordas, zebra e cor de status
  const dataStartRow=headerRowIdx+1;
  for(let r=dataStartRow;r<rows.length;r++){
    if(grupoRowsIdx.includes(r))continue;
    const zebra=((r-dataStartRow)%2===1);
    for(let c=0;c<NCOL;c++){
      const addr=XLSXStyle.utils.encode_cell({r,c});
      if(!ws[addr])continue;
      const base={border:borderAll,alignment:{vertical:'center',horizontal:c===0||c===1||c===2?'left':'center',indent:c===0?1:0},font:{sz:10}};
      if(zebra)base.fill={fgColor:{rgb:'F8F9FA'}};
      ws[addr].s=base;
    }
    const statusAddr=XLSXStyle.utils.encode_cell({r,c:NCOL-1});
    const statusVal=rows[r][NCOL-1];
    const statusKey=Object.entries({em_processo:'Em Processo',aguardando_integracao:'Aguardando Integração',integrado:'Integrado',desistiu:'Desistiu/Reprovado'}).find(([,l])=>l===statusVal)?.[0];
    const cores=STATUS_COLORS[statusKey];
    if(ws[statusAddr]&&cores){
      ws[statusAddr].s={...ws[statusAddr].s,font:{bold:true,sz:10,color:{rgb:cores.fg}},fill:{fgColor:{rgb:cores.bg}}};
    }
  }

  // Aba Resumo — visão gerencial rápida
  const totalPrevisto=contratacoesVagas.filter(v=>!globalObraFiltro||String(v.obra_id)===String(globalObraFiltro)).reduce((s,v)=>s+(v.quantidade_prevista||0),0);
  const emProcesso=ativos.filter(c=>c.status==='em_processo').length;
  const admitidos=ativos.filter(c=>!!c.data_prevista_admissao).length;
  const aguardando=ativos.filter(c=>c.status==='aguardando_integracao').length;
  const integrados=ativos.filter(c=>c.status==='integrado').length;

  const funcoesMap={};
  ativos.filter(c=>c.status==='em_processo').forEach(c=>{
    const nome=c.funcao?.nome||'Sem função';
    funcoesMap[nome]=(funcoesMap[nome]||0)+1;
  });
  const funcoesArr=Object.entries(funcoesMap).sort((a,b)=>b[1]-a[1]);

  const resumoRows=[
    ['RESUMO GERENCIAL — CONTRATAÇÕES GTEL','',''],
    [`Emitido em: ${dataEmissao}`,'',''],
    ['','',''],
    ['INDICADOR','VALOR',''],
    ['Vagas Previstas',totalPrevisto,''],
    ['Total de Candidatos',ativos.length,''],
    ['Em Processo',emProcesso,''],
    ['Admitidos',admitidos,''],
    ['Aguardando Integração',aguardando,''],
    ['Integrados',integrados,''],
    ['','',''],
    ['FUNÇÕES EM PROCESSO','QTD.',''],
    ...funcoesArr.map(([nome,qtd])=>[nome,qtd,'']),
  ];
  const wsRes=XLSXStyle.utils.aoa_to_sheet(resumoRows);
  wsRes['!cols']=[{wch:34},{wch:14},{wch:8}];
  wsRes['!merges']=[{s:{r:0,c:0},e:{r:0,c:2}},{s:{r:1,c:0},e:{r:1,c:2}}];
  if(wsRes['A1'])wsRes['A1'].s={font:{bold:true,sz:14,color:{rgb:'FFFFFF'}},fill:{fgColor:{rgb:'1D9E75'}},alignment:{vertical:'center',horizontal:'left',indent:1}};
  if(wsRes['A2'])wsRes['A2'].s={font:{italic:true,sz:10,color:{rgb:'6B7280'}},fill:{fgColor:{rgb:'E1F5EE'}},alignment:{vertical:'center',horizontal:'left',indent:1}};
  [3,11].forEach(r=>{
    for(let c=0;c<2;c++){
      const addr=XLSXStyle.utils.encode_cell({r,c});
      if(wsRes[addr])wsRes[addr].s={font:{bold:true,color:{rgb:'FFFFFF'}},fill:{fgColor:{rgb:'0F6E56'}},border:borderAll};
    }
  });
  for(let r=4;r<resumoRows.length;r++){
    if(r===11)continue;
    for(let c=0;c<2;c++){
      const addr=XLSXStyle.utils.encode_cell({r,c});
      if(wsRes[addr])wsRes[addr].s={border:borderAll,font:{sz:10},alignment:{horizontal:c===1?'center':'left',indent:c===0?1:0}};
    }
  }

  const wb=XLSXStyle.utils.book_new();
  XLSXStyle.utils.book_append_sheet(wb,wsRes,'Resumo');
  XLSXStyle.utils.book_append_sheet(wb,ws,'Candidatos');

  const sufixoObra=obraFiltroId?`_${(obras.find(o=>String(o.id)===String(obraFiltroId))?.codigo)||'Obra'}`:'_TodasObras';
  XLSXStyle.writeFile(wb,`Contratacoes_GTEL${sufixoObra}_${dataEmissao.replace(/\//g,'-')}.xlsx`);
  showToast(`Excel exportado — ${listaOrdenada.length} candidato(s)!`);
 }catch(err){
  console.error('Erro ao exportar Excel:',err);
  showToast('Erro ao exportar Excel: '+(err?.message||err),'error');
 }
}

function ctrToggleDesistencia(){
  const status=document.getElementById('ctr-status').value;
  const grupo=document.getElementById('ctr-grupo-desistencia');
  if(!grupo)return;
  grupo.style.display=status==='desistiu'?'block':'none';
  if(status==='desistiu'&&!document.getElementById('ctr-data-desistencia').value){
    document.getElementById('ctr-data-desistencia').value=ctrHojeISO();
  }
}

function ctrAutoStatusPorData(statusAlvo,valor){
  if(!valor)return; // só avança o status quando a data é preenchida, nunca ao apagar
  const sel=document.getElementById('ctr-status');
  if(!sel)return;
  const ordem={em_processo:0,aguardando_integracao:1,integrado:2};
  const atual=sel.value;
  if(atual==='desistiu')return; // não mexe em candidato já marcado como desistiu
  if((ordem[atual]??0)<ordem[statusAlvo]){
    sel.value=statusAlvo;
    ctrToggleDesistencia();
  }
}

function ctrNorm(s){return(s||'').trim().toUpperCase().replace(/\s+/g,' ');}
function ctrFuncoesUnicas(){
  return[...new Map(funcoes.map(f=>[ctrNorm(f.nome),f])).values()].sort((a,b)=>(a.nome||'').localeCompare(b.nome||'','pt-BR'));
}

function renderContratacoesVagas(){
  const vagas=contratacoesVagas.filter(v=>!contratacoesVagasFiltroObra||String(v.obra_id)===String(contratacoesVagasFiltroObra));

  let tPrevisto=0,tFalta=0,tEmProcesso=0,tAguardando=0,tIntegrado=0;

  const rows=vagas.map(v=>{
    // Match por funcao_id OU por nome da função normalizado (fallback para casos de
    // funções duplicadas com IDs diferentes mas mesmo nome, ex: digitadas manualmente em momentos distintos)
    const candidatosVaga=contratacoes.filter(c=>
      String(c.obra_id)===String(v.obra_id)&&
      (String(c.funcao_id)===String(v.funcao_id)||(c.funcao?.nome&&v.funcao?.nome&&ctrNorm(c.funcao.nome)===ctrNorm(v.funcao.nome)))
    );
    const emProcesso=candidatosVaga.filter(c=>c.status==='em_processo').length;
    const aguardando=candidatosVaga.filter(c=>c.status==='aguardando_integracao').length;
    const integrado=candidatosVaga.filter(c=>c.status==='integrado').length;
    const previsto=v.quantidade_prevista||0;
    const falta=Math.max(previsto-(emProcesso+aguardando+integrado),0);
    tPrevisto+=previsto;tFalta+=falta;tEmProcesso+=emProcesso;tAguardando+=aguardando;tIntegrado+=integrado;
    return`<tr>
      <td style="font-weight:500">${v.funcao?.nome||'—'}${v.observacao?` <i class="ti ti-note" style="color:var(--warning);cursor:help" title="${v.observacao.replace(/"/g,'&quot;')}"></i>`:''}</td>
      <td style="font-size:12px">${v.obra?`${v.obra.codigo?v.obra.codigo+' — ':''}${v.obra.nome||''}`:'<span style="color:var(--text-muted)">—</span>'}</td>
      <td style="text-align:center;font-weight:600">${previsto}</td>
      <td style="text-align:center;${falta>0?'color:var(--danger);font-weight:600':'color:var(--text-muted)'}">${falta}</td>
      <td style="text-align:center;color:var(--warning);font-weight:600">${emProcesso}</td>
      <td style="text-align:center;color:var(--info);font-weight:600">${aguardando}</td>
      <td style="text-align:center;color:var(--success);font-weight:600">${integrado}</td>
      <td style="font-size:12px;color:var(--text-muted);max-width:200px">${v.observacao?`<span title="${v.observacao.replace(/"/g,'&quot;')}">${v.observacao.length>40?v.observacao.slice(0,40)+'…':v.observacao}</span>`:'—'}</td>
      <td>
        <div class="action-btns">
          <button class="btn btn-sm" onclick="openModalVaga('${v.id}')" title="Editar"><i class="ti ti-edit"></i></button>
          <button class="btn btn-sm btn-danger" onclick="deleteVaga('${v.id}')" title="Excluir"><i class="ti ti-trash"></i></button>
        </div>
      </td>
    </tr>`;
  }).join('')||'<tr><td colspan="9"><div class="empty-state"><i class="ti ti-clipboard-list"></i><div>Nenhuma vaga prevista cadastrada</div></div></td></tr>';

  const obraOpts=obras.map(o=>`<option value="${o.id}" ${contratacoesVagasFiltroObra===String(o.id)?'selected':''}>${o.codigo?o.codigo+' — ':''}${o.nome||''}</option>`).join('');

  document.getElementById('main-content').innerHTML=`
    <div class="page-header">
      <div><div class="page-title"><i class="ti ti-user-plus"></i> Contratações</div><div class="page-subtitle">Vagas previstas por função e obra</div></div>
      <button class="btn btn-primary" onclick="openModalVaga()"><i class="ti ti-plus"></i> Nova vaga</button>
    </div>
    <div class="exp-tabs">
      <div class="exp-tab${contratacoesTab==='candidatos'?' active':''}" onclick="contratacoesTab='candidatos';renderContratacoes()">Candidatos</div>
      <div class="exp-tab${contratacoesTab==='prospeccao'?' active':''}" onclick="contratacoesTab='prospeccao';renderContratacoes()">Prospecção</div>
      <div class="exp-tab${contratacoesTab==='vagas'?' active':''}" onclick="contratacoesTab='vagas';renderContratacoes()">Vagas Previstas</div>
      <div class="exp-tab${contratacoesTab==='desistencias'?' active':''}" onclick="contratacoesTab='desistencias';renderContratacoes()">Desistências</div>
    </div>
    <div class="filters">
      <select class="filter-select" onchange="contratacoesVagasFiltroObra=this.value;renderContratacoesVagas()">
        <option value="">Todas as obras</option>${obraOpts}
      </select>
      <button class="btn btn-sm" onclick="contratacoesVagasFiltroObra='';renderContratacoesVagas()"><i class="ti ti-x"></i> Limpar</button>
    </div>
    <div class="table-container"><table>
      <thead><tr>
        <th>Função</th><th>Obra</th><th>Previsto</th><th>Falta Captação</th><th>Em Processo</th><th>Aguardando Integração</th><th>Integrado</th><th>Observação</th><th>Ações</th>
      </tr></thead>
      <tbody>${rows}</tbody>
      ${vagas.length?`<tfoot><tr style="font-weight:700;background:var(--bg)">
        <td colspan="2">Total</td>
        <td style="text-align:center">${tPrevisto}</td>
        <td style="text-align:center;color:var(--danger)">${tFalta}</td>
        <td style="text-align:center;color:var(--warning)">${tEmProcesso}</td>
        <td style="text-align:center;color:var(--info)">${tAguardando}</td>
        <td style="text-align:center;color:var(--success)">${tIntegrado}</td>
        <td></td>
        <td></td>
      </tr></tfoot>`:''}
    </table></div>`;
}

function prospRetornoInfo(retorno){
  if(retorno==='aceitou')return{label:'Aceitou',bg:'var(--success-light)',cor:'var(--success)'};
  if(retorno==='recusou')return{label:'Recusou',bg:'var(--danger-light)',cor:'var(--danger)'};
  return{label:'Pendente',bg:'var(--warning-light)',cor:'var(--warning)'};
}

function renderContratacoesProspeccao(){
  const lista=contratacoesProspeccoes.filter(p=>{
    if(globalObraFiltro&&p.obra_id&&String(p.obra_id)!==String(globalObraFiltro))return false;
    if(prospFiltroFuncao&&String(p.funcao_id)!==String(prospFiltroFuncao))return false;
    if(prospFiltroRetorno&&(p.retorno||'pendente')!==prospFiltroRetorno)return false;
    if(prospBusca){
      const b=prospBusca.toLowerCase();
      return(p.nome||'').toLowerCase().includes(b)||(p.telefone||'').toLowerCase().includes(b)||(p.funcao?.nome||'').toLowerCase().includes(b);
    }
    return true;
  }).sort((a,b)=>(a.nome||'').localeCompare(b.nome||'','pt-BR'));

  const baseContagem=globalObraFiltro?contratacoesProspeccoes.filter(p=>!p.obra_id||String(p.obra_id)===String(globalObraFiltro)):contratacoesProspeccoes;
  const total=baseContagem.length;
  const aceitos=baseContagem.filter(p=>p.retorno==='aceitou').length;
  const recusados=baseContagem.filter(p=>p.retorno==='recusou').length;
  const pendentes=baseContagem.filter(p=>!p.retorno||p.retorno==='pendente').length;

  const rows=lista.map(p=>{
    const ri=prospRetornoInfo(p.retorno);
    const obraNome=p.obra_id?(obras.find(o=>String(o.id)===String(p.obra_id))||null):null;
    return`<tr>
      <td style="font-weight:500">${p.nome||'—'}</td>
      <td style="font-size:12px">${p.funcao?.nome||'—'}</td>
      <td style="font-size:12px">${obraNome?`${obraNome.codigo?obraNome.codigo+' — ':''}${obraNome.nome||''}`:'<span style="color:var(--text-muted)">—</span>'}</td>
      <td style="font-size:12px">${p.telefone||'—'}</td>
      <td style="font-size:12px">${ctrFmtData(p.data_contato)}</td>
      <td><span class="badge" style="background:${ri.bg};color:${ri.cor}">${ri.label}</span>${p.retorno==='aceitou'&&p.data_aceite?`<div style="font-size:11px;color:var(--text-muted);margin-top:3px">${ctrFmtData(p.data_aceite)}</div>`:''}</td>
      <td style="font-size:12px;max-width:220px">${p.observacao||'<span style="color:var(--text-muted)">—</span>'}</td>
      <td>
        <div class="action-btns">
          <button class="btn btn-sm" onclick="openModalProspeccao('${p.id}')" title="Editar"><i class="ti ti-edit"></i></button>
          <button class="btn btn-sm btn-danger" onclick="deleteProspeccao('${p.id}')" title="Excluir"><i class="ti ti-trash"></i></button>
        </div>
      </td>
    </tr>`;
  }).join('')||'<tr><td colspan="8"><div class="empty-state"><i class="ti ti-phone"></i><div>Nenhum contato de prospecção cadastrado</div></div></td></tr>';

  const funcaoOpts=ctrFuncoesUnicas().map(f=>`<option value="${f.id}" ${prospFiltroFuncao===String(f.id)?'selected':''}>${f.nome}</option>`).join('');

  document.getElementById('main-content').innerHTML=`
    <div class="page-header">
      <div><div class="page-title"><i class="ti ti-user-plus"></i> Contratações</div><div class="page-subtitle">Prospecção — contato com candidatos da busca interna</div></div>
      <button class="btn btn-primary" onclick="openModalProspeccao()"><i class="ti ti-plus"></i> Novo contato</button>
    </div>
    <div class="exp-tabs">
      <div class="exp-tab${contratacoesTab==='candidatos'?' active':''}" onclick="contratacoesTab='candidatos';renderContratacoes()">Candidatos</div>
      <div class="exp-tab${contratacoesTab==='prospeccao'?' active':''}" onclick="contratacoesTab='prospeccao';renderContratacoes()">Prospecção</div>
      <div class="exp-tab${contratacoesTab==='vagas'?' active':''}" onclick="contratacoesTab='vagas';renderContratacoes()">Vagas Previstas</div>
      <div class="exp-tab${contratacoesTab==='desistencias'?' active':''}" onclick="contratacoesTab='desistencias';renderContratacoes()">Desistências</div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px">
      <div class="metric-card" onclick="prospFiltroRetorno='';renderContratacoesProspeccao()" style="cursor:pointer;border-color:${!prospFiltroRetorno?'var(--primary)':'var(--border)'}">
        <div class="metric-label">Total Contatos</div><div class="metric-value">${total}</div>
      </div>
      <div class="metric-card amber" onclick="prospFiltroRetorno='pendente';renderContratacoesProspeccao()" style="cursor:pointer;border-color:${prospFiltroRetorno==='pendente'?'var(--warning)':'var(--border)'}">
        <div class="metric-label">Pendentes</div><div class="metric-value">${pendentes}</div>
      </div>
      <div class="metric-card green" onclick="prospFiltroRetorno='aceitou';renderContratacoesProspeccao()" style="cursor:pointer;border-color:${prospFiltroRetorno==='aceitou'?'var(--success)':'var(--border)'}">

async function saveProspeccao(id){
  const nome=document.getElementById('prosp-nome').value.trim();
  if(!nome){showToast('Nome é obrigatório','error');return;}
  const isMod=prospFuncaoModoManual;
  let funcaoId=isMod?null:(document.getElementById('prosp-funcao-select').value||null);
  const funcaoManualTexto=isMod?document.getElementById('prosp-funcao-input').value.trim():null;
  if(isMod&&funcaoManualTexto){
    const existente=funcoes.find(f=>ctrNorm(f.nome)===ctrNorm(funcaoManualTexto));
    if(existente){
      funcaoId=existente.id;
    }else{
      const{data:novaFuncao,error:errFuncao}=await sb.from('funcoes').insert({nome:funcaoManualTexto}).select().single();
      if(errFuncao){showToast('Erro ao salvar função: '+errFuncao.message,'error');return;}
      funcoes.push(novaFuncao);
      funcaoId=novaFuncao.id;
    }
  }
  const payload={
    nome,
    funcao_id:funcaoId,
    obra_id:document.getElementById('prosp-obra').value||null,
    telefone:document.getElementById('prosp-telefone').value.trim()||null,
    data_contato:document.getElementById('prosp-data-contato').value||null,
    retorno:document.getElementById('prosp-retorno').value,
    data_aceite:document.getElementById('prosp-retorno').value==='aceitou'?(document.getElementById('prosp-data-aceite').value||ctrHojeISO()):null,
    observacao:document.getElementById('prosp-obs').value.trim()||null,
  };
  const{error}=id?await sb.from('contratacoes_prospeccoes').update(payload).eq('id',id):await sb.from('contratacoes_prospeccoes').insert(payload);
  if(error){showToast('Erro: '+error.message,'error');return;}
  showToast(id?'Contato atualizado!':'Contato cadastrado!');
  closeModal('modal-prospeccao');
  await loadContratacoesProspeccoes();renderContratacoes();
}

async function deleteProspeccao(id){
  if(!confirm('Excluir este contato de prospecção?'))return;
  const{error}=await sb.from('contratacoes_prospeccoes').delete().eq('id',id);
  if(error){showToast('Erro: '+error.message,'error');return;}
  showToast('Contato excluído.');
  await loadContratacoesProspeccoes();renderContratacoes();
}

function ctrEstagioDesistencia(c){
  if(c.data_envio_dp)return'Enviado ao DP p/ Registro';
  if(c.data_aprovacao_diretoria)return'Aprovação da Diretoria';
  if(c.data_documentos_portal)return'Documentos no Portal';
  if(c.data_exame)return'Exame realizado';
  return'Cadastro inicial';
}

function renderContratacoesDesistencias(){
  const desistentes=contratacoes.filter(c=>c.status==='desistiu'&&(!globalObraFiltro||String(c.obra_id)===String(globalObraFiltro))).map(c=>({
    id:c.id,tipo:'desistiu',nome:c.nome,origem:c.origem,funcaoNome:c.funcao?.nome,
    obraLabel:c.obra?`${c.obra.codigo?c.obra.codigo+' — ':''}${c.obra.nome||''}`:null,
    funcaoId:c.funcao_id,data:c.data_desistencia,
    estagio:`${ctrEstagioDesistencia(c)}`,docsInfo:ctrDocsPct(c),
    observacao:c.observacao,raw:c
  }));
  const recusados=contratacoesProspeccoes.filter(p=>p.retorno==='recusou').map(p=>({
    id:p.id,tipo:'recusou',nome:p.nome,origem:null,funcaoNome:p.funcao?.nome,
    obraLabel:null,funcaoId:p.funcao_id,data:p.data_contato,
    estagio:'Recusou na prospecção (ainda não era candidato)',docsInfo:null,
    observacao:p.observacao,raw:p
  }));
  const combinados=[...desistentes,...recusados];

  const lista=combinados.filter(item=>{
    if(desistFiltroTipo&&item.tipo!==desistFiltroTipo)return false;
    if(desistFiltroFuncao&&String(item.funcaoId)!==String(desistFiltroFuncao))return false;
    if(desistBusca){
      const b=desistBusca.toLowerCase();
      return(item.nome||'').toLowerCase().includes(b)||(item.origem||'').toLowerCase().includes(b);
    }
    return true;
  }).sort((a,b)=>(b.data||'').localeCompare(a.data||''));

  const totalDesistiram=desistentes.length;
  const totalRecusaram=recusados.length;
  const totalGeral=totalDesistiram+totalRecusaram;
  const hoje=ctrHojeISO();
  const mesAtual=hoje.slice(0,7);
  const esteMes=combinados.filter(item=>(item.data||'').slice(0,7)===mesAtual).length;

  const rows=lista.map(item=>{
    const tipoBadge=item.tipo==='desistiu'
      ?`<span class="badge" style="background:var(--danger-light);color:var(--danger)">Desistiu/Reprovado</span>`
      :`<span class="badge" style="background:#F3E8FF;color:#7C3AED">Recusou Prospecção</span>`;
    const docsCell=item.docsInfo?`<div style="color:var(--text-muted)">Docs: ${item.docsInfo.done}/${item.docsInfo.total} (${item.docsInfo.pct}%)</div>`:'';
    const editFn=item.tipo==='desistiu'?`openModalContratacao('${item.id}')`:`openModalProspeccao('${item.id}')`;
    const delFn=item.tipo==='desistiu'?`deleteContratacao('${item.id}','${(item.nome||'').replace(/'/g,"\\'")}')`:`deleteProspeccao('${item.id}')`;
    return`<tr>
      <td>
        <div style="font-weight:500">${item.nome||'—'}</div>
        ${item.origem?`<div style="font-size:11px;color:var(--text-muted)">${item.origem}</div>`:''}
      </td>
      <td style="font-size:12px">${item.funcaoNome||'—'}</td>
      <td>${tipoBadge}</td>
      <td style="font-size:12px">${ctrFmtData(item.data)}</td>
      <td style="font-size:12px">${item.estagio}${docsCell}</td>
      <td style="font-size:12px;max-width:220px">${item.observacao||'<span style="color:var(--text-muted)">—</span>'}</td>
      <td>
        <div class="action-btns">
          <button class="btn btn-sm" onclick="${editFn}" title="Editar"><i class="ti ti-edit"></i></button>
          <button class="btn btn-sm btn-danger" onclick="${delFn}" title="Excluir"><i class="ti ti-trash"></i></button>
        </div>
      </td>
    </tr>`;
  }).join('')||'<tr><td colspan="7"><div class="empty-state"><i class="ti ti-user-x"></i><div>Nenhuma desistência ou recusa registrada</div></div></td></tr>';

  const funcaoOpts=ctrFuncoesUnicas().map(f=>`<option value="${f.id}" ${desistFiltroFuncao===String(f.id)?'selected':''}>${f.nome}</option>`).join('');

  document.getElementById('main-content').innerHTML=`
    <div class="page-header">
      <div><div class="page-title"><i class="ti ti-user-plus"></i> Contratações</div><div class="page-subtitle">Candidatos que desistiram/reprovaram no processo + contatos que recusaram na prospecção</div></div>
    </div>
    <div class="exp-tabs">
      <div class="exp-tab${contratacoesTab==='candidatos'?' active':''}" onclick="contratacoesTab='candidatos';renderContratacoes()">Candidatos</div>
      <div class="exp-tab${contratacoesTab==='prospeccao'?' active':''}" onclick="contratacoesTab='prospeccao';renderContratacoes()">Prospecção</div>
      <div class="exp-tab${contratacoesTab==='vagas'?' active':''}" onclick="contratacoesTab='vagas';renderContratacoes()">Vagas Previstas</div>
      <div class="exp-tab${contratacoesTab==='desistencias'?' active':''}" onclick="contratacoesTab='desistencias';renderContratacoes()">Desistências</div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px">
      <div class="metric-card" onclick="desistFiltroTipo='';renderContratacoesDesistencias()" style="cursor:pointer;border-color:${!desistFiltroTipo?'var(--primary)':'var(--border)'}">
        <div class="metric-label">Total Geral</div><div class="metric-value">${totalGeral}</div>
      </div>
      <div class="metric-card" style="border-color:var(--danger)" onclick="desistFiltroTipo='desistiu';renderContratacoesDesistencias()">
        <div class="metric-label">Desistiram/Reprovados</div><div class="metric-value" style="color:${desistFiltroTipo==='desistiu'?'var(--danger)':'var(--text)'}">${totalDesistiram}</div>
      </div>
      <div class="metric-card" style="border-color:#7C3AED" onclick="desistFiltroTipo='recusou';renderContratacoesDesistencias()">
        <div class="metric-label">Recusaram Prospecção</div><div class="metric-value" style="color:${desistFiltroTipo==='recusou'?'#7C3AED':'var(--text)'}">${totalRecusaram}</div>
      </div>
      <div class="metric-card amber"><div class="metric-label">Este Mês</div><div class="metric-value">${esteMes}</div></div>
    </div>
    <div class="filters">
      <div class="search-box"><i class="ti ti-search"></i>
        <input placeholder="Buscar por nome ou origem..." value="${desistBusca}"
          oninput="desistBusca=this.value;if(!_buscaHandlers.desist)_buscaHandlers.desist=makeBuscaHandler(v=>desistBusca=v,renderContratacoesDesistencias,300);_buscaHandlers.desist(this.value);this.focus()">
      </div>
      <select class="filter-select" onchange="desistFiltroFuncao=this.value;renderContratacoesDesistencias()">
        <option value="">Todas as funções</option>${funcaoOpts}
      </select>
      <select class="filter-select" onchange="desistFiltroTipo=this.value;renderContratacoesDesistencias()">
        <option value="">Todos os tipos</option>
        <option value="desistiu" ${desistFiltroTipo==='desistiu'?'selected':''}>Desistiu/Reprovado</option>
        <option value="recusou" ${desistFiltroTipo==='recusou'?'selected':''}>Recusou Prospecção</option>
      </select>
      <button class="btn btn-sm" onclick="desistBusca='';desistFiltroFuncao='';desistFiltroTipo='';renderContratacoesDesistencias()"><i class="ti ti-x"></i> Limpar</button>
    </div>
    <div class="table-container"><table>
      <thead><tr>
        <th>Candidato/Contato</th><th>Função</th><th>Tipo</th><th>Data</th><th>Estágio</th><th>Motivo/Observação</th><th>Ações</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table></div>`;
}

function ctrNormalizarDocs(docs){
  const out={};
  DOCS_CONTRATACAO.forEach(([k])=>{
    const v=docs?.[k];
    out[k]=v===true?'ok':(v==='ok'||v==='isento'?v:false);
  });
  return out;
}

function ctrDocsItemsHtml(){
  const st=window._ctrDocsState||{};
  return DOCS_CONTRATACAO.map(([k,label])=>{
    const v=st[k];
    const isento=v==='isento';
    const ok=v==='ok';
    return`<div style="display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13px">
      <input type="checkbox" id="ctr-doc-${k}" ${ok?'checked':''} ${isento?'disabled':''} onchange="ctrToggleDocOk('${k}')" style="width:16px;height:16px;flex-shrink:0">
      <span style="${isento?'text-decoration:line-through;color:var(--text-muted)':''};flex:1;cursor:pointer" onclick="${isento?'':`document.getElementById('ctr-doc-${k}').click()`}">${label}${isento?' <em style="font-style:normal;font-size:11px">(isento)</em>':''}</span>
      <span onclick="ctrToggleIsento('${k}')" style="font-size:11px;color:var(--primary);cursor:pointer;white-space:nowrap">${isento?'Reativar':'Isentar'}</span>
    </div>`;
  }).join('');
}

function ctrRenderDocsChecklist(){
  const st=window._ctrDocsState||{};
  const isentos=DOCS_CONTRATACAO.filter(([k])=>st[k]==='isento').length;
  const done=DOCS_CONTRATACAO.filter(([k])=>st[k]==='ok').length;
  const total=DOCS_CONTRATACAO.length-isentos;
  const pct=total?Math.round(done/total*100):100;
  const cor=pct>=100?'var(--success)':pct>=50?'var(--warning)':'var(--danger)';
  const cont=document.getElementById('ctr-docs-itens');
  const barra=document.getElementById('ctr-docs-barra');
  const label=document.getElementById('ctr-docs-label');
  if(cont)cont.innerHTML=ctrDocsItemsHtml();
  if(barra){barra.style.width=pct+'%';barra.style.background=cor;}
  if(label)label.textContent=`${done}/${total} (${pct}%)${isentos?' · '+isentos+' isento(s)':''}`;
}

function ctrToggleDocOk(k){
  const st=window._ctrDocsState;
  st[k]=st[k]==='ok'?false:'ok';
  ctrRenderDocsChecklist();
}

function ctrToggleIsento(k){
  const st=window._ctrDocsState;
  st[k]=st[k]==='isento'?false:'isento';
  ctrRenderDocsChecklist();
}
