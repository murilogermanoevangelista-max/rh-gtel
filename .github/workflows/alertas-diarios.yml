name: Alertas Diários RH Manager

on:
  schedule:
    # 10:00 UTC = 07:00 horário de Brasília (UTC-3)
    - cron: '0 10 * * *'
  workflow_dispatch: {} # permite disparar manualmente pela aba "Actions" no GitHub, para testes

jobs:
  enviar-alertas:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar Edge Function de alertas
        run: |
          curl -i --fail \
            -X POST "${{ secrets.SUPABASE_FUNCTION_URL }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json"
