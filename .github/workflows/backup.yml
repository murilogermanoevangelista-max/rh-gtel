name: Backup Automático do Banco

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Instalar ferramenta do Postgres (versão compatível com o Supabase)
        run: |
          sudo apt-get install -y curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Gerar o backup do banco
        run: |
          mkdir -p backups
          DATA=$(date +%Y-%m-%d)
          pg_dump "${{ secrets.SUPABASE_DB_URL }}" --no-owner --no-privileges -f "backups/backup_${DATA}.sql"

      - name: Apagar backups com mais de 30 dias (evita o repositório crescer demais)
        run: |
          find backups -name "backup_*.sql" -mtime +30 -delete

      - name: Salvar o backup no repositório
        run: |
          git config user.name "backup-bot"
          git config user.email "backup-bot@users.noreply.github.com"
          git add backups
          git diff --staged --quiet || git commit -m "Backup automático $(date +%Y-%m-%d)"
          git push
