<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RH Manager — GTEL</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#1D9E75;--primary-dark:#0F6E56;--primary-light:#E1F5EE;
  --bg:#F8F9FA;--surface:#fff;--border:#E5E7EB;
  --text:#1a1a1a;--text-muted:#6B7280;
  --danger:#E24B4A;--danger-light:#FCEBEB;
  --warning:#BA7517;--warning-light:#FAEEDA;
  --success:#3B6D11;--success-light:#EAF3DE;
  --info:#185FA5;--info-light:#E6F1FB;
  --radius:8px;--radius-lg:12px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:220px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:100}
.sidebar-header{padding:20px 16px 16px;border-bottom:1px solid var(--border)}
.sidebar-logo{font-size:16px;font-weight:600;color:var(--primary)}
.sidebar-sub{font-size:11px;color:var(--text-muted)}
.sidebar-nav{flex:1;padding:12px 8px;overflow-y:auto}
.nav-section{font-size:10px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.8px;padding:8px 8px 4px}
.nav-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--radius);cursor:pointer;color:var(--text-muted);font-size:13px;margin-bottom:2px;transition:all .15s}
.nav-item:hover{background:var(--bg);color:var(--text)}
.nav-item.active{background:var(--primary-light);color:var(--primary-dark);font-weight:500}
.nav-item i{font-size:16px}
.main{margin-left:220px;min-height:100vh;padding:24px}
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
.page-title{font-size:20px;font-weight:600}
.page-subtitle{font-size:13px;color:var(--text-muted);margin-top:2px}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:24px}
.metric-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px}
.metric-label{font-size:12px;color:var(--text-muted);margin-bottom:4px}
.metric-value{font-size:24px;font-weight:600;color:var(--text)}
.metric-card.green .metric-value{color:var(--primary-dark)}
.metric-card.red .metric-value{color:var(--danger)}
.metric-card.amber .metric-value{color:var(--warning)}
.table-container{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden}
.search-box{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:6px 12px;min-width:220px}
.search-box input{border:none;background:transparent;outline:none;font-size:13px;color:var(--text);width:100%}
.search-box i{color:var(--text-muted);font-size:15px}
table{width:100%;border-collapse:collapse}
thead th{text-align:left;font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--border)}
tbody tr{border-bottom:1px solid var(--border);transition:background .1s}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:#FAFAFA}
tbody td{padding:10px 16px;font-size:13px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--primary-light);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--primary-dark);overflow:hidden;flex-shrink:0}
.avatar img{width:100%;height:100%;object-fit:cover}
.name-cell{display:flex;align-items:center;gap:10px}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:500}
.badge-green{background:var(--success-light);color:var(--success)}
.badge-red{background:var(--danger-light);color:var(--danger)}
.badge-amber{background:var(--warning-light);color:var(--warning)}
.badge-blue{background:#E6F1FB;color:#185FA5}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:13px;cursor:pointer;font-weight:500;transition:all .15s}
.btn:hover{background:var(--bg)}
.btn-primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn-primary:hover{background:var(--primary-dark);border-color:var(--primary-dark)}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-danger{background:var(--danger-light);color:var(--danger);border-color:transparent}
.btn-info{background:var(--info-light);color:var(--info);border-color:transparent}
.btn-success{background:var(--success-light);color:var(--success);border-color:transparent}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:999;padding:20px}
.modal{background:var(--surface);border-radius:var(--radius-lg);width:100%;max-width:700px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.15)}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);z-index:1}
.modal-title{font-size:16px;font-weight:600}
.modal-body{padding:24px}
.modal-footer{padding:16px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form-group{display:flex;flex-direction:column;gap:5px}
.form-group.full{grid-column:1/-1}
label{font-size:12px;font-weight:500;color:var(--text-muted)}
input,select,textarea{padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius);font-size:13px;color:var(--text);background:var(--surface);outline:none;transition:border .15s;width:100%}
input:focus,select:focus{border-color:var(--primary)}
.form-section{font-size:12px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.8px;padding-bottom:6px;border-bottom:1px solid var(--border);grid-column:1/-1}
.foto-upload{display:flex;align-items:center;gap:16px;grid-column:1/-1;padding:16px;background:var(--bg);border-radius:var(--radius);border:1px dashed var(--border)}
.foto-preview{width:64px;height:64px;border-radius:50%;background:var(--primary-light);display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:20px;font-weight:600;color:var(--primary-dark);flex-shrink:0}
.foto-preview img{width:100%;height:100%;object-fit:cover}
.funcao-toggle{font-size:11px;color:var(--primary);cursor:pointer;text-decoration:underline;margin-top:3px;display:inline-block}
.transfer-tipo-btns{grid-column:1/-1;display:flex;gap:10px;margin-top:4px}
.transfer-tipo-btn{flex:1;padding:12px;border:2px solid var(--border);border-radius:var(--radius);cursor:pointer;text-align:center;transition:all .2s;background:var(--surface)}
.transfer-tipo-btn:hover{border-color:var(--primary);background:var(--primary-light)}
.transfer-tipo-btn.selected-envio{border-color:var(--warning);background:var(--warning-light)}
.transfer-tipo-btn.selected-recebimento{border-color:var(--info);background:var(--info-light)}
.transfer-tipo-btn .ttb-icon{font-size:22px;margin-bottom:4px}
.transfer-tipo-btn .ttb-label{font-size:13px;font-weight:600}
.transfer-tipo-btn .ttb-desc{font-size:11px;color:var(--text-muted);margin-top:2px}
.transfer-block{grid-column:1/-1;display:none}
.transfer-block.visible{display:contents}
.transfer-fields{grid-column:1/-1;display:none}
.transfer-fields.visible{display:contents}
.transfer-header{grid-column:1/-1;display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:var(--radius);font-size:13px;font-weight:600;margin-top:4px}
.transfer-header.envio{background:var(--warning-light);color:var(--warning)}
.transfer-header.recebimento{background:var(--info-light);color:var(--info)}

/* FICHA */
.ficha-modal{max-width:800px}
.ficha-header-card{background:linear-gradient(135deg,var(--primary-dark),var(--primary));border-radius:var(--radius-lg);padding:24px;display:flex;align-items:center;gap:20px;margin-bottom:24px;color:#fff}
.ficha-avatar{width:80px;height:80px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;color:#fff;overflow:hidden;flex-shrink:0;border:3px solid rgba(255,255,255,.4)}
.ficha-avatar img{width:100%;height:100%;object-fit:cover}
.ficha-nome{font-size:20px;font-weight:700;margin-bottom:4px}
.ficha-mat{font-size:13px;opacity:.8}
.ficha-badges{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.ficha-badge{padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;background:rgba(255,255,255,.2);color:#fff}
.ficha-section{margin-bottom:20px}
.ficha-section-title{font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:12px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.ficha-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ficha-field{display:flex;flex-direction:column;gap:3px}
.ficha-field.full{grid-column:1/-1}
.ficha-field-label{font-size:11px;color:var(--text-muted);font-weight:500}
.ficha-field-value{font-size:14px;color:var(--text);font-weight:500}
.ficha-transf-card{background:var(--warning-light);border:1px solid #F0D090;border-radius:var(--radius);padding:16px;margin-bottom:20px}
.ficha-transf-card.recebimento{background:var(--info-light);border-color:#9EC5F0}
.ficha-transf-title{font-size:12px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.ficha-transf-title.envio{color:var(--warning)}
.ficha-transf-title.recebimento{color:var(--info)}
.ficha-export-btns{display:flex;gap:8px}

.empty-state{text-align:center;padding:48px 24px;color:var(--text-muted)}
.empty-state i{font-size:48px;margin-bottom:12px;display:block;opacity:.3}
.loading{text-align:center;padding:32px;color:var(--text-muted)}
.toast{position:fixed;bottom:24px;right:24px;background:#1a1a1a;color:#fff;padding:12px 16px;border-radius:var(--radius);font-size:13px;z-index:9999;transform:translateY(100px);transition:transform .3s;max-width:320px}
.toast.show{transform:translateY(0)}
.toast.success{background:var(--primary-dark)}
.toast.error{background:var(--danger)}
.action-btns{display:flex;gap:4px}
.filters{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.filter-select{padding:7px 10px;border:1px solid var(--border);border-radius:var(--radius);font-size:13px;background:var(--surface);color:var(--text);outline:none}
@media(max-width:768px){.sidebar{display:none}.main{margin-left:0}.form-grid{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.ficha-grid{grid-template-columns:1fr}}

/* EXPERIÊNCIA */
.exp-alert{border-radius:var(--radius-lg);padding:16px 20px;display:flex;align-items:center;gap:16px;margin-bottom:20px;border:1px solid}
.exp-alert.danger{background:#FFF5F5;border-color:#FED7D7;color:#C53030}
.exp-alert.warning{background:#FFFBEB;border-color:#FCD34D;color:#92400E}
.exp-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:20px}
.exp-card{background:var(--surface);border:2px solid var(--border);border-radius:var(--radius-lg);padding:14px;cursor:pointer;transition:all .2s;text-align:center}
.exp-card:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.1)}
.exp-card.active{border-color:var(--primary);background:var(--primary-light)}
.exp-card-value{font-size:28px;font-weight:700;margin-bottom:2px}
.exp-card-label{font-size:11px;color:var(--text-muted);font-weight:500;text-transform:uppercase;letter-spacing:.5px}
.exp-card.blue .exp-card-value{color:#185FA5}
.exp-card.green .exp-card-value{color:var(--primary-dark)}
.exp-card.amber .exp-card-value{color:var(--warning)}
.exp-card.red .exp-card-value{color:var(--danger)}
.exp-card.purple .exp-card-value{color:#6B21A8}
.exp-tabs{display:flex;gap:4px;margin-bottom:16px;background:var(--bg);padding:4px;border-radius:var(--radius);width:fit-content}
.exp-tab{padding:6px 16px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500;color:var(--text-muted);transition:all .15s}
.exp-tab.active{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.status-badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.status-exp1{background:#DBEAFE;color:#1E40AF}
.status-exp2{background:#FEF3C7;color:#92400E}
.status-efetivado{background:var(--success-light);color:var(--success)}
.status-vencendo{background:#FFF3CD;color:#856404;border:1px solid #FCD34D}
.status-vencida{background:var(--danger-light);color:var(--danger)}
.dias-restantes{font-weight:700;font-size:13px}
.dias-restantes.ok{color:var(--primary-dark)}
.dias-restantes.warn{color:var(--warning)}
.dias-restantes.danger{color:var(--danger)}
.obs-cell{max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;color:var(--text-muted);cursor:pointer}
.obs-cell:hover{color:var(--primary)}
.efetivar-btn{background:#E8F5E9;color:#2E7D32;border:1px solid #A5D6A7;border-radius:var(--radius);padding:4px 10px;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap}
.efetivar-btn:hover{background:#C8E6C9}
.obs-modal{max-width:480px}

/* FOLGAS */
.folga-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;margin-bottom:12px}
.folga-row{display:grid;grid-template-columns:220px 100px 120px 100px repeat(5,1fr);gap:0;align-items:stretch;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:6px;overflow:hidden}
.folga-cell{padding:10px 12px;border-right:1px solid var(--border);display:flex;flex-direction:column;justify-content:center;font-size:13px}
.folga-cell:last-child{border-right:none}
.folga-cell-header{font-size:10px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
.folga-venc{border-radius:6px;padding:4px 8px;font-size:12px;font-weight:600;text-align:center;margin-bottom:4px}
.folga-venc.ok{background:var(--success-light);color:var(--success)}
.folga-venc.warn{background:#FFF3CD;color:#856404;border:1px solid #FCD34D}
.folga-venc.danger{background:var(--danger-light);color:var(--danger)}
.folga-venc.future{background:var(--bg);color:var(--text-muted)}
.folga-saida-real{font-size:11px;color:var(--primary);cursor:pointer;text-decoration:underline}
.folga-saida-proj{font-size:11px;color:var(--text-muted)}
.folga-header-row{display:grid;grid-template-columns:220px 100px 120px 100px repeat(5,1fr);gap:0;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius) var(--radius) 0 0;margin-bottom:0;overflow:hidden}
.folga-header-cell{padding:8px 12px;font-size:10px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;border-right:1px solid var(--border)}
.folga-header-cell:last-child{border-right:none}
.folga-func-name{font-weight:600;font-size:13px}
.folga-func-sub{font-size:11px;color:var(--text-muted);margin-top:2px}
.passagem-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:500}
.passagem-aerea{background:#E6F1FB;color:#185FA5}
.passagem-terrestre{background:var(--success-light);color:var(--success)}
.passagem-nao{background:var(--bg);color:var(--text-muted)}
.folga-alert-banner{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:var(--radius);margin-bottom:8px;font-size:13px}
.folga-alert-banner.danger{background:var(--danger-light);border:1px solid #FCA5A5;color:#991B1B}
.folga-alert-banner.warn{background:#FFFBEB;border:1px solid #FCD34D;color:#92400E}

</style>
</head>
<body>
<aside class="sidebar">
  <div class="sidebar-header">
    <div class="sidebar-logo"><i class="ti ti-building-factory"></i> RH Manager</div>
    <div class="sidebar-sub">GTEL — Gestão de Colaboradores</div>
  </div>
  <nav class="sidebar-nav">
    <div class="nav-section">Principal</div>
    <div class="nav-item active" onclick="showPage('dashboard')"><i class="ti ti-dashboard"></i> Dashboard</div>
    <div class="nav-item" onclick="showPage('funcionarios')"><i class="ti ti-users"></i> Funcionários</div>
    <div class="nav-item" onclick="showPage('experiencia')"><i class="ti ti-certificate"></i> Experiência</div>
    <div class="nav-item" onclick="showPage('folgas')"><i class="ti ti-beach"></i> Folgas de Campo</div>
    <div class="nav-section">Cadastros</div>
    <div class="nav-item" onclick="showPage('obras')"><i class="ti ti-building-skyscraper"></i> Obras / Contratos</div>
    <div class="nav-item" onclick="showPage('empresas')"><i class="ti ti-briefcase"></i> Empresas</div>
  </nav>
</aside>
<main class="main" id="main-content"></main>
<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL='https://lqggoshphakeuufibdno.supabase.co';
const SUPABASE_KEY='sb_publishable_QlnJaa5xdUXePvXFV6QFwQ_AmMk639T';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let funcionarios=[],obras=[],empresas=[],funcoes=[];

function showToast(msg,type='success'){
  const t=document.getElementById('toast');
  t.textContent=msg;t.className='toast show '+type;
  setTimeout(()=>t.className='toast',3000);
}
function initials(n){if(!n)return'?';return n.split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase();}
function badgeSituacao(s){
  const map={ativo:'badge-green',inativo:'badge-red',transferido:'badge-amber'};
  const labels={ativo:'Ativo',inativo:'Inativo',transferido:'Transferido'};
  return`<span class="badge ${map[s]||'badge-blue'}">${labels[s]||s}</span>`;
}
function formatDate(d){
  if(!d)return'—';
  if(d instanceof Date){if(isNaN(d.getTime()))return'—';return d.toLocaleDateString('pt-BR');}
  const parsed=new Date(d+'T12:00:00');
  if(isNaN(parsed.getTime()))return'—';
  return parsed.toLocaleDateString('pt-BR');
}
const UFS=['AC','AL','AM','AP','BA','CE','DF','ES','GO','MA','MG','MS','MT','PA','PB','PE','PI','PR','RJ','RN','RO','RR','RS','SC','SE','SP','TO'];

async function loadAll(){
  const [f,o,e,fn]=await Promise.all([
    sb.from('funcionarios').select('*,funcao:funcoes!funcionarios_funcao_id_fkey(nome),empresa:empresas!funcionarios_empresa_id_fkey(nome),obra:obras!funcionarios_obra_id_fkey(nome,codigo),obra_transferencia:obras!funcionarios_obra_transferencia_id_fkey(nome,codigo)').order('nome_completo'),
    sb.from('obras').select('*,empresa:empresas(nome)').order('nome'),
    sb.from('empresas').select('*').order('nome'),
    sb.from('funcoes').select('*').order('nome'),
  ]);
  if(f.error){console.error('Erro funcionarios:',f.error);}
  funcionarios=f.data||[];obras=o.data||[];empresas=e.data||[];funcoes=fn.data||[];
}

async function showPage(page){
  document.querySelectorAll('.nav-item').forEach(el=>{
    const t=el.textContent.trim().toLowerCase();
    el.classList.toggle('active',
      (page==='dashboard'&&t.includes('dashboard'))||
      (page==='funcionarios'&&t.includes('funcionário'))||
      (page==='experiencia'&&t.includes('experiência'))||
      (page==='folgas'&&t.includes('folga'))||
      (page==='obras'&&t.includes('obra'))||
      (page==='empresas'&&t.includes('empresa'))
    );
  });
  document.getElementById('main-content').innerHTML='<div class="loading"><i class="ti ti-loader ti-spin"></i> Carregando...</div>';
  await loadAll();
  if(page==='dashboard')renderDashboard();
  else if(page==='funcionarios')renderFuncionarios();
  else if(page==='experiencia')renderExperiencia();
  else if(page==='folgas')renderFolgas();
  else if(page==='obras')renderObras();
  else if(page==='empresas')renderEmpresas();
}

// ─── DASHBOARD ───────────────────────────────────────────────────────────────
async function renderDashboard(){
  // Load folgas too for dashboard
  await loadFolgas();

  const hoje = new Date(); hoje.setHours(0,0,0,0);
  const ativos = funcionarios.filter(f=>f.situacao==='ativo'||f.situacao==='transferido').length;
  const inativos = funcionarios.filter(f=>f.situacao==='inativo').length;
  const transferidos = funcionarios.filter(f=>f.situacao==='transferido').length;
  const admMes = funcionarios.filter(f=>{
    if(!f.data_admissao) return false;
    const d = new Date(f.data_admissao+'T12:00:00');
    return d.getMonth()===hoje.getMonth() && d.getFullYear()===hoje.getFullYear();
  }).length;

  // Experiência stats
  const ativosLista = funcionarios.filter(f=>f.situacao==='ativo'||f.situacao==='transferido');
  const comExp = ativosLista.map(f=>({...f,_exp:calcExp(f)})).filter(f=>f._exp);
  const emExp = comExp.filter(f=>['exp1','exp2','vencendo'].includes(f._exp.status)).length;
  const expVencendo = comExp.filter(f=>f._exp.status==='vencendo').length;
  const expVencidas = comExp.filter(f=>f._exp.status==='vencida').length;

  // Folgas stats
  let folgasVencidas=0, folgasVencendo=0;
  folgas.forEach(f=>{
    const vencs=calcVencimentos(f);
    vencs.forEach((v,i)=>{
      const st=vencStatus(v,f[`saida${i+1}_real`]);
      if(st==='danger') folgasVencidas++;
      if(st==='warn') folgasVencendo++;
    });
  });

  // Por obra
  const byObra={};
  ativosLista.forEach(f=>{
    const key=f.obra?.codigo?`${f.obra.codigo} — ${f.obra.nome}`:'Sem obra';
    byObra[key]=(byObra[key]||0)+1;
  });

  // Por função
  const byFuncao={};
  ativosLista.forEach(f=>{
    const key=f.funcao?.nome||f.funcao_manual||'Sem função';
    byFuncao[key]=(byFuncao[key]||0)+1;
  });

  // Admissões últimos 6 meses
  const admissoesMeses=[];
  for(let i=5;i>=0;i--){
    const d=new Date(); d.setMonth(d.getMonth()-i);
    const label=d.toLocaleDateString('pt-BR',{month:'short',year:'2-digit'});
    const count=funcionarios.filter(f=>{
      if(!f.data_admissao)return false;
      const fd=new Date(f.data_admissao+'T12:00:00');
      return fd.getMonth()===d.getMonth()&&fd.getFullYear()===d.getFullYear();
    }).length;
    admissoesMeses.push({label,count});
  }
  const maxAdm=Math.max(...admissoesMeses.map(m=>m.count),1);

  // Alertas críticos
  const alertas=[];
  if(expVencidas>0) alertas.push({tipo:'danger',icon:'ti-certificate',msg:`${expVencidas} experiência(s) vencida(s) — ação necessária`,link:'experiencia'});
  if(folgasVencidas>0) alertas.push({tipo:'danger',icon:'ti-beach',msg:`${folgasVencidas} folga(s) vencida(s) — colaboradores sem folga`,link:'folgas'});
  if(expVencendo>0) alertas.push({tipo:'warning',icon:'ti-certificate',msg:`${expVencendo} experiência(s) vencendo em 15 dias`,link:'experiencia'});
  if(folgasVencendo>0) alertas.push({tipo:'warning',icon:'ti-beach',msg:`${folgasVencendo} folga(s) vencendo em 15 dias`,link:'folgas'});

  const alertasHtml = alertas.map(a=>`
    <div onclick="showPage('${a.link}')" style="display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:var(--radius);cursor:pointer;margin-bottom:6px;
      background:${a.tipo==='danger'?'var(--danger-light)':'var(--warning-light)'};
      border:1px solid ${a.tipo==='danger'?'#FCA5A5':'#FCD34D'};
      color:${a.tipo==='danger'?'#991B1B':'#92400E'}">
      <i class="ti ${a.icon}" style="font-size:18px;flex-shrink:0"></i>
      <span style="font-size:13px;font-weight:500">${a.msg}</span>
      <i class="ti ti-chevron-right" style="margin-left:auto;opacity:.5"></i>
    </div>`).join('');

  const obraRows=Object.entries(byObra).sort((a,b)=>b[1]-a[1]).map(([obra,qtd])=>`
    <div style="display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--border)">
      <div style="font-size:13px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${obra}</div>
      <div style="font-weight:700;font-size:14px;color:var(--primary-dark);min-width:24px;text-align:right">${qtd}</div>
      <div style="width:100px;background:var(--border);border-radius:4px;height:6px;flex-shrink:0">
        <div style="background:var(--primary);border-radius:4px;height:6px;width:${Math.round(qtd/(ativos||1)*100)}%"></div>
      </div>
    </div>`).join('');

  const funcaoRows=Object.entries(byFuncao).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([fn,qtd])=>`
    <div style="display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--border)">
      <div style="font-size:12px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${fn}</div>
      <div style="font-weight:700;font-size:14px;color:var(--info);min-width:24px;text-align:right">${qtd}</div>
      <div style="width:100px;background:var(--border);border-radius:4px;height:6px;flex-shrink:0">
        <div style="background:var(--info);border-radius:4px;height:6px;width:${Math.round(qtd/(ativos||1)*100)}%"></div>
      </div>
    </div>`).join('');

  const admBarras=admissoesMeses.map(m=>`
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px;flex:1">
      <div style="font-weight:700;font-size:13px;color:var(--primary-dark)">${m.count}</div>
      <div style="width:100%;background:var(--border);border-radius:4px;height:60px;display:flex;align-items:flex-end">
        <div style="background:var(--primary);border-radius:4px;width:100%;height:${Math.round(m.count/maxAdm*100)}%;min-height:${m.count>0?4:0}px;transition:height .3s"></div>
      </div>
      <div style="font-size:11px;color:var(--text-muted);text-transform:capitalize">${m.label}</div>
    </div>`).join('');

  // Próximas folgas (top 5 urgentes)
  const proximasFolgas=[];
  folgas.forEach(f=>{
    const vencs=calcVencimentos(f);
    vencs.forEach((v,i)=>{
      if(f[`saida${i+1}_real`]) return;
      const diff=Math.floor((v-hoje)/86400000);
      if(diff>=0&&diff<=60){
        proximasFolgas.push({
          nome:f.funcionario?.nome_completo||'—',
          mat:f.funcionario?.matricula||'',
          venc:v, diff, num:i+1
        });
      }
    });
  });
  proximasFolgas.sort((a,b)=>a.diff-b.diff);
  const folgasRows=proximasFolgas.slice(0,6).map(f=>`
    <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)">
      <div>
        <div style="font-size:13px;font-weight:500">${f.nome}</div>
        <div style="font-size:11px;color:var(--text-muted)">${f.mat} · Venc.${f.num}</div>
      </div>
      <div style="text-align:right">
        <div style="font-size:12px;font-weight:700;color:${f.diff<=15?'var(--warning)':'var(--primary-dark)'}">
          ${f.diff===0?'Hoje':f.diff===1?'Amanhã':`${f.diff}d`}
        </div>
        <div style="font-size:11px;color:var(--text-muted)">${formatDate(f.venc)}</div>
      </div>
    </div>`).join('') || '<div style="color:var(--text-muted);font-size:13px;padding:12px 0">Nenhuma folga próxima</div>';

  // Próximas efetivações
  const proxEfet=comExp.filter(f=>f._exp.status==='exp1'||f._exp.status==='exp2'||f._exp.status==='vencendo')
    .sort((a,b)=>(a._exp.restantes||0)-(b._exp.restantes||0)).slice(0,6);
  const efetRows=proxEfet.map(f=>`
    <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)">
      <div>
        <div style="font-size:13px;font-weight:500">${f.nome_completo}</div>
        <div style="font-size:11px;color:var(--text-muted)">${f.matricula||''} · ${f._exp.status==='exp1'?'Exp.1':'Exp.2'}</div>
      </div>
      <div style="text-align:right">
        <div style="font-size:12px;font-weight:700;color:${f._exp.restantes<=15?'var(--warning)':'var(--text-muted)'}">
          ${f._exp.restantes}d
        </div>
        <div style="font-size:11px;color:var(--text-muted)">${formatDate(f._exp.status==='exp1'?f._exp.fim1:f._exp.fim2)}</div>
      </div>
    </div>`).join('') || '<div style="color:var(--text-muted);font-size:13px;padding:12px 0">Nenhuma pendente</div>';

  document.getElementById('main-content').innerHTML=`
    <div class="page-header">
      <div><div class="page-title">Dashboard</div><div class="page-subtitle">Visão geral em tempo real — ${new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'})}</div></div>
      <button class="btn btn-primary" onclick="showPage('funcionarios')"><i class="ti ti-users"></i> Ver funcionários</button>
    </div>

    ${alertas.length?`<div style="margin-bottom:20px">${alertasHtml}</div>`:''}

    <!-- MÉTRICAS PRINCIPAIS -->
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:20px">
      <div class="metric-card" style="cursor:pointer" onclick="showPage('funcionarios')">
        <div class="metric-label">Total</div><div class="metric-value">${funcionarios.length}</div>
      </div>
      <div class="metric-card green" style="cursor:pointer" onclick="showPage('funcionarios')">
        <div class="metric-label">Ativos</div><div class="metric-value">${ativos}</div>
      </div>
      <div class="metric-card red" style="cursor:pointer" onclick="showPage('funcionarios')">
        <div class="metric-label">Inativos</div><div class="metric-value">${inativos}</div>
      </div>
      <div class="metric-card amber" style="cursor:pointer" onclick="showPage('funcionarios')">
        <div class="metric-label">Transferidos</div><div class="metric-value">${transferidos}</div>
      </div>
      <div class="metric-card" style="cursor:pointer" onclick="showPage('funcionarios')">
        <div class="metric-label">Adm. no mês</div><div class="metric-value">${admMes}</div>
      </div>
      <div class="metric-card" style="cursor:pointer" onclick="showPage('obras')">
        <div class="metric-label">Obras</div><div class="metric-value">${obras.length}</div>
      </div>
    </div>

    <!-- MÉTRICAS EXPERIÊNCIA + FOLGAS -->
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px">
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;cursor:pointer" onclick="showPage('experiencia')">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">
          <i class="ti ti-certificate" style="color:var(--info);font-size:18px"></i>
          <span style="font-weight:600;font-size:14px">Controle de Experiência</span>
          <i class="ti ti-chevron-right" style="margin-left:auto;color:var(--text-muted)"></i>
        </div>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">
          <div style="text-align:center;padding:8px;background:var(--bg);border-radius:var(--radius)">
            <div style="font-size:22px;font-weight:700;color:#185FA5">${emExp}</div>
            <div style="font-size:10px;color:var(--text-muted);text-transform:uppercase">Em Exp.</div>
          </div>
          <div style="text-align:center;padding:8px;background:var(--warning-light);border-radius:var(--radius)">
            <div style="font-size:22px;font-weight:700;color:var(--warning)">${expVencendo}</div>
            <div style="font-size:10px;color:var(--warning);text-transform:uppercase">Vencendo</div>
          </div>
          <div style="text-align:center;padding:8px;background:var(--danger-light);border-radius:var(--radius)">
            <div style="font-size:22px;font-weight:700;color:var(--danger)">${expVencidas}</div>
            <div style="font-size:10px;color:var(--danger);text-transform:uppercase">Vencidas</div>
          </div>
        </div>
      </div>
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;cursor:pointer" onclick="showPage('folgas')">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">
          <i class="ti ti-beach" style="color:var(--primary);font-size:18px"></i>
          <span style="font-weight:600;font-size:14px">Controle de Folgas</span>
          <i class="ti ti-chevron-right" style="margin-left:auto;color:var(--text-muted)"></i>
        </div>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">
          <div style="text-align:center;padding:8px;background:var(--bg);border-radius:var(--radius)">
            <div style="font-size:22px;font-weight:700;color:var(--primary-dark)">${folgas.length}</div>
            <div style="font-size:10px;color:var(--text-muted);text-transform:uppercase">Total</div>
          </div>
          <div style="text-align:center;padding:8px;background:var(--warning-light);border-radius:var(--radius)">
            <div style="font-size:22px;font-weight:700;color:var(--warning)">${folgasVencendo}</div>
            <div style="font-size:10px;color:var(--warning);text-transform:uppercase">Vencendo</div>
          </div>
          <div style="text-align:center;padding:8px;background:var(--danger-light);border-radius:var(--radius)">
            <div style="font-size:22px;font-weight:700;color:var(--danger)">${folgasVencidas}</div>
            <div style="font-size:10px;color:var(--danger);text-transform:uppercase">Vencidas</div>
          </div>
        </div>
      </div>
    </div>

    <!-- LINHA 3: Obras + Funções -->
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px">
      <div class="table-container" style="padding:16px">
        <div style="font-weight:600;font-size:14px;margin-bottom:12px;display:flex;align-items:center;gap:8px">
          <i class="ti ti-building-skyscraper" style="color:var(--primary)"></i> Distribuição por Obra
        </div>
        ${obraRows||'<div style="color:var(--text-muted);font-size:13px;padding:12px 0">Nenhum dado</div>'}
      </div>
      <div class="table-container" style="padding:16px">
        <div style="font-weight:600;font-size:14px;margin-bottom:12px;display:flex;align-items:center;gap:8px">
          <i class="ti ti-tool" style="color:var(--info)"></i> Funcionários por Função
        </div>
        ${funcaoRows||'<div style="color:var(--text-muted);font-size:13px;padding:12px 0">Nenhum dado</div>'}
      </div>
    </div>

    <!-- LINHA 4: Folgas próximas + Efetivações + Admissões -->
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px">
      <div class="table-container" style="padding:16px">
        <div style="font-weight:600;font-size:14px;margin-bottom:12px;display:flex;align-items:center;gap:8px;cursor:pointer" onclick="showPage('folgas')">
          <i class="ti ti-beach" style="color:var(--primary)"></i> Próximas Folgas
          <i class="ti ti-chevron-right" style="margin-left:auto;color:var(--text-muted);font-size:12px"></i>
        </div>
        ${folgasRows}
      </div>
      <div class="table-container" style="padding:16px">
        <div style="font-weight:600;font-size:14px;margin-bottom:12px;display:flex;align-items:center;gap:8px;cursor:pointer" onclick="showPage('experiencia')">
          <i class="ti ti-certificate" style="color:var(--info)"></i> Efetivações Pendentes
          <i class="ti ti-chevron-right" style="margin-left:auto;color:var(--text-muted);font-size:12px"></i>
        </div>
        ${efetRows}
      </div>
      <div class="table-container" style="padding:16px">
        <div style="font-weight:600;font-size:14px;margin-bottom:12px;display:flex;align-items:center;gap:8px">
          <i class="ti ti-chart-bar" style="color:var(--primary)"></i> Admissões (6 meses)
        </div>
        <div style="display:flex;align-items:flex-end;gap:6px;height:100px">
          ${admBarras}
        </div>
      </div>
    </div>
  `;
}

// ─── FUNCIONÁRIOS ─────────────────────────────────────────────────────────────
let filtroSituacao='',filtroObra='',busca='';

function renderFuncionarios(){
  let lista=funcionarios;
  if(filtroSituacao)lista=lista.filter(f=>f.situacao===filtroSituacao);
  if(filtroObra)lista=lista.filter(f=>f.obra_id===filtroObra);
  if(busca)lista=lista.filter(f=>f.nome_completo?.toLowerCase().includes(busca.toLowerCase())||f.matricula?.includes(busca));

  const rows=lista.length?lista.map(f=>{
    const funcaoNome=f.funcao?.nome||f.funcao_manual||'—';
    const avatarContent=f.foto_url?`<img src="${f.foto_url}" alt="">`:initials(f.nome_completo);
    return`<tr>
      <td><div class="name-cell">
        <div class="avatar">${avatarContent}</div>
        <div><div style="font-weight:500">${f.nome_completo}</div><div style="font-size:11px;color:var(--text-muted)">${f.matricula||'—'}</div></div>
      </div></td>
      <td>${funcaoNome}</td>
      <td>${f.obra?.codigo?f.obra.codigo+' ':''} ${f.obra?.nome||'—'}</td>
      <td>${f.empresa?.nome||'—'}</td>
      <td>${formatDate(f.data_admissao)}</td>
      <td>${badgeSituacao(f.situacao)}</td>
      <td><div class="action-btns">
        <button class="btn btn-sm btn-info" title="Visualizar ficha" onclick="verFicha('${f.id}')"><i class="ti ti-eye"></i></button>
        <button class="btn btn-sm" title="Editar" onclick="editFuncionario('${f.id}')"><i class="ti ti-edit"></i></button>
        <button class="btn btn-sm btn-danger" title="Excluir" onclick="deleteFuncionario('${f.id}','${(f.nome_completo||'').replace(/'/g,"\\'")}')"><i class="ti ti-trash"></i></button>
      </div></td>
    </tr>`;}).join('')
    :`<tr><td colspan="7"><div class="empty-state"><i class="ti ti-users"></i><div>Nenhum funcionário encontrado</div></div></td></tr>`;

  const obraOptions=obras.map(o=>`<option value="${o.id}" ${filtroObra===o.id?'selected':''}>${o.codigo} — ${o.nome}</option>`).join('');
  document.getElementById('main-content').innerHTML=`
    <div class="page-header">
      <div><div class="page-title">Funcionários</div><div class="page-subtitle">${lista.length} de ${funcionarios.length} registros</div></div>
      <button class="btn btn-primary" onclick="openModalFuncionario()"><i class="ti ti-plus"></i> Novo funcionário</button>
    </div>
    <div class="filters">
      <div class="search-box"><i class="ti ti-search"></i>
        <input placeholder="Buscar por nome ou matrícula..." value="${busca}" oninput="busca=this.value;renderFuncionarios()">
      </div>
      <select class="filter-select" onchange="filtroSituacao=this.value;renderFuncionarios()">
        <option value="">Todas situações</option>
        <option value="ativo" ${filtroSituacao==='ativo'?'selected':''}>Ativo</option>
        <option value="inativo" ${filtroSituacao==='inativo'?'selected':''}>Inativo</option>
        <option value="transferido" ${filtroSituacao==='transferido'?'selected':''}>Transferido</option>
      </select>
      <select class="filter-select" onchange="filtroObra=this.value;renderFuncionarios()">
        <option value="">Todas obras</option>${obraOptions}
      </select>
    </div>
    <div class="table-container"><table>
      <thead><tr><th>Funcionário</th><th>Função</th><th>Obra / Contrato</th><th>Empresa</th><th>Admissão</th><th>Situação</th><th></th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>`;
}

// ─── FICHA DO FUNCIONÁRIO ─────────────────────────────────────────────────────
function verFicha(id){
  const f=funcionarios.find(x=>x.id===id);
  if(!f)return;
  const funcaoNome=f.funcao?.nome||f.funcao_manual||'—';
  const isTransf=f.situacao==='transferido';
  const tipoTransf=f.tipo_transferencia||'';

  let transferSection='';
  if(isTransf&&tipoTransf){
    const isEnvio=tipoTransf==='envio';
    transferSection=`
      <div class="ficha-transf-card ${tipoTransf}">
        <div class="ficha-transf-title ${tipoTransf}">
          <i class="ti ti-${isEnvio?'arrow-right':'arrow-left'}"></i>
          ${isEnvio?'📤 Envio — Transferido para outra obra':'📥 Recebimento — Recebido de outra obra'}
        </div>
        <div class="ficha-grid">
          <div class="ficha-field">
            <div class="ficha-field-label">${isEnvio?'Obra de Destino':'Obra de Origem'}</div>
            <div class="ficha-field-value">${f.obra_transferencia?.codigo?f.obra_transferencia.codigo+' ':''} ${f.obra_transferencia?.nome||'—'}</div>
          </div>
          <div class="ficha-field">
            <div class="ficha-field-label">Data da Transferência</div>
            <div class="ficha-field-value">${formatDate(f.data_transferencia)}</div>
          </div>
          <div class="ficha-field">
            <div class="ficha-field-label">Centro de Custo</div>
            <div class="ficha-field-value">${f.centro_custo_transferencia||'—'}</div>
          </div>
          <div class="ficha-field">
            <div class="ficha-field-label">${isEnvio?'Data de Desmobilização':'Data de Mobilização'}</div>
            <div class="ficha-field-value">${formatDate(isEnvio?f.data_desmobilizacao:f.data_mobilizacao)}</div>
          </div>
        </div>
      </div>`;
  }

  const html=`
    <div class="modal-overlay" id="modal-ficha" onclick="if(event.target===this)closeModal('modal-ficha')">
      <div class="modal ficha-modal">
        <div class="modal-header">
          <span class="modal-title"><i class="ti ti-id-badge"></i> Ficha do Funcionário</span>
          <div style="display:flex;gap:8px;align-items:center">
            <div class="ficha-export-btns">
              <button class="btn btn-sm btn-success" onclick="exportFichaPDF('${id}')"><i class="ti ti-file-type-pdf"></i> PDF</button>
              <button class="btn btn-sm" style="background:#E8F5E9;color:#2E7D32;border:none" onclick="exportFichaExcel('${id}')"><i class="ti ti-file-type-xls"></i> Excel</button>
            </div>
            <button class="btn btn-sm" onclick="closeModal('modal-ficha')"><i class="ti ti-x"></i></button>

async function exportFichaPDF(id){
  const f=funcionarios.find(x=>x.id===id);
  if(!f)return;
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF();
  const funcaoNome=f.funcao?.nome||f.funcao_manual||'—';

  // Header
  doc.setFillColor(15,110,86);
  doc.rect(0,0,210,40,'F');
  doc.setTextColor(255,255,255);
  doc.setFontSize(18);doc.setFont('helvetica','bold');
  doc.text('GTEL — RH Manager',14,16);
  doc.setFontSize(11);doc.setFont('helvetica','normal');
  doc.text('Ficha de Registro de Colaborador',14,26);
  doc.setFontSize(9);
  doc.text(`Emitido em: ${new Date().toLocaleDateString('pt-BR')}`,14,34);

  doc.setTextColor(26,26,26);
  let y=52;

  const field=(label,val,x=14,yy=y)=>{
    doc.setFontSize(8);doc.setFont('helvetica','bold');doc.setTextColor(107,114,128);
    doc.text(label.toUpperCase(),x,yy);
    doc.setFontSize(11);doc.setFont('helvetica','normal');doc.setTextColor(26,26,26);
    doc.text(String(val||'—'),x,yy+6);
    return yy+14;
  };

  doc.setFontSize(12);doc.setFont('helvetica','bold');
  doc.text(f.nome_completo||'',14,y);y+=7;
  doc.setFontSize(10);doc.setFont('helvetica','normal');doc.setTextColor(107,114,128);
  doc.text(`Matrícula: ${f.matricula||'—'}`,14,y);y+=14;

  doc.setDrawColor(229,231,235);doc.line(14,y,196,y);y+=8;
  doc.setFontSize(10);doc.setFont('helvetica','bold');doc.setTextColor(26,26,26);
  doc.text('DADOS PROFISSIONAIS',14,y);y+=8;

  y=field('Função',funcaoNome,14,y);
  field('Empresa',f.empresa?.nome,110,y-14);
  y=field('Obra / Contrato',`${f.obra?.codigo||''} ${f.obra?.nome||'—'}`.trim(),14,y);
  field('Situação',f.situacao,110,y-14);
  y=field('Data de Admissão',formatDate(f.data_admissao),14,y);
  field('Data de Integração',formatDate(f.data_mobilizacao),110,y-14);
  y=field('Cidade',f.cidade,14,y);
  field('UF',f.uf,110,y-14);

  if(f.situacao==='transferido'&&f.tipo_transferencia){
    doc.setDrawColor(229,231,235);doc.line(14,y,196,y);y+=8;
    const isEnvio=f.tipo_transferencia==='envio';
    doc.setFontSize(10);doc.setFont('helvetica','bold');
    doc.setTextColor(isEnvio?186:24,isEnvio?117:95,isEnvio?23:161);
    doc.text(`TRANSFERÊNCIA — ${isEnvio?'ENVIO':'RECEBIMENTO'}`,14,y);y+=8;
    doc.setTextColor(26,26,26);
    y=field(isEnvio?'Obra de Destino':'Obra de Origem',`${f.obra_transferencia?.codigo||''} ${f.obra_transferencia?.nome||'—'}`.trim(),14,y);
    field('Data da Transferência',formatDate(f.data_transferencia),110,y-14);
    y=field('Centro de Custo',f.centro_custo_transferencia,14,y);
    field(isEnvio?'Data de Desmobilização':'Data de Mobilização',formatDate(isEnvio?f.data_desmobilizacao:f.data_mobilizacao),110,y-14);
  }

  doc.save(`Ficha_${(f.nome_completo||'funcionario').replace(/\s+/g,'_')}.pdf`);
  showToast('PDF exportado com sucesso!');
}

function exportFichaExcel(id){
  const f=funcionarios.find(x=>x.id===id);
  if(!f)return;
  const funcaoNome=f.funcao?.nome||f.funcao_manual||'—';
  const dados=[
    ['FICHA DE REGISTRO — GTEL RH Manager',''],
    ['Emitido em',new Date().toLocaleDateString('pt-BR')],
    ['',''],
    ['DADOS PROFISSIONAIS',''],
    ['Nome Completo',f.nome_completo||'—'],
    ['Matrícula',f.matricula||'—'],
    ['Função',funcaoNome],
    ['Empresa',f.empresa?.nome||'—'],
    ['Obra / Contrato',`${f.obra?.codigo||''} ${f.obra?.nome||'—'}`.trim()],
    ['Data de Admissão',formatDate(f.data_admissao)],
    ['Data de Integração',formatDate(f.data_mobilizacao)],
    ['Situação',f.situacao||'—'],
    ['Tipo',f.tipo==='nova_admissao'?'Nova Admissão':'Transferência'],
    ['Cidade',f.cidade||'—'],
    ['UF',f.uf||'—'],
  ];
  if(f.situacao==='transferido'&&f.tipo_transferencia){
    const isEnvio=f.tipo_transferencia==='envio';
    dados.push(['','']);
    dados.push([`TRANSFERÊNCIA — ${isEnvio?'ENVIO':'RECEBIMENTO'}`,'']);
    dados.push([isEnvio?'Obra de Destino':'Obra de Origem',`${f.obra_transferencia?.codigo||''} ${f.obra_transferencia?.nome||'—'}`.trim()]);
    dados.push(['Data da Transferência',formatDate(f.data_transferencia)]);
    dados.push(['Centro de Custo',f.centro_custo_transferencia||'—']);
    dados.push([isEnvio?'Data de Desmobilização':'Data de Mobilização',formatDate(isEnvio?f.data_desmobilizacao:f.data_mobilizacao)]);
  }
  const ws=XLSX.utils.aoa_to_sheet(dados);
  ws['!cols']=[{wch:30},{wch:40}];
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Ficha');
  XLSX.writeFile(wb,`Ficha_${(f.nome_completo||'funcionario').replace(/\s+/g,'_')}.xlsx`);
  showToast('Excel exportado com sucesso!');
}

function previewFoto(input){
  fotoFile=input.files[0];if(!fotoFile)return;
  const reader=new FileReader();
  reader.onload=e=>{document.getElementById('foto-prev').innerHTML=`<img src="${e.target.result}" alt="" style="width:100%;height:100%;object-fit:cover">`;};
  reader.readAsDataURL(fotoFile);
}

async function saveFuncionario(id){
  const nome=document.getElementById('f-nome').value.trim();
  const mat=document.getElementById('f-matricula').value.trim();
  if(!nome||!mat){showToast('Nome e matrícula são obrigatórios','error');return;}

  let foto_url=null;
  if(fotoFile){
    const ext=fotoFile.name.split('.').pop();
    const path=`fotos/${Date.now()}.${ext}`;
    const {error:upErr}=await sb.storage.from('funcionarios').upload(path,fotoFile);
    if(!upErr){const {data}=sb.storage.from('funcionarios').getPublicUrl(path);foto_url=data.publicUrl;}
  }

  const situacao=document.getElementById('f-situacao').value;
  const isTransf=situacao==='transferido';
  const funcaoSelect=document.getElementById('f-funcao-select').value;
  const funcaoManual=document.getElementById('f-funcao-input').value.trim();

  const payload={
    nome_completo:nome,matricula:mat,
    data_admissao:document.getElementById('f-admissao').value||null,
    data_mobilizacao:isTransf&&tipoTransferencia==='recebimento'
      ?(document.getElementById('f-mobilizacao').value||null)
      :(document.getElementById('f-integracao').value||null),
    situacao,tipo:document.getElementById('f-tipo').value,
    funcao_id:(!funcaoModoManual&&funcaoSelect)?funcaoSelect:null,
    funcao_manual:funcaoModoManual?funcaoManual:null,
    empresa_id:document.getElementById('f-empresa').value||null,
    obra_id:document.getElementById('f-obra').value||null,
    cidade:document.getElementById('f-cidade').value||null,
    uf:document.getElementById('f-uf').value||null,
    periodo_experiencia: parseInt(document.getElementById('f-periodo-exp').value)||45,
    transferido:isTransf,
    tipo_transferencia:isTransf?tipoTransferencia:null,
    data_transferencia:isTransf?(document.getElementById('f-data-transf').value||null):null,
    obra_transferencia_id:isTransf?(document.getElementById('f-obra-transf').value||null):null,
    centro_custo_transferencia:isTransf?(document.getElementById('f-centro-custo').value||null):null,
    data_desmobilizacao:isTransf&&tipoTransferencia==='envio'?(document.getElementById('f-desmobilizacao').value||null):null,
  };
  if(foto_url)payload.foto_url=foto_url;

  const saveBtn=document.querySelector('#modal-func .btn-primary');
  if(saveBtn) saveBtn.disabled=true;
  let err;
  if(id){({error:err}=await sb.from('funcionarios').update(payload).eq('id',id));}
  else{({error:err}=await sb.from('funcionarios').insert(payload));}
  if(saveBtn) saveBtn.disabled=false;
  if(err){showToast('Erro: '+err.message,'error');return;}
  showToast(id?'Funcionário atualizado!':'Funcionário cadastrado!');
  closeModal('modal-func');fotoFile=null;
  await loadAll();renderFuncionarios();
}

async function editFuncionario(id){const func=funcionarios.find(f=>f.id===id);if(func)openModalFuncionario(func);}

async function deleteFuncionario(id,nome){
  if(!confirm(`Deseja remover ${nome}?`))return;
  const {error}=await sb.from('funcionarios').delete().eq('id',id);
  if(error){showToast('Erro ao remover','error');return;}
  showToast('Funcionário removido');await loadAll();renderFuncionarios();
}

<!-- EXPERIÊNCIA MODULE - injected -->
<script>
// ─── FOLGAS DE CAMPO ─────────────────────────────────────────────────────────
let folgas = [];
let folgasBusca = '';
let folgasFiltro = 'todos'; // todos, vencidas, vencendo, ok

async function loadFolgas(){
  const {data,error} = await sb.from('folgas')
    .select('*,funcionario:funcionarios!folgas_funcionario_id_fkey(id,nome_completo,matricula,funcao:funcoes!funcionarios_funcao_id_fkey(nome),funcao_manual,obra:obras!funcionarios_obra_id_fkey(nome,codigo))')
    .order('data_inicio');
  if(error) console.error('Folgas error:',error);
  folgas = data||[];
}

function calcVencimentos(folga){
  if(!folga.data_inicio) return [];
  const inicio = new Date(folga.data_inicio+'T12:00:00');
  if(isNaN(inicio.getTime())) return [];
  const periodo = parseInt(folga.periodo_trabalhado)||90;
  const venc = [];
  for(let i=1;i<=5;i++){
    const d = new Date(inicio.getTime());
    d.setDate(d.getDate() + periodo * i);
    venc.push(d);
  }
  return venc;
}

function vencStatus(vencDate, saidaReal){
  if(saidaReal) return 'ok'; // já saiu
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  const diff = Math.floor((vencDate - hoje)/86400000);
  if(diff < 0) return 'danger';   // vencido
  if(diff <= 15) return 'warn';   // alerta 15 dias
  return 'future';
}

function passagemLabel(f){
  const parts=[];
  if(f.tipo_passagem_aerea) parts.push('<span class="passagem-badge passagem-aerea">✈️ Aérea</span>');
  if(f.tipo_passagem_terrestre) parts.push('<span class="passagem-badge passagem-terrestre">🚌 Terrestre</span>');
  if(!parts.length) parts.push('<span class="passagem-badge passagem-nao">— Não</span>');
  return parts.join('<br>');
}

async function renderFolgas(){
  document.getElementById('main-content').innerHTML='<div class="loading"><i class="ti ti-loader ti-spin"></i> Carregando...</div>';
  await Promise.all([loadAll(), loadFolgas()]);

  const hoje = new Date(); hoje.setHours(0,0,0,0);

  // Calcular alertas globais
  let totalVencidas=0, totalVencendo=0;
  folgas.forEach(f=>{
    const vencs = calcVencimentos(f);
    vencs.forEach((v,i)=>{
      const saidaReal = f[`saida${i+1}_real`];
      const st = vencStatus(v, saidaReal);
      if(st==='danger') totalVencidas++;
      if(st==='warn') totalVencendo++;
    });
  });

  // Filtro + busca
  // Sort by nearest upcoming vencimento
  const hoje2 = new Date(); hoje2.setHours(0,0,0,0);
  const sortedFolgas = [...folgas].sort((a,b)=>{
    const getNearest = f => {
      const vencs = calcVencimentos(f);
      const upcoming = vencs.map((v,i)=>({v,saidaReal:f[`saida${i+1}_real`]}))
        .filter(x=>!x.saidaReal)
        .map(x=>Math.floor((x.v-hoje2)/86400000));
      if(!upcoming.length) return 99999;
      // Prioritize overdue first, then nearest upcoming
      const overdue = upcoming.filter(d=>d<0);
      if(overdue.length) return Math.min(...overdue); // most overdue first
      return Math.min(...upcoming);
    };
    return getNearest(a)-getNearest(b);
  });

  let lista = sortedFolgas;
  if(folgasBusca){
    const b = folgasBusca.toLowerCase();
    lista = lista.filter(f=>
      f.funcionario?.nome_completo?.toLowerCase().includes(b)||
      f.funcionario?.matricula?.includes(b)||
      f.cidade_origem?.toLowerCase().includes(b)
    );
  }
  if(folgasFiltro !== 'todos'){
    lista = lista.filter(f=>{
      const vencs = calcVencimentos(f);
      return vencs.some((v,i)=>{
        const st = vencStatus(v, f[`saida${i+1}_real`]);
        return st === folgasFiltro;
      });
    });
  }

  const alertHtml = `
    ${totalVencidas>0?`<div class="folga-alert-banner danger"><i class="ti ti-alert-circle" style="font-size:20px;flex-shrink:0"></i><strong>${totalVencidas} vencimento(s) em atraso</strong> — folgas não realizadas</div>`:''}
    ${totalVencendo>0?`<div class="folga-alert-banner warn"><i class="ti ti-clock" style="font-size:20px;flex-shrink:0"></i><strong>${totalVencendo} vencimento(s) nos próximos 20 dias</strong></div>`:''}
  `;

  // Métricas
  const metricsHtml = `
    <div class="metrics" style="margin-bottom:16px">
      <div class="metric-card" style="cursor:pointer;border:2px solid ${folgasFiltro==='todos'?'var(--primary)':'var(--border)'}" onclick="folgasFiltro='todos';renderFolgas()">
        <div class="metric-label">Total</div><div class="metric-value">${folgas.length}</div>
      </div>
      <div class="metric-card red" style="cursor:pointer;border:2px solid ${folgasFiltro==='danger'?'var(--danger)':'var(--border)'}" onclick="folgasFiltro='danger';renderFolgas()">
        <div class="metric-label">Vencidas</div><div class="metric-value">${totalVencidas}</div>
      </div>
      <div class="metric-card amber" style="cursor:pointer;border:2px solid ${folgasFiltro==='warn'?'var(--warning)':'var(--border)'}" onclick="folgasFiltro='warn';renderFolgas()">
        <div class="metric-label">Vencendo (15d)</div><div class="metric-value">${totalVencendo}</div>
      </div>
    </div>
  `;

  // Tabela
  const headerHtml = `
    <div class="folga-header-row">
      <div class="folga-header-cell">Funcionário</div>
      <div class="folga-header-cell">Período / Folga</div>
      <div class="folga-header-cell">Cidade Origem</div>
      <div class="folga-header-cell">Passagem</div>
      <div class="folga-header-cell">Venc.1 / Saída</div>
      <div class="folga-header-cell">Venc.2 / Saída</div>
      <div class="folga-header-cell">Venc.3 / Saída</div>
      <div class="folga-header-cell">Venc.4 / Saída</div>
      <div class="folga-header-cell">Venc.5 / Saída</div>
    </div>
  `;

  const rowsHtml = lista.length ? lista.map(f=>{
    const vencs = calcVencimentos(f);
    const funcNome = f.funcionario?.funcao?.nome || f.funcionario?.funcao_manual || '—';
    const obraStr = f.funcionario?.obra?.codigo ? f.funcionario.obra.codigo+' '+f.funcionario.obra.nome : '—';

    const vencCells = vencs.map((v,i)=>{
      const saidaReal = f[`saida${i+1}_real`];
      const st = vencStatus(v, saidaReal);
      const diff = Math.floor((v - hoje)/86400000);
      
      let contadorHtml = '';
      if(!saidaReal){
        if(st==='danger'){
          contadorHtml = `<div style="font-size:10px;font-weight:700;color:var(--danger);margin-top:2px">⚠️ ${Math.abs(diff)}d em atraso</div>`;
        } else if(st==='warn'){
          contadorHtml = `<div style="font-size:10px;font-weight:700;color:var(--warning);margin-top:2px">⏰ Faltam ${diff}d</div>`;
        } else {
          contadorHtml = `<div style="font-size:10px;color:var(--text-muted);margin-top:2px">Faltam ${diff}d</div>`;
        }
      }

      return `<div class="folga-cell">
        <div class="folga-venc ${st}">
          ${formatDate(v)}
        </div>
        ${contadorHtml}
        ${saidaReal
          ? `<div style="font-size:11px;color:var(--success);font-weight:600;cursor:pointer;margin-top:4px" 
               onclick="abrirSaidaReal('${f.id}',${i+1},'${formatDate(v)}','${saidaReal}')" 
               title="Clique para editar">
               ✅ ${formatDate(saidaReal)} <span style="opacity:.6;font-size:10px">✏️</span>
             </div>`
          : `<div class="folga-saida-real" style="margin-top:4px" onclick="abrirSaidaReal('${f.id}',${i+1},'${formatDate(v)}','')">+ lançar saída real</div>`
        }
      </div>`;
    }).join('');

    return `<div class="folga-row" style="border-radius:0;border-top:none;margin-bottom:0;border-bottom:1px solid var(--border)">
      <div class="folga-cell" style="background:var(--bg)">
        <div class="folga-func-name">${f.funcionario?.nome_completo||'—'}</div>
        <div class="folga-func-sub">${f.funcionario?.matricula||''} · ${funcNome}</div>
        <div class="folga-func-sub" style="margin-top:2px">${obraStr}</div>
        <div style="margin-top:6px;display:flex;gap:4px">
          <button class="btn btn-sm" style="padding:3px 8px;font-size:11px" onclick="editFolga('${f.id}')"><i class="ti ti-edit"></i></button>
          <button class="btn btn-sm btn-danger" style="padding:3px 8px;font-size:11px" onclick="deleteFolga('${f.id}')"><i class="ti ti-trash"></i></button>
        </div>
      </div>
      <div class="folga-cell">
        <div style="font-weight:600">${f.periodo_trabalhado}d trab.</div>
        <div style="font-size:11px;color:var(--text-muted)">${f.periodo_folga}d folga</div>
        <div style="font-size:11px;color:var(--text-muted);margin-top:4px">Início: ${formatDate(f.data_inicio)}</div>
      </div>
      <div class="folga-cell">${f.cidade_origem||'—'}</div>
      <div class="folga-cell">${passagemLabel(f)}</div>
      ${vencCells}
    </div>`;
  }).join('') : `<div style="text-align:center;padding:48px;color:var(--text-muted)"><i class="ti ti-beach" style="font-size:48px;opacity:.2;display:block;margin-bottom:12px"></i>Nenhum registro de folga</div>`;

  document.getElementById('main-content').innerHTML = `
    <div class="page-header">
      <div><div class="page-title"><i class="ti ti-beach"></i> Folgas de Campo</div>
        <div class="page-subtitle">Controle de ciclos de folga por funcionário</div></div>
      <div style="display:flex;gap:8px">
        <button class="btn" onclick="exportFolgasPDF()"><i class="ti ti-file-type-pdf"></i> PDF</button>
        <button class="btn" style="background:#E8F5E9;color:#2E7D32;border:none" onclick="exportFolgasExcel()"><i class="ti ti-file-type-xls"></i> Excel</button>
        <button class="btn btn-primary" onclick="openModalFolga()"><i class="ti ti-plus"></i> Nova folga</button>
      </div>
    </div>
    ${alertHtml}
    ${metricsHtml}
    <div style="display:flex;gap:8px;margin-bottom:16px">
      <div class="search-box" style="flex:1"><i class="ti ti-search"></i>
        <input placeholder="Buscar por funcionário, matrícula ou cidade..." value="${folgasBusca}" oninput="folgasBusca=this.value;renderFolgas()">
      </div>
      ${(folgasBusca||folgasFiltro!=='todos')?`<button class="btn btn-sm btn-danger" onclick="folgasBusca='';folgasFiltro='todos';renderFolgas()"><i class="ti ti-x"></i> Limpar filtros</button>`:''}
    </div>
    <div style="font-size:12px;color:var(--text-muted);margin-bottom:8px">${lista.length} registro(s)</div>
    <div class="table-container" style="overflow-x:auto">
      ${headerHtml}
      <div style="border:1px solid var(--border);border-top:none;border-radius:0 0 var(--radius-lg) var(--radius-lg);overflow:hidden">
        ${rowsHtml}
      </div>
    </div>
  `;
}

              <option value="60" ${folga?.periodo_trabalhado==60?'selected':''}>60 dias</option>

              <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;color:var(--text);font-weight:400">
                <input type="checkbox" id="fl-passagem-terrestre" ${folga?.tipo_passagem_terrestre?'checked':''} style="width:16px;height:16px;accent-color:var(--primary)"> 🚌 Terrestre

        <div class="modal-footer">

          </button>

async function saveFolga(id){
  const funcId = document.getElementById('fl-func').value;
  const inicio = document.getElementById('fl-inicio').value;
  if(!funcId||!inicio){showToast('Funcionário e data de início são obrigatórios','error');return;}

  const periodo = parseInt(document.getElementById('fl-periodo').value)||90;
  const folga = parseInt(document.getElementById('fl-folga').value)||5;

  // Calcular projeções automáticas
  const dt = new Date(inicio+'T12:00:00');
  const projecoes = {};
  for(let i=1;i<=5;i++){
    const d = new Date(dt.getTime());
    d.setDate(d.getDate()+periodo*i);
    projecoes[`saida${i}_projecao`] = d.toISOString().split('T')[0];
  }

  const payload = {
    funcionario_id: funcId,
    data_inicio: inicio,
    periodo_trabalhado: periodo,
    periodo_folga: folga,
    cidade_origem: document.getElementById('fl-cidade').value||null,
    tipo_passagem_aerea: document.getElementById('fl-passagem-aerea').checked,
    tipo_passagem_terrestre: document.getElementById('fl-passagem-terrestre').checked,
    ...projecoes

// ─── EXPERIÊNCIA ─────────────────────────────────────────────────────────────
let expFiltro = 'todos'; // todos, exp1, exp2, efetivado, vencendo, vencida
let expView = 'operacional';
let expBusca = '';

function calcExp(f) {
  if (!f.data_admissao) return null;
  const admissao = new Date(f.data_admissao + 'T12:00:00');
  if (isNaN(admissao.getTime())) return null;
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  const dias = Math.floor((hoje - admissao) / 86400000);
  const periodo = parseInt(f.periodo_experiencia) || 45;
  const fim1 = new Date(admissao.getTime()); fim1.setDate(fim1.getDate() + periodo);
  const fim2 = new Date(admissao.getTime()); fim2.setDate(fim2.getDate() + periodo * 2);

  let status, restantes = null;
  if (f.efetivado) {
    status = 'efetivado';
  } else if (dias < periodo) {
    status = 'exp1';
    restantes = periodo - dias;
  } else if (dias < periodo * 2) {
    status = 'exp2';
    restantes = periodo * 2 - dias;
  } else {
    status = 'vencida';
    restantes = 0;
  }
  if (status !== 'efetivado' && restantes !== null && restantes <= 15 && restantes > 0) status = 'vencendo';

  return { dias, periodo, fim1, fim2, status, restantes };
}

function statusBadgeExp(status, restantes) {
  const map = {
    exp1: `<span class="status-badge status-exp1">Experiência 1</span>`,
    exp2: `<span class="status-badge status-exp2">Experiência 2</span>`,
    efetivado: `<span class="status-badge status-efetivado">Efetivado</span>`,
    vencendo: `<span class="status-badge status-vencendo">Exp. ${restantes <= 3 ? `<br><small>FALTAM ≤ 3 DIAS</small>` : ''}</span>`,
    vencida: `<span class="status-badge status-vencida">Vencida</span>`,
  };
  return map[status] || '';
}

async function renderExperiencia() {
  document.getElementById('main-content').innerHTML='<div class="loading"><i class="ti ti-loader ti-spin"></i> Carregando...</div>';
  await loadAll();

  // Recalcular com período
  const lista = funcionarios.filter(f => f.situacao === 'ativo' || f.situacao === 'transferido');
  const comExp = lista.map(f => ({ ...f, _exp: calcExp(f) })).filter(f => f._exp);

  const emExp = comExp.filter(f => ['exp1','exp2','vencendo'].includes(f._exp.status));
  const exp1 = comExp.filter(f => f._exp.status === 'exp1');
  const exp2 = comExp.filter(f => f._exp.status === 'exp2');
  const efetivados = comExp.filter(f => f._exp.status === 'efetivado');
  const vencendo = comExp.filter(f => f._exp.status === 'vencendo');
  const vencidas = comExp.filter(f => f._exp.status === 'vencida');
  const pctEfet = comExp.length ? Math.round(efetivados.length / comExp.length * 100) : 0;

  // Filtro ativo
  let filtrados = comExp;
  if (expFiltro === 'emexp') filtrados = emExp;
  else if (expFiltro === 'exp1') filtrados = exp1;
  else if (expFiltro === 'exp2') filtrados = exp2;
  else if (expFiltro === 'efetivado') filtrados = efetivados;
  else if (expFiltro === 'vencendo') filtrados = vencendo;
  else if (expFiltro === 'vencida') filtrados = vencidas;

  if (expBusca) {
    const b = expBusca.toLowerCase();
    filtrados = filtrados.filter(f =>
      f.nome_completo?.toLowerCase().includes(b) ||
      f.matricula?.includes(b) ||

  // Alerta
  let alertHtml = '';
  if (vencidas.length > 0) {
    alertHtml += `<div class="exp-alert danger"><i class="ti ti-alert-circle" style="font-size:24px;flex-shrink:0"></i><div><strong>${vencidas.length} experiência(s) vencida(s)</strong> — ação necessária imediata</div></div>`;
  }
  if (vencendo.length > 0) {
    alertHtml += `<div class="exp-alert warning"><i class="ti ti-clock" style="font-size:24px;flex-shrink:0"></i><div><strong>${vencendo.length} experiência(s) vencendo em até 15 dias</strong></div></div>`;
  }

  // Tabela operacional
  const rows = filtrados.length ? filtrados.map(f => {
    const e = f._exp;
    const funcNome = f.funcao?.nome || f.funcao_manual || '—';
    const diasClass = e.restantes === null ? '' : e.restantes <= 3 ? 'danger' : e.restantes <= 15 ? 'warn' : 'ok';
    const restantesHtml = e.status === 'efetivado' ? '—' : `<span class="dias-restantes ${diasClass}">${e.restantes}</span>`;
    const efetBtn = (e.status === 'exp1' || e.status === 'exp2' || e.status === 'vencendo' || e.status === 'vencida')
      ? `<button class="efetivar-btn" onclick="efetivarFuncionario('${f.id}','${(f.nome_completo||'').replace(/'/g,"\\'")}')">Efetivar ${e.status==='exp1'?'1º':'2º'}</button>` : '';
    const obs = f.observacao_interna ? `<span class="obs-cell" title="${f.observacao_interna}" onclick="abrirObs('${f.id}','${(f.nome_completo||'').replace(/'/g,"\\'")}')">📝 ${f.observacao_interna}</span>`

  }).join('') : `<tr><td colspan="10"><div class="empty-state"><i class="ti ti-certificate"></i><div>Nenhum registro encontrado</div></div></td></tr>`;

  // Gerencial view

      <div style="text-align:right"><div class="dias-restantes ${f._exp.restantes<=3?'danger':f._exp.restantes<=15?'warn':'ok'}">${f._exp.restantes}d</div>
      <div style="font-size:10px;color:var(--text-muted)">Experiência ${f._exp.status==='exp1'?'1':'2'}</div></div>
    </div>`).join('') || '<div style="color:var(--text-muted);font-size:13px;padding:12px 0">Sem experiências vencidas.</div>';

  const efetRows = efetivados.sort((a,b)=>b._exp.dias-a._exp.dias).map(f=>`
    <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)">
      <div><div style="font-weight:600;font-size:13px">${f.nome_completo}</div>
      <div style="font-size:11px;color:var(--text-muted)">${f.funcao?.nome||f.funcao_manual||'—'} · ${f.matricula}</div></div>
      <div style="text-align:right"><div style="font-weight:700;color:var(--primary-dark)">${f._exp.dias}d</div>

    </div>`).join('') || '<div style="color:var(--text-muted);font-size:13px;padding:12px 0">Nenhum efetivado.</div>';

  document.getElementById('main-content').innerHTML = `
    <div class="page-header">
      <div><div class="page-title"><i class="ti ti-certificate"></i> Controle de Experiência</div>
        <div class="page-subtitle">Controle automático 45/90 dias (ou 30/60 dias)</div></div>
      <div style="display:flex;gap:8px">

        <div class="exp-card-value">${exp1.length}</div>
        <div class="exp-card-label">Experiência 1</div>
      </div>

async function efetivarFuncionario(id, nome) {
  if (!confirm(`Confirma a efetivação de ${nome}?`)) return;
  const { error } = await sb.from('funcionarios').update({ efetivado: true }).eq('id', id);
  if (error) { showToast('Erro: ' + error.message, 'error'); return; }
  showToast(`${nome} efetivado com sucesso!`);
  await loadAll();
  renderExperiencia();
}

      <div class="modal obs-modal">
        <div class="modal-header">
          <span class="modal-title">📝 Observação — ${nome}</span>
          <button class="btn btn-sm" onclick="closeModal('modal-obs')"><i class="ti ti-x"></i></button>
        </div>
        <div class="modal-body">
          <div class="form-group full">
            <label>Observação interna (lembrete, ação pendente, etc.)</label>
            <textarea id="obs-texto" rows="4" placeholder="Ex: Demitir em 30/06, aguardar retorno do supervisor..."
              style="resize:vertical">${obsAtual}</textarea>
          </div>
          ${obsAtual ? `<div style="margin-top:8px;padding:8px 12px;background:var(--warning-light);border-radius:var(--radius);font-size:12px;color:var(--warning)"><i class="ti ti-clock"></i> Observação existente — será substituída ao salvar</div>` : ''}
        </div>
        <div class="modal-footer">
          ${obsAtual ? `<button class="btn btn-danger" onclick="salvarObs('${id}', '')">Limpar obs.</button>` : ''}
          <button class="btn" onclick="closeModal('modal-obs')">Cancelar</button>
          <button class="btn btn-primary" onclick="salvarObs('${id}', document.getElementById('obs-texto').value)">
            <i class="ti ti-check"></i> Salvar
          </button>
        </div>
      </div>
    </div>`);
}

async function salvarObs(id, texto) {
  const { error } = await sb.from('funcionarios').update({ observacao_interna: texto || null }).eq('id', id);
  if (error) { showToast('Erro: ' + error.message, 'error'); return; }
  showToast('Observação salva!');
  closeModal('modal-obs');
  await loadAll();
  renderExperiencia();
}

async function exportExpPDF() {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: 'landscape' });
  const hoje = new Date().toLocaleDateString('pt-BR');

  // Header
  doc.setFillColor(15, 110, 86);
  doc.rect(0, 0, 297, 22, 'F');
  doc.setTextColor(255,255,255);
  doc.setFontSize(14); doc.setFont('helvetica','bold');
  doc.text('GTEL — Relatório de Controle de Experiência', 14, 10);
  doc.setFontSize(9); doc.setFont('helvetica','normal');
  doc.text(`Emitido em: ${hoje}`, 14, 17);

  const lista = funcionarios.filter(f => f.situacao === 'ativo' || f.situacao === 'transferido');
  const comExp = lista.map(f => ({ ...f, _exp: calcExp(f) })).filter(f => f._exp);

  // Resumo
  let y = 30;
  doc.setTextColor(26,26,26);
  doc.setFontSize(10); doc.setFont('helvetica','bold');
  doc.text('RESUMO', 14, y); y += 7;
  doc.setFont('helvetica','normal'); doc.setFontSize(9);

  const emExp = comExp.filter(f => ['exp1','exp2','vencendo'].includes(f._exp.status));
  const efetivados = comExp.filter(f => f._exp.status === 'efetivado');
  const vencendo = comExp.filter(f => f._exp.status === 'vencendo');
  const vencidas = comExp.filter(f => f._exp.status === 'vencida');

  const resumo = [
    ['Total ativos', comExp.length],
    ['Em experiência', emExp.length],
    ['Efetivados', efetivados.length],
    ['Vencendo (15d)', vencendo.length],
    ['Vencidas', vencidas.length],
    ['% Efetivação', comExp.length ? Math.round(efetivados.length/comExp.length*100)+'%' : '0%'],
  ];
  resumo.forEach(([label, val], i) => {
    doc.text(`${label}: ${val}`, 14 + (i % 3) * 90, y + Math.floor(i/3) * 6);
  });
  y += 18;

  // Tabela
  doc.setFontSize(10); doc.setFont('helvetica','bold');
  doc.text('LISTAGEM COMPLETA', 14, y); y += 6;

  const headers = ['Matrícula','Nome','Função','Admissão','Fim 1º','Fim 2º','Restantes','Status'];
  const colWidths = [22, 60, 50, 22, 22, 22, 22, 28];
  let x = 14;
  doc.setFillColor(241,245,249);
  doc.rect(14, y, 269, 7, 'F');
  doc.setFontSize(8); doc.setFont('helvetica','bold'); doc.setTextColor(107,114,128);
  headers.forEach((h, i) => { doc.text(h, x+1, y+5); x += colWidths[i]; });
  y += 7;

  comExp.sort((a,b) => {
    const order = {vencida:0,vencendo:1,exp2:2,exp1:3,efetivado:4};
    return (order[a._exp.status]||5) - (order[b._exp.status]||5);
  }).forEach((f, idx) => {
    if (y > 185) { doc.addPage(); y = 14; }
    const e = f._exp;
    if (idx % 2 === 0) { doc.setFillColor(248,250,252); doc.rect(14, y, 269, 7, 'F'); }
    doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(26,26,26);
    x = 14;
    const statusLabel = {exp1:'Exp. 1',exp2:'Exp. 2',efetivado:'Efetivado',vencendo:'Vencendo',vencida:'Vencida'};
    const row = [
      f.matricula||'—',
      (f.nome_completo||'').substring(0,28),
      (f.funcao?.nome||f.funcao_manual||'—').substring(0,24),
      formatDate(f.data_admissao),
      formatDate(e.fim1),
      formatDate(e.fim2),
      e.status==='efetivado'?'—':String(e.restantes||0)+'d',
      statusLabel[e.status]||e.status,
    ];
    row.forEach((val, i) => { doc.text(String(val), x+1, y+5); x += colWidths[i]; });
    y += 7;
  });

  doc.save(`Controle_Experiencia_${hoje.replace(/\//g,'-')}.pdf`);
  showToast('PDF do gestor exportado!');
}

async function exportExpExcel() {
  const lista = funcionarios.filter(f => f.situacao === 'ativo' || f.situacao === 'transferido');
  const comExp = lista.map(f => ({ ...f, _exp: calcExp(f) })).filter(f => f._exp);
  const statusLabel = {exp1:'Experiência 1',exp2:'Experiência 2',efetivado:'Efetivado',vencendo:'Vencendo',vencida:'Vencida'};

  const dados = [
    ['Matrícula','Nome','Função','Empresa','Obra','Admissão','Dias Trabalhados','Fim 1º Período','Fim 2º Período','Dias Restantes','Status','Observação'],
    ...comExp.sort((a,b)=>{
      const order={vencida:0,vencendo:1,exp2:2,exp1:3,efetivado:4};
      return (order[a._exp.status]||5)-(order[b._exp.status]||5);
    }).map(f => [
      f.matricula||'',
      f.nome_completo||'',
      f.funcao?.nome||f.funcao_manual||'',
      f.empresa?.nome||'',
      f.obra?.codigo ? f.obra.codigo+' '+f.obra.nome : '',
      formatDate(f.data_admissao),
      f._exp.dias,
      formatDate(f._exp.fim1),
      formatDate(f._exp.fim2),
      f._exp.status==='efetivado'?'—':(f._exp.restantes||0),
      statusLabel[f._exp.status]||'',
      f.observacao_interna||'',
    ])
  ];

  const ws = XLSX.utils.aoa_to_sheet(dados);
  ws['!cols'] = [10,30,25,25,25,14,14,14,14,12,15,30].map(w=>({wch:w}));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Experiência');
  XLSX.writeFile(wb, `Controle_Experiencia_${new Date().toLocaleDateString('pt-BR').replace(/\//g,'-')}.xlsx`);
  showToast('Excel exportado!');
}
